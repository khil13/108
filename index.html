   judgement here is which ones are worth colouring. */
function playKind(event){
  const e = String(event == null ? "" : event).toLowerCase();
  if(e.includes("home run")) return { tag:"home run", tone:"seam" };
  if(e === "triple") return { tag:"triple", tone:"bulb" };
  if(e === "double") return { tag:"double", tone:"bulb" };
  if(e === "single") return { tag:"single", tone:"grass" };
  if(e.includes("strikeout")) return { tag:"strikeout", tone:"blush" };
  if(e.includes("walk") || e.includes("hit by pitch")) return { tag:e, tone:"slate" };
  if(e.includes("error")) return { tag:"error", tone:"blush" };
  if(e.includes("stolen base")) return { tag:"steal", tone:"grass" };
  return { tag:e || "play", tone:"slate" };
}

/* Did this line come from someone who actually batted?

   The mirror of pitchedIn, and the same bug: a rostered player who sat comes
   back with an empty batting block, which was being read as a genuine nought
   and marked wrong. Lineups are not published until a few hours before first
   pitch, so the pick is made blind — holding a regular's rest day against it
   grades the manager's decision, not the model's. */
function battedIn(b){
  if(!b) return false;
  if(b.batPA != null) return b.batPA > 0;
  if(b.batAB != null && b.batAB > 0) return true;
  return !!b.today;
}

/* A box-score line belongs to a game as much as to a player, and the two have to
   be looked up together — see loadBoxscores. */
const boxKey = (pk, pid) => String(pk) + ":" + String(pid);

/* Did this line come from someone who actually pitched?

   MLB lists every rostered player in a boxscore, and one who never left the
   bullpen can come back with a zeroed pitching block rather than an absent one.
   The record was reading that nought as a real result and grading it against the
   projection — a starter who was scratched showed up as an eight-strikeout miss,
   which is both wrong about him and quietly ruinous for the strikeout average.

   Batters faced is the cleanest signal; pitches and innings are checked too,
   since a reliever pulled mid-batter can finish with none of the three but is
   still not a scratch if he threw. A genuine nought — took the mound, recorded
   no strikeouts — passes all three and is graded, as it should be. */
function pitchedIn(b){
  if(!b) return false;
  if(b.pBF != null && b.pBF > 0) return true;
  if(b.pitches != null && b.pitches > 0) return true;
  return (inningsOf(b.pIp) || 0) > 0;
}

/* One box score, reduced to what the app uses: each player's season line, what
   he did tonight, and a pitcher's count. Shared by the live poll and by the
   settlement pass that grades finished picks. */
/* Steals are a team event as much as a personal one, and the boxscore already
   totals them per side. Read separately from the per-player map because that map
   is flat by design — it has no idea which club anyone plays for. */
function readSteals(j){
  const side = k => (((((j || {}).teams || {})[k] || {}).teamStats || {}).batting) || {};
  const h = side("home"), a = side("away");
  const n = v => Number(v) || 0;
  return { h:n(h.stolenBases), a:n(a.stolenBases),
           hcs:n(h.caughtStealing), acs:n(a.caughtStealing) };
}

function readBoxscore(j){
  const out = {};
  for(const sideKey of ["home", "away"]){
    const side = (((j || {}).teams || {})[sideKey]) || {};
    for(const key in (side.players || {})){
      const p = side.players[key];
      const id = (p.person || {}).id;
      if(!id) continue;
      const name = (p.person || {}).fullName || null;
      const sb = (p.seasonStats || {}).batting || {};
      const tb = (p.stats || {}).batting || {};
      const tp = (p.stats || {}).pitching || {};
      out[id] = {
        name, side:sideKey,
        avg:sb.avg && sb.avg !== "-" ? sb.avg : null,
        hr:sb.homeRuns != null ? sb.homeRuns : null,
        ops:sb.ops && sb.ops !== "-" ? sb.ops : null,
        today:tb.summary || null,
        todayHr:tb.homeRuns != null ? tb.homeRuns : null,
        /* Whether he came to the plate at all — see battedIn. A pinch runner
           counts as having played but never had a chance to go deep, so plate
           appearances are the measure rather than mere presence. */
        batPA:tb.plateAppearances != null ? tb.plateAppearances : null,
        batAB:tb.atBats != null ? tb.atBats : null,
        batSb:tb.stolenBases != null ? tb.stolenBases : null,
        batH:tb.hits != null ? tb.hits : null,
        batR:tb.runs != null ? tb.runs : null,
        /* MLB has used both names for this field over the years. */
        pitches:tp.numberOfPitches != null ? tp.numberOfPitches
               : tp.pitchesThrown != null ? tp.pitchesThrown : null,
        pIp:tp.inningsPitched || null,
        pEr:tp.earnedRuns != null ? tp.earnedRuns : null,
        pK:tp.strikeOuts != null ? tp.strikeOuts : null,
        /* Whether he took the mound at all, which is a different question from
           what he did there — see pitchedIn. */
        pBF:tp.battersFaced != null ? tp.battersFaced : null
      };
    }
  }
  return out;
}

/* Box scores for games in progress. This is where the batter's season line and
   the pitcher's count live — nothing lighter carries them.

   Throttled to a minute rather than the 30 seconds the scores use, because a
   pitch count 60 seconds old is still useful and each box score is a sizeable
   document. Live games only, never finals. */
async function loadBoxscores(){
  const live = S.games.filter(g => g.st === "live");
  if(!live.length) return;
  const age = S.boxAt ? Date.now() - S.boxAt : Infinity;
  if(age < 60000) return;

  /* Keyed by game and player, not player alone.

     A flat player map was never cleared and never scoped, so a line survived
     from one game to the next and from one day to the next — and settlement,
     looking a player up by id, could grade a pick against work he did somewhere
     else entirely. Scoping the key makes that impossible; pruning to the games
     currently in the window stops it growing without limit. */
  const out = {};
  const keep = new Set(S.games.map(g => String(g.pk)));
  for(const k in S.box) if(keep.has(k.slice(0, k.indexOf(":")))) out[k] = S.box[k];
  const lastPlays = Object.assign({}, S.lastPlay);
  const sb = Object.assign({}, S.steals);
  const CHUNK = 4;
  for(let i = 0; i < live.length; i += CHUNK){
    await Promise.all(live.slice(i, i + CHUNK).map(async g => {
      /* Two documents per live game: the box score for the lines and counts, the
         play-by-play for what just happened. Shared throttle, so a minute apart
         rather than every thirty seconds. */
      try{
        const pbp = await getJSON(MLB + "/game/" + g.pk + "/playByPlay");
        const plays = (pbp && pbp.allPlays) || [];
        for(let n = plays.length - 1; n >= 0; n--){
          const p = plays[n];
          if(!(p.about || {}).isComplete || !(p.result || {}).event) continue;
          lastPlays[g.pk] = {
            event:p.result.event,
            desc:p.result.description || "",
            top:!!(p.about || {}).isTopInning,
            inning:(p.about || {}).inning,
            kind:playKind(p.result.event)
          };
          break;
        }
      }catch(e){ /* the box score below is still worth having */ }

      let j;
      try{ j = await getJSON(MLB + "/game/" + g.pk + "/boxscore"); }catch(e){ return; }
      const one = readBoxscore(j);
      for(const pid in one) out[boxKey(g.pk, pid)] = one[pid];
      sb[g.pk] = readSteals(j);
    }));
  }
  S.box = out;
  S.lastPlay = lastPlays;
  S.steals = sb;
  S.boxAt = Date.now();
  S.diag.box = Object.keys(out).length;
  render();
}

/* ============================== forecast ============================= */

function simulate(sims, tweak){
  const clubs = list();
  const rate = {}, base = {}, rem = {}, lg10 = {};
  for(const t of clubs){
    const p = teamRate(t);
    rate[t.id] = p;
    lg10[t.id] = Math.log(p / (1 - p));            // log-odds, for head to head
    const bump = tweak && tweak.id === t.id;
    base[t.id] = t.w + (bump ? tweak.add : 0);
    rem[t.id] = Math.max(0, left(t) - (bump ? 1 : 0));
  }

  /* With the real fixture list, each remaining game is played between the two
     clubs actually involved, with a home edge — so a hard September counts
     against you and an easy one does not. Without it, every club plays a
     generic average opponent, which is the fallback. */
  const sched = S.remaining;
  const useSched = Array.isArray(sched) && sched.length > 100;
  let pre = null, skip = -1;
  if(useSched){
    if(tweak){
      skip = sched.findIndex(g => g.hid === tweak.id || g.aid === tweak.id);
    }
    pre = sched.map(g => ({
      hid:g.hid, aid:g.aid,
      p:1 / (1 + Math.exp(-(lg10[g.hid] - lg10[g.aid] + HFA)))
    }));
  }

  const div = {}, berth = {}, top = {}, tot = {}, hist = {};
  for(const t of clubs){
    div[t.id]=0; berth[t.id]=0; top[t.id]=0; tot[t.id]=0;
    hist[t.id] = new Array(SEASON_GAMES + 1).fill(0);
  }
  const leagues = {AL:clubs.filter(t=>DIV[t.div][0]==="AL"), NL:clubs.filter(t=>DIV[t.div][0]==="NL")};
  const wins = {}, key = {};

  for(let s = 0; s < sims; s++){
    if(pre){
      for(const t of clubs) wins[t.id] = base[t.id];
      for(let i = 0; i < pre.length; i++){
        if(i === skip) continue;                   // the game the tweak fixes
        const g = pre[i];
        if(Math.random() < g.p) wins[g.hid]++; else wins[g.aid]++;
      }
      for(const t of clubs){ tot[t.id] += wins[t.id]; hist[t.id][wins[t.id]]++; }
    } else {
      for(const t of clubs){
        let w = base[t.id];
        const p = rate[t.id], n = rem[t.id];
        for(let g = 0; g < n; g++) if(Math.random() < p) w++;
        wins[t.id] = w; tot[t.id] += w; hist[t.id][w]++;
      }
    }
    for(const lg of ["AL","NL"]){
      const pool = leagues[lg];
      for(const t of pool) key[t.id] = wins[t.id] + Math.random()*0.5;  // coin-flip ties
      const champs = [];
      for(const d of DIVS[lg]){
        let best = null;
        for(const t of pool){ if(t.div !== d) continue;
          if(!best || key[t.id] > key[best.id]) best = t; }
        if(best){ champs.push(best); div[best.id]++; berth[best.id]++; }
      }
      const field = pool.filter(t => !champs.includes(t)).sort((a,b) => key[b.id]-key[a.id]);
      for(let k = 0; k < 3 && k < field.length; k++) berth[field[k].id]++;
      champs.sort((a,b) => key[b.id]-key[a.id]);
      if(champs.length) top[champs[0].id]++;
    }
  }
  /* Read a percentile straight off the histogram: walk up the win totals
     until the requested share of simulated seasons is behind you. */
  const pctileOf = (h, q) => {
    const target = q * sims;
    let acc = 0;
    for(let w = 0; w < h.length; w++){ acc += h[w]; if(acc >= target) return w; }
    return h.length - 1;
  };

  const o = {};
  for(const t of clubs){
    const h = hist[t.id];
    o[t.id] = { div:div[t.id]/sims, berth:berth[t.id]/sims,
                top:top[t.id]/sims, projWins:tot[t.id]/sims,
                p10:pctileOf(h, 0.10), p50:pctileOf(h, 0.50), p90:pctileOf(h, 0.90) };
  }
  return o;
}

/* ---------------- recency ----------------
   Recent form is already inside the season figures, so weighting it means
   counting those games more than once. RECENCY_W is how many extra times.

   Set to 1: a club's last ten and a starter's last three outings count twice
   over. Modest on purpose. A hot fortnight feels more predictive than it is,
   and over-weighting it is the usual way to make a forecast worse. */
const RECENCY_W = 1;   // the recent stretch counts twice over, not more

/* Surnames only where space is tight. Two awkward cases: compound names like
   "De La Cruz", which need the particles kept, and suffixes like "Jr." which
   must be dropped first or they become the whole name. */
function lastName(full){
  if(!full) return "";
  let parts = String(full).trim().split(/\s+/);
  const suffix = [];
  while(parts.length > 1 && /^(jr\.?|sr\.?|i{2,3}|iv|v)$/i.test(parts[parts.length - 1])){
    suffix.unshift(parts.pop());
  }
  if(parts.length < 2) return [parts[0] || "", ...suffix].join(" ").trim();
  let i = parts.length - 1;
  while(i > 0 && /^(de|del|la|le|van|von|da|dos|di)$/i.test(parts[i-1])) i--;
  return [...parts.slice(i), ...suffix].join(" ");
}

const pairOf = s => {
  if(!s) return null;
  const m = String(s).match(/^(\d+)-(\d+)$/);
  return m ? { w:Number(m[1]), l:Number(m[2]) } : null;
};

/* ---------------- Pythagorean expectation ----------------
   A record is a noisy read on strength. Two clubs at 55-50 are not the same
   club if one got there on blowout wins and one-run losses, and the calibration
   said as much: records alone lost to simply knowing who was at home. Run
   differential separates them, and is the oldest well-attested improvement on
   W-L there is.

   The exponent is the conventional 1.83. Nothing here is asserted to work —
   USE_PYTH is a hypothesis, and the calibration on the Odds tab now runs the
   season both ways and reports which won. If run differential loses there, set
   this to false and the app goes back to records. */
const USE_PYTH = true;

/* Whether a club's record is in the single-game model at all.

   The calibration has said something awkward twice over and it has not been
   acted on. Records alone failed to beat knowing who was at home; starters were
   the only component that beat that baseline; and the sweep's preferred
   regression was 4,000, which is a polite arithmetic way of saying ignore
   records. Meanwhile the model still regresses by 400 and stacks recency,
   bullpens and Pythagorean expectation on top of a term the season says is
   worthless.

   So this is a switch, and the calibration now scores all four combinations of
   records and starters against the home-field baseline. If the lean model does as
   well, most of the machinery above is decoration and this should be false. That
   would be a finding, not a failure. */
const USE_TEAM = true;
const PYTH_EXP = 1.83;

function pythPct(rs, ra){
  if(!(rs > 0) || !(ra > 0)) return null;
  const a = Math.pow(rs, PYTH_EXP), b = Math.pow(ra, PYTH_EXP);
  return a + b > 0 ? a / (a + b) : null;
}

/* The wins a club's run differential says it should have, over the games it has
   actually played — so it drops into the same regression as a real win count
   and the two are directly comparable. Null whenever runs are not loaded yet,
   in which case every caller falls back to the record. */
function pythWins(id){
  const r = S.runs[id];
  if(!r || !r.g) return null;
  const p = pythPct(r.rs, r.ra);
  return p == null ? null : { w:p * r.g, g:r.g };
}

/* A club's true rate: its strength over the season, plus its last ten counted
   again K times, then regressed toward .500. Strength is run differential where
   the season figures have loaded and the plain record otherwise. */
function teamRate(t, regress){
  const R = regress == null ? REGRESS_SEASON : regress;
  const k = RECENCY_W;
  const ten = pairOf(t.l10);
  const addW = ten ? k * ten.w : 0;
  const addG = ten ? k * (ten.w + ten.l) : 0;
  const eff = USE_PYTH ? pythWins(t.id) : null;
  const w = eff ? eff.w : t.w;
  const g = eff ? eff.g : t.w + t.l;
  return (w + addW + R / 2) / (g + addG + R);
}

/* A starter's effective ERA, with his last three outings counted again K
   times. Earned runs are recovered from the rate and the innings, so the blend
   is over actual runs rather than an average of two averages. */
function starterEra(p){
  if(!p || p.era == null) return null;
  const k = RECENCY_W;
  if(!p.form || !p.ip) return p.era;
  const seasonER = p.era * p.ip / 9;
  const recentER = p.form.era * p.form.ip / 9;
  const ip = p.ip + k * p.form.ip;
  return ip > 0 ? (seasonER + k * recentER) * 9 / ip : p.era;
}

/* ---------------- game projection ----------------
   A Bradley-Terry comparison of two clubs on the log-odds scale: each side's
   regressed winning percentage, a home edge, and a damped adjustment for the
   gap between the two starters' ERAs.

   SP_WEIGHT is a judgement call, not a fitted parameter. It is set so a full
   run of ERA advantage moves the line about two and a half points, which is
   deliberately conservative — ERA is noisy, it carries the team's defence
   inside it, and a starter throws only part of the game. Nothing here is
   calibrated against outcomes, because this build has no way to backtest. */
function project(g){
  const h = S.teams[g.hid], a = S.teams[g.aid];
  if(!h || !a) return null;
  const lg = p => Math.log(p / (1 - p));

  let d = HFA;
  let usedTeam = false;
  if(USE_TEAM){
    d += lg(teamRate(h, REGRESS_GAME)) - lg(teamRate(a, REGRESS_GAME));
    usedTeam = true;
  }

  const hp = S.pitchers[g.hProbId], ap = S.pitchers[g.aProbId];
  const hEra = starterEra(hp), aEra = starterEra(ap);
  let usedSP = false, usedBP = false;
  if(hEra != null && aEra != null){
    const gap = Math.max(-SP_CAP, Math.min(SP_CAP, aEra - hEra));
    d += SP_WEIGHT * gap;
    usedSP = true;
  }

  const homeBp = S.bullpens[g.hid], awayBp = S.bullpens[g.aid];
  if(homeBp && awayBp){
    const gap = Math.max(-BP_CAP, Math.min(BP_CAP, awayBp.era - homeBp.era));
    d += BP_WEIGHT * gap;
    usedBP = true;
  }

  const pHome = 1 / (1 + Math.exp(-d));
  return { pHome, pAway:1 - pHome, usedTeam, usedSP, usedBP };
}

/* Fair American odds. The two sides sum to 100%, so unlike a real book there
   is no margin baked in — which is exactly why these will not match a
   sportsbook even when the underlying view agrees. */
function american(p){
  if(p <= 0 || p >= 1) return "";
  const raw = p >= 0.5 ? -(100 * p / (1 - p)) : 100 * (1 - p) / p;
  const r = Math.round(Math.abs(raw) / 5) * 5;
  return (raw < 0 ? "\u2212" : "+") + r;
}

function projectionBlock(g){
  if(g.st !== "sched") return "";
  const pr = project(g);
  if(!pr) return "";
  const row = (teamId, p) => '<div class="mlrow">'
    + '<span class="tbar" style="background:' + col(teamId) + '" aria-hidden="true"></span>'
    + '<span class="pname">' + ab(teamId) + '<em>' + esc(nm(teamId)) + '</em></span>'
    + '<span class="mlpct">' + Math.round(p * 100) + '%</span>'
    + '<span class="mlodds">' + american(p) + '</span></div>';
  const inputs = [];
  if(pr.usedTeam) inputs.push("records");
  if(pr.usedSP) inputs.push("starters");
  if(pr.usedBP) inputs.push("bullpens");
  const label = !inputs.length ? "home field only"
    : inputs.length === 1 ? inputs[0] + " only"
    : inputs.slice(0, -1).join(", ") + " and " + inputs[inputs.length - 1];
  return '<div class="pblock">'
    + '<h5 class="plabel">Model line · ' + label
      + (S.calFit ? ' · calibrated' : "") + '</h5>'
    + row(g.aid, 1 - calibrate(pr.pHome)) + row(g.hid, calibrate(pr.pHome)) + '</div>';
}

/* The bats that can end an at-bat in one swing, against the arm they face.
   Deliberately rates rather than a probability: "one per 18 plate
   appearances" is what has happened, and it cannot be mistaken for a
   forecast the way "9% tonight" would be.

   Each club gets a header naming the opposing starter, so the group of
   hitters underneath is unambiguously the group facing that arm. */
function powerBlock(g){
  if(g.st !== "sched") return "";
  const side = (teamId, oppPid) => {
    const bats = (S.hitters[teamId] || []).slice(0, 5);
    if(!bats.length) return "";
    const opp = S.pitchers[oppPid];
    /* The opposing club is whoever's starter this is. */
    const oppTeam = teamId === g.aid ? g.hid : g.aid;
    const pen = (S.bullpens[oppTeam] || {}).hr9;
    const facing = opp && opp.hr9 != null
      ? 'vs ' + esc((opp.name || "").split(" ").slice(-1)[0])
        + ' <b>' + opp.hr9.toFixed(1) + '</b>'
        + (pen != null ? ' \u00b7 pen <b>' + pen.toFixed(1) + '</b>' : "") + ' HR/9'
      : (opp && opp.name ? 'vs ' + esc(opp.name.split(" ").slice(-1)[0]) : "");
    return '<div class="clubhead">'
      + '<span class="tbar" style="background:' + col(teamId) + '" aria-hidden="true"></span>'
      + '<span class="clubab">' + ab(teamId) + '</span>'
      + '<span class="facing">' + facing + '</span></div>'
      + '<div class="batrow bathead"><span></span><span></span>'
        + '<span>season</span><span>pa/hr</span><span>last 5</span></div>'
      + bats.map(b => {
        const f = S.hitterForm[b.id];
        /* One row per hitter, not two. Surname only, and the last five
           compressed to its two useful figures — the height of this block was
           swallowing the whole screen. */
        const l5 = f
          ? '<b' + (f.hr > 0 ? ' class="hot"' : '') + '>' + f.hr + '</b>'
            + (f.avg != null ? ' ' + f.avg.toFixed(3).replace(/^0/, "") : "")
          : '<span class="dash">\u2014</span>';
        return '<div class="batrow">'
          + '<span class="bdash" aria-hidden="true"></span>'
          + '<span class="bname">' + esc(lastName(b.name)) + '</span>'
          + '<span class="bhr">' + b.hr + ' HR</span>'
          + '<span class="brate">1/' + Math.round(b.perPA) + '</span>'
          + '<span class="bl5" title="last 5 games">' + l5 + '</span></div>';
      }).join("");
  };
  // Visitors bat against the home starter, and the reverse.
  const away = side(g.aid, g.hProbId), home = side(g.hid, g.aProbId);
  if(!away && !home) return "";
  return '<div class="pblock"><h5 class="plabel">Power on show</h5>'
    + away + (away && home ? '<div class="clubgap"></div>' : "") + home + '</div>';
}

/* What has happened on the bases tonight. Shown only once something has, so a
   game with no running game does not carry an empty row saying nothing. Caught
   stealing is included because a club 0-for-2 has been running too, and that is
   as much a fact about the game as two clean steals. */
function stealLine(g){
  if(g.st !== "live" && g.st !== "final") return "";
  const s = S.steals[g.pk];
  if(!s) return "";
  const total = s.h + s.a + s.hcs + s.acs;
  if(!total) return "";
  /* Attempts rather than a bare count, so a club running twice and failing twice
     does not read as a club that never left first. */
  const side = (id, sb, cs) => ab(id) + ' <b>' + sb + '</b>'
    + (cs ? '<i> of ' + (sb + cs) + '</i>' : "");
  return '<div class="bpline sb"><em>steals</em>'
    + side(g.aid, s.a, s.acs) + ' \u00b7 ' + side(g.hid, s.h, s.hcs) + '</div>';
}

/* Who runs, before the game gives you anything to look at. The counterpart to
   Power on show, and read the same way: what has already happened, at a rate,
   not a forecast. A club's own total sits alongside so three names can be placed
   against how much running the lineup does as a whole. */
function basepathBlock(g){
  if(g.st !== "sched") return "";
  const side = teamId => {
    const rs = S.runners[teamId] || [];
    const tb = S.teamBat[teamId];
    /* A club that never runs still gets its header. Dropping it left the block
       showing one side of a two-sided matchup with no hint why. */
    if(!rs.length && !tb) return "";
    return '<div class="clubhead">'
      + '<span class="tbar" style="background:' + col(teamId) + '" aria-hidden="true"></span>'
      + '<span class="clubab">' + ab(teamId) + '</span>'
      + '<span class="facing">' + (tb && tb.sb != null
          ? '<b>' + tb.sb + '</b> SB as a club'
            + (tb.sbRate != null ? ' \u00b7 ' + Math.round(tb.sbRate * 100) + '%' : "")
          : "") + '</span></div>'
      + (rs.length
          ? '<div class="batrow bathead"><span></span><span></span>'
              + '<span>sb</span><span>att</span><span>rate</span></div>'
            + rs.map(r => '<div class="batrow">'
                + '<span class="bdash" aria-hidden="true"></span>'
                + '<span class="bname">' + esc(lastName(r.name)) + '</span>'
                + '<span class="bhr">' + r.sb + '</span>'
                + '<span class="brate">' + r.att + '</span>'
                + '<span class="bl5"><b' + (r.rate >= 0.8 ? ' class="hot"' : '') + '>'
                  + Math.round(r.rate * 100) + '%</b></span></div>').join("")
          : '<div class="batrow"><span class="bdash" aria-hidden="true"></span>'
            + '<span class="bname">no regular base stealer</span>'
            + '<span class="bhr"></span><span class="brate"></span>'
            + '<span class="bl5"></span></div>');
  };
  const away = side(g.aid), home = side(g.hid);
  if(!away && !home) return "";
  return '<div class="pblock"><h5 class="plabel">On the basepaths</h5>'
    + away + (away && home ? '<div class="clubgap"></div>' : "") + home + '</div>';
}

/* ============================== rendering =========================== */

const SEAM = '<svg class="seamrule" viewBox="0 0 320 14" preserveAspectRatio="none" aria-hidden="true">'
  + '<path d="M0 9 C 80 -1, 240 -1, 320 9" stroke="#C8102E" stroke-width="1.6" fill="none" stroke-dasharray="1.5 5" stroke-linecap="round"/>'
  + '<path d="M0 5 C 80 15, 240 15, 320 5" stroke="#C8102E" stroke-width="1.6" fill="none" stroke-dasharray="1.5 5" stroke-linecap="round"/></svg>';

const BALL = '<svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true">'
  + '<circle cx="20" cy="20" r="18.5" fill="#F2F0E6"/>'
  + '<path d="M9 4.5 C16.5 13, 16.5 27, 9 35.5" stroke="#C8102E" stroke-width="1.7" fill="none" stroke-dasharray="1 3.4" stroke-linecap="round"/>'
  + '<path d="M31 4.5 C23.5 13, 23.5 27, 31 35.5" stroke="#C8102E" stroke-width="1.7" fill="none" stroke-dasharray="1 3.4" stroke-linecap="round"/></svg>';

/* Wind arrow points the way the wind is going, i.e. bearing + 180. */
const windArrow = deg => '<svg class="arrow" viewBox="0 0 20 20" aria-hidden="true" '
  + 'style="transform:rotate(' + (((deg||0)+180)%360) + 'deg)">'
  + '<path d="M10 2 L14.5 12 L10 9.6 L5.5 12 Z"/></svg>';

/* Bases, with home plate included. Without it three floating squares do not
   read as an infield — home is the anchor that makes the shape legible. The
   label spells out the state, since the shape alone conveys nothing to a
   screen reader. */
function basesText(on){
  const b = Array.isArray(on) ? on : [];
  const names = ["first","second","third"].filter((_,i) => b[i]);
  if(!names.length) return "Bases empty";
  if(names.length === 3) return "Bases loaded";
  return "Runner" + (names.length > 1 ? "s" : "") + " on "
    + (names.length === 2 ? names.join(" and ") : names[0]);
}

function diamond(on){
  const b = Array.isArray(on) ? on : [];
  const bases = [[0,-9,b[1]],[9,0,b[0]],[-9,0,b[2]]];
  const sq = (x,y,filled) =>
    '<rect x="' + (x-4) + '" y="' + (y-4) + '" width="8" height="8" transform="rotate(45 '
    + x + ' ' + y + ')" fill="' + (filled ? "#F5B841" : "none") + '" stroke="'
    + (filled ? "#F5B841" : "#3A5A60") + '" stroke-width="1.4"/>';
  return '<svg width="38" height="38" viewBox="0 0 38 38" role="img" aria-label="'
    + basesText(b) + '">'
    + '<g transform="translate(19,17)">'
    + '<path d="M-9 0 L0 -9 L9 0 L0 9 Z" fill="none" stroke="#1C3A40" stroke-width="1"/>'
    + bases.map(([x,y,f]) => sq(x,y,f)).join("")
    + '<path d="M-3.2 9 L0 6 L3.2 9 L3.2 12 L-3.2 12 Z" fill="#2A4A50"/>'
    + '</g></svg>';
}

/* The batter's season line, when a box score has been read. */
function batLine(pk, id){
  const b = id != null ? S.box[boxKey(pk, id)] : null;
  if(!b) return "";
  const bits = [];
  if(b.avg) bits.push(b.avg);
  if(b.hr != null) bits.push(b.hr + " HR");
  if(b.today) bits.push(b.today);
  return bits.length ? ' <i class="batline">' + esc(bits.join(" \u00b7 ")) + '</i>' : "";
}

/* Tonight's work for whoever is pitching: count first, since that is the one
   that tells you the bullpen is coming. */
function pitchLine(pk, id){
  const b = id != null ? S.box[boxKey(pk, id)] : null;
  if(!b) return "";
  const bits = [];
  if(b.pitches != null) bits.push(b.pitches + " pitches");
  if(b.pIp) bits.push(b.pIp + " IP");
  if(b.pEr != null) bits.push(b.pEr + " ER");
  if(b.pK != null) bits.push(b.pK + " K");
  return bits.length
    ? '<div class="formline"><em>tonight</em>' + esc(bits.join(" \u00b7 ")) + '</div>' : "";
}

function inningText(g){
  if(!g.ord) return "Live";
  const h = (g.half||"").toLowerCase();
  if(h === "middle") return "Mid " + g.ord;
  if(h === "end") return "End " + g.ord;
  return (h === "bottom" ? "Bot " : "Top ") + g.ord;
}

/* Baseball is played in series, not as isolated games.

   Two things this has to get right. First, a four- or five-game set can start
   before the app's four-day window, so the tally comes from the full season
   fetch where available and falls back to the window until that lands.

   Second, whether the game in front of you counts. For one still to come, the
   record is the state going in. For one already final, leaving it out reads as
   nonsense — you have just watched a team win and the line says they trail. So
   a finished game counts itself. */
function seriesLine(g){
  if(!g.sg || !g.gis || g.gis < 2) return "";
  const key = h2hKey(g.hid, g.aid);
  const seasonList = S.series[key];
  const inclusive = g.st === "final";
  const DAYS = 7 * 24 * 3600 * 1000;
  const when = g.date ? new Date(g.date).getTime() : null;

  let h = 0, a = 0, counted = 0;
  if(Array.isArray(seasonList) && seasonList.length && when != null){
    for(const x of seasonList){
      if(x.sg == null) continue;
      if(inclusive ? x.sg > g.sg : x.sg >= g.sg) continue;
      if(Math.abs(new Date(x.date).getTime() - when) > DAYS) continue;   // same set only
      if(x.winner === g.hid) h++; else a++;
      counted++;
    }
  } else {
    // Fallback: the games held in the current window.
    const samePair = x => (x.hid === g.hid && x.aid === g.aid)
      || (x.hid === g.aid && x.aid === g.hid);
    for(const x of S.games){
      if(!samePair(x) || x.st !== "final" || x.sg == null) continue;
      if(inclusive ? x.sg > g.sg : x.sg >= g.sg) continue;
      if(x.hs === x.as) continue;
      if((x.hs > x.as ? x.hid : x.aid) === g.hid) h++; else a++;
      counted++;
    }
  }

  let txt = "Game " + g.sg + " of " + g.gis;
  if(counted){
    txt += h === a
      ? " · series level " + h + "\u2013" + a
      : " · " + ab(h > a ? g.hid : g.aid) + " lead "
        + Math.max(h,a) + "\u2013" + Math.min(h,a);
  } else if(g.sg === 1){
    txt += " · opener";
  } else if(g.sg === g.gis){
    txt += " · finale";
  }
  return '<div class="serieslabel">' + txt + '</div>';
}

function stakes(g){
  const h = S.teams[g.hid], a = S.teams[g.aid];
  if(!h || !a) return null;
  if(h.div === a.div){
    const lead = inDiv(h.div)[0];
    if(lead && gbTo(h,lead) <= 4 && gbTo(a,lead) <= 4)
      return ["seam", DIV[h.div][0] + " " + DIV[h.div][1] + " stakes"];
    return ["slate","Division rival"];
  }
  if(pct(h) >= .54 && pct(a) >= .54) return ["bulb","Two contenders"];
  return null;
}

function side(id, runs, hits, won, blank, batting){
  const t = S.teams[id], c = col(id);
  // The run total carries the club's colour. The leader also gets a glow in
  // that colour, so who is ahead still reads instantly on a dark panel.
  const runStyle = blank ? ""
    : ' style="color:' + c + (won ? ';text-shadow:0 0 15px ' + c + '66' : '') + '"';
  const runLabel = blank ? "" : ' aria-label="' + nm(id) + ' ' + runs
    + (runs === 1 ? " run" : " runs") + (won ? ", leading" : "") + '"';
  return '<div class="srow' + (won ? " win" : "") + '">'
    + '<span class="tbar" style="background:' + c + '" aria-hidden="true"></span>'
    + '<span class="sabbr">' + ab(id)
      + (batting ? '<i class="atbat" role="img" aria-label="at bat"></i>' : "") + '</span>'
    + '<span class="sname">' + esc(nm(id)) + '</span>'
    + '<span class="srec">' + (t ? t.w + "–" + t.l : "") + '</span>'
    + '<span class="shits">' + (hits == null ? "" : hits) + '</span>'
    + '<span class="sruns"' + runStyle + runLabel + '>' + (blank ? "" : runs) + '</span></div>';
}

function weatherStrip(g){
  const v = S.venues[g.venueId];
  const roof = v && v.roof ? v.roof : null;
  const shut = roof && /dome|indoor|closed/i.test(roof);
  const w = wxAt(g.venueId, g.start);
  if(!w && !roof) return "";
  const air = w && w.air != null
    ? '<span class="wxbit' + (w.air <= THIN_AIR ? ' thin' : '') + '"><b>' + Math.round(w.air)
      + '%</b> air' + (w.elev != null && w.elev > 300 ? ' · ' + feet(w.elev).toLocaleString() + ' ft' : "")
      + '</span>'
    : "";
  if(shut){
    return '<div class="wx"><span class="wxbit">Roof closed — no wind in play</span>' + air
      + '<span class="wxroof shut">' + esc(roof) + '</span></div>';
  }
  if(!w) return "";
  const rel = windRelative(w.dir, cfBearing((v && v.name) || g.venue));
  const gust = w.wind >= 12;
  return '<div class="wx">'
    + '<span class="wxtemp">' + Math.round(w.temp) + '°</span>'
    + '<span class="wxbit' + (gust && rel && /^out/.test(rel) ? ' thin' : '') + '">'
      + windArrow(w.dir) + '<b>' + Math.round(w.wind) + '</b> mph '
      + (rel ? rel : "from " + compass(w.dir)) + '</span>'
    + air
    + (w.rain != null && w.rain >= 25 ? '<span class="wxbit"><b>' + w.rain + '%</b> rain</span>' : "")
    + (roof ? '<span class="wxroof">' + esc(roof) + '</span>' : "")
    + '</div>';
}

/* ---------------- pitcher style, as a read rather than a forecast ----------------
   The honest version of "pitch mix matchup" needs pitch-by-pitch tracking data —
   which pitch, how often, what the batter does against each one. That lives only
   on Baseball Savant, which publishes no public API: no documented endpoints, no
   keyless access, nothing this app could fetch the way it fetches everything else.
   Third-party scrapers exist behind paid tokens, which would mean adding a paid
   dependency to an app that has had none.

   So this is not pitch mix. It is a coarser, honest substitute built from three
   numbers already on file for every starter — K/9, BB/9, innings per start — read
   against the league average of starters currently loaded. A high-K9, low-BB9 arm
   misses bats and works ahead; a low-K9, high-BB9 arm survives on weaker contact
   and deeper counts. That much is real and already fetched.

   It is deliberately descriptive, not another multiplier. K/9 already drives the
   strikeout projection directly, and HR/9 and opponent average already drive the
   home run and hit chances directly — folding a K9-derived "archetype" into those
   probabilities as well would count the same fact twice under two names. This
   reads the same way "Power on show" does: a fact about what has already
   happened, not a forecast, and not fed into any number elsewhere in the app. */
function leagueStarterRates(){
  let k = 0, bb = 0, n = 0;
  for(const key in S.pitchers){
    const p = S.pitchers[key];
    if(!p || p.gs == null || p.gs < 3 || p.k9 == null || p.bb9 == null) continue;
    k += p.k9; bb += p.bb9; n++;
  }
  return n >= 8 ? { k9:k / n, bb9:bb / n } : null;
}

function pitcherArchetype(p){
  if(!p || p.k9 == null || p.bb9 == null || !p.ip || !p.gs || p.gs < 3) return null;
  const lg = leagueStarterRates();
  if(!lg) return null;
  /* Through startInnings, not p.ip / p.gs. The raw division counts relief innings
     against starts and read 7.1 for a man throwing two, which is the bug this
     function would otherwise repeat in its own words. */
  const ipStart = startInnings(p);
  if(ipStart == null || ipStart < 2) return null;
  const kd = p.k9 - lg.k9, bd = p.bb9 - lg.bb9;
  const bits = [];
  if(kd >= 1.2) bits.push("swing-and-miss stuff");
  else if(kd <= -1.2) bits.push("pitches to contact");
  if(bd >= 1.0) bits.push("below-average control");
  else if(bd <= -1.0) bits.push("sharp control");
  if(ipStart >= 6.3) bits.push("typically goes deep");
  else if(ipStart <= 5.0) bits.push("typically short outings");
  return bits.length ? bits : null;
}

function pill(label, val, dp, hot){
  if(val == null || isNaN(val)) return "";
  return '<span class="pill' + (hot ? " hot" : "") + '"><b>'
    + val.toFixed(dp) + '</b>' + label + '</span>';
}

/* A starter's season line. Falls back to the bare name when MLB has no
   stats yet — a debut, or a reliever with no starts — rather than showing
   zeros that would read as a pitcher who has been shelled. */
function pitcherLine(teamId, pid, fallbackName){
  const p = S.pitchers[pid] || null;
  const name = (p && p.name) || fallbackName;
  if(!name) return "";
  const bits = [ab(teamId)];
  if(p && p.hand) bits.push(p.hand + "HP");
  if(p && p.ip) bits.push(p.ip.toFixed(0) + " IP");
  const stats = p
    ? pill("ERA", p.era, 2) + pill("WHIP", p.whip, 2) + pill("K/9", p.k9, 1)
      + pill("HR/9", p.hr9, 1, p.hr9 != null && p.hr9 >= 1.3)
    : "";
  const f = p && p.form;
  const formLine = f
    ? '<div class="formline"><em>last ' + f.n + (f.n === 1 ? " start" : " starts") + '</em>'
      + '<b>' + f.era.toFixed(2) + '</b> ERA · ' + ipText(f.ip) + ' IP · '
      + f.k + ' K · ' + f.bb + ' BB · ' + f.hr + ' HR</div>'
    : "";
  const style = pitcherArchetype(p);
  const styleLine = style
    ? '<div class="formline sub"><em>reads as</em>' + esc(style.join(" · ")) + '</div>'
    : "";
  return '<div class="pline">'
    + '<span class="tbar" style="background:' + col(teamId) + '" aria-hidden="true"></span>'
    + '<span class="pname">' + esc(name) + '<em>' + bits.join(" · ") + '</em></span>'
    + '<span class="prec">' + (p && p.w != null ? p.w + "–" + p.l : "") + '</span></div>'
    + '<div class="pills">' + (stats || '<span class="pill">no season line yet</span>') + '</div>'
    + formLine + styleLine;
}

function starters(g){
  if(!g.aProb && !g.hProb && !g.aProbId && !g.hProbId) return "";
  const bp = (teamId) => {
    const b = S.bullpens[teamId];
    return b ? ab(teamId) + ' <b>' + b.era.toFixed(2) + '</b>' : "";
  };
  const a = bp(g.aid), h = bp(g.hid);
  const lgTxt = S.bpLg != null ? ' \u00b7 lg ' + S.bpLg.toFixed(2) : "";

  // Season series so far, if these two have met.
  const rec = S.h2h[h2hKey(g.hid, g.aid)];
  const hw = rec ? (rec[g.hid] || 0) : 0, aw = rec ? (rec[g.aid] || 0) : 0;
  const h2h = (hw + aw) > 0
    ? '<div class="bpline"><em>season series</em>'
      + ab(g.aid) + ' <b class="' + (aw > hw ? "up" : "") + '">' + aw + '</b>'
      + ' \u00b7 ' + ab(g.hid) + ' <b class="' + (hw > aw ? "up" : "") + '">' + hw + '</b>'
      + (hw === aw ? ' \u00b7 level' : "") + '</div>'
    : "";
  return '<div class="pblock"><h5 class="plabel">Starters</h5>'
    + pitcherLine(g.aid, g.aProbId, g.aProb)
    + pitcherLine(g.hid, g.hProbId, g.hProb)
    + (a && h ? '<div class="bpline"><em>bullpen era</em>' + a + ' \u00b7 ' + h + lgTxt + '</div>' : "")
    + h2h
    + '</div>';
}

/* Whoever is throwing right now. The defence is the side not batting. */
function onMound(g){
  if(g.st !== "live" || (!g.pitcherId && !g.pitcher)) return "";
  const teamId = /top/i.test(g.half || "") ? g.hid : g.aid;
  return '<div class="pblock"><h5 class="plabel">On the mound</h5>'
    + pitcherLine(teamId, g.pitcherId, g.pitcher)
    + pitchLine(g.pk, g.pitcherId) + '</div>';
}

/* The detail blocks are the bulk of a card's height, so they fold away by
   default. Score, time and conditions stay visible — enough to scan fifteen
   games — and one tap opens the rest. */
function detail(g){
  const open = !!S.open[g.pk];
  const label = open
    ? '<span>Less</span><i class="chev" aria-hidden="true">\u25B4</i>'
    : '<span>Starters · power · bases · model line</span><i class="chev" aria-hidden="true">\u25BE</i>';
  const toggle = '<button class="disc" data-toggle="' + g.pk + '" aria-expanded="' + open + '">'
    + label + '</button>';
  if(!open) return toggle;

  const inner = starters(g) + powerBlock(g) + basepathBlock(g) + projectionBlock(g);
  if(inner) return inner + toggle;
  // Expanded but the deferred fetch has not landed yet.
  return '<div class="pblock waiting">'
    + (S.detailState === "error"
        ? "Could not load starters and hitters."
        : "Loading starters, power and the model line\u2026")
    + '</div>' + toggle;
}

/* A bar for the live win probability, split at the current split. */
/* The last completed play, in MLB's words. Trimmed of the leading batter name
   where the badge and the description would otherwise repeat it. */
function lastPlayLine(g){
  if(g.st !== "live") return "";
  const p = S.lastPlay[g.pk];
  if(!p || !p.desc) return "";
  return '<div class="lastplay">'
    + '<span class="chip ' + p.kind.tone + '">' + esc(p.kind.tag) + '</span>'
    + '<span class="lpwhen">' + (p.top ? "T" : "B") + p.inning + '</span>'
    + '<p class="lpdesc">' + esc(p.desc) + '</p>'
    + '</div>';
}

function liveOdds(g){
  const w = liveWinProb(g);
  if(!w) return "";
  /* A game in progress is never settled, so the display never says 0 or 100. */
  const raw = Math.round(w.pHome * 100);
  const hp = Math.min(99, Math.max(1, raw)), ap = 100 - hp;
  const lead = hp >= ap ? g.hid : g.aid;
  return '<div class="liveodds">'
    + '<div class="lobar" role="img" aria-label="Win probability: '
      + esc(nm(g.aid)) + ' ' + ap + ' percent, ' + esc(nm(g.hid)) + ' ' + hp + ' percent">'
      + '<i style="width:' + ap + '%;background:' + col(g.aid) + '"></i>'
      + '<i style="width:' + hp + '%;background:' + col(g.hid) + '"></i>'
    + '</div>'
    + '<div class="lolabels"><span>' + ab(g.aid) + ' ' + ap + '%</span>'
    + '<em>win probability</em>'
    + '<span>' + ab(g.hid) + ' ' + hp + '%</span></div>'
    + '</div>';
}

function gameCard(g){
  const blank = g.st === "sched" || g.st === "off";
  const tag = stakes(g);
  const homeBats = g.st === "live" && /bottom/i.test(g.half||"");
  const awayBats = g.st === "live" && /top/i.test(g.half||"");
  let head = "";
  const dl = g.delay;
  if(g.st === "off")
    head = '<span class="glabel warn">' + esc(g.detail || "Postponed") + '</span>';
  else if(dl && dl.pre)
    /* Not started, and not starting on time. The scheduled time stays, struck
       through, so it is clear what was meant to happen. */
    head = '<span class="glabel warn">Delayed' + (dl.why ? ' \u00b7 ' + esc(dl.why) : "")
      + '</span><span class="glabel was">' + dayName(g.start) + " " + clock(g.start) + '</span>';
  else if(g.st === "live")
    head = '<span class="livetag"><span class="dot' + (dl ? "" : " live") + '"></span>'
      + (dl ? 'Delayed' + (dl.why ? ' \u00b7 ' + esc(dl.why) : "") : inningText(g)) + '</span>'
      + (dl ? '<span class="glabel was">' + inningText(g) + '</span>' : "");
  else if(g.st === "final") head = '<span class="glabel">' + esc(g.detail || "Final") + '</span>';
  else head = '<span class="glabel">' + dayName(g.start) + " " + clock(g.start) + '</span>';

  let count = "";
  if(g.st === "live" && g.balls != null){
    // Between halves MLB still reports three outs and a stale count. There is
    // no live at-bat then, so show nothing rather than a row of red lights.
    const inPlay = /^(top|bottom)$/i.test(g.half || "");
    if(inPlay){
      const outs = g.outs || 0;
      count = '<span class="count">'
        + '<span class="bs" aria-label="Count ' + g.balls + ' and ' + g.strikes + '">'
          + g.balls + "–" + g.strikes + '</span>'
        + '<span class="outs" role="img" aria-label="' + outs
          + (outs === 1 ? " out" : " outs") + '">' + [0,1,2].map(i =>
          '<i class="' + (i < outs ? "on" : "") + '" aria-hidden="true"></i>').join("")
        + '</span></span>';
    }
  }

  return '<article class="gcard"><header class="ghead">' + head + count
    + (tag ? '<span class="chip ' + tag[0] + '">' + tag[1] + '</span>' : "") + '</header>'
    + seriesLine(g)
    + '<div class="matrix"><div class="mhead"><span></span><span>H</span><span>R</span></div>'
    + side(g.aid, g.as, g.aH, !blank && g.as > g.hs, blank, awayBats)
    + side(g.hid, g.hs, g.hH, !blank && g.hs > g.as, blank, homeBats)
    + '</div>'
    + liveOdds(g)
    + weatherStrip(g)
    + (g.st === "live" && g.balls != null
        ? '<div class="livebar">' + diamond(g.onBase) + '<div class="matchup">'
          + (g.batter
              // Between halves nobody is at the plate; MLB is naming who is next.
              ? '<span><em>' + (/^(top|bottom)$/i.test(g.half || "") ? "AB" : "DUE UP")
                + '</em>' + esc(g.batter) + batLine(g.pk, g.batterId) + '</span>'
              : "")
          + (g.onDeck || g.inHole
              ? '<span><em>NEXT</em>'
                + [g.onDeck, g.inHole].filter(Boolean).map(n => esc(lastName(n))).join(", ")
                + '</span>'
              : "")
          + '</div></div>'
        : "")
    + lastPlayLine(g)
    + stealLine(g)
    + onMound(g)
    + (g.st === "sched" ? detail(g) : "")
    + '<footer class="gfoot"><span>' + esc(g.venue || city(g.hid)) + '</span>'
    + '<button class="tlink" data-team="' + g.hid + '">' + ab(g.hid) + ' outlook →</button>'
    + '</footer></article>';
}

/* The club you follow, and the one thing you actually want to know about it:
   what is happening right now, or next. Live game beats upcoming beats last
   result. */
function followState(id){
  const mine = g => g.hid === id || g.aid === id;
  const live = S.games.find(g => mine(g) && g.st === "live");
  if(live) return { g:live, kind:"live" };
  const next = S.games.filter(g => mine(g) && g.st === "sched")
    .sort((a,b) => new Date(a.start) - new Date(b.start))[0];
  if(next) return { g:next, kind:"next" };
  const last = S.games.filter(g => mine(g) && g.st === "final")
    .sort((a,b) => new Date(b.start) - new Date(a.start))[0];
  return last ? { g:last, kind:"last" } : null;
}

function followStrip(){
  const id = S.follow;
  if(!id || !S.teams || !S.teams[id]) return followPicker();
  const t = S.teams[id], o = S.odds && S.odds[id];
  const rows = inDiv(t.div), rank = rows.findIndex(x => x.id === id) + 1;
  const ord = ["", "1st", "2nd", "3rd", "4th", "5th"][rank] || rank + "th";
  const d = DIV[t.div];
  const st = followState(id);

  let line = "No game in this window.";
  if(st){
    const g = st.g, home = g.hid === id, opp = home ? g.aid : g.hid;
    const vs = (home ? "vs " : "at ") + ab(opp);
    if(st.kind === "live"){
      const me = home ? g.hs : g.as, them = home ? g.as : g.hs;
      const edge = me > them ? "up" : me < them ? "down" : "tied";
      // The number is already computed for the card; this is where you want it.
      const w = liveWinProb(g);
      const mine = w ? (home ? w.pHome : 1 - w.pHome) : null;
      line = '<b>' + me + '\u2013' + them + '</b> ' + edge + ' ' + vs
        + ' \u00b7 ' + inningText(g)
        + (mine != null
            ? ' \u00b7 <b>' + Math.min(99, Math.max(1, Math.round(mine * 100))) + '%</b>'
            : "");
    } else if(st.kind === "next"){
      line = vs + ' \u00b7 ' + dayName(g.start) + ' ' + clock(g.start);
    } else {
      const me = home ? g.hs : g.as, them = home ? g.as : g.hs;
      line = (me > them ? "Won " : "Lost ") + me + '\u2013' + them + ' ' + vs;
    }
  }

  return '<section class="follow" style="border-left-color:' + col(id) + '">'
    + '<div class="fhead">'
    + '<button class="fname" data-team="' + id + '">'
      + '<b>' + ab(id) + '</b><em>' + esc(city(id) + " " + nm(id)) + '</em></button>'
    + '<span class="fpos">' + ord + ' ' + d[0] + ' ' + d[1] + '</span>'
    + '</div>'
    + '<div class="fstats">'
      + '<span><b>' + t.w + '\u2013' + t.l + '</b>record</span>'
      + '<span><b>' + gbText(gbTo(t, rows[0])) + '</b>gb</span>'
      + '<span><b>' + (o ? pc(o.berth) + '%' : '\u2014') + '</b>october</span>'
      + '<span><b>' + (o ? o.p10 + '\u2013' + o.p90 : '\u2014') + '</b>wins</span>'
    + '</div>'
    + '<p class="fgame">' + line + '</p>'
    + '<button class="fchange" id="changeTeam">'
      + (S.picker ? "Close" : "Change club") + '</button>'
    + (S.picker ? pickerGrid() : "")
    + '</section>';
}

function followPicker(){
  return '<section class="follow" style="border-left-color:var(--line)">'
    + '<p class="fgame">Pick a club to follow and its state shows here first.</p>'
    + pickerGrid() + '</section>';
}

function pickerGrid(){
  return '<div class="pgrid">'
    + CLUB_IDS.map(id => '<button class="pbtn' + (S.follow === id ? " on" : "") + '"'
      + ' data-follow="' + id + '" aria-pressed="' + (S.follow === id) + '"'
      + ' aria-label="Follow ' + esc(city(id) + " " + nm(id)) + '" style="border-color:'
      + (S.follow === id ? col(id) : "var(--line)") + '">' + ab(id) + '</button>').join("")
    + '<button class="pbtn wide" data-follow="none">None</button></div>';
}

/* What moved since the baseline.

   Records are exact, so a win or loss is reported plainly. Odds are not: they
   come out of a 5,000-season Monte Carlo whose own standard error is close to
   a percentage point, so an unchanged record with a "different" probability is
   noise, not news. Odds movement is therefore only reported for clubs whose
   record actually changed, and only past a point of movement. */
function sinceBlock(){
  const b = S.baseline;
  if(!b || !S.teams || !S.odds) return "";

  const known = id => b.teams[id] || b.teams[String(id)];
  const clubs = list().filter(t => known(t.id));
  if(!clubs.length) return "";

  const played = clubs.reduce((n,t) => n + t.w + t.l, 0)
    - clubs.reduce((n,t) => { const [w,l] = known(t.id); return n + w + l; }, 0);
  const games = Math.round(played / 2);

  const moved = t => { const [w,l] = known(t.id); return t.w !== w || t.l !== l; };
  const oddsDelta = t => {
    if(!moved(t)) return null;                     // unchanged record: any diff is noise
    const prev = b.odds ? (b.odds[t.id] != null ? b.odds[t.id] : b.odds[String(t.id)]) : null;
    if(prev == null) return null;
    const d = S.odds[t.id].berth * 100 - prev;
    return Math.abs(d) >= 1 ? d : null;
  };

  const lines = [];
  const id = S.follow;

  if(id && S.teams[id] && known(id)){
    const t = S.teams[id], [bw, bl] = known(id);
    const dw = t.w - bw, dl = t.l - bl;
    if(dw || dl){
      const rows = inDiv(t.div), lead = rows[0];
      const verb = dw && dl ? "went " + dw + "\u2013" + dl
        : dw ? (dw === 1 ? "won" : "won " + dw)
             : (dl === 1 ? "lost" : "lost " + dl);
      let s = '<b>' + ab(id) + '</b> ' + verb + ', now ' + t.w + '\u2013' + t.l;
      s += lead.id === t.id
        ? ' and lead the ' + DIV[t.div][1] + ' by ' + gbText(gbTo(rows[1], t))
        : ', ' + gbText(gbTo(t, lead)) + ' back';
      const od = oddsDelta(t);
      if(od != null) s += ' \u00b7 October ' + (od > 0 ? "+" : "\u2212")
        + Math.abs(od).toFixed(0) + ' pts';
      lines.push(s);
    }

    // Rivals matter as much as your own result when you are chasing or leading.
    const rivals = inDiv(S.teams[id].div).filter(t => t.id !== id && moved(t));
    if(rivals.length){
      lines.push('In the ' + DIV[S.teams[id].div][1] + ': ' + rivals.map(t => {
        const [w,l] = known(t.id);
        const dw = t.w - w, dl = t.l - l;
        return ab(t.id) + " " + (dw && dl ? dw + "\u2013" + dl : dw ? "won" : "lost");
      }).join(", "));
    }
  }

  /* With nothing to report, a full panel and a button to dismiss it is a lot
     of furniture around the word "nothing". Collapse to one line, and on a
     first visit say what the thing is for rather than that it is empty. */
  if(!lines.length){
    const fresh = Date.now() - new Date(b.at).getTime() < 5 * 60 * 1000;
    const msg = games > 0
      ? games + (games === 1 ? " game has" : " games have") + " finished, none touching "
        + (id && S.teams[id] ? ab(id) : "the standings") + "."
      : fresh
        ? "Tracking from now. Next time you open this, anything that moved will be here."
        : "Nothing has changed since " + timeAgo(b.at) + ".";
    return '<p class="sincelite">' + msg + '</p>';
  }

  return '<section class="since">'
    + '<h5 class="sincehead">Since ' + timeAgo(b.at) + '</h5>'
    + lines.map(l => '<p>' + l + '</p>').join("")
    + (games > 0
        ? '<p class="sincefoot">' + games + (games === 1 ? " game" : " games")
          + ' finished league-wide.</p>' : "")
    + '<button class="fchange" id="markSeen">Mark as seen</button>'
    + '</section>';
}

function renderToday(){
  const today = iso(new Date()), yday = iso(shift(-1)), tmw = iso(shift(1));
  const mine = S.games.filter(g => g.date === today);
  /* A game in progress is in progress, whatever date MLB filed it under. Past
     midnight local time, a game that began at 9:38 the previous evening still
     carries yesterday's officialDate — date-filtering it made every live game
     vanish at midnight, which is exactly when you would still be watching. */
  const live = S.games.filter(g => g.st === "live");
  const fin = mine.filter(g => g.st === "final");
  const soon = mine.filter(g => g.st === "sched");
  /* A postponed game is not still to come, and listing it there was misleading.
     It gets its own section after the rest. */
  const off = mine.filter(g => g.st === "off");
  /* A postponed game is not one of today's games. */
  const playable = mine.length - off.length;
  const last = S.games.filter(g => g.date === yday && g.st === "final");
  const next = S.games.filter(g => g.date === tmw);

  const scored = live.concat(fin);
  const runs = scored.reduce((n,g) => n + (g.hs||0) + (g.as||0), 0);
  /* A 0–0 game in the second is "within a run" in the trivial sense. Count it
     only once the game is late enough for that to say something, and always
     count finals. */
  const close = scored.filter(g => {
    if(Math.abs((g.hs||0) - (g.as||0)) > 1) return false;
    return g.st === "final" || (g.inn != null && g.inn >= 6);
  }).length;

  // Now that field orientation is known, count the wind that actually helps:
  // blowing out, hard enough to matter, in a park with no roof over it.
  const blowingOut = mine.filter(g => {
    const v = S.venues[g.venueId], w = wxAt(g.venueId, g.start);
    if(!w || (v && v.roof && /dome|indoor|closed/i.test(v.roof))) return false;
    const rel = windRelative(w.dir, cfBearing((v && v.name) || g.venue));
    return rel && /^out/.test(rel) && w.wind >= 10;
  }).length;
  // Thin air carries the ball: anything meaningfully below sea-level standard.
  const thin = mine.filter(g => {
    const w = wxAt(g.venueId, g.start);
    return w && w.air != null && w.air <= THIN_AIR;
  }).length;
  const stakesToday = mine.filter(g => { const s = stakes(g); return s && s[0] !== "slate"; }).length;

  /* Before anything has been played, "within a run" is always zero and the
     panel is dead weight, so the whole ledger switches on whether the day
     has produced any baseball yet. */
  const panels = scored.length
    ? [[live.length || playable, live.length ? "in progress" : "games today"],
       [runs, "runs today"], [close, "tight late"]]
    : [[playable, "games today"],
       [blowingOut, "wind blowing out"],
       [thin ? thin : stakesToday, thin ? "thin air" : "with stakes"]];

  const todaySched = mine.filter(g => g.st === "sched").map(g => g.pk);
  const allOpen = todaySched.length > 0 && todaySched.every(p => S.open[p]);

  const block = (title, arr) => arr.length
    ? '<h2 class="eyebrow">' + title + '</h2><div class="grid">' + arr.map(gameCard).join("") + '</div>'
    : "";

  return '<div class="pane">'
    + followStrip()
    + sinceBlock()
    + '<div class="ledger">'
    + panels.map(([n,label]) => '<div><b>' + n + '</b><span>' + label + '</span></div>').join("")
    + '</div>'
    + (todaySched.length
        ? '<button class="expandall" id="expandAll">'
          + (allOpen ? "Collapse all cards" : "Expand all cards") + '</button>'
        : "")
    + block("On the field now", live)
    + block("Final today", fin)
    + block("Still to come", soon)
    + block("Not being played", off)
    + (last.length ? SEAM + block("Last night", last) : "")
    + block("Tomorrow", next)
    + (mine.length + next.length === 0
        ? '<div class="empty"><h3>Nothing scheduled</h3><p>No games today or tomorrow.</p></div>' : "")
    + '<button class="disc notes" data-notes="1" aria-expanded="' + (S.notesOpen ? "true" : "false") + '">'
      + '<span>Notes on the numbers</span><i class="chev" aria-hidden="true">'
      + (S.notesOpen ? "\u25B4" : "\u25BE") + '</i></button>'
    + (S.notesOpen ? ('<p class="note">Weather is the forecast for first pitch at each ballpark, from Open-Meteo. '
    + 'Where a park\'s home-plate-to-centre-field bearing is on file, the wind is given as the '
    + 'batter sees it — "out to left", "in from center". Where it is not, the raw bearing the wind '
    + 'comes <em>from</em> is shown instead. Parks are added to that table only once verified, so '
    + 'a raw bearing means unknown, never guessed.</p>'
    + '<p class="note">Power on show is what has already happened: each club\'s five '
    + 'leading home run hitters, how often they have gone deep per plate appearance, and '
    + 'the HR/9 of the arm they face. These are rates, not forecasts, and this block '
    + 'deliberately stops there.</p>'
    + '<p class="note">The Plays tab does now multiply them into a chance for the one bat '
    + 'it names per club, which this note used to say it would never do. What changed is '
    + 'that the record needed a bar to grade against: "one homer in sixteen picks" means '
    + 'nothing without knowing how many were expected. Most of that multiplication is '
    + 'measured \u2014 the batter\u2019s rate, the pitcher\u2019s HR/9, and air density from '
    + 'the pressure and temperature at the park. Two numbers in it are not: how much '
    + 'thinner air lifts a home run rate, and how much a wind blowing out does. Both are '
    + 'stated in the source, both are damped, and neither has been tested against a '
    + 'result. Treat the percentage as the app showing its working, not as a price.</p>'
    /* A silent failure is worse than a missing feature. When the roster request
       comes back empty the app loses handedness entirely — no platoon term on any
       bat, and the measured splits cannot be applied either, since they are keyed
       by which side a man bats from. Nothing on screen said so; the rows simply
       stopped carrying "L v RHP" and the picks quietly got blunter. */
    + (!Object.keys(S.bats || {}).length
        ? '<p class="note"><b>Handedness is not loaded.</b> The roster request came back '
          + 'empty, so no bat pick carries a platoon term tonight and the measured splits '
          + 'cannot be applied either \u2014 they are keyed by which side a man bats from. '
          + 'The picks are otherwise sound; they are blind to the one thing that usually '
          + 'separates two team-mates. The footer shows it as bats 0.</p>'
        : "")
    + '<p class="note">A starter\'s line can carry a "reads as" tag \u2014 swing-and-miss '
    + 'stuff, sharp control, typically goes deep \u2014 built from his K/9, BB/9 and '
    + 'innings per start against the league average of starters currently loaded. This is '
    + 'not a pitch-mix matchup: that needs pitch-by-pitch tracking data that only Baseball '
    + 'Savant carries, and Savant publishes no public API this app could fetch the honest '
    + 'way, keyless and without a paid dependency. The tag is a coarser substitute, and '
    + 'deliberately descriptive \u2014 it plays no part in any probability on the card. '
    + 'K/9 already sets the strikeout projection directly and HR/9 and opponent average '
    + 'already set the home run and hit chances directly; folding the same numbers into '
    + 'the picks a second time under a different name would count them twice.</p>'
    + '<p class="note">Where MLB has posted the lineup \u2014 usually a few hours before '
    + 'first pitch \u2014 only men actually in it are eligible for the bat pick, and the '
    + 'row says so. Before that the pick is made blind from the club\u2019s leading power '
    + 'hitters, which is what it always was.</p>'
    + '<p class="note">Recent form comes from actual game logs on both sides — a '
    + 'starter\'s last three outings, a hitter\'s last five games. Those are exact, not '
    + 'sampled from a date window. Logs are per player, so a card\'s hitters are fetched '
    + 'when you open it and not before.</p>'
    + '<p class="note">MLB reports hitting stats against the club a player earned them '
    + 'with, so a mid-season trade would otherwise leave someone listed under a former '
    + 'team. Every club\'s current roster is checked against, and anyone filed under a club '
    + 'they have left is dropped. If that check fails to load they are listed as before, '
    + 'and the loaded counts in the footer will show it.</p>'
    + '<p class="note">The model line is this app\'s own view: each club\'s '
    + 'winning percentage regressed toward .500, a home edge worth about four points, '
    + 'and a damped adjustment for the gap between the two starters\' ERAs. The two '
    + 'sides sum to 100%, so these are fair odds with no margin — a real book\'s prices '
    + 'will differ for that reason alone.</p>'
    + '<p class="note">Bullpens are in it too, at roughly two thirds the starter\'s '
    + 'weight, since relief covers about 3.6 of a game\'s 9 innings against a starter\'s '
    + '5.4. A club\'s bullpen ERA is built from its pitchers with zero starts, so '
    + 'swingmen are excluded from both sides equally, and the league average it is '
    + 'measured against is computed from the same data rather than assumed.</p>'
    + '<p class="note">A caveat on that, which is worth stating plainly: a season bullpen '
    + 'ERA is the same figure every night, so it is <em>already inside</em> the club\'s '
    + 'record and run differential that the same model has just used. The starter term '
    + 'escapes that problem because which starter pitches changes from game to game; the '
    + 'bullpen term does not, and is largely counting the same thing twice. Its weight is '
    + 'small enough that the damage is limited, and it remains untestable because nothing '
    + 'here knows which relievers were available on a given day \u2014 but it should not '
    + 'be read as an independent piece of evidence.</p>'
    + '<p class="note">Relief does earn its place in one spot: the bat pick. A hitter '
    + 'faces about a third of his plate appearances against the bullpen, so the HR/9 he is '
    + 'up against blends two thirds of the starter with a third of the relief behind him. '
    + 'That is not double-counting, because the bat pick starts from the hitter\'s own '
    + 'rate rather than from a team average that already contains the pen.</p>'
    + '<p class="note">It is not a betting signal. A market price also carries bullpen '
    + 'condition, lineup cards, injuries, umpires, travel and the weight of money, none '
    + 'of which are in here, and nothing in this model has been tested against actual '
    + 'results. Treat a disagreement with a sportsbook as the model being wrong.</p>'
    + '<p class="note">Air is density as a share of the sea-level standard, computed from the '
    + 'measured pressure and temperature at that park. Below 100% the air is thinner, drag is lower '
    + 'and the ball carries further — that is the whole reason Coors plays the way it does, and it is '
    + 'also why a hot afternoon plays longer than a cool evening at the same park.</p>') : "")
    + '</div>';
}

/* ---------------- clinch and elimination ----------------
   A leader's magic number is the combined total of its own wins and its
   nearest rival's losses that guarantees the division: the rival's maximum
   possible wins, less the leader's current wins, plus one. A trailing club's
   elimination number is the same arithmetic run the other way.

   MLB publishes both, and its figures account for tiebreakers, so they are
   preferred. The computed version is a fallback for when the field is absent
   or dashed out. */
const raceNum = v => {
  if(v == null) return null;
  const s = String(v).trim();
  if(s === "" || s === "-") return null;
  if(s === "E") return 0;
  const n = Number(s);
  return isNaN(n) ? null : n;
};

function raceInfo(t){
  const rows = inDiv(t.div);
  if(!rows.length) return null;
  const leader = rows[0], isLeader = leader.id === t.id;
  const maxWins = c => c.w + Math.max(0, SEASON_GAMES - c.w - c.l);

  if(t.clinched) return { kind:"clinched" };

  if(isLeader){
    const mlb = raceNum(t.magic);
    let calc = 0;
    for(const r of rows){
      if(r.id === t.id) continue;
      const v = maxWins(r) - t.w + 1;
      if(v > calc) calc = v;
    }
    const n = mlb != null ? mlb : Math.max(0, calc);
    return n <= 0 ? { kind:"clinched" } : { kind:"magic", n, source:mlb != null ? "mlb" : "calc" };
  }

  const mlb = raceNum(t.elim);
  const calc = maxWins(t) - leader.w + 1;
  const n = mlb != null ? mlb : Math.max(0, calc);
  return n <= 0 ? { kind:"out" } : { kind:"elim", n, source:mlb != null ? "mlb" : "calc" };
}

function raceBadge(t){
  const r = raceInfo(t);
  if(!r) return "";
  if(r.kind === "clinched") return '<i class="mag in">clinched</i>';
  if(r.kind === "out") return '<i class="mag out">out</i>';
  if(r.kind === "magic") return '<i class="mag" role="img" aria-label="magic number '
    + r.n + '">m' + r.n + '</i>';
  return '<i class="mag dim" role="img" aria-label="elimination number '
    + r.n + '">e' + r.n + '</i>';
}

/* Plain language beats a bare number in the team sheet. */
function raceSentence(t){
  const r = raceInfo(t);
  if(!r) return "";
  const rows = inDiv(t.div), leader = rows[0], d = DIV[t.div];
  const div = d[0] + " " + d[1];
  if(r.kind === "clinched") return ab(t.id) + " has clinched the " + div + ".";
  if(r.kind === "out") return ab(t.id) + " is out of the " + div + " race.";
  if(r.kind === "magic"){
    const rival = rows[1];
    return ab(t.id) + " clinches the " + div + " with any combination of <b>" + r.n
      + "</b> wins of their own and " + (rival ? ab(rival.id) : "the field") + " losses.";
  }
  return ab(t.id) + " is eliminated from the " + div + " after any combination of <b>"
    + r.n + "</b> losses of their own and " + ab(leader.id) + " wins.";
}

function divTable(d){
  const rows = inDiv(d);
  if(!rows.length) return "";
  const lead = rows[0], o = S.odds;
  return '<section class="dblock"><h3 class="dname">' + DIV[d][0] + " " + DIV[d][1] + '</h3>'
    + '<div class="thead"><span>Club</span><span>W–L</span><span>PCT</span><span>GB</span>'
    + '<span>L10</span><span>Div%</span></div>'
    + rows.map((t,i) =>
      '<button class="trow" data-team="' + t.id + '">'

      + '<span class="tname"><span class="tline"><b>' + ab(t.id) + '</b>' + raceBadge(t)
        + '</span><em>' + esc(nm(t.id)) + '</em></span>'
      + '<span class="tnum">' + t.w + "–" + t.l + '</span>'

        + Math.max(1.5, o[t.id].div*100) + '%;background:' + col(t.id) + '"></i></span>'
      + '<em>' + pc(o[t.id].div) + '</em></span></button>').join("")
    + '</section>';
}

function pictureBlock(lg){
  const p = pictureOf(lg), o = S.odds;

    + '<p class="note">Seeds one to three are the division leaders by record. GB cut is games behind '
