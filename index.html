<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1A1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="108">
<meta name="description" content="108 — baseball by the numbers. Live scores, standings, weather and October odds.">
<title>108 — Baseball by the numbers</title>

<!--
  108 — Baseball by the numbers
  No frameworks, no build step, no bundler, no API keys.

  Data sources, both keyless and both CORS-enabled:
    MLB Stats API   statsapi.mlb.com        scores, standings, venues
    Open-Meteo      api.open-meteo.com      temperature and wind

  Measured vs modelled is kept strictly separate. Scores, records and
  weather are fetched. The October odds are simulated in your browser
  and the method is stated in full on the Odds tab.
-->

<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root{
  --night:#0D1A1D; --deep:#122428; --panel:#162C30; --line:#22434A;
  --chalk:#F2F0E6; --slate:#7D989C; --bulb:#F5B841; --seam:#C8102E;
  --grass:#5FCB8B; --blush:#F5919F;
  --display:'Anton',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--night);color:var(--chalk);font-family:var(--body);
  -webkit-font-smoothing:antialiased;min-height:100vh;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
button:focus-visible{outline:2px solid var(--bulb);outline-offset:2px;border-radius:3px;}
button:disabled{cursor:default;}
h1,h2,h3,h4{margin:0;font-weight:400;}
p{margin:0;}
ul{margin:0;padding:0;list-style:none;}

/* masthead */
/* Opaque, not translucent. A sticky bar at 94% with a backdrop blur lets
   whatever is scrolling underneath ghost through it, which on a dense card
   means stray numbers appearing in the header. */
.mast{position:sticky;top:0;z-index:20;background:var(--night);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);}
.mtop{display:flex;align-items:center;gap:11px;padding:14px 18px 10px;}
.wordmark{font-family:var(--display);font-size:30px;letter-spacing:.02em;line-height:1;}
.tagline{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--slate);margin-top:3px;}
.feed{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.feedrow{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--slate);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--slate);display:block;}
.dot.ok{background:var(--grass);}
.dot.live{background:var(--seam);animation:pulse 1.9s ease-in-out infinite;}
.dot.bad{background:var(--bulb);}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.78);}}
.refresh{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:#738E93;}
.refresh:hover{color:var(--bulb);}
.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--slate);padding:11px 13px;white-space:nowrap;
  border-bottom:2px solid transparent;transition:color .18s;}
.tabs button[aria-selected="true"]{color:var(--chalk);border-bottom-color:var(--seam);}

.banner{padding:11px 18px;background:#241D0D;border-bottom:1px solid #4A3A16;
  font-size:12.5px;line-height:1.55;color:#E3C98A;}
.banner b{color:var(--bulb);font-weight:600;}

.pane{padding:18px 14px 64px;max-width:820px;margin:0 auto;}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--slate);margin:26px 4px 10px;}
.eyebrow.tight{margin:0 0 3px;}
.ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:4px;overflow:hidden;}
.ledger div{background:var(--deep);padding:13px 12px;}
.ledger b{display:block;font-family:var(--display);font-size:27px;line-height:1;color:var(--bulb);}
.ledger span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--slate);display:block;margin-top:5px;}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;border:1px solid;white-space:nowrap;}
.chip.seam{color:var(--blush);border-color:#5E2029;background:#2A1418;}
.chip.bulb{color:var(--bulb);border-color:#4A3A16;background:#241D0D;}
.chip.slate{color:var(--slate);border-color:var(--line);}
.seamrule{display:block;width:100%;height:14px;margin:30px 0 6px;opacity:.85;}
.note{font-size:12px;line-height:1.6;color:var(--slate);margin-top:18px;padding:0 4px;}
.toggle{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:4px;overflow:hidden;margin:18px 0 4px;}
.toggle button{flex:1;background:var(--night);padding:9px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);}
.toggle button.on{background:var(--panel);color:var(--chalk);}

/* game cards */
.grid{display:grid;gap:10px;grid-template-columns:1fr;}
@media(min-width:660px){.grid{grid-template-columns:1fr 1fr;}}
.gcard{background:var(--deep);border:1px solid var(--line);border-radius:5px;padding:11px 13px 9px;}
.ghead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:20px;}
.glabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--slate);}
.glabel.warn{color:var(--bulb);}
.livetag{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--blush);}
.count{display:flex;align-items:center;gap:7px;margin-left:auto;}
.bs{font-family:var(--mono);font-size:11px;}
.outs{display:flex;gap:3px;}
.outs i{width:5px;height:5px;border-radius:50%;border:1px solid #3A5A60;display:block;}
.outs i.on{background:var(--seam);border-color:var(--seam);}
.matrix{margin:9px -4px 8px;padding:5px 4px 7px;border-radius:3px;
  background:radial-gradient(rgba(245,184,65,.055) .7px,transparent .8px) 0 0/5px 5px,#0B1618;}
.mhead{display:grid;grid-template-columns:3px 46px 1fr auto 24px 44px;gap:8px;
  padding:2px 8px 3px;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:#738E93;}
.mhead span:nth-child(2){grid-column:5;text-align:right;}
.mhead span:nth-child(3){grid-column:6;text-align:right;}
.srow{display:grid;grid-template-columns:3px 46px 1fr auto 24px 44px;gap:8px;
  align-items:center;padding:4px 8px;}
.tbar{width:3px;height:15px;border-radius:2px;display:block;}
.sabbr{font-family:var(--display);font-size:17px;letter-spacing:.03em;color:var(--slate);
  display:flex;align-items:center;gap:4px;}
.atbat{width:4px;height:4px;border-radius:50%;background:var(--bulb);display:block;}
.win .sabbr,.win .sname{color:var(--chalk);}
.sname{font-size:12.5px;color:var(--slate);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.srec{font-family:var(--mono);font-size:10.5px;color:#738E93;}
.shits{font-family:var(--mono);font-size:11.5px;color:#6E8A8E;text-align:right;}
.sruns{font-family:var(--mono);font-weight:500;font-size:25px;text-align:right;
  color:#6E8A8E;line-height:1;}
.win .sruns{font-weight:500;}
.livebar{display:flex;align-items:center;gap:11px;padding:2px 4px 8px;}
.matchup{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:12px;}
.matchup span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.matchup em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  color:#738E93;margin-right:6px;}
/* pitcher blocks */
.pblock{margin:0 -4px 8px;padding:8px 10px 9px;border-radius:3px;background:#0F2126;
  border:1px solid #1C3A40;}
.plabel{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;
  color:#738E93;margin-bottom:7px;}
.pline{display:grid;grid-template-columns:3px 1fr auto;gap:9px;align-items:center;}
.pname{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:13.5px;color:var(--chalk);}
.pname em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--slate);}
.prec{font-family:var(--mono);font-size:11.5px;color:var(--slate);}
.mlrow{display:grid;grid-template-columns:3px 1fr auto auto;gap:9px;align-items:center;}
.mlrow + .mlrow{margin-top:5px;}
.mlpct{font-family:var(--mono);font-weight:500;font-size:14px;color:var(--chalk);
  text-align:right;min-width:38px;}
.mlodds{font-family:var(--mono);font-size:12px;color:var(--bulb);text-align:right;
  min-width:46px;}
.batrate{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--slate);
  text-align:right;min-width:74px;text-transform:uppercase;}
.clubhead{display:grid;grid-template-columns:3px auto 1fr;gap:9px;align-items:center;
  padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--line);}
.clubab{font-family:var(--display);font-size:14px;letter-spacing:.04em;color:var(--chalk);}
.facing{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:#738E93;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.facing b{color:var(--bulb);font-weight:500;}
.clubgap{height:14px;}
.bdash{width:3px;height:1px;background:var(--line);display:block;}
.formline{margin:5px 0 0 12px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:#738E93;}
.formline em{font-style:normal;font-size:8.5px;letter-spacing:.14em;color:#738E93;
  margin-right:8px;}
.formline.sub{margin:3px 0 8px 12px;}
.formline b{color:var(--chalk);font-weight:500;font-size:11px;}
.pblock.waiting{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:#738E93;text-align:center;padding:16px 10px;}
.bpline{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--slate);}
.bpline em{font-style:normal;font-size:8.5px;letter-spacing:.14em;color:#738E93;
  margin-right:9px;}
.bpline b{color:var(--slate);font-weight:500;font-size:11.5px;}
.bpline b.up{color:var(--chalk);}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 0 12px;}
.pills:not(:last-child){margin-bottom:10px;}
.pill{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--slate);border:1px solid var(--line);border-radius:2px;padding:3px 6px;
  white-space:nowrap;}
.pill b{color:var(--chalk);font-weight:500;font-size:11px;margin-right:4px;}
.pill.hot{border-color:#4A3A16;background:#241D0D;color:var(--bulb);}
.pill.hot b{color:var(--bulb);}

/* weather strip */
.serieslabel{font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:#738E93;margin:7px 0 -2px;}
.wx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 -4px 8px;
  padding:8px 10px;border-radius:3px;background:#0F2126;border:1px solid #1C3A40;}
.wxtemp{font-family:var(--mono);font-weight:500;font-size:16px;color:var(--chalk);}
.wxbit{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--slate);display:flex;align-items:center;gap:5px;}
.wxbit b{color:var(--chalk);font-weight:500;}
.wxbit.thin{color:var(--bulb);}
.wxbit.thin b{color:var(--bulb);}
.arrow{display:block;width:15px;height:15px;flex:0 0 auto;}
.arrow path{fill:var(--bulb);}
.wxroof{font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:#738E93;}
.wxroof.shut{color:var(--bulb);}
.disc{display:flex;align-items:center;justify-content:center;gap:8px;
  width:calc(100% + 8px);margin:0 -4px 8px;padding:9px 8px;border:1px solid var(--line);
  border-radius:3px;background:#0F2126;font-family:var(--mono);font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);}
.disc.notes{margin-top:26px;}
.disc:hover{color:var(--bulb);border-color:#2C5058;}
.chev{font-style:normal;font-size:11px;line-height:1;}
.expandall{width:100%;margin-top:10px;padding:9px;border:1px solid var(--line);
  border-radius:4px;background:transparent;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);}
.expandall:hover{color:var(--bulb);border-color:#2C5058;}
/* followed club */
/* since last visit */
.since{background:#0F2126;border:1px solid #1C3A40;border-radius:4px;
  padding:12px 13px 10px;margin-bottom:16px;}
.sincehead{font-family:var(--mono);font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--bulb);margin-bottom:8px;}
.since p{font-size:13px;line-height:1.55;color:var(--slate);margin-bottom:4px;}
.since p b{color:var(--chalk);font-family:var(--display);font-size:15px;
  font-weight:400;letter-spacing:.03em;}
.sincelite{font-size:12px;line-height:1.55;color:#738E93;margin:-4px 4px 16px;}
.sincefoot{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:#738E93;margin-top:7px;}
.follow{background:var(--deep);border:1px solid var(--line);border-left-width:3px;
  border-radius:4px;padding:12px 13px 11px;margin-bottom:16px;}
.fhead{display:flex;align-items:baseline;gap:10px;}
.fname{display:flex;align-items:baseline;gap:8px;text-align:left;min-width:0;}
.fname b{font-family:var(--display);font-size:20px;letter-spacing:.03em;color:var(--chalk);}
.fname em{font-style:normal;font-size:12.5px;color:var(--slate);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.fname:hover b{color:var(--bulb);}
.fpos{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:#738E93;white-space:nowrap;}
.fstats{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;}
.fstats span{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--slate);display:flex;flex-direction:column;gap:2px;}
.fstats b{font-size:14px;font-weight:500;color:var(--chalk);letter-spacing:0;}
.fgame{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--slate);}
.fgame b{color:var(--bulb);font-weight:500;font-family:var(--mono);}
.fchange{margin-top:9px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:#738E93;}
.fchange:hover{color:var(--bulb);}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:11px;}
.pbtn{padding:12px 2px;border:1px solid var(--line);border-radius:3px;
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--slate);
  background:var(--night);min-height:40px;}
.pbtn.on{color:var(--chalk);}
.pbtn.wide{grid-column:span 6;}
.pbtn:hover{color:var(--chalk);}
.gfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#738E93;}
.tlink{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--slate);white-space:nowrap;}
.tlink:hover{color:var(--bulb);}

/* tables */
.dblock{margin-top:22px;}
.dname{font-family:var(--display);font-size:19px;letter-spacing:.03em;
  text-transform:uppercase;padding:0 4px 8px;}
.thead,.trow{display:grid;grid-template-columns:16px 3px 1fr 46px 38px 32px 40px 56px;gap:8px;}
.thead{padding:0 8px 6px;border-bottom:1px solid var(--line);font-family:var(--mono);
  font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#738E93;}
.thead span:first-child{grid-column:3;}
.trow{align-items:center;width:100%;text-align:left;padding:9px 8px;
  border-bottom:1px solid rgba(34,67,74,.5);}
.trow:hover{background:var(--deep);}
.tpos{font-family:var(--mono);font-size:11px;color:#738E93;}
.tname{display:flex;flex-direction:column;gap:1px;min-width:0;}
.tline{display:flex;align-items:baseline;min-width:0;}
.mag{font-style:normal;font-family:var(--mono);font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--bulb);border:1px solid #4A3A16;background:#241D0D;
  border-radius:2px;padding:2px 4px;margin-left:6px;vertical-align:2px;}
.mag.dim{color:#738E93;border-color:var(--line);background:transparent;}
.mag.in{color:var(--grass);border-color:#1E4634;background:#0F2A1D;}
.mag.out{color:var(--blush);border-color:#5E2029;background:#2A1418;}
.tname b{font-family:var(--display);font-size:15px;font-weight:400;letter-spacing:.03em;}
.tname em{font-style:normal;font-size:11px;color:var(--slate);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.tnum{font-family:var(--mono);font-size:12.5px;text-align:right;}
.tnum.dim{color:var(--slate);}
.tnum.sm{font-size:10.5px;}
.pctcell{display:flex;align-items:center;gap:6px;}
.minibar{flex:1;height:4px;background:#0B1618;border-radius:2px;overflow:hidden;}
.minibar i{display:block;height:100%;border-radius:2px;}
.pctcell em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--slate);
  width:22px;text-align:right;}
.cutline{display:flex;align-items:center;gap:9px;padding:8px;}
.cutline::before,.cutline::after{content:"";flex:1;height:1px;
  background:repeating-linear-gradient(90deg,var(--chalk) 0 5px,transparent 5px 11px);opacity:.45;}
.cutline span{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--slate);}
.pthead,.prow{display:grid;grid-template-columns:32px 3px 1fr 46px 46px 44px;gap:8px;}
.pthead span:first-child{grid-column:3;}
.prow{align-items:center;width:100%;text-align:left;padding:9px 8px;
  border-bottom:1px solid rgba(34,67,74,.5);}
.prow:hover{background:var(--deep);}
.pseed{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--bulb);
  text-transform:uppercase;}
.othead,.orow{display:grid;grid-template-columns:3px 1fr 56px 40px 36px 68px;gap:8px;}
.othead span:first-child{grid-column:2;}
.orow{align-items:center;width:100%;text-align:left;padding:10px 8px;
  border-bottom:1px solid rgba(34,67,74,.5);}
.orow:hover{background:var(--deep);}
.obar{display:flex;align-items:center;gap:6px;height:14px;}
.obar i{display:block;height:6px;border-radius:3px;flex:0 0 auto;max-width:42px;}
.obar em{font-style:normal;font-family:var(--mono);font-size:12px;margin-left:auto;}

.cardblk{background:var(--deep);border:1px solid var(--line);border-radius:5px;
  padding:11px 13px 10px;margin-top:10px;}
.cbhead{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;
  border-bottom:1px solid var(--line);margin-bottom:8px;}
.cbteams{font-family:var(--display);font-size:16px;letter-spacing:.03em;color:var(--chalk);}
.cbtime{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:#738E93;}
.cbrow{display:grid;grid-template-columns:46px 3px 1fr auto;gap:9px;align-items:center;
  padding:4px 0;}
.cblabel{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:#738E93;}
.cbval{font-size:13px;color:var(--chalk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cbval b{font-family:var(--display);font-size:15px;font-weight:400;letter-spacing:.03em;}

<body>
<div id="app"><p class="load">Starting 108…</p></div>
<!-- Announcements live outside #app, because a live region that gets replaced
     on every render often fails to announce at all. -->
<div id="live" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
"use strict";

/* ============================== config ============================== */

const MLB = "https://statsapi.mlb.com/api/v1";
const WX  = "https://api.open-meteo.com/v1/forecast";
/* Bumped whenever this file changes, and printed in the footer, so "is the
   new version actually deployed?" is answerable without guessing. */
const BUILD = "42 — calibration: replay the model against results";
const SEASON_GAMES = 162;
const SIMS = 5000;
const SHEET_SIMS = 1500;
const REGRESS = 40;          // games of .500 folded into every record
const HFA = 0.16;            // log-odds home edge; MLB homes win about 54%
const SP_WEIGHT = 0.10;      // log-odds per run of starter ERA advantage
const SP_CAP = 3;            // ERA gap beyond this stops adding signal
/* A bullpen covers roughly 3.6 of a game's 9 innings against a starter's 5.4,
   so it gets about two thirds of the starter's weight: 0.10 x 3.6/5.4. */
const BP_WEIGHT = 0.07;
const BP_CAP = 2.5;
const BP_MIN_IP = 50;        // ignore a bullpen with too little work to read

/* Team identity by MLB id. Ids are stable. Records, divisions, venues and
   coordinates all arrive from the API — only names and colours live here,
   and colours are brightened where the true primary is unreadable on dark. */
const T = {
  108:["LAA","Angels","Los Angeles","#D22036"],   109:["AZ","D-backs","Arizona","#C2405A"],
  110:["BAL","Orioles","Baltimore","#DF4601"],    111:["BOS","Red Sox","Boston","#BD3039"],
  112:["CHC","Cubs","Chicago","#4E87D6"],         113:["CIN","Reds","Cincinnati","#D6203A"],
  114:["CLE","Guardians","Cleveland","#E31937"],  115:["COL","Rockies","Colorado","#8E6FC7"],
  116:["DET","Tigers","Detroit","#F2F0E6"],       117:["HOU","Astros","Houston","#EB6E1F"],
  118:["KC","Royals","Kansas City","#2E74C4"],    119:["LAD","Dodgers","Los Angeles","#4C87C6"],
  120:["WSH","Nationals","Washington","#E4444A"], 121:["NYM","Mets","New York","#FF5910"],
  133:["ATH","Athletics","","#EFB21E"],           134:["PIT","Pirates","Pittsburgh","#E0A106"],
  135:["SD","Padres","San Diego","#FFC425"],      136:["SEA","Mariners","Seattle","#2BA6A0"],
  137:["SF","Giants","San Francisco","#FD5A1E"],  138:["STL","Cardinals","St. Louis","#C41E3A"],
  139:["TB","Rays","Tampa Bay","#8FBCE6"],        140:["TEX","Rangers","Texas","#4A7FD1"],
  141:["TOR","Blue Jays","Toronto","#3E7FD1"],    142:["MIN","Twins","Minnesota","#E23E5C"],
  143:["PHI","Phillies","Philadelphia","#E81828"],144:["ATL","Braves","Atlanta","#CE1141"],
  145:["CWS","White Sox","Chicago","#A8B4BC"],    146:["MIA","Marlins","Miami","#00A3E0"],
  147:["NYY","Yankees","New York","#9AA7B1"],     158:["MIL","Brewers","Milwaukee","#FFC52F"]
};
const ab = id => (T[id] ? T[id][0] : "?");
const nm = id => (T[id] ? T[id][1] : "Unknown");
const city = id => (T[id] ? T[id][2] : "");
const col = id => (T[id] ? T[id][3] : "#7D989C");

const DIV = {200:["AL","West"],201:["AL","East"],202:["AL","Central"],
             203:["NL","West"],204:["NL","East"],205:["NL","Central"]};
const DIVS = {AL:[201,202,200], NL:[204,205,203]};
/* Club ids in alphabetical order of abbreviation, for the picker grid. */
const CLUB_IDS = Object.keys(T).map(Number).sort((a,b) => ab(a) < ab(b) ? -1 : 1);

/* ============================== state =============================== */

const S = {
  tab:"today", lg:{standings:"AL", odds:"NL"},
  teams:null, games:[], venues:{}, wx:{}, pitchers:{}, hitters:{}, open:{},
  bullpens:{}, bpLg:null, hitterForm:{}, h2h:{}, series:{}, runs:{}, finals:null, remaining:null, cal:null, calBusy:false, plays:[], playsState:"idle", playsDay:"today", detailState:"idle", wxAt:null, diag:{}, notesOpen:false,
  follow:119, picker:false, baseline:null,
  odds:null, seed:0, simBusy:false,
  phase:"loading", err:null, at:null, stale:false, sheet:null, swing:null, swingBusy:false
};

/* ============================== helpers ============================= */

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const iso = d => d.toLocaleDateString("en-CA");
const shift = n => { const d = new Date(); d.setDate(d.getDate()+n); return d; };
const clock = t => new Date(t).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const dayName = t => new Date(t).toLocaleDateString([], {weekday:"short"});
const pct = t => (t.w+t.l ? t.w/(t.w+t.l) : 0);
const fmt3 = x => x.toFixed(3).replace(/^0/,"");
/* Inclusive bounds. At 5,000 sims a berth of exactly 4975 lands on .995,
   and rounding that up printed "100" — a claim of certainty the simulation
   never made. */
const pc = p => p >= .995 ? ">99" : p <= .005 ? "<1" : String(Math.round(p*100));
const left = t => Math.max(0, SEASON_GAMES - t.w - t.l);
const gbTo = (t,o) => { const n = (o.w-t.w+(t.l-o.l))/2; return n <= 0 ? 0 : n; };
const gbText = n => n === 0 ? "—" : n % 1 === 0 ? String(n) : n.toFixed(1);

const list = () => Object.values(S.teams || {});
const inDiv = d => list().filter(t => t.div === d).sort((a,b) => pct(b)-pct(a));
const inLg = lg => list().filter(t => DIV[t.div] && DIV[t.div][0] === lg).sort((a,b) => pct(b)-pct(a));

function pictureOf(lg){
  const leaders = DIVS[lg].map(d => inDiv(d)[0]).filter(Boolean);
  const rest = inLg(lg).filter(t => !leaders.includes(t));
  return { seeds: leaders.slice().sort((a,b) => pct(b)-pct(a)),
           wilds: rest.slice(0,3), chasing: rest.slice(3) };
}

/* The last good standings and schedule, kept so the app opens with something
   on screen instead of a spinner, and survives a dead connection.

   Venues are cached too, being static. Weather deliberately is not — a stale
   forecast presented as current would be worse than none. */
const CACHE_KEY = "108.cache";
function saveCache(){
  if(!S.teams) return;
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      at:(S.at || new Date()).toISOString(),
      teams:S.teams, games:S.games, venues:S.venues
    }));
  }catch(e){ /* quota or private browsing; not worth failing over */ }
}
function loadCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const c = JSON.parse(raw);
    return c && c.teams && c.games && c.at ? c : null;
  }catch(e){ return null; }
}

/* A snapshot of the league as it stood when you last marked it seen, so the
   next visit can report what moved. Records are exact. Odds are stored too,
   but see sinceBlock for why they are only reported conditionally. */
const BASE_KEY = "108.baseline";
function loadBaseline(){
  try{
    const raw = localStorage.getItem(BASE_KEY);
    if(!raw) return null;
    const b = JSON.parse(raw);
    return b && b.teams && b.at ? b : null;
  }catch(e){ return null; }
}
function saveBaseline(){
  if(!S.teams) return;
  const teams = {}, odds = {};
  for(const t of list()) teams[t.id] = [t.w, t.l];
  if(S.odds) for(const k in S.odds) odds[k] = Math.round(S.odds[k].berth * 1000) / 10;
  const snap = { at:new Date().toISOString(), teams, odds };
  try{ localStorage.setItem(BASE_KEY, JSON.stringify(snap)); }catch(e){}
  S.baseline = snap;
}

function timeAgo(iso){
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if(mins < 2) return "moments ago";
  if(mins < 60) return mins + " minutes ago";
  const hrs = Math.round(mins / 60);
  if(hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
  const days = Math.round(hrs / 24);
  return days + (days === 1 ? " day ago" : " days ago");
}

/* Remember the followed club between visits. Wrapped because Safari throws
   on storage access in private browsing rather than returning null. */
const FOLLOW_KEY = "108.follow";
function loadFollow(){
  try{
    const v = localStorage.getItem(FOLLOW_KEY);
    if(v === "none") return null;
    const n = Number(v);
    if(T[n]) return n;
  }catch(e){ /* storage unavailable; keep the default */ }
  return S.follow;
}
function saveFollow(id){
  try{ localStorage.setItem(FOLLOW_KEY, id == null ? "none" : String(id)); }
  catch(e){ /* nothing to do; it just will not persist */ }
}

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

/* ============================== fetching ============================ */

function readStandings(json){
  const out = {};
  for(const rec of json.records || []){
    const d = rec.division && rec.division.id;
    for(const tr of rec.teamRecords || []){
      const id = tr.team && tr.team.id;
      if(!T[id] || !DIV[d]) continue;
      const sp = (json => (tr.records && tr.records.splitRecords || []).find(s => s.type === json));
      const pair = s => s ? s.wins + "-" + s.losses : null;
      out[id] = { id, div:d, w:tr.wins, l:tr.losses,
        gb:tr.gamesBack, streak:(tr.streak||{}).streakCode || null,
        l10:pair(sp("lastTen")), home:pair(sp("home")), away:pair(sp("away")),
        magic:tr.magicNumber, elim:tr.eliminationNumber,
        wcElim:tr.wildCardEliminationNumber,
        clinched:!!tr.clinched, clinchInd:tr.clinchIndicator || null };
    }
  }
  return out;
}

function statusOf(g){
  const a = (g.status||{}).abstractGameState, d = (g.status||{}).detailedState || "";
  if(/postponed|cancel|suspend/i.test(d)) return "off";
  if(a === "Live") return "live";
  if(a === "Final") return "final";
  return "sched";
}

function readGames(json){
  const out = [];
  for(const day of json.dates || []){
    for(const g of day.games || []){
      const h = (g.teams||{}).home || {}, a = (g.teams||{}).away || {};
      const hid = (h.team||{}).id, aid = (a.team||{}).id;
      if(!T[hid] || !T[aid]) continue;
      const ls = g.linescore || {}, off = ls.offense || {};
      out.push({
        pk:g.gamePk, date:g.officialDate || day.date, st:statusOf(g),
        sg:g.seriesGameNumber == null ? null : g.seriesGameNumber,
        gis:g.gamesInSeries == null ? null : g.gamesInSeries,
        detail:(g.status||{}).detailedState || "", hid, aid,
        hs:h.score == null ? null : h.score, as:a.score == null ? null : a.score,
        start:g.gameDate, venueId:(g.venue||{}).id, venue:(g.venue||{}).name || "",
        hProb:(h.probablePitcher||{}).fullName || null,
        aProb:(a.probablePitcher||{}).fullName || null,
        hProbId:(h.probablePitcher||{}).id || null,
        aProbId:(a.probablePitcher||{}).id || null,
        inn:ls.currentInning == null ? null : ls.currentInning,
        ord:ls.currentInningOrdinal || null, half:ls.inningState || null,
        balls:ls.balls, strikes:ls.strikes, outs:ls.outs,
        onBase:[!!off.first, !!off.second, !!off.third],
        batter:(off.batter||{}).fullName || null,
        pitcher:((ls.defense||{}).pitcher||{}).fullName || null,
        pitcherId:((ls.defense||{}).pitcher||{}).id || null,
        hH:((ls.teams||{}).home||{}).hits, aH:((ls.teams||{}).away||{}).hits
      });
    }
  }
  return out;
}

/* Innings pitched arrive as "142.1", which is baseball notation for 142 and
   one third — not 142.1. Parsing it as a decimal quietly corrupts every
   per-nine rate, so convert thirds properly. */
function inningsOf(ip){
  if(ip == null) return null;
  const [whole, frac] = String(ip).split(".");
  const w = parseInt(whole, 10);
  if(isNaN(w)) return null;
  const thirds = frac ? parseInt(frac[0], 10) || 0 : 0;
  return w + thirds / 3;
}

/* And back again for display. 16.67 innings is written 16.2 in baseball —
   sixteen and two thirds. Printing the decimal is accurate but reads wrong
   to anyone who follows the sport. */
function ipText(inn){
  if(inn == null) return "—";
  const whole = Math.floor(inn + 1e-9);
  const thirds = Math.round((inn - whole) * 3);
  return thirds === 3 ? (whole + 1) + ".0" : whole + "." + thirds;
}

/* Every starter on the slate in a single request. Rates come from MLB where
   it supplies them and are computed from the counting stats otherwise, so a
   field name changing upstream degrades to arithmetic rather than blanks.

   The hydrate takes arrays, so the season line and the full game log arrive
   together — no second round trip for recent form. */
async function loadPitchers(ids){
  const out = {};
  if(!ids.length) return out;
  const yr = new Date().getFullYear();
  let j;
  try{
    j = await getJSON(MLB + "/people?personIds=" + ids.join(",")
      + "&hydrate=stats(group=pitching,type=season,season=" + yr + ")");
  }catch(e){ return out; }

  for(const p of j.people || []){
    const seasonGrp = (p.stats || [])[0];
    const s = seasonGrp && seasonGrp.splits && seasonGrp.splits.length
      ? seasonGrp.splits[seasonGrp.splits.length - 1].stat : null;   // last split = current club
    const ip = s ? inningsOf(s.inningsPitched) : null;
    const per9 = (count, given) => {
      if(given != null && given !== "-" && !isNaN(parseFloat(given))) return parseFloat(given);
      if(ip && ip > 0 && count != null) return count * 9 / ip;
      return null;
    };

    out[p.id] = {
      id:p.id,
      name:p.fullName || null,
      hand:((p.pitchHand||{}).code) || null,
      era:s && s.era != null && s.era !== "-" ? parseFloat(s.era) : null,
      whip:s && s.whip != null && s.whip !== "-" ? parseFloat(s.whip) : null,
      ip,
      w:s ? s.wins : null, l:s ? s.losses : null, gs:s ? s.gamesStarted : null,
      k9:s ? per9(s.strikeOuts, s.strikeoutsPer9Inn) : null,
      hr9:s ? per9(s.homeRuns, s.homeRunsPer9) : null,
      bb9:s ? per9(s.baseOnBalls, s.walksPer9Inn) : null,
      oppAvg:s && s.avg != null && s.avg !== "-" ? s.avg : null,
      form:null
    };
  }
  return out;
}

/* Game logs in their own request. The combined array hydrate,
   type=[season,gameLog], returned season stats only — so this uses the plain
   single-type form that is known to work, at the cost of one more call. */
async function loadPitcherForm(ids){
  if(!ids.length) return 0;
  const yr = new Date().getFullYear();
  let j;
  try{
    j = await getJSON(MLB + "/people?personIds=" + ids.join(",")
      + "&hydrate=stats(group=pitching,type=gameLog,season=" + yr + ")");
  }catch(e){ return 0; }
  let filled = 0;
  for(const p of j.people || []){
    const rec = S.pitchers[p.id];
    if(!rec) continue;
    const grp = (p.stats || []).find(s => Array.isArray(s.splits) && s.splits.length);
    if(!grp) continue;
    // Starts only, so the comparison is like for like against the season line.
    let starts = grp.splits.filter(sp => sp.stat && Number(sp.stat.gamesStarted) > 0);
    if(!starts.length) starts = grp.splits;      // a reliever opening: use appearances
    const last = starts.slice(-3);
    let inn = 0, er = 0, k = 0, bb = 0, hr = 0;
    for(const sp of last){
      inn += inningsOf(sp.stat.inningsPitched) || 0;
      er += Number(sp.stat.earnedRuns) || 0;
      k += Number(sp.stat.strikeOuts) || 0;
      bb += Number(sp.stat.baseOnBalls) || 0;
      hr += Number(sp.stat.homeRuns) || 0;
    }
    if(inn > 0){
      rec.form = { n:last.length, ip:inn, era:9 * er / inn, k, bb, hr };
      filled++;
    }
  }
  return filled;
}

/* Hitter form from actual game logs — the same mechanism that works for
   pitchers, which is why it is trustworthy where the date-range attempt was
   not. The cost is that logs are per player, so this is fetched only for the
   bats on cards you have actually opened, in batches, and never twice.

   A null entry means "asked for, nothing came back", which stops a player
   with no log from being requested on every render. */
async function loadHitterLogs(ids){
  if(!ids.length) return 0;
  const yr = new Date().getFullYear();
  let j;
  try{
    j = await getJSON(MLB + "/people?personIds=" + ids.join(",")
      + "&hydrate=stats(group=hitting,type=gameLog,season=" + yr + ")");
  }catch(e){ return 0; }
  let filled = 0;
  for(const p of j.people || []){
    const grp = (p.stats || []).find(s => Array.isArray(s.splits) && s.splits.length);
    if(!grp) continue;
    const last = grp.splits.slice(-5);
    if(!last.length) continue;
    let hr = 0, ab = 0, h = 0, rbi = 0;
    for(const sp of last){
      const st = sp.stat || {};
      hr += Number(st.homeRuns) || 0;
      ab += Number(st.atBats) || 0;
      h += Number(st.hits) || 0;
      rbi += Number(st.rbi) || 0;
    }
    S.hitterForm[p.id] = { g:last.length, hr, ab, h, rbi,
                           avg:ab > 0 ? h / ab : null };
    filled++;
  }
  return filled;
}

/* The bats on every card currently open, deduped. */
function openCardHitterIds(){
  const ids = [];
  for(const g of S.games){
    if(!S.open[g.pk]) continue;
    for(const tid of [g.aid, g.hid])
      for(const b of (S.hitters[tid] || []).slice(0, 5)) if(b.id) ids.push(b.id);
  }
  return [...new Set(ids)];
}

async function ensureHitterForm(){
  const need = openCardHitterIds().filter(id => !(id in S.hitterForm));
  if(!need.length) return;
  need.forEach(id => { S.hitterForm[id] = null; });   // claim them, so no refetch
  const CHUNK = 40;
  for(let i = 0; i < need.length; i += CHUNK){
    await loadHitterLogs(need.slice(i, i + CHUNK));
    S.diag.hitterForm = Object.values(S.hitterForm).filter(Boolean).length;
    render();
  }
}

/* Season head-to-head. The four-day window the app normally keeps is no use
   here, so this pulls every completed regular-season game once and reduces it
   to a win count per pairing. No hydrate, so each game is small.

   Keyed by the two club ids sorted, which makes the lookup independent of who
   is at home in any given meeting. */
const h2hKey = (a, b) => (a < b ? a + "-" + b : b + "-" + a);

async function loadSeason(){
  const yr = new Date().getFullYear();
  const h2h = {}, series = {}, remaining = [], runs = {}, finals = [];
  let j;
  try{
    j = await getJSON(MLB + "/schedule?sportId=1&gameType=R"
      + "&startDate=" + yr + "-03-01&endDate=" + yr + "-10-05");
  }catch(e){ return { h2h, series, remaining, runs, finals }; }
  for(const day of j.dates || []){
    for(const g of day.games || []){
      const h = (g.teams || {}).home || {}, a = (g.teams || {}).away || {};
      const hid = (h.team || {}).id, aid = (a.team || {}).id;
      if(!T[hid] || !T[aid]) continue;
      const st = (g.status || {}).abstractGameState;
      const det = (g.status || {}).detailedState || "";
      if(st === "Final"){
        if(h.score == null || a.score == null) continue;
        // Runs count from every finished game, ties included.
        const rh = runs[hid] || (runs[hid] = { rs:0, ra:0, g:0 });
        const rv = runs[aid] || (runs[aid] = { rs:0, ra:0, g:0 });
        rh.rs += h.score; rh.ra += a.score; rh.g++;
        rv.rs += a.score; rv.ra += h.score; rv.g++;
        // Kept in full so the model can be replayed against them later.
        finals.push({ date:g.officialDate || day.date, hid, aid, hs:h.score, as:a.score });
        if(h.score === a.score) continue;   // no winner to record below
        const k = h2hKey(hid, aid);
        const rec = h2h[k] || (h2h[k] = {});
        const winner = h.score > a.score ? hid : aid;
        rec[winner] = (rec[winner] || 0) + 1;
        // Kept so a series record can span more than the four-day window.
        (series[k] = series[k] || []).push({
          sg:g.seriesGameNumber == null ? null : g.seriesGameNumber,
          date:g.officialDate || day.date, winner });
      } else if(!/postponed|cancel/i.test(det)){
        // Anything not yet final is still to be played, including tonight's.
        remaining.push({ hid, aid });
      }
    }
  }
  finals.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  return { h2h, series, remaining, runs, finals };
}

/* ---------------- plays of the day ----------------
   Every play MLB records carries a "captivating index" — their own scoring of
   how interesting it was. Using it means the ranking is MLB's judgement, not a
   metric I invented. Where the index is absent or flat, runs driven in serve
   as the tie-break, which is at least a fact about the play.

   One request per game, chunked, and only when the tab is first opened. */
/* ---------------- calibration ----------------
   Replay the model over every completed game of the season and compare what it
   said to what happened.

   Crucially this walks forward: each club's record is rebuilt as it stood
   *before* the game being predicted, so the model is never told how the season
   turned out. Games are skipped until both clubs have played MIN_GP, because a
   record of 4-2 carries no information.

   What it cannot test: starters and bullpens. Those would need the probable
   pitcher for 1,500 historical games, one request each. So this measures the
   team-strength and home-field core — the foundation the rest sits on. */
const BT_MIN_GP = 25;

function backtest(recencyW){
  const games = S.finals;
  if(!Array.isArray(games) || games.length < 200) return null;

  const st = {};   // running state per club
  const seat = id => st[id] || (st[id] = { w:0, l:0, rs:0, ra:0, recent:[] });

  const preds = [];
  let baseBrier = 0, baseN = 0;

  for(const g of games){
    const h = seat(g.hid), a = seat(g.aid);
    const hg = h.w + h.l, ag = a.w + a.l;

    if(hg >= BT_MIN_GP && ag >= BT_MIN_GP){
      const rate = t => {
        const ten = t.recent.slice(-10);
        const tw = ten.filter(Boolean).length;
        return (t.w + recencyW * tw + REGRESS / 2)
             / (t.w + t.l + recencyW * ten.length + REGRESS);
      };
      const lg = p => Math.log(p / (1 - p));
      const p = 1 / (1 + Math.exp(-(lg(rate(h)) - lg(rate(a)) + HFA)));

      // No starters available historically, so the run projection is the
      // team-rate half of it only.
      const projTotal = (h.rs / hg + a.ra / ag) / 2 + (a.rs / ag + h.ra / hg) / 2;

      const homeWon = g.hs > g.as;
      preds.push({ p, homeWon, projTotal, actualTotal:g.hs + g.as });

      // Baseline to beat: home field and nothing else.
      baseBrier += Math.pow(0.540 - (homeWon ? 1 : 0), 2);
      baseN++;
    }

    h.w += g.hs > g.as ? 1 : 0; h.l += g.hs > g.as ? 0 : 1;
    a.w += g.as > g.hs ? 1 : 0; a.l += g.as > g.hs ? 0 : 1;
    h.rs += g.hs; h.ra += g.as;
    a.rs += g.as; a.ra += g.hs;
    h.recent.push(g.hs > g.as); a.recent.push(g.as > g.hs);
    if(h.recent.length > 20) h.recent.shift();
    if(a.recent.length > 20) a.recent.shift();
  }

  if(!preds.length) return null;

  let brier = 0, right = 0, absErr = 0, bias = 0;
  const bands = [[.50,.55],[.55,.60],[.60,.65],[.65,.70],[.70,1.01]]
    .map(([lo,hi]) => ({ lo, hi, n:0, sumP:0, won:0 }));

  for(const q of preds){
    brier += Math.pow(q.p - (q.homeWon ? 1 : 0), 2);
    const favP = Math.max(q.p, 1 - q.p);
    const favWon = (q.p > 0.5) === q.homeWon;
    if(favWon) right++;
    for(const b of bands){
      if(favP >= b.lo && favP < b.hi){ b.n++; b.sumP += favP; if(favWon) b.won++; break; }
    }
    absErr += Math.abs(q.projTotal - q.actualTotal);
    bias += q.projTotal - q.actualTotal;
  }
  const n = preds.length;
  return {
    n, brier:brier / n, baseBrier:baseN ? baseBrier / baseN : null,
    acc:right / n, runMAE:absErr / n, runBias:bias / n,
    bands:bands.filter(b => b.n > 0).map(b => ({
      label:Math.round(b.lo * 100) + "\u2013" + (b.hi > 1 ? "100" : Math.round(b.hi * 100)),
      n:b.n, said:b.sumP / b.n, actual:b.won / b.n
    }))
  };
}

/* ---------------- projected total ----------------
   A run estimate, not a betting line. Each side's expectation is the midpoint
   of what it scores and what its opponent allows, then shifted by how the
   starter compares to the league — scaled to the share of a game a starter
   covers, about six innings of nine.

   There is deliberately no over/under here. That word only means something
   against a book's number, and this app has no source for one. What follows is
   a projection you can compare to a line yourself. */
const SP_SHARE = 0.6;

function teamRuns(id){
  const r = S.runs[id];
  return r && r.g > 0 ? { rs:r.rs / r.g, ra:r.ra / r.g, g:r.g } : null;
}
function leagueRunsPerGame(){
  let rs = 0, g = 0;
  for(const k in S.runs){ rs += S.runs[k].rs; g += S.runs[k].g; }
  return g > 0 ? rs / g : null;
}

function projectTotal(g){
  const h = teamRuns(g.hid), a = teamRuns(g.aid), lg = leagueRunsPerGame();
  if(!h || !a || !lg) return null;
  let expH = (h.rs + a.ra) / 2, expA = (a.rs + h.ra) / 2;
  const hEra = starterEra(S.pitchers[g.hProbId]);
  const aEra = starterEra(S.pitchers[g.aProbId]);
  let usedSP = false;
  if(hEra != null && aEra != null){
    expH += SP_SHARE * (aEra - lg);      // the arm you face, not your own
    expA += SP_SHARE * (hEra - lg);
    usedSP = true;
  }
  expH = Math.max(1, expH); expA = Math.max(1, expA);
  /* Round the two sides first and derive the total from them, so the card
     never shows parts that fail to add up to the whole. */
  const h1 = Math.round(expH * 10) / 10, a1 = Math.round(expA * 10) / 10;
  return { home:h1, away:a1, total:Math.round((h1 + a1) * 10) / 10, usedSP, lg };
}

/* The bat most likely to matter: best home run rate against the most
   homer-prone arm on the card. An observation about who is involved, not a
   prediction that it happens. */
function bestMatchup(g){
  let best = null;
  const consider = (batTeam, oppPid) => {
    const p = S.pitchers[oppPid];
    if(!p || p.hr9 == null) return;
    for(const b of (S.hitters[batTeam] || []).slice(0, 5)){
      if(!b.perPA) continue;
      const score = (1 / b.perPA) * p.hr9;
      if(!best || score > best.score)
        best = { score, batter:b.name, team:batTeam, perPA:b.perPA,
                 hr:b.hr, pitcher:p.name, hr9:p.hr9 };
    }
  };
  consider(g.aid, g.hProbId);
  consider(g.hid, g.aProbId);
  return best;
}

async function loadPlays(){
  /* Open the app at half past midnight and "today" is half an hour old, while
     the games you actually watched are dated yesterday. So take today's games
     if any have started, and last night's otherwise. */
  const today = iso(new Date()), yday = iso(shiftDays(-1));
  const started = g => g.st === "live" || g.st === "final";
  let targets = S.games.filter(g => g.date === today && started(g));
  let dayLabel = "today";
  if(!targets.length){
    targets = S.games.filter(g => g.date === yday && started(g));
    dayLabel = "last night";
  }
  S.playsDay = dayLabel;
  if(!targets.length){ S.playsState = "ready"; return; }

  const best = {};   // club id -> its standout play today
  const CHUNK = 4;
  for(let i = 0; i < targets.length; i += CHUNK){
    const batch = targets.slice(i, i + CHUNK);
    await Promise.all(batch.map(async g => {
      let plays = null;
      try{
        const j = await getJSON(MLB + "/game/" + g.pk + "/playByPlay");
        plays = j && j.allPlays;
      }catch(e){ return; }
      if(!Array.isArray(plays)) return;
      for(const p of plays){
        const r = p.result || {}, ab = p.about || {};
        if(!r.description) continue;
        const top = !!ab.isTopInning;
        const club = top ? g.aid : g.hid;          // the batting side
        const score = (Number(ab.captivatingIndex) || 0) * 100 + (Number(r.rbi) || 0);
        const cur = best[club];
        if(!cur || score > cur.score){
          best[club] = { score, club, opp:top ? g.hid : g.aid,
            idx:Number(ab.captivatingIndex) || 0, rbi:Number(r.rbi) || 0,
            inning:ab.inning, top, desc:r.description, event:r.event || "",
            live:g.st === "live" };
        }
      }
    }));
    S.plays = Object.values(best).sort((a,b) => b.score - a.score);
    render();
  }
  S.playsState = "ready";
  S.diag.plays = S.plays.length;
  render();
}

async function ensurePlays(){
  if(S.playsState !== "idle") return;
  S.playsState = "loading";
  render();
  await loadPlays();
}

/* Every regular's season hitting line in one request, sorted by home runs,
   then grouped by club. A 100 plate-appearance floor keeps a callup with two
   homers in nine games out of the leaders. */
async function loadHitters(){
  const byTeam = {};
  const yr = new Date().getFullYear();
  let j;
  try{
    j = await getJSON(MLB + "/stats?stats=season&group=hitting&season=" + yr
      + "&sportId=1&sortStat=homeRuns&order=desc&limit=750");
  }catch(e){ return byTeam; }
  const splits = (j.stats && j.stats[0] && j.stats[0].splits) || [];
  for(const s of splits){
    const tid = (s.team || {}).id, st = s.stat || {};
    if(!T[tid]) continue;
    const hr = st.homeRuns, pa = st.plateAppearances;
    if(!hr || hr <= 0 || !pa || pa < 100) continue;
    (byTeam[tid] = byTeam[tid] || []).push({
      id:(s.player || {}).id,
      name:(s.player || {}).fullName || "—", hr, pa, perPA:pa / hr
    });
  }
  for(const k in byTeam) byTeam[k] = byTeam[k].sort((a, b) => b.hr - a.hr).slice(0, 5);
  return byTeam;
}

/* Bullpen strength, built from player lines rather than a team total, because
   MLB's team pitching figures fold the starters in. A "reliever" here is a
   pitcher with zero starts — unambiguous, at the cost of excluding swingmen,
   whose innings get left out of both clubs equally. The league average is
   computed from the same pass rather than assumed. */
async function loadBullpens(){
  const yr = new Date().getFullYear();
  let j;
  try{
    j = await getJSON(MLB + "/stats?stats=season&group=pitching&season=" + yr
      + "&sportId=1&sortStat=inningsPitched&order=desc&limit=1200");
  }catch(e){ return { teams:{}, lg:null }; }
  const splits = (j.stats && j.stats[0] && j.stats[0].splits) || [];
  const acc = {};
  let lgER = 0, lgIP = 0;
  for(const s of splits){
    const tid = (s.team || {}).id, st = s.stat || {};
    if(!T[tid]) continue;
    if(st.gamesStarted == null || Number(st.gamesStarted) !== 0) continue;
    const ip = inningsOf(st.inningsPitched), er = Number(st.earnedRuns);
    if(!ip || ip <= 0 || isNaN(er)) continue;
    const a = acc[tid] || (acc[tid] = { ip:0, er:0 });
    a.ip += ip; a.er += er;
    lgER += er; lgIP += ip;
  }
  const teams = {};
  for(const k in acc){
    if(acc[k].ip < BP_MIN_IP) continue;
    teams[k] = { era:9 * acc[k].er / acc[k].ip, ip:acc[k].ip };
  }
  return { teams, lg:lgIP > 0 ? 9 * lgER / lgIP : null };
}

/* Venue coordinates and roof type come from MLB, so no ballpark list is
   hardcoded here and venue changes are picked up automatically. */
async function loadVenues(ids){
  const out = {};
  try{
    const j = await getJSON(MLB + "/venues?hydrate=location,fieldInfo&venueIds=" + ids.join(","));
    for(const v of j.venues || []){
      const c = ((v.location||{}).defaultCoordinates) || {};
      out[v.id] = { id:v.id, name:v.name,
        lat:c.latitude == null ? null : c.latitude,
        lon:c.longitude == null ? null : c.longitude,
        roof:((v.fieldInfo||{}).roofType) || null };
    }
  }catch(e){ /* weather simply stays absent */ }
  return out;
}

/* One request covers every ballpark: Open-Meteo accepts comma-separated
   coordinate lists and returns an array in the same order. */
async function loadWeather(venues){
  const parks = Object.values(venues).filter(v => v.lat != null && v.lon != null);
  if(!parks.length) return {};
  const url = WX
    + "?latitude=" + parks.map(p => p.lat).join(",")
    + "&longitude=" + parks.map(p => p.lon).join(",")
    + "&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,precipitation_probability,surface_pressure"
    + "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=UTC&forecast_days=3";
  let j;
  try{ j = await getJSON(url); }catch(e){ return {}; }
  const arr = Array.isArray(j) ? j : [j];
  const out = {};
  parks.forEach((p,i) => {
    if(arr[i] && arr[i].hourly)
      out[p.id] = { h:arr[i].hourly, elev:arr[i].elevation == null ? null : arr[i].elevation };
  });
  return out;
}

/* Air density from the ideal gas law: rho = P / (R * T), with pressure and
   temperature both measured. Thinner air means less drag and more carry,
   which is the whole story at altitude. 1.225 kg/m3 is the sea-level
   standard, so the percentage is honest physics on real inputs, not an
   invented "carry index". */
const R_AIR = 287.058, RHO0 = 1.225;
/* The sea-level standard is defined at 59F, so nearly every summer game sits
   below it — a 97% threshold flagged fourteen of fifteen and told you only
   that it was July. 90% is the level that actually separates altitude and
   desert heat from ordinary warm weather. */
const THIN_AIR = 90;
function airPct(tempF, hPa){
  if(tempF == null || hPa == null) return null;
  const K = (tempF - 32) * 5/9 + 273.15;
  return (hPa * 100) / (R_AIR * K) / RHO0 * 100;
}
const feet = m => Math.round(m * 3.28084);

/** Conditions at first pitch: the forecast hour nearest the start time. */
function wxAt(venueId, startISO){
  const rec = S.wx[venueId];
  if(!rec || !rec.h || !rec.h.time || !startISO) return null;
  const h = rec.h;
  const target = new Date(startISO).getTime();
  let best = -1, gap = Infinity;
  for(let i = 0; i < h.time.length; i++){
    const d = Math.abs(new Date(h.time[i] + "Z").getTime() - target);
    if(d < gap){ gap = d; best = i; }
  }
  if(best < 0 || gap > 3*3600*1000) return null;
  const temp = h.temperature_2m[best];
  const hPa = (h.surface_pressure || [])[best];
  return { temp, wind:h.wind_speed_10m[best], dir:h.wind_direction_10m[best],
           rain:(h.precipitation_probability||[])[best],
           air:airPct(temp, hPa), elev:rec.elev };
}

const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = deg => COMPASS[Math.round(((deg % 360) / 22.5)) % 16];
const degOf = pt => { const i = COMPASS.indexOf(pt); return i < 0 ? null : i * 22.5; };

/* Compass direction from home plate to centre field, per ballpark.
   Source: Clem's Baseball Architecture, "CF orientation" column, read from
   the current-parks section of the stadium statistics table.

   Keyed by venue name as MLB reports it, lowercased. Renamed parks carry
   both spellings so a rename does not silently break the lookup. Anything
   missing — the Athletics at Sutter Health Park, for one — falls back to the
   raw bearing, which is honest rather than guessed. */
const ORIENT = {
  "fenway park":"NE",                "wrigley field":"NE",
  "dodger stadium":"NNE",            "angel stadium":"NE",
  "kauffman stadium":"NE",           "oriole park at camden yards":"NNE",
  "rate field":"ESE",                "guaranteed rate field":"ESE",
  "rogers centre":"NNW",             "progressive field":"N",
  "coors field":"N",                 "tropicana field":"NE",
  "chase field":"N",                 "t-mobile park":"NE",
  "oracle park":"ESE",               "daikin park":"ENE",
  "minute maid park":"ENE",          "comerica park":"SSE",
  "american family field":"SE",      "pnc park":"ESE",
  "great american ball park":"ESE",  "great american ballpark":"ESE",
  "citizens bank park":"NNE",        "petco park":"N",
  "busch stadium":"NE",              "nationals park":"NNE",
  "yankee stadium":"ENE",            "citi field":"NNE",
  "target field":"E",                "loandepot park":"ESE",
  "truist park":"SSE",               "globe life field":"ENE"
};
const cfBearing = venueName => {
  if(!venueName) return null;
  const pt = ORIENT[venueName.toLowerCase().trim()];
  return pt ? degOf(pt) : null;
};

/* Where the wind is actually pushing the ball, given the park's alignment.
   Open-Meteo reports the bearing wind comes FROM, so it travels toward
   bearing+180. Measured against the home-plate-to-centre axis: negative is
   the left-field side, positive the right. */
const WIND_ZONES = ["out to center","out to right","crossing to right","in from right",
                    "in from center","in from left","crossing to left","out to left"];
function windRelative(fromDeg, cf){
  if(fromDeg == null || cf == null) return null;
  let a = (fromDeg + 180) - cf;
  a = ((a % 360) + 360) % 360;                 // 0–359 clockwise from the CF axis
  return WIND_ZONES[Math.round(a / 45) % 8];
}

async function load(){
  const yr = new Date().getFullYear();
  try{
    const [st, sc] = await Promise.all([
      getJSON(MLB + "/standings?leagueId=103,104&season=" + yr + "&standingsTypes=regularSeason"),
      getJSON(MLB + "/schedule?sportId=1&startDate=" + iso(shift(-1)) + "&endDate=" + iso(shift(2))
              + "&hydrate=team,linescore,probablePitcher")
    ]);
    const teams = readStandings(st);
    if(Object.keys(teams).length < 20) throw new Error("standings incomplete");
    S.teams = teams;
    S.games = readGames(sc);
    S.phase = "ready"; S.err = null; S.at = new Date(); S.stale = false;
    S.odds = simulate(SIMS);
    saveCache();
    if(!S.baseline) saveBaseline();   // first visit: record the starting point silently
    render();

    /* What a collapsed card shows: score, time, stakes, weather. That is all
       this stage fetches. Starters, power and the model line live behind a
       tap, so their data is fetched on the tap — see loadDetail. */
    if(!Object.keys(S.venues).length){
      const ids = [...new Set(S.games.map(g => g.venueId).filter(Boolean))];
      if(ids.length){ S.venues = await loadVenues(ids); render(); }
    }
    // Ballparks do not move, so venues are fetched once. Weather does.
    const wxAge = S.wxAt ? Date.now() - S.wxAt : Infinity;
    if(Object.keys(S.venues).length && wxAge > 15 * 60 * 1000){
      S.wx = await loadWeather(S.venues); S.wxAt = Date.now(); render();
    }
    // A live card shows its pitcher without being expanded, so fetch those now.
    if(S.games.some(g => g.st === "live") && !Object.keys(S.pitchers).length){
      const pids = [...new Set(S.games
        .flatMap(g => [g.hProbId, g.aProbId, g.pitcherId]).filter(Boolean))];
      if(pids.length){ S.pitchers = await loadPitchers(pids); render(); }
    }
  }catch(e){
    S.err = e.message;
    if(S.phase !== "ready") S.phase = "error";
    render();
  }
}

/* Everything behind the disclosure: starters with their game logs, the power
   blocks, and the bullpen figures the model line needs. Four requests, two of
   them 750 rows deep — far and away the bulk of this app's traffic, and all of
   it for content that stays folded away until asked for. So it is fetched on
   the first expand, once per session, and rendered as each piece lands. */
/* The season fetch serves two masters: head-to-head records on the cards, and
   the real fixture list the forecast needs. Either tab may ask for it first,
   so it lives behind one guard and recomputes the odds once it lands. */
async function ensureSeason(){
  if(S.remaining) return;
  const season = await loadSeason();
  S.h2h = season.h2h;
  S.series = season.series;
  S.runs = season.runs;
  S.finals = season.finals;
  S.remaining = season.remaining;
  S.diag.h2h = Object.keys(S.h2h).length;
  S.diag.remaining = season.remaining.length;
  if(season.remaining.length > 100) S.odds = simulate(SIMS);   // now schedule-aware
  render();
}

async function loadDetail(){
  if(S.detailState === "loading" || S.detailState === "ready") return;
  S.detailState = "loading";
  render();
  try{

  const pids = [...new Set(S.games
    .flatMap(g => [g.hProbId, g.aProbId, g.pitcherId]).filter(Boolean))];

  if(!Object.keys(S.pitchers).length && pids.length){
    S.pitchers = await loadPitchers(pids); render();
  }
  S.diag.pitchers = Object.keys(S.pitchers).length;

  if(pids.length){ S.diag.form = await loadPitcherForm(pids); render(); }

  if(!Object.keys(S.bullpens).length){
    const bp = await loadBullpens();
    S.bullpens = bp.teams; S.bpLg = bp.lg; render();
  }
  S.diag.bullpens = Object.keys(S.bullpens).length;

  await ensureSeason();

  if(!Object.keys(S.hitters).length){ S.hitters = await loadHitters(); render(); }
  S.diag.hitters = Object.values(S.hitters).reduce((n,a) => n + a.length, 0);

    S.detailState = "ready";
  }catch(e){
    // Never leave a card stuck on "loading" because one call blew up.
    S.detailState = "error";
  }
  render();
  ensureHitterForm();
}

/* ============================== forecast ============================= */

function simulate(sims, tweak){
  const clubs = list();
  const rate = {}, base = {}, rem = {}, lg10 = {};
  for(const t of clubs){
    const p = teamRate(t);
    rate[t.id] = p;
    lg10[t.id] = Math.log(p / (1 - p));            // log-odds, for head to head
    const bump = tweak && tweak.id === t.id;
    base[t.id] = t.w + (bump ? tweak.add : 0);
    rem[t.id] = Math.max(0, left(t) - (bump ? 1 : 0));
  }

  /* With the real fixture list, each remaining game is played between the two
     clubs actually involved, with a home edge — so a hard September counts
     against you and an easy one does not. Without it, every club plays a
     generic average opponent, which is the fallback. */
  const sched = S.remaining;
  const useSched = Array.isArray(sched) && sched.length > 100;
  let pre = null, skip = -1;
  if(useSched){
    if(tweak){
      skip = sched.findIndex(g => g.hid === tweak.id || g.aid === tweak.id);
    }
    pre = sched.map(g => ({
      hid:g.hid, aid:g.aid,
      p:1 / (1 + Math.exp(-(lg10[g.hid] - lg10[g.aid] + HFA)))
    }));
  }

  const div = {}, berth = {}, top = {}, tot = {}, hist = {};
  for(const t of clubs){
    div[t.id]=0; berth[t.id]=0; top[t.id]=0; tot[t.id]=0;
    hist[t.id] = new Array(SEASON_GAMES + 1).fill(0);
  }
  const leagues = {AL:clubs.filter(t=>DIV[t.div][0]==="AL"), NL:clubs.filter(t=>DIV[t.div][0]==="NL")};
  const wins = {}, key = {};

  for(let s = 0; s < sims; s++){
    if(pre){
      for(const t of clubs) wins[t.id] = base[t.id];
      for(let i = 0; i < pre.length; i++){
        if(i === skip) continue;                   // the game the tweak fixes
        const g = pre[i];
        if(Math.random() < g.p) wins[g.hid]++; else wins[g.aid]++;
      }
      for(const t of clubs){ tot[t.id] += wins[t.id]; hist[t.id][wins[t.id]]++; }
    } else {
      for(const t of clubs){
        let w = base[t.id];
        const p = rate[t.id], n = rem[t.id];
        for(let g = 0; g < n; g++) if(Math.random() < p) w++;
        wins[t.id] = w; tot[t.id] += w; hist[t.id][w]++;
      }
    }
    for(const lg of ["AL","NL"]){
      const pool = leagues[lg];
      for(const t of pool) key[t.id] = wins[t.id] + Math.random()*0.5;  // coin-flip ties
      const champs = [];
      for(const d of DIVS[lg]){
        let best = null;
        for(const t of pool){ if(t.div !== d) continue;
          if(!best || key[t.id] > key[best.id]) best = t; }
        if(best){ champs.push(best); div[best.id]++; berth[best.id]++; }
      }
      const field = pool.filter(t => !champs.includes(t)).sort((a,b) => key[b.id]-key[a.id]);
      for(let k = 0; k < 3 && k < field.length; k++) berth[field[k].id]++;
      champs.sort((a,b) => key[b.id]-key[a.id]);
      if(champs.length) top[champs[0].id]++;
    }
  }
  /* Read a percentile straight off the histogram: walk up the win totals
     until the requested share of simulated seasons is behind you. */
  const pctileOf = (h, q) => {
    const target = q * sims;
    let acc = 0;
    for(let w = 0; w < h.length; w++){ acc += h[w]; if(acc >= target) return w; }
    return h.length - 1;
  };

  const o = {};
  for(const t of clubs){
    const h = hist[t.id];
    o[t.id] = { div:div[t.id]/sims, berth:berth[t.id]/sims,
                top:top[t.id]/sims, projWins:tot[t.id]/sims,
                p10:pctileOf(h, 0.10), p50:pctileOf(h, 0.50), p90:pctileOf(h, 0.90) };
  }
  return o;
}

/* ---------------- recency ----------------
   Recent form is already inside the season figures, so weighting it means
   counting those games more than once. RECENCY_W is how many extra times.

   Set to 1: a club's last ten and a starter's last three outings count twice
   over. Modest on purpose. A hot fortnight feels more predictive than it is,
   and over-weighting it is the usual way to make a forecast worse. */
const RECENCY_W = 1;   // the recent stretch counts twice over, not more

/* Surnames only where space is tight. Two awkward cases: compound names like
   "De La Cruz", which need the particles kept, and suffixes like "Jr." which
   must be dropped first or they become the whole name. */
function lastName(full){
  if(!full) return "";
  let parts = String(full).trim().split(/\s+/);
  const suffix = [];
  while(parts.length > 1 && /^(jr\.?|sr\.?|i{2,3}|iv|v)$/i.test(parts[parts.length - 1])){
    suffix.unshift(parts.pop());
  }
  if(parts.length < 2) return [parts[0] || "", ...suffix].join(" ").trim();
  let i = parts.length - 1;
  while(i > 0 && /^(de|del|la|le|van|von|da|dos|di)$/i.test(parts[i-1])) i--;
  return [...parts.slice(i), ...suffix].join(" ");
}

const pairOf = s => {
  if(!s) return null;
  const m = String(s).match(/^(\d+)-(\d+)$/);
  return m ? { w:Number(m[1]), l:Number(m[2]) } : null;
};

/* A club's true rate: season record, plus its last ten counted again K times,
   then regressed toward .500. */
function teamRate(t){
  const k = RECENCY_W;
  const ten = pairOf(t.l10);
  const addW = ten ? k * ten.w : 0;
  const addG = ten ? k * (ten.w + ten.l) : 0;
  return (t.w + addW + REGRESS / 2) / (t.w + t.l + addG + REGRESS);
}

/* A starter's effective ERA, with his last three outings counted again K
   times. Earned runs are recovered from the rate and the innings, so the blend
   is over actual runs rather than an average of two averages. */
function starterEra(p){
  if(!p || p.era == null) return null;
  const k = RECENCY_W;
  if(!p.form || !p.ip) return p.era;
  const seasonER = p.era * p.ip / 9;
  const recentER = p.form.era * p.form.ip / 9;
  const ip = p.ip + k * p.form.ip;
  return ip > 0 ? (seasonER + k * recentER) * 9 / ip : p.era;
}

/* ---------------- game projection ----------------
   A Bradley-Terry comparison of two clubs on the log-odds scale: each side's
   regressed winning percentage, a home edge, and a damped adjustment for the
   gap between the two starters' ERAs.

   SP_WEIGHT is a judgement call, not a fitted parameter. It is set so a full
   run of ERA advantage moves the line about two and a half points, which is
   deliberately conservative — ERA is noisy, it carries the team's defence
   inside it, and a starter throws only part of the game. Nothing here is
   calibrated against outcomes, because this build has no way to backtest. */
function project(g){
  const h = S.teams[g.hid], a = S.teams[g.aid];
  if(!h || !a) return null;
  const lg = p => Math.log(p / (1 - p));

  let d = lg(teamRate(h)) - lg(teamRate(a)) + HFA;

  const hp = S.pitchers[g.hProbId], ap = S.pitchers[g.aProbId];
  const hEra = starterEra(hp), aEra = starterEra(ap);
  let usedSP = false, usedBP = false;
  if(hEra != null && aEra != null){
    const gap = Math.max(-SP_CAP, Math.min(SP_CAP, aEra - hEra));
    d += SP_WEIGHT * gap;
    usedSP = true;
  }

  const homeBp = S.bullpens[g.hid], awayBp = S.bullpens[g.aid];
  if(homeBp && awayBp){
    const gap = Math.max(-BP_CAP, Math.min(BP_CAP, awayBp.era - homeBp.era));
    d += BP_WEIGHT * gap;
    usedBP = true;
  }

  const pHome = 1 / (1 + Math.exp(-d));
  return { pHome, pAway:1 - pHome, usedSP, usedBP };
}

/* Fair American odds. The two sides sum to 100%, so unlike a real book there
   is no margin baked in — which is exactly why these will not match a
   sportsbook even when the underlying view agrees. */
function american(p){
  if(p <= 0 || p >= 1) return "";
  const raw = p >= 0.5 ? -(100 * p / (1 - p)) : 100 * (1 - p) / p;
  const r = Math.round(Math.abs(raw) / 5) * 5;
  return (raw < 0 ? "\u2212" : "+") + r;
}

function projectionBlock(g){
  if(g.st !== "sched") return "";
  const pr = project(g);
  if(!pr) return "";
  const row = (teamId, p) => '<div class="mlrow">'
    + '<span class="tbar" style="background:' + col(teamId) + '" aria-hidden="true"></span>'
    + '<span class="pname">' + ab(teamId) + '<em>' + esc(nm(teamId)) + '</em></span>'
    + '<span class="mlpct">' + Math.round(p * 100) + '%</span>'
    + '<span class="mlodds">' + american(p) + '</span></div>';
  const inputs = ["records"];
  if(pr.usedSP) inputs.push("starters");
  if(pr.usedBP) inputs.push("bullpens");
  const label = inputs.length === 1 ? "records only"
    : inputs.slice(0, -1).join(", ") + " and " + inputs[inputs.length - 1];
  return '<div class="pblock">'
    + '<h5 class="plabel">Model line · ' + label + '</h5>'
    + row(g.aid, pr.pAway) + row(g.hid, pr.pHome) + '</div>';
}

/* The bats that can end an at-bat in one swing, against the arm they face.
   Deliberately rates rather than a probability: "one per 18 plate
   appearances" is what has happened, and it cannot be mistaken for a
   forecast the way "9% tonight" would be.

   Each club gets a header naming the opposing starter, so the group of
   hitters underneath is unambiguously the group facing that arm. */
function powerBlock(g){
  if(g.st !== "sched") return "";
  const side = (teamId, oppPid) => {
    const bats = (S.hitters[teamId] || []).slice(0, 5);
    if(!bats.length) return "";
    const opp = S.pitchers[oppPid];
    const facing = opp && opp.hr9 != null
      ? 'vs ' + esc((opp.name || "").split(" ").slice(-1)[0])
        + ' <b>' + opp.hr9.toFixed(1) + '</b> HR/9'
      : (opp && opp.name ? 'vs ' + esc(opp.name.split(" ").slice(-1)[0]) : "");
    return '<div class="clubhead">'
      + '<span class="tbar" style="background:' + col(teamId) + '" aria-hidden="true"></span>'
      + '<span class="clubab">' + ab(teamId) + '</span>'
      + '<span class="facing">' + facing + '</span></div>'
      + bats.map(b => {
        const f = S.hitterForm[b.id];
        const sub = f
          ? '<div class="formline sub"><em>last ' + f.g + 'G</em>'
            + '<b>' + f.hr + '</b> HR · ' + f.h + ' for ' + f.ab
            + (f.avg != null ? ' · ' + f.avg.toFixed(3).replace(/^0/, "") : "")
            + (f.rbi ? ' · ' + f.rbi + ' RBI' : "") + '</div>'
          : "";
        return '<div class="mlrow">'
          + '<span class="bdash" aria-hidden="true"></span>'
          + '<span class="pname">' + esc(b.name) + '</span>'
          + '<span class="mlpct">' + b.hr + ' HR</span>'
          + '<span class="batrate">1 per ' + Math.round(b.perPA) + ' PA</span></div>' + sub;
      }).join("");
  };
  // Visitors bat against the home starter, and the reverse.
  const away = side(g.aid, g.hProbId), home = side(g.hid, g.aProbId);
  if(!away && !home) return "";
  return '<div class="pblock"><h5 class="plabel">Power on show</h5>'
    + away + (away && home ? '<div class="clubgap"></div>' : "") + home + '</div>';
}
