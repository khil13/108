<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1A1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="108">
<meta name="description" content="108 — baseball by the numbers. Live scores, standings, weather and October odds.">
<title>108 — Baseball by the numbers</title>

<!--
  108 — Baseball by the numbers
  No frameworks, no build step, no bundler, no API keys.

  Data sources, both keyless and both CORS-enabled:
    MLB Stats API   statsapi.mlb.com        scores, standings, venues
    Open-Meteo      api.open-meteo.com      temperature and wind

  Measured vs modelled is kept strictly separate. Scores, records and
  weather are fetched. The October odds are simulated in your browser
  and the method is stated in full on the Odds tab.
-->

<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root{
  --night:#0D1A1D; --deep:#122428; --panel:#162C30; --line:#22434A;
  --chalk:#F2F0E6; --slate:#7D989C; --bulb:#F5B841; --seam:#C8102E;
  --grass:#5FCB8B; --blush:#F5919F;
  /* One measure shared by header, content and footer. Widens on a desktop so
     the app uses the screen instead of sitting in a narrow strip. */
  --measure:820px;
  --display:'Anton',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{background:var(--night);color:var(--chalk);font-family:var(--body);
  -webkit-font-smoothing:antialiased;min-height:100vh;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
button:focus-visible{outline:2px solid var(--bulb);outline-offset:2px;border-radius:3px;}
button:disabled{cursor:default;}
h1,h2,h3,h4{margin:0;font-weight:400;}
p{margin:0;}
ul{margin:0;padding:0;list-style:none;}

/* masthead */
/* Opaque, not translucent. A sticky bar at 94% with a backdrop blur lets
   whatever is scrolling underneath ghost through it, which on a dense card
   means stray numbers appearing in the header. */
.mast{position:sticky;top:0;z-index:20;background:var(--night);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);}
/* The masthead spanned the full window while the content below was capped and
   centred, so on a wide screen the header floated off on its own. Both now
   share the same measure. */
.mtop{display:flex;align-items:center;gap:11px;padding:14px 18px 10px;
  max-width:var(--measure);margin:0 auto;}
.wordmark{font-family:var(--display);font-size:30px;letter-spacing:.02em;line-height:1;}
.tagline{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--slate);margin-top:3px;}
.feed{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.feedrow{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--slate);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--slate);display:block;}
.dot.ok{background:var(--grass);}
.dot.live{background:var(--seam);animation:pulse 1.9s ease-in-out infinite;}
.dot.bad{background:var(--bulb);}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.78);}}
.refresh{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:#738E93;}
.refresh:hover{color:var(--bulb);}
.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none;
  max-width:var(--measure);margin:0 auto;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--slate);padding:11px 13px;white-space:nowrap;
  border-bottom:2px solid transparent;transition:color .18s;}
.tabs button[aria-selected="true"]{color:var(--chalk);border-bottom-color:var(--seam);}

.banner{padding:11px 18px;background:#241D0D;border-bottom:1px solid #4A3A16;
  font-size:12.5px;line-height:1.55;color:#E3C98A;}
.banner b{color:var(--bulb);font-weight:600;}

.pane{padding:18px 14px 64px;max-width:var(--measure);margin:0 auto;}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--slate);margin:26px 4px 10px;}
.eyebrow.tight{margin:0 0 3px;}
.ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:4px;overflow:hidden;}
.ledger div{background:var(--deep);padding:13px 12px;}
.ledger b{display:block;font-family:var(--display);font-size:27px;line-height:1;color:var(--bulb);}
.ledger span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--slate);display:block;margin-top:5px;}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;border:1px solid;white-space:nowrap;}
.chip.seam{color:var(--blush);border-color:#5E2029;background:#2A1418;}
.chip.bulb{color:var(--bulb);border-color:#4A3A16;background:#241D0D;}
.chip.slate{color:var(--slate);border-color:var(--line);}
.seamrule{display:block;width:100%;height:14px;margin:30px 0 6px;opacity:.85;}
.note{font-size:12px;line-height:1.6;color:var(--slate);margin-top:18px;padding:0 4px;}
.toggle{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:4px;overflow:hidden;margin:18px 0 4px;}
.toggle button{flex:1;background:var(--night);padding:9px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);}
.toggle button.on{background:var(--panel);color:var(--chalk);}

/* game cards */
/* align-items:start matters once there are two columns: without it an expanded
   card stretches its collapsed neighbour to match, leaving a tall empty box. */
.grid{display:grid;gap:10px;grid-template-columns:1fr;align-items:start;}
@media(min-width:660px){.grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1180px){
  :root{--measure:1140px;}
  .grid{grid-template-columns:1fr 1fr 1fr;}
  /* Cards benefit from a wide measure; tables do not. An eight-column
     standings row stretched to 1,140px leaves the club name marooned from its
     numbers, so tables keep a readable width and centre themselves. */
  .dblock,.method,.thead,.trow,.pthead,.prow,.othead,.orow,.follow,.since,
  .sincelite,.ledger,.expandall,.disc.notes,.note,.cdday,.cdblk,.cdio{
    max-width:740px;margin-left:auto;margin-right:auto;}
}
@media(min-width:1600px){
  :root{--measure:1440px;}
  .grid{grid-template-columns:repeat(4,1fr);}
}
.gcard{background:var(--deep);border:1px solid var(--line);border-radius:5px;padding:11px 13px 9px;}
.ghead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:20px;}
.glabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--slate);}
.glabel.warn{color:var(--bulb);}
.glabel.was{text-decoration:line-through;opacity:.55;}
.livetag{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--blush);}
.count{display:flex;align-items:center;gap:7px;margin-left:auto;}
.bs{font-family:var(--mono);font-size:11px;}
.outs{display:flex;gap:3px;}
.outs i{width:5px;height:5px;border-radius:50%;border:1px solid #3A5A60;display:block;}
.outs i.on{background:var(--seam);border-color:var(--seam);}
.lastplay{margin:0 -4px 8px;padding:8px 10px 9px;border-radius:3px;
  background:#0F2126;border:1px solid #1C3A40;}
.lastplay .chip{vertical-align:1px;}
.lpwhen{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:#738E93;margin-left:8px;}
.lpdesc{margin-top:6px;font-size:12.5px;line-height:1.5;color:var(--chalk);}
.liveodds{margin:0 -4px 8px;}
.lobar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#0B1618;}
.lobar i{display:block;height:100%;transition:width .4s ease;}
.lolabels{display:flex;align-items:baseline;gap:8px;margin-top:5px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--chalk);}
.lolabels em{font-style:normal;flex:1;text-align:center;font-size:8.5px;
  letter-spacing:.14em;text-transform:uppercase;color:#738E93;}
.matrix{margin:9px -4px 8px;padding:5px 4px 7px;border-radius:3px;
  background:radial-gradient(rgba(245,184,65,.055) .7px,transparent .8px) 0 0/5px 5px,#0B1618;}
.mhead{display:grid;grid-template-columns:3px 46px 1fr auto 24px 44px;gap:8px;
  padding:2px 8px 3px;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:#738E93;}
.mhead span:nth-child(2){grid-column:5;text-align:right;}
.mhead span:nth-child(3){grid-column:6;text-align:right;}
.srow{display:grid;grid-template-columns:3px 46px 1fr auto 24px 44px;gap:8px;
  align-items:center;padding:4px 8px;}
.tbar{width:3px;height:15px;border-radius:2px;display:block;}
.sabbr{font-family:var(--display);font-size:17px;letter-spacing:.03em;color:var(--slate);
  display:flex;align-items:center;gap:4px;}
.atbat{width:4px;height:4px;border-radius:50%;background:var(--bulb);display:block;}
.win .sabbr,.win .sname{color:var(--chalk);}
.sname{font-size:12.5px;color:var(--slate);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.srec{font-family:var(--mono);font-size:10.5px;color:#738E93;}
.shits{font-family:var(--mono);font-size:11.5px;color:#6E8A8E;text-align:right;}
.sruns{font-family:var(--mono);font-weight:500;font-size:25px;text-align:right;
  color:#6E8A8E;line-height:1;}
.win .sruns{font-weight:500;}
.livebar{display:flex;align-items:center;gap:11px;padding:2px 4px 8px;}
.matchup{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:12px;}
.matchup span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.batline{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.04em;
  color:#738E93;margin-left:7px;}
.matchup em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  color:#738E93;margin-right:6px;}
/* pitcher blocks */
.pblock{margin:0 -4px 8px;padding:8px 10px 9px;border-radius:3px;background:#0F2126;
  border:1px solid #1C3A40;}
.plabel{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;
  color:#738E93;margin-bottom:7px;}
.pline{display:grid;grid-template-columns:3px 1fr auto;gap:9px;align-items:center;}
.pname{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:13.5px;color:var(--chalk);}
.pname em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--slate);}
.prec{font-family:var(--mono);font-size:11.5px;color:var(--slate);}
.mlrow{display:grid;grid-template-columns:3px 1fr auto auto;gap:9px;align-items:center;}
.mlrow + .mlrow{margin-top:5px;}
.mlpct{font-family:var(--mono);font-weight:500;font-size:14px;color:var(--chalk);
  text-align:right;min-width:38px;}
.mlodds{font-family:var(--mono);font-size:12px;color:var(--bulb);text-align:right;
  min-width:46px;}
.batrow{display:grid;grid-template-columns:3px 1fr 54px 42px 74px;gap:8px;
  align-items:baseline;padding:5px 0;}
.bathead{padding:0 0 4px;font-family:var(--mono);font-size:8px;letter-spacing:.12em;
  text-transform:uppercase;color:#738E93;border-bottom:1px solid rgba(34,67,74,.5);
  margin-bottom:3px;}
.bathead span{text-align:right;}
.bname{font-size:13.5px;color:var(--chalk);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
.bhr{font-family:var(--mono);font-size:12px;color:var(--chalk);text-align:right;}
.brate{font-family:var(--mono);font-size:10.5px;color:var(--slate);text-align:right;}
.bl5{font-family:var(--mono);font-size:10.5px;color:var(--slate);text-align:right;}
.bl5 b{font-weight:500;color:var(--slate);}
.bl5 b.hot{color:var(--bulb);}
.bl5 .dash{color:#738E93;}
.clubhead{display:grid;grid-template-columns:3px auto 1fr;gap:9px;align-items:center;
  padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--line);}
.clubab{font-family:var(--display);font-size:14px;letter-spacing:.04em;color:var(--chalk);}
.facing{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:#738E93;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.facing b{color:var(--bulb);font-weight:500;}
.clubgap{height:14px;}
.bdash{width:3px;height:1px;background:var(--line);display:block;}
.formline{margin:5px 0 0 12px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:#738E93;}
.formline em{font-style:normal;font-size:8.5px;letter-spacing:.14em;color:#738E93;
  margin-right:8px;}
.formline.sub{margin:3px 0 8px 12px;}
.formline b{color:var(--chalk);font-weight:500;font-size:11px;}
.pblock.waiting{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:#738E93;text-align:center;padding:16px 10px;}
.bpline{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--slate);}
.bpline em{font-style:normal;font-size:8.5px;letter-spacing:.14em;color:#738E93;
  margin-right:9px;}
.bpline b{color:var(--slate);font-weight:500;font-size:11.5px;}
.bpline b.up{color:var(--chalk);}
.bpline.sb i{font-style:normal;color:#738E93;font-size:10px;}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 0 12px;}
.pills:not(:last-child){margin-bottom:10px;}
.pill{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--slate);border:1px solid var(--line);border-radius:2px;padding:3px 6px;
  white-space:nowrap;}
.pill b{color:var(--chalk);font-weight:500;font-size:11px;margin-right:4px;}
.pill.hot{border-color:#4A3A16;background:#241D0D;color:var(--bulb);}
.pill.hot b{color:var(--bulb);}

/* weather strip */
.serieslabel{font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:#738E93;margin:7px 0 -2px;}
.wx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 -4px 8px;
  padding:8px 10px;border-radius:3px;background:#0F2126;border:1px solid #1C3A40;}
.wxtemp{font-family:var(--mono);font-weight:500;font-size:16px;color:var(--chalk);}
.wxbit{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--slate);display:flex;align-items:center;gap:5px;}
.wxbit b{color:var(--chalk);font-weight:500;}
.wxbit.thin{color:var(--bulb);}
.wxbit.thin b{color:var(--bulb);}
.arrow{display:block;width:15px;height:15px;flex:0 0 auto;}
.arrow path{fill:var(--bulb);}
.wxroof{font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:#738E93;}
.wxroof.shut{color:var(--bulb);}
.disc{display:flex;align-items:center;justify-content:center;gap:8px;
  width:calc(100% + 8px);margin:0 -4px 8px;padding:9px 8px;border:1px solid var(--line);
  border-radius:3px;background:#0F2126;font-family:var(--mono);font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);}
.disc.notes{margin-top:26px;}
.disc:hover{color:var(--bulb);border-color:#2C5058;}
.chev{font-style:normal;font-size:11px;line-height:1;}
.expandall{width:100%;margin-top:10px;padding:9px;border:1px solid var(--line);
  border-radius:4px;background:transparent;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);}
.expandall:hover{color:var(--bulb);border-color:#2C5058;}
/* followed club */
/* since last visit */
.since{background:#0F2126;border:1px solid #1C3A40;border-radius:4px;
  padding:12px 13px 10px;margin-bottom:16px;}
.sincehead{font-family:var(--mono);font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--bulb);margin-bottom:8px;}
.since p{font-size:13px;line-height:1.55;color:var(--slate);margin-bottom:4px;}
.since p b{color:var(--chalk);font-family:var(--display);font-size:15px;
  font-weight:400;letter-spacing:.03em;}
.sincelite{font-size:12px;line-height:1.55;color:#738E93;margin:-4px 4px 16px;}
.sincefoot{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:#738E93;margin-top:7px;}
.follow{background:var(--deep);border:1px solid var(--line);border-left-width:3px;
  border-radius:4px;padding:12px 13px 11px;margin-bottom:16px;}
.fhead{display:flex;align-items:baseline;gap:10px;}
.fname{display:flex;align-items:baseline;gap:8px;text-align:left;min-width:0;}
.fname b{font-family:var(--display);font-size:20px;letter-spacing:.03em;color:var(--chalk);}
.fname em{font-style:normal;font-size:12.5px;color:var(--slate);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.fname:hover b{color:var(--bulb);}
.fpos{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:#738E93;white-space:nowrap;}
.fstats{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;}
.fstats span{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--slate);display:flex;flex-direction:column;gap:2px;}
.fstats b{font-size:14px;font-weight:500;color:var(--chalk);letter-spacing:0;}
.fgame{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--slate);}
.fgame b{color:var(--bulb);font-weight:500;font-family:var(--mono);}
.fchange{margin-top:9px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:#738E93;}
.fchange:hover{color:var(--bulb);}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:11px;}
.pbtn{padding:12px 2px;border:1px solid var(--line);border-radius:3px;
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--slate);
  background:var(--night);min-height:40px;}
.pbtn.on{color:var(--chalk);}
.pbtn.wide{grid-column:span 6;}
.pbtn:hover{color:var(--chalk);}
.gfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#738E93;}
.tlink{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--slate);white-space:nowrap;}
.tlink:hover{color:var(--bulb);}

/* tables */
.dblock{margin-top:22px;}
.dname{font-family:var(--display);font-size:19px;letter-spacing:.03em;
  text-transform:uppercase;padding:0 4px 8px;}
.thead,.trow{display:grid;grid-template-columns:16px 3px 1fr 46px 38px 32px 40px 56px;gap:8px;}
.thead{padding:0 8px 6px;border-bottom:1px solid var(--line);font-family:var(--mono);
  font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#738E93;}
.thead span:first-child{grid-column:3;}
.trow{align-items:center;width:100%;text-align:left;padding:9px 8px;
  border-bottom:1px solid rgba(34,67,74,.5);}
.trow:hover{background:var(--deep);}
.tpos{font-family:var(--mono);font-size:11px;color:#738E93;}
.tname{display:flex;flex-direction:column;gap:1px;min-width:0;}
.tline{display:flex;align-items:baseline;min-width:0;}
.mag{font-style:normal;font-family:var(--mono);font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--bulb);border:1px solid #4A3A16;background:#241D0D;
  border-radius:2px;padding:2px 4px;margin-left:6px;vertical-align:2px;}
.mag.dim{color:#738E93;border-color:var(--line);background:transparent;}
.mag.in{color:var(--grass);border-color:#1E4634;background:#0F2A1D;}

const MLB = "https://statsapi.mlb.com/api/v1";

   REGRESS_SEASON estimates a club's true strength over the ~58 games it has
   left. Forty games of .500 puts the Dodgers at .600, close to what a 67-38
   club actually goes on to play.

   REGRESS_GAME is for predicting one game, and the calibration test picked it:
   400 scored best over 1,192 games. That is not because records suddenly matter
   less — it is because the log-odds mapping was producing spreads far too wide
   for a single baseball game, and heavy regression compresses them back. 160
   through 4,000 all scored within 0.0003, so the finding is "much more than
   40", not precisely 400. */

   "what the season simulation uses", and backtest picked it up as its default —
   so every headline comparison on the Odds tab replayed the single-game model at
   40 games of regression while the cards applied 400. The four-corner table then
   reported that team records made the model worse and told you to switch them
   off, on the strength of a model you were not running. The sweep, which passes
   regression explicitly, disagreed with it in the same panel.

   Two constants, two purposes, and each site now names the one it means. */
const HFA = 0.16;            // log-odds home edge; MLB homes win about 54%
/* The number any forecast has to beat: predict the home side, at the rate home
   sides actually win, and never look at who is playing. Shared by the season
   replay and by the record, so the two cannot quietly disagree about what
   "better than nothing" means. */

   same 1,192 games, and starters were the only component that beat the
   home-field baseline at all.

   0.35 — where the best *applied* weight was still 0.10 to 0.15, and 0.35 scored
   worse than ignoring starters altogether. That is not a contradiction. A running
   ERA is a noisy read on a pitcher's true quality, so the right response to it is
   damped by roughly the ratio of signal to noise. Applying the true weight to an
   estimate is how you turn a real effect into a worse forecast. */

  133:["ATH","Athletics","","#EFB21E"],           134:["PIT","Pirates","Pittsburgh","#E0A106"],

/* ============================== helpers ============================= */

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const iso = d => d.toLocaleDateString("en-CA");
const shift = n => { const d = new Date(); d.setDate(d.getDate()+n); return d; };
const clock = t => new Date(t).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const dayName = t => new Date(t).toLocaleDateString([], {weekday:"short"});
const pct = t => (t.w+t.l ? t.w/(t.w+t.l) : 0);
const fmt3 = x => x.toFixed(3).replace(/^0/,"");
/* Inclusive bounds. At 5,000 sims a berth of exactly 4975 lands on .995,
   and rounding that up printed "100" — a claim of certainty the simulation
   never made. */
const pc = p => p >= .995 ? ">99" : p <= .005 ? "<1" : String(Math.round(p*100));
const left = t => Math.max(0, SEASON_GAMES - t.w - t.l);
const gbTo = (t,o) => { const n = (o.w-t.w+(t.l-o.l))/2; return n <= 0 ? 0 : n; };
const gbText = n => n === 0 ? "—" : n % 1 === 0 ? String(n) : n.toFixed(1);

const list = () => Object.values(S.teams || {});
const inDiv = d => list().filter(t => t.div === d).sort((a,b) => pct(b)-pct(a));
const inLg = lg => list().filter(t => DIV[t.div] && DIV[t.div][0] === lg).sort((a,b) => pct(b)-pct(a));

function pictureOf(lg){
  const leaders = DIVS[lg].map(d => inDiv(d)[0]).filter(Boolean);
  const rest = inLg(lg).filter(t => !leaders.includes(t));
  return { seeds: leaders.slice().sort((a,b) => pct(b)-pct(a)),
           wilds: rest.slice(0,3), chasing: rest.slice(3) };
}

function timeAgo(iso){
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if(mins < 2) return "moments ago";
  if(mins < 60) return mins + " minutes ago";
  const hrs = Math.round(mins / 60);
  if(hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
  const days = Math.round(hrs / 24);
  return days + (days === 1 ? " day ago" : " days ago");
}

async function getJSON(url){

  if(!r.ok) throw new Error("HTTP " + r.status);

/* ============================== fetching ============================ */

function readStandings(json){
  const out = {};
  for(const rec of json.records || []){
    const d = rec.division && rec.division.id;
    for(const tr of rec.teamRecords || []){
      const id = tr.team && tr.team.id;
      if(!T[id] || !DIV[d]) continue;
      const sp = (json => (tr.records && tr.records.splitRecords || []).find(s => s.type === json));
      const pair = s => s ? s.wins + "-" + s.losses : null;
      out[id] = { id, div:d, w:tr.wins, l:tr.losses,
        gb:tr.gamesBack, streak:(tr.streak||{}).streakCode || null,
        l10:pair(sp("lastTen")), home:pair(sp("home")), away:pair(sp("away")),
        magic:tr.magicNumber, elim:tr.eliminationNumber,
        wcElim:tr.wildCardEliminationNumber,
        clinched:!!tr.clinched, clinchInd:tr.clinchIndicator || null };
    }
  }
  return out;
}

/* MLB gives three views of a game's state: a coded letter, a broad category,
   and a prose sentence. The letter is unambiguous where the prose is not, so it
   wins when present.

     D postponed   C cancelled   U suspended
     S scheduled   P pre-game    I in progress   F final   O game over          */
function statusOf(g){
  const st = g.status || {};
  const code = st.codedGameState || st.statusCode || "";
  const det = st.detailedState || "";
  const abs = st.abstractGameState;
  if(code === "D" || code === "C" || code === "U") return "off";
  if(/postponed|cancel|suspend/i.test(det)) return "off";
  if(abs === "Live") return "live";
  if(abs === "Final") return "final";
  return "sched";
}

/* A delay is not a state of its own — a game can be delayed before it starts or
   stopped mid-innings — so it rides alongside the status. MLB puts the reason
   after a colon: "Delayed Start: Rain". Without this the card shows a start
   time as though nothing were wrong, which is how a rain delay went unnoticed.

   The reason can be absent, in which case the fact of the delay is still worth
   showing. */
function delayOf(g){
  const det = (g.status || {}).detailedState || "";
  if(!/delay/i.test(det)) return null;
  const m = det.match(/:\s*(.+)$/);
  const why = m ? m[1].trim() : null;
  return { pre:/delayed start/i.test(det), why };
}

function readGames(json){
  const out = [];
  for(const day of json.dates || []){
    for(const g of day.games || []){
      const h = (g.teams||{}).home || {}, a = (g.teams||{}).away || {};
      const hid = (h.team||{}).id, aid = (a.team||{}).id;
      if(!T[hid] || !T[aid]) continue;
      const ls = g.linescore || {}, off = ls.offense || {};
      out.push({
        pk:g.gamePk, date:g.officialDate || day.date, st:statusOf(g), delay:delayOf(g),
        sg:g.seriesGameNumber == null ? null : g.seriesGameNumber,
        gis:g.gamesInSeries == null ? null : g.gamesInSeries,
        detail:(g.status||{}).detailedState || "", hid, aid,
        hs:h.score == null ? null : h.score, as:a.score == null ? null : a.score,
        start:g.gameDate, venueId:(g.venue||{}).id, venue:(g.venue||{}).name || "",
        hProb:(h.probablePitcher||{}).fullName || null,
        aProb:(a.probablePitcher||{}).fullName || null,
        hProbId:(h.probablePitcher||{}).id || null,
        aProbId:(a.probablePitcher||{}).id || null,
        inn:ls.currentInning == null ? null : ls.currentInning,
        ord:ls.currentInningOrdinal || null, half:ls.inningState || null,
        balls:ls.balls, strikes:ls.strikes, outs:ls.outs,
        onBase:[!!off.first, !!off.second, !!off.third],
        batter:(off.batter||{}).fullName || null,
        batterId:(off.batter||{}).id || null,
        onDeck:(off.onDeck||{}).fullName || null,
        /* Posted lineups, when MLB has them — usually a few hours before first
           pitch. Everything that picks a hitter has been guessing until now, and
           saying so in the notes did not stop bat picks being voided because the
           man was rested. */
        lineup:(() => {
          const lu = g.lineups || {};
          const ids = side => Array.isArray(lu[side])
            ? lu[side].map(p => (p || {}).id).filter(Boolean) : [];
          const home = ids("homePlayers"), away = ids("awayPlayers");
          return home.length && away.length ? { home, away } : null;
        })(),
        inHole:(off.inHole||{}).fullName || null,
        pitcher:((ls.defense||{}).pitcher||{}).fullName || null,
        pitcherId:((ls.defense||{}).pitcher||{}).id || null,
        hH:((ls.teams||{}).home||{}).hits, aH:((ls.teams||{}).away||{}).hits
      });
    }
  }
  return out;
}

/* Innings pitched arrive as "142.1", which is baseball notation for 142 and
   one third — not 142.1. Parsing it as a decimal quietly corrupts every
   per-nine rate, so convert thirds properly. */
function inningsOf(ip){
  if(ip == null) return null;
  const [whole, frac] = String(ip).split(".");
  const w = parseInt(whole, 10);
  if(isNaN(w)) return null;
  const thirds = frac ? parseInt(frac[0], 10) || 0 : 0;
  return w + thirds / 3;
}

/* And back again for display. 16.67 innings is written 16.2 in baseball —
   sixteen and two thirds. Printing the decimal is accurate but reads wrong
   to anyone who follows the sport. */
function ipText(inn){
  if(inn == null) return "—";
  const whole = Math.floor(inn + 1e-9);
  const thirds = Math.round((inn - whole) * 3);
  return thirds === 3 ? (whole + 1) + ".0" : whole + "." + thirds;
}

/* Every starter on the slate in a single request. Rates come from MLB where
   it supplies them and are computed from the counting stats otherwise, so a
   field name changing upstream degrades to arithmetic rather than blanks.

   The hydrate takes arrays, so the season line and the full game log arrive
   together — no second round trip for recent form. */
async function loadPitchers(ids){
  const out = {};
  if(!ids.length) return out;
  const yr = new Date().getFullYear();
  let j;
  try{
    j = await getJSON(MLB + "/people?personIds=" + ids.join(",")
      + "&hydrate=stats(group=pitching,type=season,season=" + yr + ")");
  }catch(e){ return out; }

  for(const p of j.people || []){
    const seasonGrp = (p.stats || [])[0];
    const s = seasonGrp && seasonGrp.splits && seasonGrp.splits.length
      ? seasonGrp.splits[seasonGrp.splits.length - 1].stat : null;   // last split = current club
    const ip = s ? inningsOf(s.inningsPitched) : null;
    const per9 = (count, given) => {
      if(given != null && given !== "-" && !isNaN(parseFloat(given))) return parseFloat(given);
      if(ip && ip > 0 && count != null) return count * 9 / ip;
      return null;
    };

    out[p.id] = {
      id:p.id,
      name:p.fullName || null,
      hand:((p.pitchHand||{}).code) || null,
      era:s && s.era != null && s.era !== "-" ? parseFloat(s.era) : null,
      whip:s && s.whip != null && s.whip !== "-" ? parseFloat(s.whip) : null,
      ip,
      w:s ? s.wins : null, l:s ? s.losses : null, gs:s ? s.gamesStarted : null,
      k9:s ? per9(s.strikeOuts, s.strikeoutsPer9Inn) : null,
      hr9:s ? per9(s.homeRuns, s.homeRunsPer9) : null,
      bb9:s ? per9(s.baseOnBalls, s.walksPer9Inn) : null,
      oppAvg:s && s.avg != null && s.avg !== "-" ? s.avg : null,
      form:null
    };
  }
  return out;
}

/* Game logs in their own request. The combined array hydrate,
   type=[season,gameLog], returned season stats only — so this uses the plain
   single-type form that is known to work, at the cost of one more call. */
async function loadPitcherForm(ids){
  if(!ids.length) return 0;
  const yr = new Date().getFullYear();
  let j;
  try{
    j = await getJSON(MLB + "/people?personIds=" + ids.join(",")
      + "&hydrate=stats(group=pitching,type=gameLog,season=" + yr + ")");
  }catch(e){ return 0; }
  let filled = 0;
  for(const p of j.people || []){
    const rec = S.pitchers[p.id];
    if(!rec) continue;
    const grp = (p.stats || []).find(s => Array.isArray(s.splits) && s.splits.length);
    if(!grp) continue;
    // Starts only, so the comparison is like for like against the season line.
    let starts = grp.splits.filter(sp => sp.stat && Number(sp.stat.gamesStarted) > 0);
    if(!starts.length) starts = grp.splits;      // a reliever opening: use appearances
    const last = starts.slice(-3);
    let inn = 0, er = 0, k = 0, bb = 0, hr = 0;
    for(const sp of last){
      inn += inningsOf(sp.stat.inningsPitched) || 0;
      er += Number(sp.stat.earnedRuns) || 0;
      k += Number(sp.stat.strikeOuts) || 0;
      bb += Number(sp.stat.baseOnBalls) || 0;
      hr += Number(sp.stat.homeRuns) || 0;
    }
    if(inn > 0){
      rec.form = { n:last.length, ip:inn, era:9 * er / inn, k, bb, hr };
      filled++;
    }
  }
  return filled;
}

/* Hitter form from actual game logs — the same mechanism that works for
   pitchers, which is why it is trustworthy where the date-range attempt was
   not. The cost is that logs are per player, so this is fetched only for the
   bats on cards you have actually opened, in batches, and never twice.

   A null entry means "asked for, nothing came back", which stops a player
   with no log from being requested on every render. */
async function loadHitterLogs(ids){
  if(!ids.length) return 0;
  const yr = new Date().getFullYear();
  let j;
  try{
    j = await getJSON(MLB + "/people?personIds=" + ids.join(",")
      + "&hydrate=stats(group=hitting,type=gameLog,season=" + yr + ")");
  }catch(e){ return 0; }
  let filled = 0;
  for(const p of j.people || []){
    const grp = (p.stats || []).find(s => Array.isArray(s.splits) && s.splits.length);
    if(!grp) continue;
    const last = grp.splits.slice(-5);
    if(!last.length) continue;
    let hr = 0, ab = 0, h = 0, rbi = 0;
    for(const sp of last){
      const st = sp.stat || {};
      hr += Number(st.homeRuns) || 0;
      ab += Number(st.atBats) || 0;
      h += Number(st.hits) || 0;
      rbi += Number(st.rbi) || 0;
    }
    S.hitterForm[p.id] = { g:last.length, hr, ab, h, rbi,
                           avg:ab > 0 ? h / ab : null };
    filled++;
  }
  return filled;
}

/* The bats on every card currently open, deduped. */
function openCardHitterIds(){
  const ids = [];
  const today = iso(new Date());
  for(const g of S.games){
    /* Expanded cards on Today, and every game on today's Plays card — the Watch
       pick weighs recent form, so it needs the logs whether or not a card on the
       other tab happens to be open. */
    const wanted = S.open[g.pk] || (g.date === today && g.st === "sched");
    if(!wanted) continue;
    for(const tid of [g.aid, g.hid])
      for(const b of (S.hitters[tid] || []).slice(0, 5)) if(b.id) ids.push(b.id);
  }
  return [...new Set(ids)];
}

async function ensureHitterForm(){
  const need = openCardHitterIds().filter(id => !(id in S.hitterForm));
  if(!need.length) return;
  need.forEach(id => { S.hitterForm[id] = null; });   // claim them, so no refetch
  const CHUNK = 40;
  for(let i = 0; i < need.length; i += CHUNK){
    await loadHitterLogs(need.slice(i, i + CHUNK));
    S.diag.hitterForm = Object.values(S.hitterForm).filter(Boolean).length;
    render();
  }
}

/* Season head-to-head. The four-day window the app normally keeps is no use
   here, so this pulls every completed regular-season game once and reduces it
   to a win count per pairing. No hydrate, so each game is small.

   Keyed by the two club ids sorted, which makes the lookup independent of who
   is at home in any given meeting. */
const h2hKey = (a, b) => (a < b ? a + "-" + b : b + "-" + a);

async function loadSeason(){
  const yr = new Date().getFullYear();
  const h2h = {}, series = {}, remaining = [], runs = {}, finals = [];
  let j;
  try{
    j = await getJSON(MLB + "/schedule?sportId=1&gameType=R"
      + "&startDate=" + yr + "-03-01&endDate=" + yr + "-10-05"
      + "&hydrate=probablePitcher");
  }catch(e){ return { h2h, series, remaining, runs, finals }; }
  for(const day of j.dates || []){
    for(const g of day.games || []){
      const h = (g.teams || {}).home || {}, a = (g.teams || {}).away || {};
      const hid = (h.team || {}).id, aid = (a.team || {}).id;
      if(!T[hid] || !T[aid]) continue;
      const st = (g.status || {}).abstractGameState;
      const det = (g.status || {}).detailedState || "";
      if(st === "Final"){
        if(h.score == null || a.score == null) continue;
        // Runs count from every finished game, ties included.
        const rh = runs[hid] || (runs[hid] = { rs:0, ra:0, g:0 });
        const rv = runs[aid] || (runs[aid] = { rs:0, ra:0, g:0 });
        rh.rs += h.score; rh.ra += a.score; rh.g++;
        rv.rs += a.score; rv.ra += h.score; rv.g++;
        // Kept in full so the model can be replayed against them later. The id
        // is what the scorecard is keyed by, so settlement can be exact.
        finals.push({ pk:g.gamePk, date:g.officialDate || day.date, hid, aid,
          hs:h.score, as:a.score,
          hsp:(h.probablePitcher || {}).id || null,
          asp:(a.probablePitcher || {}).id || null });
        if(h.score === a.score) continue;   // no winner to record below
        const k = h2hKey(hid, aid);
        const rec = h2h[k] || (h2h[k] = {});
        const winner = h.score > a.score ? hid : aid;
        rec[winner] = (rec[winner] || 0) + 1;
        // Kept so a series record can span more than the four-day window.
        (series[k] = series[k] || []).push({
          sg:g.seriesGameNumber == null ? null : g.seriesGameNumber,
          date:g.officialDate || day.date, winner });
      } else if(!/postponed|cancel/i.test(det)){
        // Anything not yet final is still to be played, including tonight's.
        remaining.push({ hid, aid });
      }
    }
  }
  finals.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  return { h2h, series, remaining, runs, finals };
}

/* Every starter who appeared this season, with their outings in date order.

   This is what makes the starter term testable. Knowing who pitched is not
   enough — the model would need his ERA *as it stood that day*, not today's.
   The game logs give each appearance with a date, so a running ERA can be
   rebuilt for any point in the season. Roughly 250 pitchers in batches of 40,
   so about seven requests, once, on demand. */
async function loadStarterHistory(){
  const finals = S.finals;
  if(!Array.isArray(finals)) return null;
  const ids = [...new Set(finals.flatMap(f => [f.hsp, f.asp]).filter(Boolean))];
  if(!ids.length) return null;                 // MLB kept no starters for past games

  const yr = new Date().getFullYear();
  const out = {};
  const CHUNK = 40;
  for(let i = 0; i < ids.length; i += CHUNK){
    const batch = ids.slice(i, i + CHUNK);
    let j;
    try{
      j = await getJSON(MLB + "/people?personIds=" + batch.join(",")
        + "&hydrate=stats(group=pitching,type=gameLog,season=" + yr + ")");
    }catch(e){ continue; }
    for(const p of j.people || []){
      const grp = (p.stats || []).find(s => Array.isArray(s.splits) && s.splits.length);
      if(!grp) continue;
      const log = [];
      for(const sp of grp.splits){
        const ip = inningsOf((sp.stat || {}).inningsPitched);
        const er = Number((sp.stat || {}).earnedRuns);
        if(!ip || isNaN(er)) continue;
        log.push({ date:sp.date || (sp.game || {}).officialDate || "", ip, er });
      }
      log.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
      // Cumulative, so an ERA before any date is a binary search away.
      let ip = 0, er = 0;
      for(const e of log){ ip += e.ip; er += e.er; e.cumIp = ip; e.cumEr = er; }
      out[p.id] = log;
    }
    S.diag.spHistory = Object.keys(out).length;
    render();
  }
  return out;
}

/* A starter's ERA using only what he had thrown before this date. */
const SP_MIN_IP = 25;
function eraBefore(pid, date){
  const log = S.spHistory && S.spHistory[pid];
  if(!log || !log.length) return null;
  let lo = 0, hi = log.length;
  while(lo < hi){ const m = (lo + hi) >> 1; if(log[m].date < date) lo = m + 1; else hi = m; }
  if(lo === 0) return null;
  const e = log[lo - 1];
  return e.cumIp >= SP_MIN_IP ? 9 * e.cumEr / e.cumIp : null;
}

/* ---------------- calibration ----------------
   Replay the model over every completed game of the season and compare what it
   said to what happened.

   Crucially this walks forward: each club's record is rebuilt as it stood
   *before* the game being predicted, so the model is never told how the season
   turned out. Games are skipped until both clubs have played MIN_GP, because a
   record of 4-2 carries no information.

   What it cannot test: starters and bullpens. Those would need the probable
   pitcher for 1,500 historical games, one request each. So this measures the
   team-strength and home-field core — the foundation the rest sits on. */
const BT_MIN_GP = 25;

/* regress and spWeight default to the app's own constants, but can be varied
   so the sweep below can search for better ones. */
function backtest(recencyW, useSP, regress, spWeight, usePyth, useTeam){
  /* Single-game predictions, so the single-game regression. */
  const REG = regress == null ? REGRESS_GAME : regress;
  const SPW = spWeight == null ? SP_WEIGHT : spWeight;
  const PY = usePyth == null ? USE_PYTH : usePyth;
  const TEAM = useTeam == null ? true : useTeam;
  const games = S.finals;
  if(!Array.isArray(games) || games.length < 200) return null;

  const st = {};   // running state per club
  const seat = id => st[id] || (st[id] = { w:0, l:0, rs:0, ra:0, recent:[] });
  /* Runs at each ground as they stood before the game being predicted, so the
     park factor is tested on what was knowable rather than on the season total
     that includes the game itself. */
  const pk = {};
  const ground = id => pk[id] || (pk[id] = { r:0, g:0 });
  let lgR = 0, lgN = 0;

  const preds = [];
  let baseBrier = 0, baseN = 0;

  for(const g of games){
    const h = seat(g.hid), a = seat(g.aid);
    const hg = h.w + h.l, ag = a.w + a.l;

    if(hg >= BT_MIN_GP && ag >= BT_MIN_GP){
      const rate = t => {
        const ten = t.recent.slice(-10);
        const tw = ten.filter(Boolean).length;
        const g = t.w + t.l;
        /* The state walked forward already carries runs scored and allowed —
           they were only ever used for the run projection. Strength can come
           from them instead of the record, using nothing the model would not
           have known on the day. */
        let w = t.w;
        if(PY && g > 0){
          const p = pythPct(t.rs, t.ra);
          if(p != null) w = p * g;
        }
        return (w + recencyW * tw + REG / 2)
             / (g + recencyW * ten.length + REG);
      };
      const lg = p => Math.log(p / (1 - p));
      let d = HFA;
      if(TEAM) d += lg(rate(h)) - lg(rate(a));
      let spApplied = false;
      if(useSP){
        const hE = eraBefore(g.hsp, g.date), aE = eraBefore(g.asp, g.date);
        if(hE != null && aE != null){
          d += SPW * Math.max(-SP_CAP, Math.min(SP_CAP, aE - hE));
          spApplied = true;
        }
      }
      const p = 1 / (1 + Math.exp(-d));

      // No starters available historically, so the run projection is the
      // team-rate half of it only.
      const projTotal = (h.rs / hg + a.ra / ag) / 2 + (a.rs / ag + h.ra / hg) / 2;
      /* The same projection, scaled by where it is being played. Reported
         separately so the park term is measured rather than assumed. */
      const gr = ground(g.hid);
      const lgAvg = lgN > 0 ? lgR / lgN : null;
      const factor = lgAvg && gr.g > 0
        ? ((gr.r + PARK_REGRESS * lgAvg) / (gr.g + PARK_REGRESS)) / lgAvg : 1;
      const projPark = projTotal * factor;

      const homeWon = g.hs > g.as;
      // The number any projection has to beat: just predict the league average.
      let lgRuns = 0, lgG = 0;
      for(const k in st){ lgRuns += st[k].rs; lgG += st[k].w + st[k].l; }
      const lgTotal = lgG > 0 ? 2 * lgRuns / lgG : 9;
      preds.push({ p, homeWon, projTotal, projPark, lgTotal,
                   actualTotal:g.hs + g.as, spApplied });

      // Baseline to beat: home field and nothing else.
      baseBrier += Math.pow(HOME_BASE - (homeWon ? 1 : 0), 2);
      baseN++;
    }

    h.w += g.hs > g.as ? 1 : 0; h.l += g.hs > g.as ? 0 : 1;
    a.w += g.as > g.hs ? 1 : 0; a.l += g.as > g.hs ? 0 : 1;
    h.rs += g.hs; h.ra += g.as;
    a.rs += g.as; a.ra += g.hs;
    const gd = ground(g.hid);
    gd.r += g.hs + g.as; gd.g++;
    lgR += g.hs + g.as; lgN++;
    h.recent.push(g.hs > g.as); a.recent.push(g.as > g.hs);
    if(h.recent.length > 20) h.recent.shift();
    if(a.recent.length > 20) a.recent.shift();
  }

  if(!preds.length) return null;

  let brier = 0, right = 0, absErr = 0, bias = 0, naiveErr = 0, spN = 0, parkErr = 0;
  const bands = [[.50,.55],[.55,.60],[.60,.65],[.65,.70],[.70,1.01]]
    .map(([lo,hi]) => ({ lo, hi, n:0, sumP:0, won:0 }));
  /* Absolute accuracy and ranking are different questions. A projection can be
     useless at calling one game and still sort games correctly — which would
     mean the number should be read as a comparison, not a forecast. */
  const runBands = [[0,7.5],[7.5,8.5],[8.5,9.5],[9.5,10.5],[10.5,99]]
    .map(([lo,hi]) => ({ lo, hi, n:0, sumP:0, sumA:0 }));

  for(const q of preds){
    brier += Math.pow(q.p - (q.homeWon ? 1 : 0), 2);
    const favP = Math.max(q.p, 1 - q.p);
    const favWon = (q.p > 0.5) === q.homeWon;
    if(favWon) right++;
    for(const b of bands){
      if(favP >= b.lo && favP < b.hi){ b.n++; b.sumP += favP; if(favWon) b.won++; break; }
    }
    for(const b of runBands){
      if(q.projTotal >= b.lo && q.projTotal < b.hi){
        b.n++; b.sumP += q.projTotal; b.sumA += q.actualTotal; break;
      }
    }
    absErr += Math.abs(q.projTotal - q.actualTotal);
    parkErr += Math.abs((q.projPark == null ? q.projTotal : q.projPark) - q.actualTotal);
    bias += q.projTotal - q.actualTotal;
    naiveErr += Math.abs(q.lgTotal - q.actualTotal);
    if(q.spApplied) spN++;
  }
  const n = preds.length;
  return {
    preds,
    n, brier:brier / n, baseBrier:baseN ? baseBrier / baseN : null,
    acc:right / n, runMAE:absErr / n, parkMAE:parkErr / n,
    runBias:bias / n, naiveMAE:naiveErr / n, spN,
    runBands:runBands.filter(b => b.n > 20).map(b => ({
      label:(b.lo === 0 ? "under 7.5" : b.hi === 99 ? "over 10.5"
             : b.lo + "\u2013" + b.hi),
      n:b.n, said:b.sumP / b.n, actual:b.sumA / b.n
    })),
    bands:bands.filter(b => b.n > 0).map(b => ({
      label:Math.round(b.lo * 100) + "\u2013" + (b.hi > 1 ? "100" : Math.round(b.hi * 100)),
      n:b.n, said:b.sumP / b.n, actual:b.won / b.n
    }))
  };
}

/* ---------------- live win probability ----------------
   As a game unfolds, what is left to decide it is the score and how many outs
   remain. Each side's remaining runs are drawn from a Poisson whose mean is the
   league's runs per half-inning — a figure computed from this season's results
   rather than assumed — multiplied by the half-innings they have left. Ties go
   to extra innings, simulated the same way.

   What it does not know: who is on base. A bases-loaded, nobody-out situation
   reads the same here as bases empty with two out. Including that properly
   needs a run-expectancy table built from years of play-by-play, which this app
   has no way to derive, and inventing the twenty-four values would be worse
   than leaving them out. Outs are in it; runners are not. */
const LIVE_SIMS = 3000;

function poisson(mean){
  if(mean <= 0) return 0;
  // Knuth's method; means here are small, so the loop is short.
  const L = Math.exp(-mean);
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while(p > L);
  return k - 1;
}

function liveWinProb(g){
  if(g.st !== "live" || g.hs == null || g.as == null) return null;
  const lgPerGame = leagueRunsPerGame();
  if(!lgPerGame) return null;
  /* Each side scores at its own rate, not the league's: what a club scores
     against what its opponent concedes, the same pairing the pre-game run
     projection uses. Without this, the top of the first reads 50% regardless
     of who is playing. Falls back to the league rate when a club's season
     figures have not loaded. */
  const hr_ = teamRuns(g.hid), ar_ = teamRuns(g.aid);
  const homePerHalf = (hr_ && ar_ ? (hr_.rs + ar_.ra) / 2 : lgPerGame) / 9;
  const awayPerHalf = (hr_ && ar_ ? (ar_.rs + hr_.ra) / 2 : lgPerGame) / 9;
  const perHalf = lgPerGame / 9;               // extras, where the edge matters least

  const inn = g.inn || 1;
  const half = (g.half || "").toLowerCase();
  const outs = g.outs || 0;
  const lastInn = Math.max(9, inn);

  const awayRem = (lastInn - inn) + (half === "top" ? (3 - outs) / 3 : 0);
  const homeRem = (lastInn - inn)
    + (half === "top" || half === "middle" ? 1 : (3 - outs) / 3);
  if(awayRem <= 0 && homeRem <= 0) return null;      // game is effectively over

  let homeWins = 0;
  for(let s = 0; s < LIVE_SIMS; s++){
    let a = g.as + poisson(awayPerHalf * awayRem);
    let h = g.hs + poisson(homePerHalf * homeRem);
    // Extra innings, a half each, until somebody is ahead.
    let guard = 0;
    while(a === h && guard++ < 40){
      a += poisson(perHalf);
      h += poisson(perHalf);
    }
    if(h > a) homeWins++;
  }
  return { pHome:homeWins / LIVE_SIMS, awayRem, homeRem };
}

/* ---------------- the scorecard ----------------
   What the app said, written down before the game, then checked against the
   result. This is the only way the record means anything: reconstructing
   yesterday's predictions from today's records and today's ERAs would let the
   model half know the answer, which is the mistake the calibration nearly made.

   So it is prospective. It starts empty and fills from the first time you open
   the Plays tab. A week of use gives you a week. */
const CARD_KEY = "108.scorecard";
const FIT_KEY = "108.calfit";
const CAL_KEY = "108.cal";
const CARD_DAYS = 21;
const CONF_BAR = 0.55;

function loadScorecard(){
  try{
    const raw = localStorage.getItem(CARD_KEY);
    const c = raw ? JSON.parse(raw) : null;
    return c && typeof c === "object" ? c : {};
  }catch(e){ return {}; }
}
function saveScorecard(){
  // Keep three weeks; beyond that it is history nobody reads.
  const cutoff = iso(shift(-CARD_DAYS));
  for(const k in S.card) if((S.card[k].date || "") < cutoff) delete S.card[k];
  try{ localStorage.setItem(CARD_KEY, JSON.stringify(S.card)); }catch(e){}
}

/* Entries written before the settlement was keyed by game id could have been
   scored against the other half of a doubleheader: the wrong final, and picks
   graded from a box score that was not theirs. Build 80 stopped that happening;
   it could not undo what was already saved, and nothing self-heals, because a
   graded pick is never revisited.

   So this discards the *results* of anything written under the old scheme —
   score, bat outcomes, strikeout counts — while keeping the predictions
   themselves, which were always sound. Settlement then runs again from scratch,
   by game id, and grades each pick from its own box score. Predictions are not
   touched; nothing is re-predicted with hindsight. */
const CARD_V = 2;
function repairScorecard(){
  let n = 0;
  for(const key in S.card){
    const e = S.card[key];
    if(!e || e.v >= CARD_V) continue;
    delete e.hs; delete e.as;
    delete e.boxTried; delete e.boxTries;
    for(const w of watchList(e)) delete w.result;
    if(Array.isArray(e.ks)) for(const k of e.ks){ delete k.actual; delete k.scratched; }
    e.v = CARD_V;
    n++;
  }
  if(n){ S.diag.repaired = n; S.cardDirty = true; saveScorecard(); }
  return n;
}

/* Called when the Plays tab renders a game that has not started. Records the
   prediction once and never revises it. */
function ksFor(g){
  /* The pitcher's own club is stored as well as the lineup he faces, so the
     record can label his row the way it labels a bat's. Records written before
     build 79 have no `own` and simply go unlabelled. */
  return [[g.aProbId, g.hid, g.aid], [g.hProbId, g.aid, g.hid]].map(([pid, oppId, own]) => {
    const k = projectStrikeouts(pid, oppId);
    return k ? { pid, own, name:(S.pitchers[pid] || {}).name, exp:k.exp } : null;
  }).filter(Boolean);
}

function recordPrediction(g){
  if(g.st !== "sched") return;
  const key = String(g.pk);
  const pr = project(g), tot = projectTotal(g), bats = bestBats(g);
  if(!pr) return;

  /* The tab renders before every dataset has landed, so a first pass could
     record a side with no run projection and no strikeout lines — and those
     nulls then stuck forever. A record can be completed while the game has still
     not started; once it has, nothing is ever revised. */
  const existing = S.card[key];
  if(existing){
    /* Nothing about a settled record is ever revisited, whatever the schedule
       still says about the game. A card can be marked final while MLB has yet to
       flip the fixture's status, and the top-ups below would then overwrite
       results that had already been graded. */
    if(existing.hs != null) return;
    let filled = false;
    if(existing.total == null && tot){ existing.total = tot.total; filled = true; }
    const fresh = bats.map(watchOf);
    const cur = watchList(existing);
    const provisional = ws => ws.filter(w => w.tba).length;
    /* Replaced when there are more bats than before, or when the same bats can
       now be scored against a real starter rather than a stand-in. */
    if(fresh.length > cur.length
       || (fresh.length === cur.length && fresh.length > 0
           && provisional(fresh) < provisional(cur))){
      existing.watches = fresh;
      delete existing.watch;
      filled = true;
    }
    if((!existing.ks || !existing.ks.length)){
      const ks = ksFor(g);
      if(ks.length){ existing.ks = ks; filled = true; }
    }
    /* The projection itself is kept current too. The first pass runs before
       loadDetail has fetched starters and bullpens, so what it records is the
       records-only line — measured at up to fourteen points from the number the
       card goes on to show, far enough to favour the other club. Leaving it
       meant the scorecard graded a prediction that was never displayed.

       This is still not revision after the fact: recordPrediction returns at the
       top unless the game is scheduled, and renderPlays only passes it games
       that have not started. First pitch closes the record for good. */
    const shown = calibrate(pr.pHome);
    if(existing.pHome !== pr.pHome || existing.shown !== shown){
      existing.pHome = pr.pHome; existing.shown = shown;
      existing.usedSP = pr.usedSP; existing.usedBP = pr.usedBP;
      filled = true;
    }
    if(filled) S.cardDirty = true;
    return;
  }
  S.card[key] = {
    date:g.date, hid:g.hid, aid:g.aid,
    /* Both numbers. pHome is the model's own output; shown is what the card
       actually put on screen, which is the calibrated one wherever a fit exists.
       The record grades what was shown. */
    pHome:pr.pHome, shown:calibrate(pr.pHome),
    usedSP:pr.usedSP, usedBP:pr.usedBP,
    total:tot ? tot.total : null,
    watches:bats.map(watchOf),
    ks:ksFor(g),
    v:CARD_V,
    at:new Date().toISOString()
  };
  S.cardDirty = true;
}

/* Fill in results for anything recorded but not yet settled. The schedule
   window covers the last two days, which is where yesterday's games are. */
function settleScorecard(){
  let changed = false;

  /* The season's completed games. The four-day schedule window cannot settle a
     prediction older than itself — go away for a week and the whole card orphans
     — so results come from here instead.

     Keyed by MLB's game id, which is what the scorecard itself is keyed by, so
     settlement is exact. The old key was date and club pair, and a doubleheader
     has two ids sharing one of those: both predictions were handed the first
     game's score, and the second game's picks were graded against a result that
     was not theirs.

     The pair key survives as a fallback for any final carrying no id, but only
     where it identifies one game. Where two share it there is nothing to tell
     them apart, so both are left unsettled rather than guessed at. */
  const byPk = {}, byPair = {}, ambiguous = {};
  if(Array.isArray(S.finals))
    for(const f of S.finals){
      if(!f || !f.date || f.hs == null || f.as == null) continue;
      if(f.pk != null) byPk[String(f.pk)] = f;
      const k = f.date + ":" + f.hid + ":" + f.aid;
      if(k in byPair) ambiguous[k] = true; else byPair[k] = f;
    }

  for(const key in S.card){
    const e = S.card[key];
    if(!e || e.hs != null || !e.date) continue;
    const k = e.date + ":" + e.hid + ":" + e.aid;
    const f = byPk[key] || (ambiguous[k] ? null : byPair[k]);
    if(!f) continue;
    e.hs = f.hs; e.as = f.as;
    changed = true;
  }

  for(const g of S.games){
    const e = S.card[String(g.pk)];
    if(!e || e.hs != null) continue;
    if(g.st !== "final" || g.hs == null || g.as == null) continue;
    e.hs = g.hs; e.as = g.as;
    /* What the watched batter actually did. Reported, not graded: the row was
       offered as "this is the bat most likely to matter", never as a claim that
       he would go deep. A fact either way. */
    /* What each starter actually struck out. The box score carries it, and it is
       a plain count against a plain projection. */
    if(Array.isArray(e.ks)){
      for(const k of e.ks){
        if(k.actual != null) continue;
        /* Scoped to this game, so absence now means he was not in it — but the
           live poll only ever captured games it happened to watch, so a missing
           line here is as likely to mean "never polled" as "never pitched".
           Grading yes, scratch verdicts no; those come from the box score
           fetched deliberately in settlePicksFromBox. */
        const b = S.box[boxKey(g.pk, k.pid)];
        if(pitchedIn(b) && b.pK != null) k.actual = b.pK;
      }
    }
    for(const w of watchList(e)){
      if(w.result || w.dnp || w.id == null) continue;
      const b = S.box[boxKey(g.pk, w.id)];
      if(!b) continue;                          // never polled; not evidence of anything
      if(!battedIn(b)){ w.dnp = true; continue; }
      w.result = { hr:b.todayHr != null ? b.todayHr : null,
        h:b.batH != null ? b.batH : null, r:b.batR != null ? b.batR : null,
        line:b.today || null };
    }
    changed = true;
  }
  if(changed){ S.cardDirty = true; saveScorecard(); }
}

/* A pick can only be graded from the box score of the game it was made on, and
   the live poll stops the moment a game ends. So the watched batter's result and
   the starters' strikeout counts were never arriving: the window in which they
   could be captured was only while the game was live and the app was open.

   This closes it. For any finished game whose picks are still unresolved, fetch
   that game's box score once and grade them. A few at a time, and each key is
   claimed so a failed fetch is not retried forever. */
/* Predictions written before the batter id was stored carry only a name and a
   club. That was enough to leave them permanently ungradeable — the settlement
   looks a player up by id. The club's hitter list has both, so the id can be
   recovered rather than the record written off. */
function repairWatchId(e){
  for(const w of watchList(e)){
    if(w.id != null || !w.name || !w.team) continue;
    const roster = S.hitters[w.team];
    if(!Array.isArray(roster)) continue;
    const hit = roster.find(b => b.name === w.name);
    if(hit && hit.id != null){ w.id = hit.id; S.cardDirty = true; }
  }
}

/* Three attempts, not one. The old code claimed a game before the fetch and
   never released it, so a single dropped request — a tunnel, a flaky minute of
   wifi — abandoned that game's picks permanently. Counting instead means a
   transient failure is retried on a later render while a game whose box score
   genuinely has nothing to offer still stops being asked about. */
const BOX_TRIES = 3;

async function settlePicksFromBox(){
  const pending = [];
  for(const key in S.card){
    const e = S.card[key];
    if(!e || e.hs == null) continue;
    repairWatchId(e);
    if((e.boxTries || 0) >= BOX_TRIES) continue;
    const needWatch = watchList(e).some(w => w.id != null && !w.result && !w.dnp);
    const needK = Array.isArray(e.ks)
      && e.ks.some(k => k.actual == null && !k.scratched);
    if(needWatch || needK) pending.push(key);
  }
  if(!pending.length) return;

  let changed = false;
  for(const key of pending.slice(0, 6)){
    const e = S.card[key];
    e.boxTries = (e.boxTries || 0) + 1;
    let j;
    try{ j = await getJSON(MLB + "/game/" + key + "/boxscore"); }
    catch(err){ changed = true; continue; }   // the attempt count is worth saving
    /* It answered, so whatever it says is final: anything still ungraded below
       is absent from the game rather than unreachable. */
    e.boxTries = BOX_TRIES;
    const box = readBoxscore(j);
    if(settleParlayFromBox(key, box)) changed = true;
    for(const w of watchList(e)){
      if(w.id == null || w.result || w.dnp) continue;
      /* This box score is the game's own, so a bat that is not in it, or is in
         it without a plate appearance, did not play. Recorded as such rather
         than failed. */
      const b = box[w.id];
      if(battedIn(b)) w.result = { hr:b.todayHr != null ? b.todayHr : 0,
        h:b.batH != null ? b.batH : 0, r:b.batR != null ? b.batR : 0,
        line:b.today || null };
      else w.dnp = true;
    }
    if(Array.isArray(e.ks)) for(const k of e.ks){
      if(k.actual != null) continue;
      /* This box score is the game's own, so absence is meaningful: a probable
         who is not in it, or is in it without having thrown, did not pitch.
         Recorded as such rather than graded — the projection was for a start
         that never happened, and marking it wrong would say something false
         about the pitcher and about the model. */
      const b = box[k.pid];
      if(pitchedIn(b)){ if(b.pK != null) k.actual = b.pK; }
      else k.scratched = true;
    }
    changed = true;
  }
  if(changed || S.cardDirty){ saveScorecard(); S.cardDirty = false; render(); }
}

/* How long before the record means anything.

   Two figures from the same normal approximation to a coin flip. detectableAt
   is the hit rate that would stand out from chance at the sample you have:
   anything below it is indistinguishable from a run of luck. gamesNeeded runs it
   the other way — the sample at which a given real edge would separate from 50%.

   Both use the 95% two-sided z of 1.96 and the variance of a fair coin, which is
   the widest case and so the conservative one. The point is not the exact
   number; it is that "too few to mean much yet" has a size, and the size is
   larger than it feels. */
const detectableAt = n => n > 0 ? 0.5 + 1.96 * Math.sqrt(0.25 / n) : null;
const gamesNeeded = p => {
  const edge = Math.abs(p - 0.5);
  if(edge < 1e-6) return Infinity;
  return Math.ceil(Math.pow(1.96, 2) * 0.25 / (edge * edge));
};

/* What the card put on screen, which is what the record grades. Entries written
   before build 81 stored only the model's raw number, so that is the fallback. */
const gradedP = e => e.shown != null ? e.shown : e.pHome;

/* The record so far, over settled games only.

   A drawn game has no side to be right about, so it sits out the side record —
   but its bats and its starters are gradeable like anyone else's, and used to be
   dropped from every tally while still drawing rows on screen. Sides are counted
   over the games that could be called; everything else over all of them. */
function scorecardSummary(){
  const settled = Object.values(S.card).filter(e => e.hs != null);
  if(!settled.length) return null;
  const called = settled.filter(e => e.hs !== e.as);

  let right = 0, brier = 0, baseBrier = 0, high = 0, highRight = 0;
  for(const e of called){
    const p = gradedP(e);
    const homeWon = e.hs > e.as;
    const conf = Math.max(p, 1 - p);
    const hit = (p > 0.5) === homeWon;
    if(hit) right++;
    /* The picks it leaned on, which is where a model earns its keep. The
       threshold is 55 rather than 60 because the calibration told the model to
       regress team records hard, and it now rarely exceeds 60 at all — a bar it
       almost never clears measures nothing. */
    if(conf >= CONF_BAR){ high++; if(hit) highRight++; }
    brier += Math.pow(p - (homeWon ? 1 : 0), 2);
    /* Scored against the same games, so the comparison is like for like. */
    baseBrier += Math.pow(HOME_BASE - (homeWon ? 1 : 0), 2);
  }

  let absErr = 0, totN = 0, watchN = 0, watchHr = 0, kN = 0, kErr = 0, kBias = 0;
  let watchExp = 0, watchVar = 0, watchExpN = 0, watchHrP = 0, watchDnp = 0;
  let hitN = 0, hitGot = 0, hitExp = 0, runN = 0, runGot = 0, runExp = 0;
  for(const e of settled){
    if(e.total != null){ absErr += Math.abs(e.total - (e.hs + e.as)); totN++; }
    for(const w of watchList(e)){
      if(w.dnp){ watchDnp++; continue; }
      if(!w.result) continue;
      watchN++; if(w.result.hr > 0) watchHr++;
      /* Each pick carried its own chance of a homer, so the expectation is the
         sum of them rather than a single league rate — and the variance comes
         from the same place, which is what makes "unlucky" measurable. */
      if(w.p != null){
        watchExp += w.p; watchVar += w.p * (1 - w.p); watchExpN++;
        if(w.result.hr > 0) watchHrP++;
      }
      /* Hits and runs, counted the same way and against the same kind of bar. */
      if(w.pHit != null && w.result.h != null){
        hitN++; hitExp += w.pHit; if(w.result.h > 0) hitGot++;
      }
      if(w.pRun != null && w.result.r != null){
        runN++; runExp += w.pRun; if(w.result.r > 0) runGot++;
      }
    }
    if(Array.isArray(e.ks)) for(const k of e.ks){
      if(k.actual == null) continue;
      kN++; kErr += Math.abs(k.exp - k.actual); kBias += k.exp - k.actual;
    }
  }
  const n = called.length;
  return { n, drawn:settled.length - n, right,
           acc:n ? right / n : null, brier:n ? brier / n : null,
           baseBrier:n ? baseBrier / n : null,
           runMAE:totN ? absErr / totN : null, totN,
           watchN, watchHr, watchExp, watchExpN, watchHrP, watchDnp,
           hitN, hitGot, hitExp, runN, runGot, runExp,
           watchSd:watchVar > 0 ? Math.sqrt(watchVar) : null,
           high, highRight,
           kN, kMAE:kN ? kErr / kN : null, kBias:kN ? kBias / kN : null };
}

/* ---------------- projected total ----------------
   A run estimate, not a betting line. Each side's expectation is the midpoint
   of what it scores and what its opponent allows, then shifted by how the
   starter compares to the league — scaled to the share of a game a starter
   covers, about six innings of nine.

   There is deliberately no over/under here. That word only means something
   against a book's number, and this app has no source for one. What follows is
   a projection you can compare to a line yourself. */
const SP_SHARE = 0.6;

function teamRuns(id){
  const r = S.runs[id];
  return r && r.g > 0 ? { rs:r.rs / r.g, ra:r.ra / r.g, g:r.g } : null;
}
function leagueRunsPerGame(){
  let rs = 0, g = 0;
  for(const k in S.runs){ rs += S.runs[k].rs; g += S.runs[k].g; }
  return g > 0 ? rs / g : null;
}

function projectTotal(g){
  const h = teamRuns(g.hid), a = teamRuns(g.aid), lg = leagueRunsPerGame();
  if(!h || !a || !lg) return null;
  let expH = (h.rs + a.ra) / 2, expA = (a.rs + h.ra) / 2;
  const hEra = starterEra(S.pitchers[g.hProbId]);
  const aEra = starterEra(S.pitchers[g.aProbId]);
  let usedSP = false;
  if(hEra != null && aEra != null){
    expH += SP_SHARE * (aEra - lg);      // the arm you face, not your own
    expA += SP_SHARE * (hEra - lg);
    usedSP = true;
  }
  /* Where it is being played. Both sides are scaled by the same factor, since a
     park that suppresses runs suppresses them for whoever is batting. */
  const park = parkOf(g.hid);
  expH *= park; expA *= park;
  /* Then pulled toward the point the season says it is unbiased at. The split
     between the two sides is left alone — only the total's spread was measured,
     so only the total's spread is corrected. */
  const sh = runShrink();
  let shrunk = false;
  if(sh){
    const raw = expH + expA;
    const adj = sh.inter + sh.slope * raw;
    if(raw > 0 && adj > 0){ const f = adj / raw; expH *= f; expA *= f; shrunk = true; }
  }
  expH = Math.max(1, expH); expA = Math.max(1, expA);
  /* Round the two sides first and derive the total from them, so the card
     never shows parts that fail to add up to the whole. */
  const h1 = Math.round(expH * 10) / 10, a1 = Math.round(expA * 10) / 10;
  return { home:h1, away:a1, total:Math.round((h1 + a1) * 10) / 10, usedSP, lg,
           park:park === 1 ? null : park, shrunk };
}

/* A starter's strikeout total tonight: his rate per nine, over the innings he
   typically goes, adjusted for how often the lineup he faces strikes out
   relative to the league. Every input is measured — his K/9 and innings from his
   own season, the lineup's rate from the same hitting data — so the only
   judgement is the shape of the formula. */
function projectStrikeouts(pid, oppTeamId){
  const p = S.pitchers[pid];
  if(!p || p.k9 == null || !p.ip || !p.gs || p.gs < 3) return null;
  const ipPerStart = p.ip / p.gs;
  if(ipPerStart < 2) return null;                 // not really a starter
  let mult = 1;
  const opp = S.teamBat[oppTeamId];
  const lgK = leagueKRate();
  if(opp && lgK) mult = opp.kRate / lgK;
  return { exp:(p.k9 / 9) * ipPerStart * mult, k9:p.k9, ip:ipPerStart,
           oppKRate:opp ? opp.kRate : null };
}

/* League strikeout rate, from the same team figures. */
function leagueKRate(){
  let k = 0, n = 0;
  for(const key in S.teamBat){ k += S.teamBat[key].kRate; n++; }
  return n ? k / n : null;
}

/* The bat most likely to matter: best home run rate against the most
   homer-prone arm on the card. An observation about who is involved, not a
   prediction that it happens. */
/* The last five games counted four times over against the season total. Enough
   that a hot bat overtakes a similar one who has gone quiet, not enough that a
   genuinely elite rate loses to three good nights. Twenty at-bats is a small
   sample and this treats it like one. */
const WATCH_RECENCY = 4;

function watchRate(b){
  const base = b.perPA > 0 ? 1 / b.perPA : 0;
  const f = S.hitterForm[b.id];
  const ab = f && Number(f.ab) > 0 ? Number(f.ab) : 0;
  const hr = f && Number(f.hr) >= 0 ? Number(f.hr) : null;
  if(!ab || hr == null || !isFinite(hr)) return { rate:base, form:null };
  const rate = (b.hr + WATCH_RECENCY * hr) / (b.pa + WATCH_RECENCY * ab);
  return isFinite(rate) && rate >= 0 ? { rate, form:f } : { rate:base, form:null };
}

/* Which game of a repeated matchup this is. When two clubs meet twice on one
   day — a doubleheader, usually a postponement being made up — the inputs
   barely move, so the same bat wins both times and the second card tells you
   nothing you did not already know. Naming the next-best bat instead gives two
   real names rather than one repeated. */
function matchupIndex(g){
  const same = S.games.filter(x =>
    x.date === g.date
    && ((x.hid === g.hid && x.aid === g.aid) || (x.hid === g.aid && x.aid === g.hid)));
  if(same.length < 2) return 0;
  same.sort((a, b) => new Date(a.start) - new Date(b.start));
  const i = same.findIndex(x => x.pk === g.pk);
  return i < 0 ? 0 : i;
}

/* One bat per club. A single name across both lineups meant half of every card
   went unmentioned — the bat you were watching for was as likely as not on the
   other side. Each club now gets its best home run rate weighed against the
   HR/9 of the arm it actually faces.

   The doubleheader rule survives, applied per club: the second game of a
   repeated matchup takes each side's second name rather than repeating the
   first. */
/* How far the opposing starter alone may move a bat's chance, either way. A
   full season of HR/9 is a real measurement, but it is measured in his park and
   behind his fielders, so it is not all his — 40% is generous without being
   credulous. */
const ARM_SWING = 0.4;

/* A hitter does not face one pitcher, he faces two thirds of a starter and a
   third of a bullpen. The bat pick has always used the starter's HR/9 alone,
   which flatters a lineup facing a homer-prone starter in front of a good pen and
   punishes the reverse.

   Two thirds and a third, because a starter covers about 5.4 of nine innings.
   Nothing here is fitted; the split is the same arithmetic already used to set
   BP_WEIGHT, and it applies to a rate the app measures on both sides. */
const BP_PA_SHARE = 1 / 3;

function facedHr9(starterHr9, oppTeamId){
  const bp = S.bullpens[oppTeamId];
  const pen = bp && bp.hr9 != null ? bp.hr9 : null;
  if(starterHr9 == null) return pen;
  if(pen == null) return starterHr9;
  return (1 - BP_PA_SHARE) * starterHr9 + BP_PA_SHARE * pen;
}

/* The league reference the arm multiplier is measured against, blended the same
   way, so a starter-only league figure is not compared with a blended one. */
function leagueFacedHr9(){
  const sp = leagueHr9();
  if(sp == null) return null;
  return S.bpLgHr9 == null ? sp
    : (1 - BP_PA_SHARE) * sp + BP_PA_SHARE * S.bpLgHr9;
}

/* Clubs with no bat pick because a posted lineup contains none of the hitters the
   app has a home run rate for.

   I had intended to fall back to the unfiltered list here, and on writing it that
   was plainly wrong: naming a man the lineup card says is not playing produces a
   pick guaranteed to void, and the parlay would have taken it as a leg. Losing
   the pick is the correct behaviour. Losing it silently was not. */
function batPickGaps(g){
  const out = [];
  for(const teamId of [g.aid, g.hid]){
    const lu = lineupIds(g, teamId);
    if(!lu) continue;
    const rated = (S.hitters[teamId] || []).filter(b => b.perPA);
    if(!rated.length) continue;          // nothing rated at all: a different gap
    if(!rated.some(b => lu.indexOf(b.id) >= 0)) out.push(teamId);
  }
  return out;
}

/* The one thing that can tell two team-mates apart on a given night.

   Everything else the bat pick weighs — the opposing starter, the bullpen behind
   him, the park, the wind, the air — is common to a whole lineup. So the ranking
   within a club came down to season home run rate, which barely moves, and the
   same name was named every day. Handedness is different: it varies by batter and
   by which arm happens to be starting, so the club's best right-handed bat can
   genuinely overtake its best left-handed one when a lefty is on the mound.

   The direction is not in dispute; the size is a judgement, and this is roughly
   half of the published splits, damped for the same reason SP_WEIGHT is. Left
   handers gain more from the advantage than right handers lose from its absence,
   so the two sides are not mirrored — and at the league's rough mix of hands the
   four cases average to 1.00, so this shifts the ranking without inflating
   anyone's stated chance. */
const PLATOON_SWING = 0.12;

/* How many bats each club gets on the card. */
const WATCH_PER_CLUB = 2;

/* The swing is for power. Contact platoon splits are roughly half the size —
   a batting average moves about twenty points across the handedness matchup
   where a home run rate moves a fifth — so hits and runs pass a smaller scale
   rather than reusing the homer figure, which would have overstated them. */
const CONTACT_PLATOON = 0.5;

function platoonMult(batSide, pitchHand, scaleBy){
  if(!batSide || !pitchHand) return 1;
  const swing = PLATOON_SWING * (scaleBy == null ? 1 : scaleBy);
  if(batSide === "S") return 1 + swing * 0.25;   // always takes the better side
  const scale = batSide === "L" ? 1 : 0.75;
  return 1 + (batSide !== pitchHand ? swing : -swing) * scale;
}

/* Who is actually in the lineup, when MLB has published it. */
function lineupIds(g, teamId){
  const lu = g && g.lineup;
  if(!lu) return null;
  const arr = teamId === g.hid ? lu.home : teamId === g.aid ? lu.away : null;
  return Array.isArray(arr) && arr.length ? arr : null;
}

/* The league's opponent batting average among the starters on file, so a hit
   projection is measured against the same population its arm comes from. */
function leagueOppAvg(){
  let sum = 0, n = 0;
  for(const key in S.pitchers){
    const v = parseFloat((S.pitchers[key] || {}).oppAvg);
    if(isFinite(v) && v > 0){ sum += v; n++; }
  }
  return n >= 5 ? sum / n : null;
}

/* League HR/9 among the starters on file, innings-weighted so a long reliever
   with nine innings does not count for as much as a starter with a hundred and
   forty. Stands in for a probable who has not been announced. */
function leagueHr9(){
  let hr = 0, ip = 0;
  for(const key in S.pitchers){
    const p = S.pitchers[key];
    if(p.hr9 == null || !p.ip) continue;
    hr += p.hr9 * p.ip / 9;
    ip += p.ip;
  }
  return ip > 0 ? 9 * hr / ip : null;
}

function bestBats(g){
  const n = matchupIndex(g);
  /* Common to the whole ballpark, so this does not change which bat is picked
     within a game — both clubs stand in the same air. What it changes is how
     likely the pick is to pay off, and so the bar the record grades it against:
     a bat at Coors with the wind out is not the same bet as the same bat in a
     San Francisco marine layer, and scoring them against one number was wrong. */
  const cond = hrConditions(g);
  const forClub = (batTeam, oppPid, oppTeam) => {
    const p = S.pitchers[oppPid];
    /* The opposing starter's HR/9 multiplies every bat in that lineup by the
       same amount, so it has no say in which one is named — only in how likely
       he is to go deep. A probable who has not been posted therefore cost the
       whole club its pick for no reason: a lineup facing an unnamed arm still
       has a most dangerous bat. The league's starters stand in until the real
       one is announced, and the row says as much. */
    const known = !!(p && p.hr9 != null);
    const spHr9 = known ? p.hr9 : leagueHr9();
    /* What he will actually see tonight: this starter, plus the relief behind
       him. Relief is a season figure and the same every night, which is exactly
       why it belongs here — it is information about the opponent the batter's own
       rate knows nothing about. */
    const hr9 = facedHr9(spHr9, oppTeam);
    const penHr9 = (S.bullpens[oppTeam] || {}).hr9;
    /* An array, not null. forClub used to return a single pick or null and the
       caller filtered; it now returns a list and the caller concatenates, and
       this exit was missed in that change — so on the first open of the Plays
       tab, before any pitcher or bullpen had loaded, bestBats threw on
       null.concat and took the whole render with it. The tab could not be
       opened at all, because S.tab was set before the render that failed. */
    if(hr9 == null) return [];
    /* Once MLB posts the lineup, only men actually in it are eligible. Before
       that the pick is made blind, as it always was, and says so. */
    const lu = lineupIds(g, batTeam);
    /* The whole pool, not the first eight of it. The stored array is ordered by
       home run total for the display above; slicing it here threw away exactly
       the high-rate bats the union was widened to include. */
    const pool = (S.hitters[batTeam] || [])
      .filter(b => !lu || lu.indexOf(b.id) >= 0);
    const ranked = [];
    for(const b of pool){
      if(!b.perPA) continue;
      const r = watchRate(b);
      const side = S.bats[b.id] || null;
      const hand = known ? p.hand : null;
      const plat = platoonMult(side, hand);
      const platC = platoonMult(side, hand, CONTACT_PLATOON);
