/* The model says 60%; the record says those win 54%. Rather than leave that
   gap in a table nobody re-reads, fit it and apply it.

   Platt scaling: find a and b such that mapping the raw probability through
   sigmoid(a * logit(p) + b) best matches what actually happened. An a below 1
   means the model is overconfident, and the mapping pulls every number toward
   even by exactly as much as the season says it should be pulled.

   Fitted on the same games it is scored against, which is mild overfitting —
   negligible with two parameters over a thousand games, but worth stating. */
function fitCalibration(preds, min){
  if(!preds || preds.length < (min == null ? 200 : min)) return null;
  let a = 1, b = 0;
  const lr = 0.3;
  for(let iter = 0; iter < 600; iter++){
    let ga = 0, gb = 0;
    for(const q of preds){
      const p = Math.min(0.999, Math.max(0.001, q.p));
      const x = Math.log(p / (1 - p));
      const pred = 1 / (1 + Math.exp(-(a * x + b)));
      const err = pred - (q.homeWon ? 1 : 0);
      ga += err * x; gb += err;
    }
    a -= lr * ga / preds.length;
    b -= lr * gb / preds.length;
  }
  if(!isFinite(a) || !isFinite(b) || a <= 0) return null;   // diverged
  return { a, b, n:preds.length };
}

/* Applying a given fit to games it never saw.

   The fit above is trained on the same games it is scored against, which the
   caveat has always admitted. This splits the season: the first four fifths
   train, the last fifth is held back and scored cold. If the mapping is real it
   improves the held-out Brier; if it were only memorising, it would not.

   The split is chronological rather than random, because a random one would let
   the fit see games from either side of every held-out date — which for a model
   built on a running season record is a subtler form of the same leak. */
const HOLDOUT = 0.2;

function scoreWith(fit, preds){
  if(!fit || !preds || !preds.length) return null;
  const map = p => {
    const q = Math.min(0.999, Math.max(0.001, p));
    const x = Math.log(q / (1 - q));
    return 1 / (1 + Math.exp(-(fit.a * x + fit.b)));
  };
  let raw = 0, cal = 0;
  for(const q of preds){
    const y = q.homeWon ? 1 : 0;
    raw += Math.pow(q.p - y, 2);
    cal += Math.pow(map(q.p) - y, 2);
  }
  return { n:preds.length, raw:raw / preds.length, cal:cal / preds.length };
}

function holdoutCheck(preds){
  if(!preds || preds.length < 400) return null;
  const cut = Math.floor(preds.length * (1 - HOLDOUT));
  const fit = fitCalibration(preds.slice(0, cut));
  if(!fit) return null;
  const out = scoreWith(fit, preds.slice(cut));
  return out ? Object.assign({ fit, trained:cut }, out) : null;
}

/* ---------------- the bat number, against what happened ----------------
   The homer picks came in 2.5 sigma under their own expectation over 162 graded
   picks — 24 against 37.2, a stated rate about 0.6 of the real one. That is too
   far out to be a bad run, and the cause is structural: the pick is the largest
   of eight noisy rates, and the largest of several noisy estimates is biased
   upward by construction. Nothing in watchRate regresses against that, and the
   last five games are weighted four times over on a twenty-plate-appearance
   sample, which hands the bat that happened to run hot an extra push.

   Rather than guess a shrink, this measures one. Every settled pick carries the
   probability it was given and whether he homered, so the same Platt mapping the
   side model uses is fitted to them. Sixty picks is the floor — below that the
   correction would be noisier than the thing it corrects.

   It refits as the record grows, so if the underlying pick improves the
   correction shrinks toward doing nothing on its own. */
const BAT_FIT_MIN = 60;

/* The three markets, and where each one's stated chance and outcome live. */
const MARKETS = {
  hr:  { field:"p",    got:r => r.hr > 0, label:"homered" },
  hit: { field:"pHit", got:r => r.h  > 0, label:"got a hit" },
  run: { field:"pRun", got:r => r.r  > 0, label:"scored" }
};

function batPreds(market){
  const m = MARKETS[market] || MARKETS.hr;
  const out = [];
  for(const key in S.card){
    const e = S.card[key];
    if(!e || e.hs == null) continue;
    for(const w of watchList(e)){
      if(!w.result || w.dnp) continue;
      const p = w[m.field];
      if(p == null) continue;
      const got = m.got(w.result);
      if(got == null) continue;
      out.push({ p, homeWon:!!got });
    }
  }
  return out;
}

/* One fit per market, refitted when its record grows. Hits and runs get the same
   treatment as homers on principle, though only the homer market has yet shown a
   bias large enough to need it — if the others turn out well calibrated their
   mappings will sit near the identity and do nothing. */
function marketFit(market){
  const preds = batPreds(market);
  S.batFitN = S.batFitN || {};
  S.batFit = S.batFit || {};
  if(preds.length !== S.batFitN[market]){
    S.batFitN[market] = preds.length;
    S.batFit[market] = fitCalibration(preds, BAT_FIT_MIN);
  }
  return S.batFit[market];
}

const batFit = () => marketFit("hr");

function calibrateMarket(market, p){
  const f = marketFit(market);
  if(!f || p == null || !isFinite(p)) return p;
  if(!isFinite(f.a) || !isFinite(f.b) || f.a <= 0) return p;
  const q = Math.min(0.999, Math.max(0.001, p));
  const out = 1 / (1 + Math.exp(-(f.a * Math.log(q / (1 - q)) + f.b)));
  return isFinite(out) ? out : p;
}

function calibrateBat(p){
  const f = batFit();
  if(!f || p == null || !isFinite(p)) return p;
  if(!isFinite(f.a) || !isFinite(f.b) || f.a <= 0) return p;
  const q = Math.min(0.999, Math.max(0.001, p));
  const out = 1 / (1 + Math.exp(-(f.a * Math.log(q / (1 - q)) + f.b)));
  return isFinite(out) ? out : p;
}

/* Apply it, when one has been fitted and shown to help.

   It used to apply on the strength of having been fitted at all. Over 1,346
   games the model improved to the point where there was nothing left to correct
   — slope 1.08, essentially the identity, with the raw bands already honest at
   50-55% -> 51% and 55-60% -> 58% — and the held-out test turned against it:
   0.2440 calibrated against 0.2437 raw. The app was applying a correction its
   own out-of-sample check rejected.

   So the gate is the held-out result, not the existence of a fit. No held-out
   result means no mapping either: an untested correction is not better than
   none, and this is the one place in the app where that had been assumed. */
function calibrate(p){
  const f = S.calFit;
  if(!f || p == null || !isFinite(p)) return p;
  if(!S.calOut || !(S.calOut.cal < S.calOut.raw)) return p;
  /* A malformed fit would turn every probability on every card into NaN, so it
     is checked rather than trusted. A non-positive slope would also invert the
     model, which no amount of miscalibration justifies. */
  if(!isFinite(f.a) || !isFinite(f.b) || f.a <= 0) return p;
  const q = Math.min(0.999, Math.max(0.001, p));
  const x = Math.log(q / (1 - q));
  const out = 1 / (1 + Math.exp(-(f.a * x + f.b)));
  return isFinite(out) ? out : p;
}

/* A search over the two weights that matter, now that there is a measure to
   search against. Sixteen replays of the season, which is fast because the data
   is already in memory. This is the difference between a constant I chose and
   one the season chose. */
function sweep(){
  const regressions = [40, 80, 160, 400, 4000];   // 4000 all but ignores records
  const weights = [0, 0.10, 0.15, 0.20, 0.30];
  let best = null;
  const rows = [];
  for(const py of [false, true]){
    for(const r of regressions){
      for(const w of weights){
        const res = backtest(0, w > 0, r, w, py);
        if(!res) continue;
        rows.push({ regress:r, spWeight:w, pyth:py, brier:res.brier, n:res.n });
        if(!best || res.brier < best.brier) best = rows[rows.length - 1];
      }
    }
  }
  return { rows, best };
}

/* The calibration table, on demand because it replays 1,500 games. */
function calibrationBlock(){
  if(!S.cal){
    return '<div class="method"><h4>Has any of this been right?</h4>'
      + '<p>Nothing in this model has been checked against a result. Every weight in it '
      + 'was reasoned rather than fitted. This replays it over every completed game of the '
      + 'season, rebuilding each club\'s record as it stood beforehand, and reports what '
      + 'happened.</p>'
      + '<div class="mrow"><span>' + (S.finals ? S.finals.length.toLocaleString() + ' games available' : 'loading season\u2026')
      + '</span><button class="btn" id="runCal"' + (S.calBusy || !S.finals ? " disabled" : "") + '>'
      + (S.calBusy ? "Replaying\u2026" : "Run the test") + '</button></div></div>';
  }
  const c = S.cal.with, c0 = S.cal.without;
  const better = c.brier < c.baseBrier;
  return '<div class="method cal"><h4>Calibration \u00b7 ' + c.n.toLocaleString() + ' games</h4>'
    + '<div class="calhead"><span>Model said</span><span>Games</span><span>Actual</span></div>'
    + c.bands.map(b => {
        const gap = b.actual - b.said;
        const cls = Math.abs(gap) <= .03 ? "good" : Math.abs(gap) <= .07 ? "fair" : "poor";
        return '<div class="calrow"><span>' + b.label + '%</span>'
          + '<span>' + b.n + '</span>'
          + '<span class="cal-' + cls + '">' + Math.round(b.actual * 100) + '%</span></div>';
      }).join("")
    + '<p>' + (better
        ? 'The model beats a home-field-only baseline: Brier score '
          + c.brier.toFixed(4) + ' against ' + c.baseBrier.toFixed(4) + '. Lower is better.'
        : 'The model does <b>not</b> beat a home-field-only baseline: Brier '
          + c.brier.toFixed(4) + ' against ' + c.baseBrier.toFixed(4) + '. Read the bands '
          + 'above: its most confident calls do no better than its least confident ones. '
          + 'On this evidence records, starters and bullpens are adding nothing you could '
          + 'not get from knowing who is at home.')
      + ' The favourite won ' + Math.round(c.acc * 100) + '% of the time.</p>'
    + (c.runBands && c.runBands.length >= 3
        ? '<h4 class="swhead">Does the run projection rank games?</h4>'
          + '<div class="calhead"><span>Projected</span><span>Games</span><span>Actual</span></div>'
          + c.runBands.map(b => '<div class="calrow"><span>' + b.label + '</span>'
              + '<span>' + b.n + '</span>'
              + '<span>' + b.actual.toFixed(1) + '</span></div>').join("")
          + '<p>' + (() => {
              const lo = c.runBands[0].actual, hi = c.runBands[c.runBands.length - 1].actual;
              const spread = hi - lo;
              return spread > 0.8
                ? 'Games it projects high do score more \u2014 ' + lo.toFixed(1)
                  + ' runs at the bottom against ' + hi.toFixed(1) + ' at the top. So it '
                  + 'ranks games even though it cannot call one, which is why the card shows '
                  + 'it against the league average rather than as a forecast.'
                : 'The actual averages barely move across the bands, so it does not rank '
                  + 'games either. On this evidence the number is not worth showing at all.';
            })() + '</p>'
        : "")
    + '<p>Run projections miss by <b>' + c.runMAE.toFixed(2) + '</b> runs on average. '
      + 'Simply predicting the league average every time misses by '
      + c.naiveMAE.toFixed(2) + '. '
      + (c.runMAE < c.naiveMAE - 0.05
          ? 'So the projection is doing some work.'
          : c.runMAE > c.naiveMAE + 0.05
            ? '<b>So it is worse than a flat guess.</b>'
            : '<b>So it is no better than a flat guess</b> \u2014 game totals are '
              + 'dominated by things no season rate can see.')
      + (Math.abs(c.runBias) < .15 ? ' No meaningful bias.'
          : c.runBias > 0 ? ' It runs ' + c.runBias.toFixed(2) + ' too high.'
                          : ' It runs ' + Math.abs(c.runBias).toFixed(2) + ' too low.')
      + ' The run projection is tested without its starter adjustment, so this is the '
      + 'team-rate half of it only.</p>'
    + (S.cal.withSP && S.cal.withSP.spN > 200
        ? '<p>' + (S.cal.withSP.spN.toLocaleString()) + ' of those games had both starters '
          + 'on file with enough innings to judge. Adding the starter term: Brier '
          + S.cal.withSP.brier.toFixed(4) + ' against ' + c.brier.toFixed(4) + ' without. '
          + (S.cal.withSP.brier < c.brier - 5e-5
              ? '<b>Starters help.</b> That is the piece worth keeping and refining.'
              : S.cal.withSP.brier > c.brier + 5e-5
                ? '<b>Starters make it worse</b> as weighted here \u2014 SP_WEIGHT is too high.'
                : 'No measurable difference, so the starter term is not earning its place '
                  + 'either.') + '</p>'
        : '<p>Starters could not be tested: MLB did not return a probable pitcher for '
          + 'enough completed games, or too few had the innings to judge.</p>')
    + (S.cal.lean && S.cal.homeOnly && S.cal.withSP
        ? (() => {
            const rows = [
              ["home field only", S.cal.homeOnly],
              ["+ records", S.cal.with],
              ["+ starters", S.cal.lean],
              ["+ both", S.cal.withSP]
            ].filter(r => r[1]);
            const best = rows.reduce((b, r) => !b || r[1].brier < b[1].brier ? r : b, null);
            const lean = S.cal.lean.brier, both = S.cal.withSP.brier;
            const recordsWorth = lean - both;
            return '<h4 class="swhead">Are team records earning their place?</h4>'
              + '<div class="calhead"><span>Model</span><span>Games</span>'
                + '<span>Brier</span></div>'
              + rows.map(([lbl, r]) => '<div class="calrow"><span>' + lbl + '</span>'
                  + '<span>' + r.n + '</span>'
                  + '<span class="' + (r === best[1] ? "cal-good" : "") + '">'
                  + r.brier.toFixed(4) + '</span></div>').join("")
              + '<p>Best here is <b>' + best[0] + '</b>. Adding records to the starter '
              + 'model changes Brier by ' + (recordsWorth >= 0 ? "\u2212" : "+")
              + Math.abs(recordsWorth).toFixed(4) + '. '
              + (Math.abs(recordsWorth) < 5e-4
                  ? '<b>That is nothing.</b> A club\u2019s record is doing no measurable '
                    + 'work in this model, and the regression, the recency weighting and '
                    + 'the Pythagorean machinery above it are all decoration. Set '
                    + 'USE_TEAM to false and the model gets simpler at no cost.'
                  : recordsWorth > 0
                    ? 'Records do help, so they stay. The earlier finding that they lost '
                      + 'to the home-field baseline on their own is not the same claim: a '
                      + 'term can be useless alone and useful alongside a better one.'
                    : '<b>Records make it worse</b> once starters are in. Set USE_TEAM to '
                      + 'false.')
              + ' The app currently has records '
              + (USE_TEAM ? '<b>in</b>' : '<b>out</b>') + '.</p>'
              + '<p class="caveat">Bullpens are absent from all four, because testing them '
              + 'would need to know which relievers were available on a given day and '
              + 'nothing here does. So the model the cards actually show is one term '
              + 'richer than the best row above, and that term is untested.</p>';
          })()
        : "")
    + (c.parkMAE != null
        ? '<h4 class="swhead">Does knowing the ballpark help?</h4>'
          + '<div class="calhead"><span>Run projection</span><span>Games</span>'
            + '<span>Off by</span></div>'
          + [["team rates alone", c.runMAE], ["scaled by the park", c.parkMAE]]
            .map(([lbl, v]) => '<div class="calrow"><span>' + lbl + '</span>'
              + '<span>' + c.n + '</span>'
              + '<span class="' + (v <= Math.min(c.runMAE, c.parkMAE) ? "cal-good" : "")
              + '">' + v.toFixed(2) + '</span></div>').join("")
          + '<p>' + (() => {
              const d = c.runMAE - c.parkMAE;
              if(Math.abs(d) < 0.01)
                return 'No measurable difference \u2014 the same answer twice now, over '
                  + 'more than a thousand games each time. The term has been taken out of '
                  + 'the run projection on the strength of it; this comparison stays so '
                  + 'that if the park ever does start to matter, the app will say so. '
                  + 'Either the regression of ' + PARK_REGRESS + ' games damped it into '
                  + 'irrelevance, or run scoring is far more about who is batting than '
                  + 'where.';
              return d > 0
                ? 'The park helps here, by ' + d.toFixed(2) + ' runs a game \u2014 enough '
                  + 'to be worth putting back into the projection, which no longer carries '
                  + 'it.'
                : '<b>The park makes it worse</b>, by ' + Math.abs(d).toFixed(2)
                  + ' runs a game. It is not applied, so nothing needs changing.';
            })() + '</p>'
        : "")
    + (S.cal.rec && S.cal.pyth
        ? '<h4 class="swhead">Record, or run differential?</h4>'
          + '<div class="calhead"><span>Strength from</span><span>Games</span><span>Brier</span></div>'
          + [["win–loss record", S.cal.rec], ["run differential", S.cal.pyth]].map(([lbl, r]) =>
              '<div class="calrow"><span>' + lbl + '</span><span>' + r.n + '</span>'
              + '<span class="' + (r.brier <= Math.min(S.cal.rec.brier, S.cal.pyth.brier)
                  ? "cal-good" : "") + '">' + r.brier.toFixed(4) + '</span></div>').join("")
          + '<p>' + (() => {
              const d = S.cal.rec.brier - S.cal.pyth.brier;
              if(Math.abs(d) < 5e-5)
                return 'No measurable difference. Run differential is not buying anything '
                  + 'here, so the extra machinery is not earning its place.';
              return d > 0
                ? 'Run differential wins, by ' + d.toFixed(4) + '. Two clubs on the same '
                  + 'record are not the same club, and this is the season saying so. '
                  + (USE_PYTH ? 'It is what the cards use.'
                              : '<b>Set USE_PYTH to true.</b>')
                : 'The plain record wins, by ' + Math.abs(d).toFixed(4) + '. '
                  + (USE_PYTH ? '<b>Set USE_PYTH to false</b> \u2014 the cards are currently '
                              + 'using the worse of the two.'
                              : 'It is what the cards use.');
            })() + '</p>'
        : "")
    + (S.calFit
        ? '<h4 class="swhead">The numbers the cards now show</h4>'
          + (S.calOut && !(S.calOut.cal < S.calOut.raw)
              ? '<p><b>The mapping below is fitted but not applied.</b> The held-out test '
                + 'further down rejected it, and the gate is that test rather than the '
                + 'existence of a fit \u2014 so the cards are showing the raw model '
                + 'numbers. It is kept on screen because a later run may reverse this, '
                + 'and because a correction that stopped being needed is worth seeing.</p>'
              : "")
          + '<p>The mapping is: '
          + 'sigmoid(' + S.calFit.a.toFixed(2) + ' \u00d7 logit(p) '
          + (S.calFit.b >= 0 ? '+ ' : '\u2212 ') + Math.abs(S.calFit.b).toFixed(2) + '). '
          + (S.calFit.a < 0.9
              ? 'A slope below 1 means the model was overconfident, so every number is '
                + 'pulled toward even by the amount the season says it should be.'
              : S.calFit.a > 1.1
                ? 'A slope above 1 means the model was underconfident and the numbers are '
                  + 'pushed further from even.'
                : 'A slope near 1 means the raw numbers were about right already.') + '</p>'
          + '<div class="calhead"><span>Model said</span><span>Now shows</span><span></span></div>'
          + [0.52, 0.56, 0.60, 0.66, 0.72].map(p => '<div class="calrow">'
              + '<span>' + Math.round(p * 100) + '%</span>'
              + '<span>' + Math.round(calibrate(p) * 100) + '%</span>'
              + '<span></span></div>').join("")
          + '<p class="caveat">' + (S.calOut
              ? 'Held out: fitted on the first ' + S.calOut.trained.toLocaleString()
                + ' games and scored on the ' + S.calOut.n.toLocaleString()
                + ' after them, which it never saw. Brier ' + S.calOut.cal.toFixed(4)
                + ' calibrated against ' + S.calOut.raw.toFixed(4) + ' raw. '
                + (S.calOut.cal < S.calOut.raw - 5e-5
                    ? 'It helps on games it was not fitted to, which is the test that '
                      + 'matters.'
                    : S.calOut.cal > S.calOut.raw + 5e-5
                      ? '<b>It hurts out of sample.</b> The mapping is fitting noise, and '
                        + 'the raw numbers were better left alone.'
                      : 'No difference out of sample \u2014 the mapping is not doing '
                        + 'anything a fresh game would notice.')
                + ' The mapping applied to the cards is fitted on all '
                + S.calFit.n.toLocaleString() + ' games, since more data makes the '
                + 'estimate itself better; this split is how it is judged, not how it '
                + 'is built.'
              : 'Fitted on the same games it is scored against, and too few of them to '
                + 'hold any back \u2014 so this is not an out-of-sample result.') + '</p>'
        : "")
    + (S.sweep && S.sweep.best
        ? '<h4 class="swhead">What the season would have chosen</h4>'
          + '<p>Searching all three over the same games: the best combination is '
          + '<b>regression ' + S.sweep.best.regress + '</b>, <b>starter weight '
          + S.sweep.best.spWeight.toFixed(2) + '</b> and strength from <b>'
          + (S.sweep.best.pyth ? 'run differential' : 'the win\u2013loss record')
          + '</b>, giving Brier '
          + S.sweep.best.brier.toFixed(4) + '. The app currently uses ' + REGRESS_GAME
          + ', ' + SP_WEIGHT.toFixed(2) + ' and '
          + (USE_PYTH ? 'run differential' : 'the record') + '.'
          + (S.sweep.best.regress > REGRESS_GAME * 2
              ? ' A far higher regression winning means team records deserve <b>less</b> '
                + 'weight than they are getting \u2014 which matches records alone losing '
                + 'to the baseline above.'
              : '')
          + (S.sweep.best.spWeight === 0
              ? ' A starter weight of zero winning would mean starters do not help after '
                + 'all.' : '')
          + '</p>'
          + '<div class="calhead"><span>Regression</span><span>SP wt</span><span>Brier</span></div>'
          + S.sweep.rows.slice().sort((a,b) => a.brier - b.brier).slice(0, 6)
            .map(r => '<div class="calrow"><span>' + r.regress
              + (r.pyth ? ' \u00b7 runs' : ' \u00b7 record') + '</span>'
              + '<span>' + r.spWeight.toFixed(2) + '</span>'
              + '<span class="' + (r === S.sweep.best ? "cal-good" : "") + '">'
              + r.brier.toFixed(4) + '</span></div>').join("")
        : "")
    + (c0 && c0.brier != null
        ? '<p class="caveat">Recent form weighting: Brier ' + c.brier.toFixed(4)
      + ' with it, ' + c0.brier.toFixed(4) + ' without. '
      + (Math.abs(c.brier - c0.brier) < 5e-5
          ? 'Identical to four decimal places \u2014 counting the last ten twice makes '
            + 'no measurable difference at all.'
          : c.brier < c0.brier ? 'Counting the last ten twice helps, marginally.'
            : 'Counting the last ten twice makes it <b>worse</b>. Set RECENCY_W to 0.')
      + ' Bullpens remain untested: there is no historical record of which relievers were '
      + 'available on a given day.</p>'
        : "")
    + '<div class="mrow"><span>'
      + (S.calAt ? 'last run ' + timeAgo(S.calAt) : 'saved from an earlier run')
      + '</span><button class="btn" id="runCal"' + (S.calBusy ? " disabled" : "") + '>'
      + (S.calBusy ? "Replaying\u2026" : "Run it again") + '</button></div>'
    + '</div>';
}

/* The simulated win totals as a band rather than a single number. The axis
   is fixed so the width of one club's band is comparable to another's — a
   contender 100 games in has a narrower spread than a .500 club, and that
   is worth being able to see. */
function rangeBar(o){
  const LO = 50, HI = 115, span = HI - LO;
  const x = w => Math.max(0, Math.min(100, (w - LO) / span * 100));
  const l = x(o.p10), r = x(o.p90), m = x(o.p50);
  return '<div class="rblock">'
    + '<h4 class="ssub">Win total, middle 80% of seasons</h4>'
    + '<div class="rtrack">'
    + '<i class="rband" aria-hidden="true" style="left:' + l + '%;width:' + Math.max(1.5, r - l) + '%"></i>'
    + '<i class="rtick" aria-hidden="true" style="left:' + m + '%"></i>'
    + '</div>'
    + '<div class="rlabels"><span>' + LO + '</span>'
    + '<span class="rmid"><b>' + o.p10 + '\u2013' + o.p90 + '</b> wins, median ' + o.p50 + '</span>'
    + '<span>' + HI + '</span></div></div>';
}

/* ---------------- a player's recent work ----------------

   Opened by tapping a named bat, and only then. The batted-ball detail needs the
   play-by-play for each game he appeared in, which is five to ten requests for
   one man — fine on demand, impossible for the sixty bats the card names. So
   nothing here is fetched until someone asks for it.

   MLB's play-by-play carries a hitData object on batted balls: launch speed,
   launch angle, distance and where it landed. That is Statcast measurement
   arriving through the same free feed the rest of the app uses. I had previously
   told this project it was out of reach, which was wrong — Baseball Savant has no
   public API, and I took that to mean the numbers were unavailable, when the
   league's own play-by-play has been carrying them the whole time.

   Written to expect the field and survive without it: if hitData is absent the
   sheet still lists what he did, just without the speeds. */
async function loadSwings(pid, teamId){
  const key = String(pid);
  if(S.swingData[key]) return S.swingData[key];
  const out = { rows:[], hasHit:false, at:Date.now() };
  /* His club's last games, newest first, capped so a tap cannot become a flood. */
  const mine = (S.finals || []).filter(f => f.hid === teamId || f.aid === teamId)
    .slice().sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 8);
  for(const f of mine){
    let pbp;
    try{ pbp = await getJSON(MLB + "/game/" + f.pk + "/playByPlay"); }
    catch(e){ continue; }
    for(const play of (pbp && pbp.allPlays) || []){
      const bat = (play.matchup || {}).batter || {};
      if(bat.id !== pid) continue;
      const res = play.result || {};
      if(!res.event) continue;
      /* The measured ball is on one of the play's events, not the play itself. */
      let hd = null;
      for(const ev of (play.playEvents || [])) if(ev.hitData) hd = ev.hitData;
      out.rows.push({
        date:f.date, event:res.event,
        speed:hd && hd.launchSpeed != null ? Number(hd.launchSpeed) : null,
        angle:hd && hd.launchAngle != null ? Number(hd.launchAngle) : null,
        dist:hd && hd.totalDistance != null ? Number(hd.totalDistance) : null,
        pitcher:((play.matchup || {}).pitcher || {}).fullName || null
      });
      if(hd) out.hasHit = true;
    }
    if(out.rows.length >= 14) break;
  }
  out.rows = out.rows.slice(0, 14);
  S.swingData[key] = out;
  return out;
}

/* Which of these counts as squared up. Not Statcast's barrel, which has a
   specific definition over a speed-and-angle region this does not reproduce —
   this is the plainer question of whether it was hit hard and in the air, and it
   is labelled as that rather than borrowing a word that means something else. */
const hardHit = r => r.speed != null && r.speed >= 95;
const inAir = r => r.angle != null && r.angle >= 8 && r.angle <= 40;

function playerSheet(){
  const ps = S.player;
  if(!ps) return "";
  const d = S.swingData[String(ps.id)];
  const rows = d ? d.rows : null;

  const chip = r => {
    const hr = /home run/i.test(r.event);
    const hit = hr || /single|double|triple/i.test(r.event);
    return '<div class="swing' + (hr ? " hr" : hit ? " hit" : "") + '">'
      + '<div class="swtop"><span>' + esc(r.date.slice(5)) + '</span></div>'
      + '<div class="swev">' + esc(r.event) + '</div>'
      + (r.speed != null
          ? '<div class="swnum"><b>' + r.speed.toFixed(0) + '</b><span>mph</span>'
            + (r.angle != null ? '<i>' + (r.angle > 0 ? "+" : "") + r.angle.toFixed(0)
                + '\u00b0</i>' : "")
            + (r.dist != null && hr ? '<i>' + r.dist.toFixed(0) + ' ft</i>' : "")
            + '</div>'
          : '<div class="swnum dim"><span>no measurement</span></div>')
      + '</div>';
  };

  let body;
  if(!d) body = '<p class="load">Reading his last games\u2026</p>';
  else if(!rows.length) body = '<p class="note">No plate appearances found in his '
    + 'club\u2019s recent games. He may not have played, or the play-by-play for those '
    + 'games is not available.</p>';
  else {
    const measured = rows.filter(r => r.speed != null);
    const hard = measured.filter(hardHit).length;
    const air = measured.filter(r => hardHit(r) && inAir(r)).length;
    body = (measured.length
        ? '<div class="stats">'
          + '<div><b>' + rows.length + '</b><span>plate appearances</span></div>'
          + '<div><b>' + hard + '</b><span>hit 95+ mph</span></div>'
          + '<div><b>' + air + '</b><span>hard and in the air</span></div></div>'
          + '<p class="note">Over ' + measured.length + ' measured balls, which is far too '
          + 'few to read as a rate. This is what he did, not what he does \u2014 it plays no '
          + 'part in any pick on the card.</p>'
        : "")
      + '<div class="swings">' + rows.map(chip).join("") + '</div>';
  }

  return '<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"'
    + ' tabindex="-1" aria-label="' + esc(ps.name) + ' recent work">'
    + '<div class="shandle"></div>'
    + '<header class="shead" style="border-color:' + col(ps.team) + '"><div>'
    + '<p class="eyebrow tight">' + esc(ab(ps.team)) + ' \u00b7 recent work</p>'
    + '<h3>' + esc(ps.name) + '</h3></div>'
    + '<button class="x" id="closeSheet" aria-label="Close">\u2715</button></header>'
    + body + '</div></div>';
}

  const lead = rows[0], p = pictureOf(d[0]), cut = p.wilds[p.wilds.length-1];
  const done = S.games.filter(g => (g.hid===id||g.aid===id) && (g.st==="final"||g.st==="live"));
  const next = S.games.filter(g => (g.hid===id||g.aid===id) && g.st==="sched");
  const ord = ["","1st","2nd","3rd","4th","5th"][rank] || rank + "th";

  return '<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"'
    + ' tabindex="-1" aria-label="'
    + esc(nm(id)) + ' outlook"><div class="shandle"></div>'
    + '<header class="shead" style="border-color:' + col(id) + '"><div>'
    + '<p class="eyebrow tight">' + d[0] + " " + d[1] + " · " + ord + '</p>'
    + '<h3>' + esc((city(id) ? city(id) + " " : "") + nm(id)) + '</h3></div>'
    + '<button class="x" id="closeSheet" aria-label="Close">✕</button></header>'
    + '<div class="stats"><div><b>' + t.w + "–" + t.l + '</b><span>record</span></div>'
    + '<div><b>' + fmt3(pct(t)) + '</b><span>win rate</span></div>'
    + '<div><b>' + left(t) + '</b><span>games left</span></div></div>'
    + '<div class="stats"><div><b>' + gbText(gbTo(t,lead)) + '</b><span>gb division</span></div>'
    + '<div><b>' + (cut && cut.id === id ? "—" : gbText(gbTo(t,cut||lead))) + '</b><span>gb cutline</span></div>'
    + '<div><b>' + (t.streak || "—") + '</b><span>streak</span></div></div>'
    /* The record, the race and the recent games all stand on their own. Only
       these three cells and the band below need a simulation, so a sheet opened
       without one shows dashes rather than nothing. */
    + '<div class="stats"><div><b>' + (o ? Math.round(o.projWins) : "\u2014")
      + '</b><span>projected wins</span></div>'
    + '<div><b>' + (o ? pc(o.div) + '%' : "\u2014") + '</b><span>win division</span></div>'
    + '<div><b>' + (o ? pc(o.berth) + '%' : "\u2014") + '</b><span>reach october</span></div></div>'
    + (o ? rangeBar(o) : "")
    + '<p class="racenote">' + raceSentence(t) + '</p>'
    + (o ? '<div class="swing">' + (S.swing != null
        ? '<p>One win instead of one loss moves ' + ab(id) + '\u2019s October odds by <b>'
          + (S.swing*100).toFixed(1) + ' points</b>. Every remaining game carries roughly this much.</p>'
        : '<button class="btn wide" id="measure"' + (S.swingBusy?" disabled":"") + '>'
          + (S.swingBusy ? "Simulating…" : "What is one game worth?") + '</button>') + '</div>'
      : "")
    + '<h4 class="ssub">Recent</h4><ul class="slist">'
    + (done.length ? done.map(g => {
        const home = g.hid === id, mine = home ? g.hs : g.as, theirs = home ? g.as : g.hs;
        const opp = home ? g.aid : g.hid, live = g.st === "live";
        return '<li><span class="res ' + (live ? "n" : mine > theirs ? "w" : "l") + '">'
          + (live ? "•" : mine > theirs ? "W" : "L") + '</span>'
          + '<span class="opp">' + (home ? "vs " : "at ") + ab(opp) + '</span>'
          + '<span class="line">' + mine + "–" + theirs + '</span>'
          + '<span class="when">' + (live ? inningText(g) : dayName(g.start)) + '</span></li>';
      }).join("") : '<li class="empty">Nothing in this window yet.</li>')
    + '</ul>'
    + (next.length ? '<h4 class="ssub">Next up</h4><ul class="slist">' + next.map(g =>
        '<li><span class="res n">→</span><span class="opp">'
        + (g.hid === id ? "vs " : "at ") + ab(g.hid === id ? g.aid : g.hid) + '</span>'
        + '<span class="line"></span><span class="when">' + dayName(g.start) + " " + clock(g.start)
        + '</span></li>').join("") + '</ul>' : "")
    + '</div></div>';
}

/* Rebuilding the whole page loses the scroll position, which is right when
   the view changes and wrong for everything else — expanding a card, or a
   background refresh, should leave you where you were. Pass true only when
   a genuinely new view is being shown.

   It also destroys focus, which matters more: the app refreshes itself every
   30 seconds during games, so anyone navigating by keyboard was being thrown
   back to the top of the document twice a minute. Focus is captured by a
   stable attribute and restored after the swap. */
function focusKey(el){
  if(!el || el === document.body || !el.getAttribute) return null;
  if(el.id) return "#" + el.id;
  for(const a of ["data-tab","data-lg","data-team","data-follow","data-toggle"]){
    const v = el.getAttribute(a);
    if(v != null) return "[" + a + '="' + v + '"]';
  }
  return null;
}

/* One block per upcoming game: which side the model prefers, how many runs it
   projects, and the standout matchup. All three are this app's own output. */
function cardBlock(g){
  const pr = project(g), tot = projectTotal(g), bats = bestBats(g);
  if(!pr) return "";
  /* Displayed odds are the calibrated ones where a fit exists: the number the
     season says this model's confidence is actually worth. */
  const cHome = calibrate(pr.pHome);
  const favId = cHome >= 0.5 ? g.hid : g.aid;
  const favP = Math.max(cHome, 1 - cHome);
  const rawP = Math.max(pr.pHome, pr.pAway);
  const shifted = S.calFit && Math.abs(favP - rawP) >= 0.01;
  const wx = wxAt(g.venueId, g.start);
  const v = S.venues[g.venueId];
  const rel = wx ? windRelative(wx.dir, cfBearing((v && v.name) || g.venue)) : null;

  return '<article class="cardblk">'
    + '<header class="cbhead">'
      + '<span class="cbteams">' + ab(g.aid) + ' at ' + ab(g.hid) + '</span>'
      + '<span class="cbtime">' + dayName(g.start) + ' ' + clock(g.start) + '</span>'
    + '</header>'
    + '<div class="cbrow">'
      + '<span class="cblabel">Side</span>'
      + '<span class="tbar" style="background:' + col(favId) + '" aria-hidden="true"></span>'
      + '<span class="cbval"><b>' + ab(favId) + '</b> ' + Math.round(favP * 100) + '%'
        + (shifted ? ' <span class="cbraw">raw ' + Math.round(rawP * 100) + '%</span>' : "")
        + '</span>'
      + '<span class="cbodds">' + american(favP) + '</span>'
    + '</div>'
    + (tot
        ? (() => {
            /* The informative part is the gap from average, not the number. The
               projection misses a single game by about three and a half runs, so
               "9.0" implies a precision it does not have; "0.1 above average"
               is what it actually knows. */
            const lgTot = tot.lg * 2;
            const gap = tot.total - lgTot;
            const word = Math.abs(gap) < 0.5 ? "about average"
              : gap > 0 ? "+" + gap.toFixed(1) + " vs average"
                        : gap.toFixed(1) + " vs average";
            const err = S.cal && S.cal.with
              ? ' \u00b7 give or take ' + S.cal.with.runMAE.toFixed(1)
              : "";
            const cal = tot.shrunk ? ' \u00b7 calibrated' : "";
            return '<div class="cbrow">'
              + '<span class="cblabel">Runs</span>'
              + '<span class="tbar" aria-hidden="true"></span>'
              + '<span class="cbval"><b>' + tot.total.toFixed(1) + '</b> '
                + esc(word) + '</span>'
              + '<span class="cbodds sm">' + ab(g.aid) + ' ' + tot.away.toFixed(1)
                + ' \u00b7 ' + ab(g.hid) + ' ' + tot.home.toFixed(1)
                + esc(cal) + esc(err) + '</span>'
              + '</div>';
          })()
        : "")
    + (() => {
        const rows = [[g.aProbId, g.hid, g.aid], [g.hProbId, g.aid, g.hid]]
          .map(([pid, oppId, ownId]) => {
            const k = projectStrikeouts(pid, oppId);
            /* A strikeout projection is about a named pitcher, so unlike the bat
               pick there is no standing in for him. Saying the probable has not
               been posted is better than a row quietly going missing. */
            if(!k) return pid ? null : { ownId, tba:true };
            return { pid, ownId, k, name:(S.pitchers[pid] || {}).name };
          }).filter(Boolean);
        if(!rows.length || rows.every(r => r.tba)) return "";
        /* The projected number is the point of the row, so it must never be the
           thing that gets squeezed out. The detail is abbreviated and allowed to
           truncate instead. */
        return rows.map(r => r.tba
          ? '<div class="cbrow">'
            + '<span class="cblabel">K</span>'
            + '<span class="tbar" style="background:' + col(r.ownId) + '" aria-hidden="true"></span>'
            + '<span class="cbval">' + ab(r.ownId) + ' <em>starter not posted</em></span>'
            + '<span class="cbodds sm"></span>'
            + '</div>'
          : '<div class="cbrow">'
          + '<span class="cblabel">K</span>'
          + '<span class="tbar" style="background:' + col(r.ownId) + '" aria-hidden="true"></span>'
          + '<span class="cbval">' + esc(lastName(r.name))
            + ' <b>' + r.k.exp.toFixed(1) + '</b></span>'
          + '<span class="cbodds sm">' + r.k.k9.toFixed(1) + ' K/9 \u00b7 '
            + r.k.ip.toFixed(1) + ' IP'
            + (r.k.oppKRate != null ? ' \u00b7 ' + Math.round(r.k.oppKRate * 100) + '%' : "")
            + '</span>'
          + '</div>').join("");
      })()
    + bats.map(mu => '<div class="cbrow">'
        + '<span class="cblabel">Watch</span>'
        + '<span class="tbar" style="background:' + col(mu.team) + '" aria-hidden="true"></span>'
        + '<span class="cbval wrap"' + (mu.batterId
            ? ' data-player="' + mu.batterId + '" data-pteam="' + mu.team
              + '" data-pname="' + esc(mu.batter) + '" role="button" tabindex="0"'
            : "") + '>' + esc(lastName(mu.batter))
          + (mu.tonight != null
              ? ' <b>' + Math.round(mu.tonight * 100) + '%</b>'
              : "")
          /* Hit and run alongside the homer, in the order they are likeliest. */
          + (mu.pHit != null || mu.pRun != null
              ? ' <em class="props">'
                + (mu.pHit != null ? 'H ' + Math.round(mu.pHit * 100) + '%' : "")
                + (mu.pHit != null && mu.pRun != null ? ' \u00b7 ' : "")
                + (mu.pRun != null ? 'R ' + Math.round(mu.pRun * 100) + '%' : "")
                + '</em>'
              : "")
          + '</span>'
        + '<span class="cbodds sm">'
          + (mu.rank ? 'next best \u00b7 ' : "")

          /* What the ballpark did to it, when it did anything worth naming. */
          + (mu.cond && Math.abs(mu.cond.mult - 1) >= 0.03
              ? (mu.cond.mult > 1 ? '+' : "")
                + Math.round((mu.cond.mult - 1) * 100) + '% air/wind \u00b7 '
              : "")
          + (mu.form ? 'L5 ' + mu.form.hr + ' HR \u00b7 ' : "")
          + (mu.tba
              ? 'starter TBA \u00b7 lg ' + mu.hr9.toFixed(1)
              : esc(lastName(mu.pitcher)) + ' ' + mu.spHr9.toFixed(1)
                + (mu.penHr9 != null ? ' \u00b7 pen ' + mu.penHr9.toFixed(1) : "")
                + ' HR/9')
          + (mu.raw != null && mu.tonight != null
              && Math.abs(mu.raw - mu.tonight) >= 0.02
              ? ' \u00b7 was ' + Math.round(mu.raw * 100) + '%' : "")
          + (mu.side && mu.hand ? ' \u00b7 ' + mu.side + ' v ' + mu.hand + 'HP' : "")
          + (mu.slot != null ? ' \u00b7 bats ' + ordinal(mu.slot + 1)
              : mu.posted ? ' \u00b7 in the lineup' : "")
          + '</span>'
        + '</div>').join("")
    + batPickGaps(g).map(tid => '<div class="cbrow">'
        + '<span class="cblabel">Watch</span>'
        + '<span class="tbar" style="background:' + col(tid) + '" aria-hidden="true"></span>'
        + '<span class="cbval">' + ab(tid) + ' <em>no rated bat starting</em></span>'
        + '<span class="cbodds sm"></span>'
        + '</div>').join("")
    + (wx
        ? '<p class="cbwx">' + Math.round(wx.temp) + '\u00b0 \u00b7 '
          + Math.round(wx.wind) + ' mph ' + (rel || "from " + compass(wx.dir))
          + (wx.air != null ? ' \u00b7 ' + Math.round(wx.air) + '% air' : "") + '</p>'
        : "")
    + '</article>';
}

/* The feed, newest first, grouped by day. Entries touching the club you follow
   are marked, and can be shown on their own. */
function renderFeed(){
  if(S.feedState === "loading" && !S.feed.length)
    return '<div class="pane"><p class="load">Reading transactions\u2026</p></div>';
  if(!S.feed.length)
    return '<div class="pane"><div class="empty"><h3>Nothing to report</h3>'
      + '<p>No roster moves in the last ' + FEED_DAYS + ' days, or the transactions '
      + 'feed could not be reached.</p></div></div>';

  const mine = e => S.follow && (e.team === S.follow || e.from === S.follow);
  const list = S.feedMine ? S.feed.filter(mine) : S.feed;
  const mineCount = S.feed.filter(mine).length;

  /* Which of these moves touch a player the app is naming tonight. */
  const named = namedPlayers();
  const touches = e => {
    const ids = [e.pid].concat(e.pids || []).filter(Boolean);
    for(const id of ids) if(named[id]) return named[id];
    return null;
  };
  const hitList = S.feed.filter(touches);

  const byDay = [];
  for(const e of list){
    const last = byDay[byDay.length - 1];
    if(last && last.date === e.date) last.items.push(e);
    else byDay.push({ date:e.date, items:[e] });
  }

  const dayLabelOf = d => {
    if(d === iso(new Date())) return "Today";
    if(d === iso(shift(-1))) return "Yesterday";
    const dt = new Date(d + "T12:00:00");
    return isNaN(dt) ? d : dt.toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
  };

  /* Twelve days is a lot of routine option moves. The two most recent days stay
     open; everything older folds behind a tap, the same pattern the game cards
     use. Nothing is dropped — the count is on the button. */
  const OPEN_DAYS = 2;
  const recent = byDay.slice(0, OPEN_DAYS);
  const older = byDay.slice(OPEN_DAYS);
  const olderCount = older.reduce((n, d) => n + d.items.length, 0);

  /* Trades and injured-list moves are the news worth spotting; routine option
     moves are not. Everything gets an avatar, but the significant kinds get a
     larger one and a wider row, so importance reads as shape. */
  const BIG = { trade:1, injured:1, back:1 };
  const dayBlock = d => '<h2 class="eyebrow">' + esc(dayLabelOf(d.date)) + '</h2>'
    + d.items.map(e => {
        const big = !!BIG[e.kind.tag];
        const il = e.kind.tag === "injured" || e.kind.tag === "back"
          ? ilLength(e.desc) : null;
        return '<article class="fitem' + (mine(e) ? " mine" : "")
          + (big ? " big" : "") + '">'
          + (e.kind.tag === "trade" ? tradeAvatar(e)
              : avatar(e.person, e.team, big, positionFromText(e.desc)))
          + '<div class="fbody">'
            + '<div class="fhead2">'
              + '<span class="fclub">' + (e.team ? ab(e.team) : "\u2014") + '</span>'
              + '<span class="chip ' + e.kind.tone + '">' + esc(e.kind.tag) + '</span>'
              + (il ? '<span class="chip slate">' + il + '</span>' : "")
              + (e.also ? '<span class="chip slate">' + (e.also + 1)
                  + ' players</span>' : "")
              + (touches(e) ? '<span class="chip bulb">' + esc(touches(e))
                  + '</span>' : "")
            + '</div>'
            + '<p class="fdesc">' + esc(e.desc) + '</p>'
          + '</div>'
          + '</article>';
      }).join("");

  /* Only worth saying when there is something to say. */
  const alert = hitList.length
    ? '<div class="since"><h5 class="sincehead">Touching tonight\u2019s card</h5>'
      + hitList.slice(0, 4).map(e => '<p><b>' + esc(lastName(e.person || "")) + '</b> '
          + esc(e.kind.tag) + ' \u00b7 ' + esc(touches(e)) + '</p>').join("")
      + (hitList.length > 4
          ? '<p class="sincefoot">and ' + (hitList.length - 4) + ' more below</p>' : "")
      + '</div>'
    : "";

  return '<div class="pane">'
    + alert
    + (S.follow && mineCount
        ? '<div class="toggle" role="tablist">'
          + '<button role="tab" aria-selected="' + (!S.feedMine) + '" class="'
            + (!S.feedMine ? "on" : "") + '" data-feed="all">Everything</button>'
          + '<button role="tab" aria-selected="' + (!!S.feedMine) + '" class="'
            + (S.feedMine ? "on" : "") + '" data-feed="mine">'
            + ab(S.follow) + ' only (' + mineCount + ')</button>'
          + '</div>'
        : "")
    + (list.length
        ? recent.map(dayBlock).join("")
          + (older.length
              ? '<button class="disc notes" data-feedolder="1" aria-expanded="'
                + (S.feedOlder ? "true" : "false") + '">'
                + '<span>' + olderCount + ' earlier '
                + (olderCount === 1 ? "move" : "moves") + ', to '
                + esc(dayLabelOf(older[older.length - 1].date)) + '</span>'
                + '<i class="chev" aria-hidden="true">'
                + (S.feedOlder ? "\u25B4" : "\u25BE") + '</i></button>'
                + (S.feedOlder ? older.map(dayBlock).join("") : "")
              : "")
        : '<div class="empty"><h3>Nothing for ' + ab(S.follow) + '</h3>'
          + '<p>No moves involving them in the last ' + FEED_DAYS + ' days.</p></div>')
    + '<p class="note">A move is flagged when it touches a player the app is naming on '
    + 'tonight\'s card \u2014 a Watch pick, a bat on the leaderboard, or a probable '
    + 'starter. Matched by player id rather than by name, so it cannot catch the wrong '
    + 'man. Nothing appears here if the Plays tab has not loaded its hitters yet.</p>'
    + '<p class="note">A trade the feed has not seen before also expires the roster data '
    + 'immediately, rather than waiting out its three-hour clock. That is the gap that '
    + 'once left a traded player listed under his old club on the Plays tab while this '
    + 'tab was already reporting the deal.</p>'
    + '<p class="note">Every line is MLB\'s own wording for a roster move, not a summary '
    + 'written here. Trades, injured-list placements and activations, call-ups, options '
    + 'and releases \u2014 the last ' + FEED_DAYS + ' days. There is no injury reporting '
    + 'beyond what a transaction states, so a knock that does not cost a roster spot will '
    + 'not appear.</p>'
    + '</div>';
}

/* ---------------- keeping the record ----------------
   Everything else in this app is a fetch away — standings, scores, weather, the
   whole season. The scorecard is not. It is prospective by design, it starts
   empty, and it fills at the rate baseball is played. It also lives in
   localStorage, which a cleared cache, a new browser or a private window wipes
   without warning and without a copy anywhere.

   So: a file. Plain JSON, the same shape held in memory, readable in any text
   editor and analysable outside the app. */
function exportScorecard(){
  const n = Object.keys(S.card).length;
  if(!n){ S.ioMsg = "Nothing to export yet."; render(); return; }
  const payload = { app:"108", kind:"scorecard", version:CARD_V,
                    at:new Date().toISOString(), build:BUILD, card:S.card };
  try{
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "108-scorecard-" + iso(new Date()) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    S.ioMsg = "Exported " + n + (n === 1 ? " prediction." : " predictions.");
  }catch(e){ S.ioMsg = "Could not export: " + e.message; }
  render();
}

/* Merging rather than replacing, because the obvious use is carrying a record
   between two browsers that each hold part of it.

   Where both sides know a game, the settled copy wins, and if both are settled
   the incoming one is ignored — a prediction is written once and an import is
   no place to start revising them. */
function importScorecard(text){
  let payload;
  try{ payload = JSON.parse(text); }
  catch(e){ S.ioMsg = "That file is not readable JSON."; render(); return; }
  const incoming = payload && payload.card && typeof payload.card === "object"
    ? payload.card : null;
  if(!incoming || payload.kind !== "scorecard"){
    S.ioMsg = "That does not look like a 108 scorecard.";
    render();
    return;
  }
  let added = 0, filled = 0, known = 0, bad = 0;
  for(const key in incoming){
    const inc = incoming[key];
    if(!inc || !inc.date || inc.pHome == null){ bad++; continue; }
    const have = S.card[key];
    if(!have){ S.card[key] = inc; added++; }
    else if(have.hs == null && inc.hs != null){
      have.hs = inc.hs; have.as = inc.as;
      if(inc.watches) have.watches = inc.watches;
      if(inc.ks) have.ks = inc.ks;
      filled++;
    }
    else known++;
  }
  S.cardDirty = true;
  saveScorecard();
  S.ioMsg = added + " added, " + filled + " completed, " + known + " already known"
    + (bad ? ", " + bad + " unreadable" : "") + ".";
  render();
}

function scorecardIO(){
  return '<div class="cdio">'
    + '<button class="btn" id="exportCard">Export</button>'
    + '<label class="btn" for="importFile">Import'
      + '<input type="file" id="importFile" accept="application/json,.json"></label>'
    + (S.ioMsg ? '<span class="ioMsg">' + esc(S.ioMsg) + '</span>' : "")
    + '</div>'
    + '<p class="note">The record is the one thing here that cannot be refetched \u2014 it '
    + 'only exists because you were running the app before those games started. It lives '
    + 'in this browser\u2019s storage, which clearing your history will erase. Export writes '
    + 'it to a file; import merges one back, so a record kept on a phone and a laptop can '
    + 'be joined rather than duplicated.</p>';
}

/* ---------------- the card of the day ----------------
   Eight legs, one per game, assembled from the same numbers the rest of the app
   already stakes its record on — and printed beside the probability that all
   eight land, which is the number that matters and the one a betting slip never
   shows you.

   That number is a product, so it punishes optimism geometrically. Eight legs at
   a genuine 60% is 1.7%. At 55% it is 0.8%. This is not a flaw in the display; it
   is what a parlay is, and the app's own record says its legs are not at 55%.

   Two deliberate constraints. One leg per game, because a homer pick and a run
   total in the same ballpark are the same weather and the same starter and fail
   together — multiplying correlated legs would overstate the joint chance, which
   is exactly the error that makes these look attractive. And the probability
   stored with each leg is the one the app showed, so the record grades what was
   claimed rather than a number reconstructed later.

   What is not here: hits and spread. Nothing in the app tracks hit rates or
   margins, and a run projection is not a spread. Inventing either would be worse
   than their absence. */
const PARLAY_KEY = "108.parlay";
/* The card is as long as the slate. Fifteen games gives fifteen picks, one from
   each; a four-game night gives eight, found by looking harder at those four.

   A fixed length was always slightly wrong in both directions. On a full slate it
   left five games untouched that had honest picks in them; on a thin one it
   forced the card either short or deep. Tying the length to the number of games
   makes the card a read of the day rather than a fixed-size product, with a floor
   so a three-game Monday still produces something worth settling. */
const PARLAY_LEGS = 8;
/* Eight, whatever the slate offers.

   The card followed the number of games for a while, on the reasoning that a
   fuller day deserved a fuller card. What that produced was thirteen and fifteen
   leg cards at one in twenty thousand and one in ninety thousand, which cannot
   land and so cannot tell you anything: a week of them read as a terrible week
   when the legs underneath were hitting 47%, exactly their expectation. Eight is
   the length where the card is still a long shot but a real one, and the leg rate
   in the record measures the picks either way.

   Still floored the same way, so a three-game Monday produces eight legs by
   looking harder at those three rather than a card of three. */
const parlayTarget = () => PARLAY_LEGS;
/* Two of each across five kinds is exactly eight plus a little slack, so the cap
   sits at two: every kind is represented, none takes more than a quarter of the
   card, and the two thin kinds — homers and steals — each get the second slot
   that stops them naming the same player every night. */
const kindCap = () => 2;

function loadParlay(){
  try{
    const raw = localStorage.getItem(PARLAY_KEY);
    const c = raw ? JSON.parse(raw) : null;
    return c && typeof c === "object" ? c : {};
  }catch(e){ return {}; }
}
function saveParlay(){
  const cutoff = iso(shift(-CARD_DAYS));
  for(const d in S.parlay) if(d < cutoff) delete S.parlay[d];
  try{ localStorage.setItem(PARLAY_KEY, JSON.stringify(S.parlay)); }catch(e){}
}

/* P(X >= k) for a Poisson mean. Runs and strikeouts are counts of largely
   independent events, so a Poisson is the honest default shape — it will
   understate the fat tail of a blowout, and that is worth knowing rather than
   papering over. */
function poissonAtLeast(k, mean){
  if(!(mean > 0)) return k <= 0 ? 1 : 0;
  if(k <= 0) return 1;
  let term = Math.exp(-mean), cum = term;
  for(let i = 1; i < k; i++){ term *= mean / i; cum += term; }
  return Math.max(0, Math.min(1, 1 - cum));
}

/* The calibration replays 1,249 games and fetches game logs for 250 starters, so
   it is not something to make someone run twice. It was being lost on every
   reload all the same — and worse than merely lost: runSpread() prefers the
   season's measured error and silently fell back to the live record's, which is
   twenty-odd games against twelve hundred. The card was quoting the noisier
   number while the better one sat one button away.

   The prediction arrays are dropped; they are large and only the click handler
   uses them, which recomputes anyway. */
function saveCal(){
  /* A run that produced nothing must not overwrite one that did. The handler
     calls this before it nulls out an empty result, so pressing "Run it again"
     before the season data had loaded wrote a hollow object over the saved one
     and loadCal then refused it — the calibration was gone for good, from a
     button press that looked like it had simply failed. */
  if(!S.cal || !S.cal.with || !S.cal.without) return;
  if(S.cal.with.brier == null) return;
  const keep = r => r ? { n:r.n, brier:r.brier, baseBrier:r.baseBrier, acc:r.acc,
    runMAE:r.runMAE, parkMAE:r.parkMAE, naiveMAE:r.naiveMAE, runBias:r.runBias,
    spN:r.spN, bands:r.bands, runBands:r.runBands } : null;
  const cal = {};
  for(const k in (S.cal || {})) cal[k] = keep(S.cal[k]);
  try{
    localStorage.setItem(CAL_KEY, JSON.stringify({
      at:new Date().toISOString(), cal, sweep:S.sweep,
      calOut:S.calOut ? { n:S.calOut.n, raw:S.calOut.raw, cal:S.calOut.cal,
                          trained:S.calOut.trained } : null }));
  }catch(e){}
}

function loadCal(){
  try{
    const raw = localStorage.getItem(CAL_KEY);
    const c = raw ? JSON.parse(raw) : null;
    /* calibrationBlock reads `with` and `without` without guarding them, so a
       restored object missing either would kill the Odds tab on every load until
       storage was cleared — a far worse failure than simply not persisting. The
       optional variants below it are all guarded at the point of use. */
    if(!c || !c.cal || !c.cal.with || !c.cal.without) return;
    /* Every field calibrationBlock reads without guarding, not just the two
       objects. A stored calibration missing any one of them would throw on the
       Odds tab at every load until storage was cleared, which is the failure this
       whole check exists to prevent. */
    const need = ["brier", "baseBrier", "acc", "runMAE", "naiveMAE", "runBias"];
    if(need.some(k => c.cal.with[k] == null)) return;
    if(!Array.isArray(c.cal.with.bands)) return;
    if(c.cal.without.brier == null) return;
    S.cal = c.cal; S.sweep = c.sweep || null;
    S.calOut = c.calOut || null; S.calAt = c.at || null;
  }catch(e){}
}

/* How much of the run projection's spread is real.

   The calibration's own bands answer this. Games projected at 8.0 scored 8.4,
   those at 9.0 scored 9.1, those at 10.0 scored 9.6 — two runs of projected
   spread producing barely one run of actual. Fitting actual on projected gives a
   slope near 0.6, which is another way of stating what the block already says in
   words: the projection ranks games but its distance from average is mostly
   noise.

   Using it raw as the mean of a distribution therefore overstates every run leg
   at the tails. A card showing "under 9.5, projected 6.4" was reading 72% when
   the season's own numbers put it nearer 65%. This shrinks the projection toward
   the point where it is unbiased, by exactly the amount measured — nothing is
   chosen here, and with no calibration run there is no shrink at all.

   The same shape as calibrate() for probabilities, and applied in the same place:
   to what the card shows, so the record grades it. */
function runShrink(){
  const b = S.cal && S.cal.with && S.cal.with.runBands;
  if(!Array.isArray(b) || b.length < 3) return null;
  let sw = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
  for(const r of b){
    if(!(r.n > 0) || r.said == null || r.actual == null) continue;
    sw += r.n; sx += r.n * r.said; sy += r.n * r.actual;
    sxx += r.n * r.said * r.said; sxy += r.n * r.said * r.actual;
  }
  const den = sw * sxx - sx * sx;
  if(!(den > 0)) return null;
  const slope = (sw * sxy - sx * sy) / den;
  const inter = (sy - slope * sx) / sw;
  /* A slope at or above 1 means the projection is not over-dispersed and there is
     nothing to correct; anything negative would invert it, which no amount of
     miscalibration justifies. */
  if(!isFinite(slope) || !isFinite(inter) || slope <= 0 || slope >= 1) return null;
  return { slope, inter, pivot:inter / (1 - slope) };
}

/* ---------------- park factors ----------------
   Runs per game at each club's home ground against the league, computed from the
   season's own completed games. Nothing is fetched and nothing is hardcoded: the
   thirty-row table of park factors this app has always refused to carry is not
   needed, because the finals are already in memory and they say it themselves.

   Regressed, because eighty-odd home games is a small sample and much of the
   variation in a park's raw run total is the clubs that happened to play there.
   How much to regress was measured rather than picked, across three guesses at
   what real park variation looks like: a smooth spread across all thirty, a
   league of neutral parks with three extremes, and a league of near-neutral parks
   with one Coors. Twenty games won on the first, forty on the third, and the two
   were within noise on the second. Forty is the value that is never worst, which
   is the right way to choose between shapes when you do not know which one you
   are in. Zero was worse than all of them: an unregressed factor overfits its own
   sample.

   Temper expectations. The gain across those sweeps was 0.02 to 0.05 runs a game
   against a projection that misses by two and a half. The park is real, and it
   costs nothing because the finals are already here — but it does not rescue the
   run projection and nothing in this app should be read as claiming it does. */
const PARK_REGRESS = 40;

/* Normal CDF, by the usual rational approximation of erf. Needed because the run
   projection's spread is measured rather than assumed — see below. */
function normCdf(z){
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478
            + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}

/* The app's own measured error on a game total, in runs, preferring the season
   replay over the live record because it has a thousand games rather than twenty.
   Null when neither has run. */
/* How far a game total actually lands from a projection.

   Measured where there is a measurement, and otherwise a stated constant rather
   than nothing. Returning null sent the caller to a Poisson tail, and runs are
   not Poisson: they cluster into big innings, so the real spread of game totals
   is roughly four and a half runs while sqrt(mean) on a projection of 5.7 gives
   2.4. That difference turned an honest 80% into a stated 94% — a number the app
   had no business being that sure of, on the component its own record ranks last.

   Every measurement this app has ever taken of it, across two full calibration
   runs and the live record, has put the mean absolute error near 3.6 runs, which
   is a standard deviation near 4.5. That is the fallback. */
const RUN_SD = 4.5;

function runSpread(){
  if(S.cal && S.cal.with && S.cal.with.runMAE) return S.cal.with.runMAE * 1.2533;
  const s = scorecardSummary();
  if(s && s.runMAE && s.totN >= 20) return s.runMAE * 1.2533;
  return RUN_SD;
}

/* Every leg this app can honestly offer on one game. */
function legsFor(g){
  const out = [];
  /* Every leg carries its own fixture. The run legs named no club at all — "Under
     9.5 runs, projected 7.5" with nothing to say which game it was — and the rest
     named only one side, so the opponent was missing everywhere. Stored on the leg
     rather than looked up later, because the schedule window is four days and a
     card outlives it. */
  const add = leg => {
    if(!leg || !(leg.p > 0) || !(leg.p < 1)) return;
    leg.hid = g.hid; leg.aid = g.aid;
    out.push(leg);
  };

  const pr = project(g);
  if(pr){
    const pHome = calibrate(pr.pHome);
    const homeFav = pHome >= 0.5;
    const team = homeFav ? g.hid : g.aid;
    add({ pk:g.pk, kind:"ml", team, p:Math.max(pHome, 1 - pHome),
          label:ab(team) + " to win", detail:"moneyline" });
  }

  const tot = projectTotal(g), lgTot = leagueRunsPerGame();
  if(tot && lgTot){
    /* The line is the league's own average total, rounded to a half so it cannot
       push. No book's number is involved, and none is available. */
    const line = Math.round(lgTot * 2) + 0.5;
    const over = tot.total > line;
    /* A Poisson around the projection would put the spread at about 2.9 runs and
       so hand this leg an 80% confidence. The app has measured its own error on a
       game total at appreciably more than that, and using the measured figure
       roughly halves the confidence. Claiming Poisson precision for a projection
       known to miss by four runs would be the least honest number in the app. */
    /* Always a normal tail on a measured spread now. runSpread no longer returns
       null, so the Poisson branch that used to sit here is gone: it modelled runs
       as independent arrivals, which is exactly what they are not. */
    const sd = runSpread();
    const pOver = 1 - normCdf((line - tot.total) / sd);
    add({ pk:g.pk, kind:"runs", line, over, p:over ? pOver : 1 - pOver,
          label:(over ? "Over " : "Under ") + line.toFixed(1) + " runs",
          /* "projected 7.0 \u00b1 5.0 measured" reads as 7 plus 5, which is over the
             line rather than under it. Plain words cannot be mistaken for a sum. */
          detail:"projected " + tot.total.toFixed(1)
            + (sd ? ", give or take " + sd.toFixed(1) : "") });
  }

  for(const [pid, oppId, ownId] of [[g.aProbId, g.hid, g.aid], [g.hProbId, g.aid, g.hid]]){
    const k = projectStrikeouts(pid, oppId);
    if(!k) continue;
    /* The line sits at the projection, not below it. Setting it a couple under
       produced legs at 85% and an eight-leg card at one in five, which is not a
       parlay so much as a rounding error dressed as one. At the projection the
       leg is a coin flip on the app's own number, which is what it should be. */
    const need = Math.max(3, Math.round(k.exp));
    /* A line and a side, rather than a floor. "4+ strikeouts" only ever asked
       whether he would clear it, so the card could never say a pitcher was
       likely to fall short — every strikeout leg was an over by construction,
       and on a starter projected below his line that is the worse side of the
       bet. The line sits half a strikeout under the rounded projection, and the
       leg takes whichever side of it the projection actually favours. */
    const line = need - 0.5;
    const pOver = poissonAtLeast(need, k.exp);
    const over = pOver >= 0.5;
    add({ pk:g.pk, kind:"k", pid, team:ownId, need, line, over,
          gs:(S.pitchers[pid] || {}).gs,
          p:over ? pOver : 1 - pOver,
          label:lastName((S.pitchers[pid] || {}).name) + (over ? " over " : " under ")
            + line.toFixed(1) + " strikeouts",
          detail:"projected " + k.exp.toFixed(1) });
  }

  /* Home runs, on the calibrated number rather than the raw one. These were
     taken out when the picks were running three sigma under their own
     expectation; what fixed that was not removing them but measuring the bias and
     correcting for it, so mu.tonight is now mapped through the record. */
  /* Every bat the app rates for this game, not just the two it names. The card
     takes the single best home run leg across the whole slate, so drawing from
     two bats a club meant the same name won almost every night — the pool was too
     narrow for the matchup to ever change the answer. Five a club gives the park,
     the arm and the platoon something to work with. */
  for(const mu of bestBats(g).concat(benchBats(g))){
    if(mu.tonight == null || mu.batterId == null) continue;
    add({ pk:g.pk, kind:"hr", pid:mu.batterId, team:mu.team, p:mu.tonight,
          pa:mu.pa, posted:mu.posted, tba:mu.tba,
          label:lastName(mu.batter) + " home run",
          detail:"1 per " + Math.round(1 / mu.blended) + " PA" });
  }

  for(const tid of [g.aid, g.hid]){
    const lu = lineupIds(g, tid);
    const games = (S.runs[tid] || {}).g;
    if(!games) continue;
    /* Every runner on the club's list, not only its leader. Offering one
       candidate a club meant the league's top base stealer was the top steal leg
       every single night, because he was the only name allowed to compete. */
    const outSb = unavailable();
    for(const r of (S.runners[tid] || [])){
    if(outSb[r.id]) continue;
    if(lu && lu.indexOf(r.id) < 0) continue;
    /* Steals per team game, not per game he started, because the app does not
       know how often he plays. That understates his rate on a night he is in the
       lineup and overstates the chance he is in it at all. The two pull opposite
       ways and neither is measured, which is the weakest leg here. */
    /* Against whoever is defending. A club that throws out a third of runners is a
       materially worse place to run than one at fifteen per cent, and until now the
       leg knew nothing about that: its whole number was the runner's own season
       total, so the same name won every night. Measured against the league and
       damped like every other multiplier here, and it stands aside entirely when
       the club has not been run against enough to have a rate. */
    const opp = tid === g.hid ? g.aid : g.hid;
    const csRate = S.runDef ? S.runDef[opp] : null;
    const csMult = (csRate != null && S.lgCs != null && S.lgCs < 1)
      ? Math.max(1 - ARM_SWING, Math.min(1 + ARM_SWING, (1 - csRate) / (1 - S.lgCs)))
      : 1;
    add({ pk:g.pk, kind:"sb", pid:r.id, team:tid, posted:!!lu,
          p:1 - Math.exp(-(r.sb / games) * csMult),
          label:lastName(r.name) + " to steal",
          detail:r.sb + " in " + games + " games"
            + (csRate != null
                ? " \u00b7 " + ab(opp) + " throws out " + Math.round(csRate * 100) + "%"
                : "")
            + (lu ? " \u00b7 starting" : " \u00b7 lineup TBA") });
    }
  }

  return out;
}

/* Build once, for a date, and never revise — the same discipline as the
   scorecard. Highest-probability leg from each game, one apiece, until eight. */
function buildParlay(date){
  const games = S.games.filter(g => g.date === date && g.st === "sched");
  const existing = S.parlay[date];

  /* Built once and then frozen was wrong in one specific way. loadDetail fetches
     hitters last, so a card assembled in the window after the starters land but
     before the bats do sees no home run or steal candidates at all — and kept
     that shape for the day, leaving half the card as run legs, which is the
     component the calibration likes least.

     So it may be finished, but only while nothing has begun: every leg still
     unsettled, and every game on it still listed as scheduled. That is the same
     discipline recordPrediction uses. It is not revision with hindsight; it is
     completing a card that was written before the data arrived. */
  const sched = {};
  for(const g of games) sched[String(g.pk)] = true;
  const openStill = existing && (existing.legs || []).length
    && existing.legs.every(l => l.hit == null && !l.clear && !l.dead && !l.void
                                && sched[String(l.pk)]);
  if(existing && !openStill) return existing;
  if(games.length < 3) return existing || null;
  const all = [];
  for(const g of games) for(const leg of legsFor(g)) all.push(leg);
  if(!all.length) return existing || null;
  all.sort((a, b) => b.p - a.p);

  /* One leg per game, and built in three passes so the card is actually varied.
     Ranking on probability alone collapsed it into seven strikeout legs, because
     that kind is systematically the most confident; capping each kind at two then
     dropped home runs entirely, because they are systematically the least. So:
     one of every kind available first, then fill to the cap, then fill regardless.
     A card of one bet repeated eight times tests nothing. */
  const target = parlayTarget();
  const cap = kindCap();
  /* Whether the slate can fill the card from separate fixtures. When it can, no
     game is ever asked twice. */
  const thin = games.length < target;

  const legs = [], used = {}, byKind = {}, taken = {};
  /* `limit` caps how many of a kind may be taken; `perGame` how many legs one
     game may contribute. */
  const take = (limit, perGame) => {
    for(const leg of all){
      if(legs.length >= target) return;
      if((used[leg.pk] || 0) >= perGame) continue;
      /* Never the same market twice on the same game: two "under 9.5" legs on
         one fixture are not two picks, they are one pick written twice. */
      if(taken[leg.pk + ":" + leg.kind]) continue;
      if(limit != null && (byKind[leg.kind] || 0) >= limit) continue;
      used[leg.pk] = (used[leg.pk] || 0) + 1;
      taken[leg.pk + ":" + leg.kind] = true;
      byKind[leg.kind] = (byKind[leg.kind] || 0) + 1;
      legs.push(leg);
    }
  };
  /* Breadth of kind before depth of kind: one of every kind, then two of every
     kind, and so on up to the cap — each round trying separate fixtures first.
     On a thin night the round also gets a second look with the per-game limit
     lifted, because a three-game slate runs out of games before it runs out of
     kinds, and the kinds it drops are always the last two by probability. */
  for(let lim = 1; lim <= cap; lim++){
    take(lim, 1);
    if(thin) take(lim, 2);
  }
  take(null, 1);           // then one apiece from any game still untouched

  /* Only if the slate could not fill the card from separate games does a fixture
     get asked for a third leg and beyond.

     This was once refused outright: a short slate simply produced a short card,
     on the grounds that two legs from one fixture are not independent and the
     joint figure would flatter itself. That reasoning still holds, and the block
     says so where the legs appear. But refusing meant a four-game night produced
     a four-leg card while those four games held a dozen honest picks, and looking
     harder at fewer games is the better answer than looking at nothing. The
     correlation is disclosed rather than hidden, and it is the one thing about
     these legs the joint number cannot capture. */
  if(thin) for(let perGame = 3; perGame <= 5 && legs.length < target; perGame++){
    take(cap, perGame);
    take(null, perGame);
  }

  /* Which legs ended up sharing a fixture, so the display can mark them. */
  const perGameCount = {};
  for(const l of legs) perGameCount[l.pk] = (perGameCount[l.pk] || 0) + 1;
  for(const l of legs) l.shared = perGameCount[l.pk] > 1 || undefined;

  if(legs.length < 3) return existing || null;
  /* Only replaced by something more varied. Once every kind the slate offers is
     represented, the card settles and stops moving. */
  const kinds = ls => new Set(ls.map(l => l.kind)).size;
  if(existing && kinds(legs) <= kinds(existing.legs)
     && legs.length <= existing.legs.length) return existing;
  const joint = legs.reduce((n, l) => n * l.p, 1);
  const rec = { date, at:new Date().toISOString(), legs, joint, built:legs.length };
  S.parlay[date] = rec;
  S.parlayDirty = true;
  return rec;
}

/* Grade what can be graded from a final score. Player legs wait for a box
   score, which settlePicksFromBox fetches. */
function settleParlay(){
  const byPk = {};
  if(Array.isArray(S.finals))
    for(const f of S.finals) if(f && f.pk != null && f.hs != null) byPk[String(f.pk)] = f;
  for(const g of S.games)
    if(g.st === "final" && g.hs != null) byPk[String(g.pk)] = { hs:g.hs, as:g.as, hid:g.hid, aid:g.aid };

  let changed = false;
  for(const d in S.parlay){
    for(const leg of S.parlay[d].legs || []){
      if(leg.hit != null || leg.void) continue;
      const f = byPk[String(leg.pk)];
      if(!f) continue;
      if(leg.kind === "ml"){
        if(f.hs === f.as){ leg.void = true; }
        else leg.hit = (f.hs > f.as ? f.hid : f.aid) === leg.team;
        leg.actual = f.as + "\u2013" + f.hs;
        changed = true;
      } else if(leg.kind === "runs"){
        const total = f.hs + f.as;
        leg.hit = leg.over ? total > leg.line : total < leg.line;
        leg.actual = total + " runs";
        changed = true;
      }
    }
  }
  if(changed){ S.parlayDirty = true; saveParlay(); }
}

/* Some legs are decided long before the last out, and the app already knows it.

   Strikeouts, homers and steals are counting stats: they only go up, so once the
   line is cleared nothing can take it back. An over is the same once the total
   passes. An under is the mirror image — it can be killed early but never
   confirmed, because runs can always still come. A moneyline is never safe at
   any point before the final, so it is left alone.

   Deliberately provisional. A game abandoned before it is official has its
   statistics wiped, so this marks the leg rather than grading it: settleParlay
   and settleParlayFromBox still write the real result when the game ends, and
   they take precedence over anything decided here. */
function settleParlayLive(){
  const live = {};
  for(const g of S.games) if(g.st === "live") live[String(g.pk)] = g;
  if(!Object.keys(live).length) return;
  let changed = false;
  for(const d in S.parlay){
    for(const leg of S.parlay[d].legs || []){
      if(leg.hit != null || leg.void || leg.clear || leg.dead) continue;
      const g = live[String(leg.pk)];
      if(!g) continue;
      if(leg.kind === "ml") continue;                 // a lead is not a result
      if(leg.kind === "runs"){
        const total = (g.hs || 0) + (g.as || 0);
        if(total > leg.line){
          if(leg.over) leg.clear = true; else leg.dead = true;
          leg.actual = total + " runs";
          changed = true;
        }
        continue;
      }
      const b = S.box[boxKey(leg.pk, leg.pid)];
      if(!b) continue;
      if(leg.kind === "k" && pitchedIn(b) && b.pK != null && b.pK >= leg.need){
        /* Strikeouts only go up, so clearing the line settles an over for good
           and kills an under for good. Neither can reverse; an under still
           standing is not safe until he leaves the mound. */
        if(leg.over === false) leg.dead = true; else leg.clear = true;
        leg.actual = b.pK + " K"; changed = true;
      } else if(leg.kind === "hr" && b.todayHr > 0){
        leg.clear = true; leg.actual = b.todayHr + " HR"; changed = true;
      } else if(leg.kind === "sb" && b.batSb > 0){
        leg.clear = true; leg.actual = b.batSb + " SB"; changed = true;
      }
    }
  }
  if(changed){ S.parlayDirty = true; saveParlay(); }
}

/* The player legs, from a box score belonging to that game. */
function settleParlayFromBox(pk, box){
  let changed = false;
  for(const d in S.parlay){
    for(const leg of S.parlay[d].legs || []){
      if(String(leg.pk) !== String(pk) || leg.hit != null || leg.void) continue;
      const b = box[leg.pid];
      if(leg.kind === "hr" || leg.kind === "sb"){
        if(!battedIn(b)){ leg.void = true; leg.actual = "did not play"; changed = true; continue; }
        if(leg.kind === "hr"){
          const hr = b.todayHr != null ? b.todayHr : 0;
          leg.hit = hr > 0; leg.actual = hr + " HR";
        } else {
          const sb = b.batSb != null ? b.batSb : 0;
