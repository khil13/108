      ranked.push({ score:r.rate * plat * hr9, batter:b.name, batterId:b.id, team:batTeam,
                    perPA:b.perPA, hr:b.hr,
                    hRate:b.pa > 0 ? (b.h || 0) / b.pa : 0,
                    rRate:b.pa > 0 ? (b.r || 0) / b.pa : 0, platC,
                    pitcher:known ? p.name : null,
                    hr9, spHr9, penHr9, plat, side, hand,
                    tba:!known, posted:!!lu, blended:r.rate, form:r.form });
    }
    if(!ranked.length) return [];
    ranked.sort((a, b) => b.score - a.score);
    /* Two per club, four per game. The best bat on a side barely moves from one
       night to the next — he is the best bat, and saying otherwise would be
       naming someone less likely — but the runner-up moves a great deal, so a
       second name is where the day-to-day variation actually lives.

       Both are graded. The alternative was to name two and check one, which would
       have kept the tally continuous at the cost of putting something on screen
       that nothing verifies, and that is not how the rest of this works. */
    const start = n * WATCH_PER_CLUB;
    let picks = ranked.slice(start, start + WATCH_PER_CLUB);
    /* Second game of a doubleheader with a short list: rather than no pick, fall
       back to the tail of it. */
    if(!picks.length) picks = ranked.slice(-WATCH_PER_CLUB);
    /* The arm belongs in the number, not only in the ranking. HR/9 decided which
       bat was named and then played no part in how likely he was to go deep, so
       a hitter facing a homer-prone starter and one facing a groundballer were
       graded against the same expectation. Measured against the league rather
       than used raw, and damped, because a starter's HR/9 carries his park and
       his defence inside it. */
    const lg = leagueFacedHr9();
    const armMult = lg && lg > 0
      ? Math.max(1 - ARM_SWING, Math.min(1 + ARM_SWING, hr9 / lg)) : 1;
    /* A hit is a different question from a home run, so it answers to a
       different arm figure: the opposing starter's opponent average rather than
       his HR/9, measured against the league the same damped way. Runs are
       different again — a batter scores when his club scores, so his rate is
       scaled by what the run projection expects of that club tonight against
       what it usually manages. Both are measured; neither invents a weight. */
    const lgAvg = leagueOppAvg();
    const oppAvg = known && p.oppAvg != null ? parseFloat(p.oppAvg) : null;
    const hitMult = (lgAvg && oppAvg) ?
      Math.max(1 - ARM_SWING, Math.min(1 + ARM_SWING, oppAvg / lgAvg)) : 1;
    const tot = projectTotal(g);
    const own = S.runs[batTeam];
    const runMult = (tot && own && own.g > 0) ? (() => {
      const tonight = batTeam === g.hid ? tot.home : tot.away;
      const usual = own.rs / own.g;
      return usual > 0
        ? Math.max(1 - ARM_SWING, Math.min(1 + ARM_SWING, tonight / usual)) : 1;
    })() : 1;

    return picks.map((chosen, i) => {
      const mult = (cond ? cond.mult : 1) * armMult * (chosen.plat || 1);
      return Object.assign(chosen, { cond, armMult,
        adjusted:chosen.blended * mult,
        raw:gameProb(chosen.blended * mult),
        tonight:calibrateBat(gameProb(chosen.blended * mult)),
        /* Both scaled by the platoon edge as well, since handedness bears on
           contact as much as on power. */
        pHit:calibrateMarket("hit",
          gameProb(chosen.hRate * hitMult * (chosen.platC || 1))),
        pRun:calibrateMarket("run",
          gameProb(chosen.rRate * runMult * (chosen.platC || 1))),
        /* Only a doubleheader's later game is "next best"; the second pick of a
           pair is not, and its own percentage says where it stands. */
        rank:start > 0 ? start + i : 0 });
    });
  };
  // Visitors bat against the home starter and the home relief, and the reverse.
  return forClub(g.aid, g.hProbId, g.hid)
    .concat(forClub(g.hid, g.aProbId, g.aid));
}

/* A rate per plate appearance is not a chance of a home run tonight, and the
   difference is the whole reason "1 of 16" was unreadable. A regular gets about
   4.3 plate appearances in a game he starts, so a bat at one homer per twenty
   goes deep in roughly a fifth of his games — not a twentieth.

   Storing this with each pick is what lets the record say how many homers were
   expected, and so whether a lean stretch is a bad picker or a bad fortnight. */
const PA_PER_GAME = 4.3;
const gameProb = rate =>
  rate > 0 && rate < 1 ? 1 - Math.pow(1 - rate, PA_PER_GAME) : null;
const hrGameProb = gameProb;   // the same arithmetic, named for its first use

const watchOf = mu => Object.assign(
  { name:mu.batter, team:mu.team, id:mu.batterId,
    p:mu.tonight != null ? mu.tonight : gameProb(mu.blended),
    pHit:mu.pHit, pRun:mu.pRun },
  /* Picked against a stand-in rather than the real arm, so it can be improved
     on while the game has still not started. */
  mu.tba ? { tba:true } : null);

/* Records written before this change named one bat and stored it singular.
   Both shapes are read through here, so an old card still grades. */
const watchList = e => Array.isArray(e.watches) ? e.watches : (e.watch ? [e.watch] : []);

/* Which club each player is actually on now.

   MLB reports hitting stats against whichever club a player earned them with,
   so a mid-season trade leaves someone listed under a former team — the power
   block would show a hitter who cannot possibly bat in tonight's game. This is
   the check that catches it: one request for all thirty rosters, then anyone
   whose stats are filed under a club they no longer play for is dropped.

   If the request fails the app behaves as it did before, listing them, which is
   wrong but not broken. */
async function loadRosters(){
  const yr = new Date().getFullYear();
  /* Two maps from one request. The person record carries batSide and the app was
     reading the id and throwing the rest away — which is why the bat pick had
     nothing that could tell one team-mate from another on a given night. */
  const out = {}, bats = {};
  let j;
  try{
    j = await getJSON(MLB + "/teams?sportId=1&season=" + yr + "&hydrate=roster(person)");
  }catch(e){ return { club:out, bats }; }
  for(const t of j.teams || []){
    if(!T[t.id]) continue;
    // The shape has varied; accept either a bare array or a nested one.
    const list = Array.isArray(t.roster) ? t.roster
      : (t.roster && Array.isArray(t.roster.roster)) ? t.roster.roster : null;
    if(!list) continue;
    for(const entry of list){
      const person = entry.person || {};
      const pid = person.id;
      if(!pid) continue;
      out[pid] = t.id;
      const side = (person.batSide || {}).code;
      if(side) bats[pid] = side;
    }
  }
  return { club:out, bats };
}

/* Every regular's season hitting line in one request, sorted by home runs,
   then grouped by club. A 100 plate-appearance floor keeps a callup with two
   homers in nine games out of the leaders. */
async function loadHitters(rosters){
  const byTeam = {}, runners = {};
  const yr = new Date().getFullYear();
  let j;
  try{
    j = await getJSON(MLB + "/stats?stats=season&group=hitting&season=" + yr
      + "&sportId=1&sortStat=homeRuns&order=desc&limit=750");
  }catch(e){
    /* The shape matters as much as the contents. Returning the bare byTeam here
       left S.hitters undefined, and every read of S.hitters[id] then threw — the
       Plays tab entirely, any expanded card, and out through render() as an
       unhandled rejection on every subsequent poll. One dropped request on a
       750-row fetch bricked the app until reload. */
    return { byTeam, teamBat:{}, runners:{} };
  }
  const splits = (j.stats && j.stats[0] && j.stats[0].splits) || [];
  const bat = {};
  for(const s of splits){
    const tid = (s.team || {}).id, st = s.stat || {};
    if(!T[tid]) continue;
    /* Team strikeout rate is accumulated across every player in the response,
       before the leaders are filtered out — a top-five-by-homers list would say
       nothing about how often the lineup as a whole strikes out. */
    const tb = bat[tid] || (bat[tid] = { k:0, pa:0, sb:0, cs:0 });
    tb.k += Number(st.strikeOuts) || 0;
    tb.pa += Number(st.plateAppearances) || 0;
    tb.sb += Number(st.stolenBases) || 0;
    tb.cs += Number(st.caughtStealing) || 0;

    const pid = (s.player || {}).id;
    /* Anyone whose stats sit under a club they have since left is dropped, for
       runners as much as for sluggers. Only applied when the roster list loaded. */
    const traded = rosters && Object.keys(rosters).length && pid
      && rosters[pid] && rosters[pid] !== tid;

    /* Base stealers are a different list from home run hitters and need their
       own pass: the fastest man in a lineup is often near the bottom of it for
       power, and the plate-appearance floor that keeps a callup out of the
       slugging leaders would keep a September pinch-runner out of this one too.
       Five attempts is the floor — below that a success rate is noise. */
    const sb = Number(st.stolenBases) || 0, cs = Number(st.caughtStealing) || 0;
    if(!traded && sb + cs >= 5){
      (runners[tid] = runners[tid] || []).push({
        id:pid, name:(s.player || {}).fullName || "\u2014",
        sb, cs, att:sb + cs, rate:sb / (sb + cs) });
    }

    const hr = st.homeRuns, pa = st.plateAppearances;
    if(!hr || hr <= 0 || !pa || pa < 100) continue;
    if(traded) continue;
    (byTeam[tid] = byTeam[tid] || []).push({
      id:pid,
      name:(s.player || {}).fullName || "—", hr, pa, perPA:pa / hr,
      /* Already in the response, and thrown away until now. */
      h:Number(st.hits) || 0, r:Number(st.runs) || 0
    });
  }
    /* Two lists, unioned, because the pool was being chosen by one measure and
     ranked by another. Keeping the top eight by season home run total, then
     ranking those by rate, quietly excluded the better bet: thirty homers in six
     hundred plate appearances makes that cut ahead of eighteen in two hundred and
     sixty, though the second man is likelier to go deep tonight. He could never
     be named because he was never a candidate.

     So the club's biggest totals and its best rates both get in. The rate arm
     asks for 200 plate appearances rather than the 100 that qualifies anyone at
     all — a rate off a quarter-season is noisy enough to top a list by luck, and
     this pick has no regression of its own to lean on.

     The stored order stays by total, because Power on show reads from the same
     array and describes itself as the club's leading home run hitters. */
  for(const k in byTeam){
    const all = byTeam[k];
    const byTotal = all.slice().sort((a, b) => b.hr - a.hr).slice(0, 8);
    const byRate = all.filter(b => b.pa >= 200)
      .sort((a, b) => a.perPA - b.perPA).slice(0, 8);
    const seen = {}, keep = [];
    for(const b of byTotal.concat(byRate)){
      if(seen[b.id]) continue;
      seen[b.id] = true; keep.push(b);
    }
    byTeam[k] = keep.sort((a, b) => b.hr - a.hr);
  }
  for(const k in runners) runners[k] = runners[k].sort((a, b) => b.sb - a.sb).slice(0, 3);
  const teamBat = {};
  for(const k in bat) if(bat[k].pa > 500)
    teamBat[k] = { kRate:bat[k].k / bat[k].pa, sb:bat[k].sb, cs:bat[k].cs,
                   sbRate:bat[k].sb + bat[k].cs > 0
                     ? bat[k].sb / (bat[k].sb + bat[k].cs) : null };
  return { byTeam, teamBat, runners };
}

/* Bullpen strength, built from player lines rather than a team total, because
   MLB's team pitching figures fold the starters in. A "reliever" here is a
   pitcher with zero starts — unambiguous, at the cost of excluding swingmen,
   whose innings get left out of both clubs equally. The league average is
   computed from the same pass rather than assumed. */
async function loadBullpens(){
  const yr = new Date().getFullYear();
  let j;
  try{
    j = await getJSON(MLB + "/stats?stats=season&group=pitching&season=" + yr
      + "&sportId=1&sortStat=inningsPitched&order=desc&limit=1200");
  }catch(e){ return { teams:{}, lg:null }; }
  const splits = (j.stats && j.stats[0] && j.stats[0].splits) || [];
  const acc = {};
  let lgER = 0, lgIP = 0, lgHR = 0;
  for(const s of splits){
    const tid = (s.team || {}).id, st = s.stat || {};
    if(!T[tid]) continue;
    if(st.gamesStarted == null || Number(st.gamesStarted) !== 0) continue;
    const ip = inningsOf(st.inningsPitched), er = Number(st.earnedRuns);
    if(!ip || ip <= 0 || isNaN(er)) continue;
    const a = acc[tid] || (acc[tid] = { ip:0, er:0, hr:0 });
    a.ip += ip; a.er += er;
    a.hr += Number(st.homeRuns) || 0;
    lgER += er; lgIP += ip; lgHR += Number(st.homeRuns) || 0;
  }
  const teams = {};
  for(const k in acc){
    if(acc[k].ip < BP_MIN_IP) continue;
    teams[k] = { era:9 * acc[k].er / acc[k].ip, ip:acc[k].ip,
                 hr9:9 * acc[k].hr / acc[k].ip };
  }
  return { teams, lg:lgIP > 0 ? 9 * lgER / lgIP : null,
           lgHr9:lgIP > 0 ? 9 * lgHR / lgIP : null };
}

/* ---------------- the feed ----------------
   MLB publishes every roster move as a transaction: trades, injured-list
   placements, activations, call-ups, releases. The descriptions are MLB's own
   prose, so this is a news feed without a word of it being written here. */
const FEED_DAYS = 12;

/* MLB's descriptions begin with the club's full name — "Los Angeles Dodgers
   placed RHP..." — which the header directly above already shows. Stripping it
   costs nothing and shortens every line in the feed. */
function trimClub(desc, teamId){
  if(!desc || !teamId) return desc || "";
  const full = (city(teamId) ? city(teamId) + " " : "") + nm(teamId);
  const bare = nm(teamId);
  for(const name of [full, bare]){
    if(name && desc.startsWith(name + " ")){
      const rest = desc.slice(name.length + 1);
      return rest.charAt(0).toUpperCase() + rest.slice(1);
    }
  }
  return desc;
}

/* MLB's transaction feed does not reliably carry a team id, but every
   description opens with the club's full name. Matching that recovers the club
   — and with it the colour, the abbreviation, and the ability to trim the name
   out of the sentence. Longest name first, so "Chicago White Sox" is not
   mistaken for "Chicago Cubs" on the word Chicago. */
let CLUB_BY_NAME = null;
function clubFromText(desc){
  if(!desc) return null;
  if(!CLUB_BY_NAME){
    CLUB_BY_NAME = [];
    for(const id of Object.keys(T).map(Number)){
      const full = (city(id) ? city(id) + " " : "") + nm(id);
      CLUB_BY_NAME.push([full.toLowerCase(), id]);
      if(nm(id)) CLUB_BY_NAME.push([nm(id).toLowerCase(), id]);
    }
    CLUB_BY_NAME.sort((a, b) => b[0].length - a[0].length);
  }
  const low = String(desc).toLowerCase();
  for(const [name, id] of CLUB_BY_NAME) if(low.startsWith(name + " ")) return id;
  return null;
}

/* The position MLB names before the player: "optioned CF Junior Perez". A real
   detail, and it costs nothing since the sentence is already in hand. */
function positionFromText(desc){
  const m = String(desc || "").match(/\b(RHP|LHP|C|1B|2B|3B|SS|LF|CF|RF|OF|IF|DH|P)\s+[A-Z]/);
  return m ? m[1] : null;
}

/* An initials disc in the club's colour. Not a likeness — MLB's headshots are
   licensed images and hotlinking them from a hosted page is a different matter
   from reading their stats API, so this is drawn rather than fetched. It earns
   its place by making the feed scannable by shape and colour instead of by
   reading every line.

   Falls back to the club abbreviation when a transaction names no player, which
   happens for coaching and front-office moves. */
function initialsOf(name){
  if(!name) return "";
  /* Suffixes are dropped, but particles are not: "Elly De La Cruz" is ED, not
     EC — lastName() already knows where a surname begins, so reuse it. */
  const parts = String(name).trim().split(/\s+/)
    .filter(p => !/^(jr\.?|sr\.?|i{2,3}|iv|v)$/i.test(p));
  if(!parts.length) return "";
  if(parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  const surname = lastName(parts.join(" "));
  return (parts[0][0] + (surname[0] || parts[parts.length - 1][0])).toUpperCase();
}

/* A hex colour at low opacity, so the disc carries the club's colour as a fill
   rather than only a ring. An outline alone reads as a placeholder. */
function tint(hex, alpha){
  const h = String(hex || "#738E93").replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(x => x + x).join("") : h, 16);
  if(isNaN(n)) return "rgba(115,142,147," + alpha + ")";
  return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255)
    + "," + alpha + ")";
}

function avatar(name, teamId, big, pos){
  const c = teamId ? col(teamId) : "#738E93";
  const txt = initialsOf(name) || (teamId ? ab(teamId).slice(0, 2) : "\u2014");
  return '<span class="avwrap" aria-hidden="true">'
    + '<span class="av' + (big ? " avbig" : "") + '"'
      + ' style="border-color:' + c + ';color:' + c
      + ';background:' + tint(c, big ? 0.18 : 0.12) + '">' + esc(txt) + '</span>'
    + (pos ? '<span class="avpos">' + esc(pos) + '</span>' : "")
    + '</span>';
}

/* A trade moves a player between two clubs, and the sentence makes you work out
   which way. Two discs and an arrow say it at a glance. */
function tradeAvatar(e){
  const to = e.team, from = e.from;
  if(!from || !to || from === to) return avatar(e.person, to, true);
  /* The player's initials, with the direction of the move beneath: the club he
     left, an arrow, the club he joined. */
  const txt = initialsOf(e.person);
  return '<span class="avtrade" aria-hidden="true">'
    + '<span class="av avbig" style="border-color:' + col(to) + ';color:' + col(to)
      + ';background:' + tint(col(to), 0.18) + '">' + esc(txt || "\u21c4") + '</span>'
    + '<span class="avpair">'
      + '<i class="avmini" style="background:' + col(from) + '"></i>'
      + '<i class="avarrow">\u2192</i>'
      + '<i class="avmini" style="background:' + col(to) + '"></i>'
    + '</span></span>';
}

/* The injured list comes in lengths, and they are different news. MLB states
   which in its own wording. */
function ilLength(desc){
  const m = String(desc || "").match(/(\d+)-day/i);
  return m ? m[1] + "-day" : null;
}

/* A short badge from MLB's type and wording. Status Change covers both going
   on the injured list and coming off it, so the description settles which. */
function feedKind(t){
  const d = String((t || {}).typeDesc || "").toLowerCase();
  const note = String((t || {}).description || "").toLowerCase();
  if(d.includes("trade")) return { tag:"trade", tone:"seam" };
  /* "il" as a substring matches Milwaukee, Phillies and available, so the test
     has to be for the phrase MLB actually uses. */
  if(/injured list|\b\d+-day\b|\bIL\b/i.test(note))
    return note.includes("activated") || note.includes("reinstated")
      ? { tag:"back", tone:"grass" } : { tag:"injured", tone:"blush" };
  if(note.includes("activated") || note.includes("reinstated")) return { tag:"back", tone:"grass" };
  if(d.includes("selected") || d.includes("recalled")) return { tag:"called up", tone:"bulb" };
  if(d.includes("optioned") || d.includes("assigned")) return { tag:"sent down", tone:"slate" };
  if(d.includes("designated")) return { tag:"dfa", tone:"slate" };
  if(d.includes("released")) return { tag:"released", tone:"slate" };
  if(d.includes("signed")) return { tag:"signed", tone:"bulb" };
  if(d.includes("claimed")) return { tag:"claimed", tone:"bulb" };
  return { tag:d || "move", tone:"slate" };
}

async function loadFeed(){
  const from = iso(shift(-FEED_DAYS)), to = iso(shift(1));
  let j;
  try{
    j = await getJSON(MLB + "/transactions?sportId=1&startDate=" + from + "&endDate=" + to);
  }catch(e){ return []; }
  const out = [];
  for(const t of j.transactions || []){
    if(!t.description) continue;
    const tid = (t.team || {}).id || clubFromText(t.description);
    out.push({
      id:t.id, date:t.date || t.effectiveDate || "",
      team:T[tid] ? tid : null,
      from:((t.fromTeam || {}).id) || null,
      person:(t.person || {}).fullName || null,
      desc:trimClub(t.description, T[tid] ? tid : null),
      kind:feedKind(t)
    });
  }
  /* MLB files a multi-player trade once per player, each carrying the same
     sentence, so a five-for-one arrived as five identical paragraphs. Collapsed
     to one, with a count of how many players the move covered. */
  const seen = {}, merged = [];
  for(const e of out){
    const key = e.date + "|" + e.desc;
    if(seen[key]){ seen[key].also = (seen[key].also || 0) + 1; continue; }
    seen[key] = e;
    merged.push(e);
  }
  // Newest first; MLB returns them oldest first.
  merged.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  return merged;
}

/* Refetched when the tab is opened and the last read is more than ten minutes
   old. Loading once per session would leave a news feed frozen. */
const FEED_TTL = 10 * 60 * 1000;
async function ensureFeed(){
  if(S.feedState === "loading") return;
  const age = S.feedAt ? Date.now() - S.feedAt : Infinity;
  if(S.feedState === "ready" && age < FEED_TTL) return;
  if(!S.feed.length){ S.feedState = "loading"; render(); }
  const fresh = await loadFeed();
  if(fresh.length || !S.feed.length) S.feed = fresh;   // keep the old list if a refresh fails
  S.feedAt = Date.now();
  S.feedState = "ready";
  S.diag.feed = S.feed.length;
  render();
}

/* Venue coordinates and roof type come from MLB, so no ballpark list is
   hardcoded here and venue changes are picked up automatically. */
async function loadVenues(ids){
  const out = {};
  try{
    const j = await getJSON(MLB + "/venues?hydrate=location,fieldInfo&venueIds=" + ids.join(","));
    for(const v of j.venues || []){
      const c = ((v.location||{}).defaultCoordinates) || {};
      out[v.id] = { id:v.id, name:v.name,
        lat:c.latitude == null ? null : c.latitude,
        lon:c.longitude == null ? null : c.longitude,
        roof:((v.fieldInfo||{}).roofType) || null };
    }
  }catch(e){ /* weather simply stays absent */ }
  return out;
}

/* One request covers every ballpark: Open-Meteo accepts comma-separated
   coordinate lists and returns an array in the same order. */
async function loadWeather(venues){
  const parks = Object.values(venues).filter(v => v.lat != null && v.lon != null);
  if(!parks.length) return {};
  const url = WX
    + "?latitude=" + parks.map(p => p.lat).join(",")
    + "&longitude=" + parks.map(p => p.lon).join(",")
    + "&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,precipitation_probability,surface_pressure"
    + "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=UTC&forecast_days=3";
  let j;
  try{ j = await getJSON(url); }catch(e){ return {}; }
  const arr = Array.isArray(j) ? j : [j];
  const out = {};
  parks.forEach((p,i) => {
    if(arr[i] && arr[i].hourly)
      out[p.id] = { h:arr[i].hourly, elev:arr[i].elevation == null ? null : arr[i].elevation };
  });
  return out;
}

/* Air density from the ideal gas law: rho = P / (R * T), with pressure and
   temperature both measured. Thinner air means less drag and more carry,
   which is the whole story at altitude. 1.225 kg/m3 is the sea-level
   standard, so the percentage is honest physics on real inputs, not an
   invented "carry index". */
const R_AIR = 287.058, RHO0 = 1.225;
/* The sea-level standard is defined at 59F, so nearly every summer game sits
   below it — a 97% threshold flagged fourteen of fifteen and told you only
   that it was July. 90% is the level that actually separates altitude and
   desert heat from ordinary warm weather. */
const THIN_AIR = 90;
function airPct(tempF, hPa){
  if(tempF == null || hPa == null) return null;
  const K = (tempF - 32) * 5/9 + 273.15;
  return (hPa * 100) / (R_AIR * K) / RHO0 * 100;
}
const feet = m => Math.round(m * 3.28084);

/** Conditions at first pitch: the forecast hour nearest the start time. */
function wxAt(venueId, startISO){
  const rec = S.wx[venueId];
  if(!rec || !rec.h || !rec.h.time || !startISO) return null;
  const h = rec.h;
  const target = new Date(startISO).getTime();
  let best = -1, gap = Infinity;
  for(let i = 0; i < h.time.length; i++){
    const d = Math.abs(new Date(h.time[i] + "Z").getTime() - target);
    if(d < gap){ gap = d; best = i; }
  }
  if(best < 0 || gap > 3*3600*1000) return null;
  const temp = h.temperature_2m[best];
  const hPa = (h.surface_pressure || [])[best];
  return { temp, wind:h.wind_speed_10m[best], dir:h.wind_direction_10m[best],
           rain:(h.precipitation_probability||[])[best],
           air:airPct(temp, hPa), elev:rec.elev };
}

const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = deg => COMPASS[Math.round(((deg % 360) / 22.5)) % 16];
const degOf = pt => { const i = COMPASS.indexOf(pt); return i < 0 ? null : i * 22.5; };

/* Compass direction from home plate to centre field, per ballpark.
   Source: Clem's Baseball Architecture, "CF orientation" column, read from
   the current-parks section of the stadium statistics table.

   Keyed by venue name as MLB reports it, lowercased. Renamed parks carry
   both spellings so a rename does not silently break the lookup. Anything
   missing — the Athletics at Sutter Health Park, for one — falls back to the
   raw bearing, which is honest rather than guessed. */
const ORIENT = {
  "fenway park":"NE",                "wrigley field":"NE",
  "dodger stadium":"NNE",            "angel stadium":"NE",
  "kauffman stadium":"NE",           "oriole park at camden yards":"NNE",
  "rate field":"ESE",                "guaranteed rate field":"ESE",
  "rogers centre":"NNW",             "progressive field":"N",
  "coors field":"N",                 "tropicana field":"NE",
  "chase field":"N",                 "t-mobile park":"NE",
  "oracle park":"ESE",               "daikin park":"ENE",
  "minute maid park":"ENE",          "comerica park":"SSE",
  "american family field":"SE",      "pnc park":"ESE",
  "great american ball park":"ESE",  "great american ballpark":"ESE",
  "citizens bank park":"NNE",        "petco park":"N",
  "busch stadium":"NE",              "nationals park":"NNE",
  "yankee stadium":"ENE",            "citi field":"NNE",
  "target field":"E",                "loandepot park":"ESE",
  "truist park":"SSE",               "globe life field":"ENE"
};
const cfBearing = venueName => {
  if(!venueName) return null;
  const pt = ORIENT[venueName.toLowerCase().trim()];
  return pt ? degOf(pt) : null;
};

/* Where the wind is actually pushing the ball, given the park's alignment.
   Open-Meteo reports the bearing wind comes FROM, so it travels toward
   bearing+180. Measured against the home-plate-to-centre axis: negative is
   the left-field side, positive the right. */
const WIND_ZONES = ["out to center","out to right","crossing to right","in from right",
                    "in from center","in from left","crossing to left","out to left"];
function windRelative(fromDeg, cf){
  if(fromDeg == null || cf == null) return null;
  let a = (fromDeg + 180) - cf;
  a = ((a % 360) + 360) % 360;                 // 0–359 clockwise from the CF axis
  return WIND_ZONES[Math.round(a / 45) % 8];
}

/* The same geometry as a number rather than a label: how much of the wind is
   actually pushing toward the outfield, in mph. Positive blows out, negative in,
   and a crosswind lands near zero because it does neither. The eight zones above
   are for reading; this is for arithmetic. */
function windOut(fromDeg, mph, cf){
  if(fromDeg == null || cf == null || mph == null) return null;
  const toward = (fromDeg + 180) * Math.PI / 180;
  return mph * Math.cos(toward - cf * Math.PI / 180);
}

/* ---------------- conditions, as they bear on a home run ----------------
   The app has measured the wind and the air at every ballpark since the weather
   went in, printed both on the card, and never once let them touch the bat pick
   — which is the pick they bear on most. A fly ball at the wall is decided by
   drag and by what the air is doing, and both are known here.

   Air is physics and already computed: density from the measured pressure and
   temperature, as a share of the sea-level standard. Thinner air is less drag
   and more carry, which is the whole of why Coors plays as it does. The
   elasticity below converts a density shortfall into a home run rate, and it is
   set so that Coors on a summer evening — around 85% of standard — lifts the
   rate by roughly a fifth, which is the neighbourhood of that park's measured
   home run factor.

   Wind is a judgement, and a deliberately small one: a percent and a half per
   mph blowing out, capped at a quarter either way, so a 15 mph gale out to
   centre moves the number by about a fifth and a hurricane cannot move it by
   more than a quarter. Published work on Wrigley puts the real effect higher
   than this. Damped on purpose, since the forecast is for first pitch and the
   wind at 9pm is not the wind at 7.

   Neither coefficient is fitted against results, exactly as SP_WEIGHT was not
   before the calibration existed. They are stated here so they can be argued
   with, and the record now grades every pick against the number they produce,
   which is how they will eventually be found wrong. */
const AIR_ELASTICITY = 1.3;
const WIND_PER_MPH = 0.015;
const WIND_CAP = 0.25;

/* What the air is doing across tonight's slate.

   The air term measured every park against the sea-level standard, which is
   defined at 59F — a temperature baseball is rarely played in. So a 95% park
   scored x1.065, a 93% park x1.091, and on a summer slate every single game was
   multiplied upward with nothing pulling the other way. That is a systematic
   inflation of every bat pick, not a park effect.

   Measured against the slate's own mean instead, so Coors is still high and a
   cool coastal evening is genuinely low. The cost is that a night which is hot
   everywhere now reads as neutral rather than raised; the benefit is that the
   term no longer adds several per cent to every number in the app. */
function slateAir(){
  let sum = 0, n = 0;
  for(const g of S.games){
    const w = wxAt(g.venueId, g.start);
    if(w && w.air != null){ sum += w.air; n++; }
  }
  return n >= 3 ? sum / n : null;
}

function hrConditions(g){
  const v = S.venues[g.venueId];
  const w = wxAt(g.venueId, g.start);
  if(!w) return null;
  const roofShut = !!(v && v.roof && /dome|indoor|closed/i.test(v.roof));
  let mult = 1, air = null, out = null;
  const ref = slateAir();
  if(w.air != null && ref != null){
    air = w.air;
    mult *= 1 + AIR_ELASTICITY * ((ref - w.air) / 100);
  } else if(w.air != null){
    air = w.air;          // shown, but nothing to measure it against yet
  }
  /* A closed roof means there is no wind in play, whatever the forecast says
     about the weather outside it. */
  if(!roofShut){
    const cf = cfBearing((v && v.name) || g.venue);
    const o = windOut(w.dir, w.wind, cf);
    if(o != null){
      out = o;
      mult *= 1 + Math.max(-WIND_CAP, Math.min(WIND_CAP, WIND_PER_MPH * o));
    }
  }
  return { mult, air, out, roofShut, temp:w.temp, wind:w.wind, dir:w.dir };
}

async function load(){
  const yr = new Date().getFullYear();
  try{
    const [st, sc] = await Promise.all([
      getJSON(MLB + "/standings?leagueId=103,104&season=" + yr + "&standingsTypes=regularSeason"),
      getJSON(MLB + "/schedule?sportId=1&startDate=" + iso(shift(-1)) + "&endDate=" + iso(shift(2))
              + "&hydrate=team,linescore,probablePitcher,lineups")
    ]);
    const teams = readStandings(st);
    if(Object.keys(teams).length < 20) throw new Error("standings incomplete");
    S.teams = teams;
    S.games = readGames(sc);
    S.phase = "ready"; S.err = null; S.at = new Date(); S.stale = false;
    S.odds = simulate(SIMS);
    saveCache();
    if(!S.baseline) saveBaseline();   // first visit: record the starting point silently
    render();

    /* What a collapsed card shows: score, time, stakes, weather. That is all
       this stage fetches. Starters, power and the model line live behind a
       tap, so their data is fetched on the tap — see loadDetail. */
    if(!Object.keys(S.venues).length){
      const ids = [...new Set(S.games.map(g => g.venueId).filter(Boolean))];
      if(ids.length){ S.venues = await loadVenues(ids); render(); }
    }
    // Ballparks do not move, so venues are fetched once. Weather does.
    const wxAge = S.wxAt ? Date.now() - S.wxAt : Infinity;
    if(Object.keys(S.venues).length && wxAge > 15 * 60 * 1000){
      S.wx = await loadWeather(S.venues); S.wxAt = Date.now(); render();
    }
    // Box scores carry the batter's line and the pitcher's count.
    loadBoxscores();

    /* The live win probability needs each club's scoring rate, which lives in
       the season fetch. Without this it was only ever available after visiting
       another tab, so the bar silently omitted itself on the one screen where
       it matters. Guarded internally, so it runs once. */
    if(S.games.some(g => g.st === "live")) ensureSeason();

    // A live card shows its pitcher without being expanded, so fetch those now.
    if(S.games.some(g => g.st === "live") && !Object.keys(S.pitchers).length){
      const pids = [...new Set(S.games
        .flatMap(g => [g.hProbId, g.aProbId, g.pitcherId]).filter(Boolean))];
      if(pids.length){ S.pitchers = await loadPitchers(pids); render(); }
    }
  }catch(e){
    S.err = e.message;
    if(S.phase !== "ready") S.phase = "error";
    render();
  }
}

/* Everything behind the disclosure: starters with their game logs, the power
   blocks, and the bullpen figures the model line needs. Four requests, two of
   them 750 rows deep — far and away the bulk of this app's traffic, and all of
   it for content that stays folded away until asked for. So it is fetched on
   the first expand, once per session, and rendered as each piece lands. */
/* The season fetch serves two masters: head-to-head records on the cards, and
   the real fixture list the forecast needs. Either tab may ask for it first,
   so it lives behind one guard and recomputes the odds once it lands. */
async function ensureSeason(){
  if(S.remaining) return;
  const season = await loadSeason();
  S.h2h = season.h2h;
  S.series = season.series;
  S.runs = season.runs;
  S.finals = season.finals;
  S.remaining = season.remaining;
  S.park = parkFactors(season.finals);
  if(S.park) S.diag.parks = Object.keys(S.park.factors).length;
  S.diag.h2h = Object.keys(S.h2h).length;
  S.diag.remaining = season.remaining.length;
  if(season.remaining.length > 100) S.odds = simulate(SIMS);   // now schedule-aware
  render();
}

/* Rosters, hitters and bullpens were fetched once and never again. Scores poll
   every thirty seconds and the transactions feed every ten minutes, so the app
   could print a trade in the Feed while still listing the player under his old
   club on the Plays tab — two sets of facts from the same source disagreeing
   because one had an expiry and the other did not. On a phone, where the app sits
   in the background for days rather than being reloaded, that gap only widens.

   Three hours, or any change of date, whichever comes first. The date check is
   the one that matters: most roster moves land overnight. */
const DETAIL_TTL = 3 * 60 * 60 * 1000;

function detailStale(){
  if(S.detailState !== "ready" || !S.detailAt) return false;
  if(S.detailDay && S.detailDay !== iso(new Date())) return true;
  return Date.now() - S.detailAt > DETAIL_TTL;
}

async function loadDetail(){
  if(S.detailState === "loading") return;
  if(S.detailState === "ready"){
    if(!detailStale()) return;
    /* Cleared so the guards below fetch again rather than skipping. Each piece
       re-renders as it lands, the same as on a cold start. */
    S.pitchers = {}; S.bullpens = {}; S.bpLg = null; S.bpLgHr9 = null;
    S.rosters = {}; S.bats = {}; S.hitters = {}; S.teamBat = {}; S.runners = {};
  }
  S.detailState = "loading";
  render();
  try{

  const pids = [...new Set(S.games
    .flatMap(g => [g.hProbId, g.aProbId, g.pitcherId]).filter(Boolean))];

  if(!Object.keys(S.pitchers).length && pids.length){
    S.pitchers = await loadPitchers(pids); render();
  }
  S.diag.pitchers = Object.keys(S.pitchers).length;

  if(pids.length){ S.diag.form = await loadPitcherForm(pids); render(); }

  if(!Object.keys(S.bullpens).length){
    const bp = await loadBullpens();
    S.bullpens = bp.teams; S.bpLg = bp.lg; S.bpLgHr9 = bp.lgHr9; render();
  }
  S.diag.bullpens = Object.keys(S.bullpens).length;

  await ensureSeason();

  if(!Object.keys(S.hitters).length){
    if(!Object.keys(S.rosters).length){
      const r = await loadRosters() || {};
      S.rosters = r.club || {};
      S.bats = r.bats || {};
      S.diag.rosters = Object.keys(S.rosters).length;
      S.diag.bats = Object.keys(S.bats).length;
    }
    const hit = await loadHitters(S.rosters) || {};
    /* Defensive on the way in as well, so a future change to loadHitters cannot
       reintroduce the same failure. */
    S.hitters = hit.byTeam || {};
    S.teamBat = hit.teamBat || {};
    S.runners = hit.runners || {};
    render();
  }
  S.diag.hitters = Object.values(S.hitters).reduce((n,a) => n + a.length, 0);

    S.detailState = "ready";
    S.detailAt = Date.now();
    S.detailDay = iso(new Date());
  }catch(e){
    // Never leave a card stuck on "loading" because one call blew up.
    S.detailState = "error";
  }
  render();
  ensureHitterForm();
}

/* What just happened. MLB names the event and writes the sentence, so the only
   judgement here is which ones are worth colouring. */
function playKind(event){
  const e = String(event == null ? "" : event).toLowerCase();
  if(e.includes("home run")) return { tag:"home run", tone:"seam" };
  if(e === "triple") return { tag:"triple", tone:"bulb" };
  if(e === "double") return { tag:"double", tone:"bulb" };
  if(e === "single") return { tag:"single", tone:"grass" };
  if(e.includes("strikeout")) return { tag:"strikeout", tone:"blush" };
  if(e.includes("walk") || e.includes("hit by pitch")) return { tag:e, tone:"slate" };
  if(e.includes("error")) return { tag:"error", tone:"blush" };
  if(e.includes("stolen base")) return { tag:"steal", tone:"grass" };
  return { tag:e || "play", tone:"slate" };
}

/* Did this line come from someone who actually batted?

   The mirror of pitchedIn, and the same bug: a rostered player who sat comes
   back with an empty batting block, which was being read as a genuine nought
   and marked wrong. Lineups are not published until a few hours before first
   pitch, so the pick is made blind — holding a regular's rest day against it
   grades the manager's decision, not the model's. */
function battedIn(b){
  if(!b) return false;
  if(b.batPA != null) return b.batPA > 0;
  if(b.batAB != null && b.batAB > 0) return true;
  return !!b.today;
}

/* A box-score line belongs to a game as much as to a player, and the two have to
   be looked up together — see loadBoxscores. */
const boxKey = (pk, pid) => String(pk) + ":" + String(pid);

/* Did this line come from someone who actually pitched?

   MLB lists every rostered player in a boxscore, and one who never left the
   bullpen can come back with a zeroed pitching block rather than an absent one.
   The record was reading that nought as a real result and grading it against the
   projection — a starter who was scratched showed up as an eight-strikeout miss,
   which is both wrong about him and quietly ruinous for the strikeout average.

   Batters faced is the cleanest signal; pitches and innings are checked too,
   since a reliever pulled mid-batter can finish with none of the three but is
   still not a scratch if he threw. A genuine nought — took the mound, recorded
   no strikeouts — passes all three and is graded, as it should be. */
function pitchedIn(b){
  if(!b) return false;
  if(b.pBF != null && b.pBF > 0) return true;
  if(b.pitches != null && b.pitches > 0) return true;
  return (inningsOf(b.pIp) || 0) > 0;
}

/* One box score, reduced to what the app uses: each player's season line, what
   he did tonight, and a pitcher's count. Shared by the live poll and by the
   settlement pass that grades finished picks. */
/* Steals are a team event as much as a personal one, and the boxscore already
   totals them per side. Read separately from the per-player map because that map
   is flat by design — it has no idea which club anyone plays for. */
function readSteals(j){
  const side = k => (((((j || {}).teams || {})[k] || {}).teamStats || {}).batting) || {};
  const h = side("home"), a = side("away");
  const n = v => Number(v) || 0;
  return { h:n(h.stolenBases), a:n(a.stolenBases),
           hcs:n(h.caughtStealing), acs:n(a.caughtStealing) };
}

function readBoxscore(j){
  const out = {};
  for(const sideKey of ["home", "away"]){
    const side = (((j || {}).teams || {})[sideKey]) || {};
    for(const key in (side.players || {})){
      const p = side.players[key];
      const id = (p.person || {}).id;
      if(!id) continue;
      const sb = (p.seasonStats || {}).batting || {};
      const tb = (p.stats || {}).batting || {};
      const tp = (p.stats || {}).pitching || {};
      out[id] = {
        avg:sb.avg && sb.avg !== "-" ? sb.avg : null,
        hr:sb.homeRuns != null ? sb.homeRuns : null,
        ops:sb.ops && sb.ops !== "-" ? sb.ops : null,
        today:tb.summary || null,
        todayHr:tb.homeRuns != null ? tb.homeRuns : null,
        /* Whether he came to the plate at all — see battedIn. A pinch runner
           counts as having played but never had a chance to go deep, so plate
           appearances are the measure rather than mere presence. */
        batPA:tb.plateAppearances != null ? tb.plateAppearances : null,
        batAB:tb.atBats != null ? tb.atBats : null,
        batSb:tb.stolenBases != null ? tb.stolenBases : null,
        batH:tb.hits != null ? tb.hits : null,
        batR:tb.runs != null ? tb.runs : null,
        /* MLB has used both names for this field over the years. */
        pitches:tp.numberOfPitches != null ? tp.numberOfPitches
               : tp.pitchesThrown != null ? tp.pitchesThrown : null,
        pIp:tp.inningsPitched || null,
        pEr:tp.earnedRuns != null ? tp.earnedRuns : null,
        pK:tp.strikeOuts != null ? tp.strikeOuts : null,
        /* Whether he took the mound at all, which is a different question from
           what he did there — see pitchedIn. */
        pBF:tp.battersFaced != null ? tp.battersFaced : null
      };
    }
  }
  return out;
}

/* Box scores for games in progress. This is where the batter's season line and
   the pitcher's count live — nothing lighter carries them.

   Throttled to a minute rather than the 30 seconds the scores use, because a
   pitch count 60 seconds old is still useful and each box score is a sizeable
   document. Live games only, never finals. */
async function loadBoxscores(){
  const live = S.games.filter(g => g.st === "live");
  if(!live.length) return;
  const age = S.boxAt ? Date.now() - S.boxAt : Infinity;
  if(age < 60000) return;

  /* Keyed by game and player, not player alone.

     A flat player map was never cleared and never scoped, so a line survived
     from one game to the next and from one day to the next — and settlement,
     looking a player up by id, could grade a pick against work he did somewhere
     else entirely. Scoping the key makes that impossible; pruning to the games
     currently in the window stops it growing without limit. */
  const out = {};
  const keep = new Set(S.games.map(g => String(g.pk)));
  for(const k in S.box) if(keep.has(k.slice(0, k.indexOf(":")))) out[k] = S.box[k];
  const lastPlays = Object.assign({}, S.lastPlay);
  const sb = Object.assign({}, S.steals);
  const CHUNK = 4;
  for(let i = 0; i < live.length; i += CHUNK){
    await Promise.all(live.slice(i, i + CHUNK).map(async g => {
      /* Two documents per live game: the box score for the lines and counts, the
         play-by-play for what just happened. Shared throttle, so a minute apart
         rather than every thirty seconds. */
      try{
        const pbp = await getJSON(MLB + "/game/" + g.pk + "/playByPlay");
        const plays = (pbp && pbp.allPlays) || [];
        for(let n = plays.length - 1; n >= 0; n--){
          const p = plays[n];
          if(!(p.about || {}).isComplete || !(p.result || {}).event) continue;
          lastPlays[g.pk] = {
            event:p.result.event,
            desc:p.result.description || "",
            top:!!(p.about || {}).isTopInning,
            inning:(p.about || {}).inning,
            kind:playKind(p.result.event)
          };
          break;
        }
      }catch(e){ /* the box score below is still worth having */ }

      let j;
      try{ j = await getJSON(MLB + "/game/" + g.pk + "/boxscore"); }catch(e){ return; }
      const one = readBoxscore(j);
      for(const pid in one) out[boxKey(g.pk, pid)] = one[pid];
      sb[g.pk] = readSteals(j);
    }));
  }
  S.box = out;
  S.lastPlay = lastPlays;
  S.steals = sb;
  S.boxAt = Date.now();
  S.diag.box = Object.keys(out).length;
  render();
}

/* ============================== forecast ============================= */

function simulate(sims, tweak){
  const clubs = list();
  const rate = {}, base = {}, rem = {}, lg10 = {};
  for(const t of clubs){
    const p = teamRate(t);
    rate[t.id] = p;
    lg10[t.id] = Math.log(p / (1 - p));            // log-odds, for head to head
    const bump = tweak && tweak.id === t.id;
    base[t.id] = t.w + (bump ? tweak.add : 0);
    rem[t.id] = Math.max(0, left(t) - (bump ? 1 : 0));
  }

  /* With the real fixture list, each remaining game is played between the two
     clubs actually involved, with a home edge — so a hard September counts
     against you and an easy one does not. Without it, every club plays a
     generic average opponent, which is the fallback. */
  const sched = S.remaining;
  const useSched = Array.isArray(sched) && sched.length > 100;
  let pre = null, skip = -1;
  if(useSched){
    if(tweak){
      skip = sched.findIndex(g => g.hid === tweak.id || g.aid === tweak.id);
    }
    pre = sched.map(g => ({
      hid:g.hid, aid:g.aid,
      p:1 / (1 + Math.exp(-(lg10[g.hid] - lg10[g.aid] + HFA)))
    }));
  }

  const div = {}, berth = {}, top = {}, tot = {}, hist = {};
  for(const t of clubs){
    div[t.id]=0; berth[t.id]=0; top[t.id]=0; tot[t.id]=0;
    hist[t.id] = new Array(SEASON_GAMES + 1).fill(0);
  }
  const leagues = {AL:clubs.filter(t=>DIV[t.div][0]==="AL"), NL:clubs.filter(t=>DIV[t.div][0]==="NL")};
  const wins = {}, key = {};

  for(let s = 0; s < sims; s++){
    if(pre){
      for(const t of clubs) wins[t.id] = base[t.id];
      for(let i = 0; i < pre.length; i++){
        if(i === skip) continue;                   // the game the tweak fixes
        const g = pre[i];
        if(Math.random() < g.p) wins[g.hid]++; else wins[g.aid]++;
      }
      for(const t of clubs){ tot[t.id] += wins[t.id]; hist[t.id][wins[t.id]]++; }
    } else {
      for(const t of clubs){
        let w = base[t.id];
        const p = rate[t.id], n = rem[t.id];
        for(let g = 0; g < n; g++) if(Math.random() < p) w++;
        wins[t.id] = w; tot[t.id] += w; hist[t.id][w]++;
      }
    }
    for(const lg of ["AL","NL"]){
      const pool = leagues[lg];
      for(const t of pool) key[t.id] = wins[t.id] + Math.random()*0.5;  // coin-flip ties
      const champs = [];
      for(const d of DIVS[lg]){
        let best = null;
        for(const t of pool){ if(t.div !== d) continue;
          if(!best || key[t.id] > key[best.id]) best = t; }
        if(best){ champs.push(best); div[best.id]++; berth[best.id]++; }
      }
      const field = pool.filter(t => !champs.includes(t)).sort((a,b) => key[b.id]-key[a.id]);
      for(let k = 0; k < 3 && k < field.length; k++) berth[field[k].id]++;
      champs.sort((a,b) => key[b.id]-key[a.id]);
      if(champs.length) top[champs[0].id]++;
    }
  }
  /* Read a percentile straight off the histogram: walk up the win totals
     until the requested share of simulated seasons is behind you. */
  const pctileOf = (h, q) => {
    const target = q * sims;
    let acc = 0;
    for(let w = 0; w < h.length; w++){ acc += h[w]; if(acc >= target) return w; }
    return h.length - 1;
  };

  const o = {};
  for(const t of clubs){
    const h = hist[t.id];
    o[t.id] = { div:div[t.id]/sims, berth:berth[t.id]/sims,
                top:top[t.id]/sims, projWins:tot[t.id]/sims,
                p10:pctileOf(h, 0.10), p50:pctileOf(h, 0.50), p90:pctileOf(h, 0.90) };
  }
  return o;
}

/* ---------------- recency ----------------
   Recent form is already inside the season figures, so weighting it means
   counting those games more than once. RECENCY_W is how many extra times.

   Set to 1: a club's last ten and a starter's last three outings count twice
   over. Modest on purpose. A hot fortnight feels more predictive than it is,
   and over-weighting it is the usual way to make a forecast worse. */
const RECENCY_W = 1;   // the recent stretch counts twice over, not more

/* Surnames only where space is tight. Two awkward cases: compound names like
   "De La Cruz", which need the particles kept, and suffixes like "Jr." which
   must be dropped first or they become the whole name. */
function lastName(full){
  if(!full) return "";
  let parts = String(full).trim().split(/\s+/);
  const suffix = [];
  while(parts.length > 1 && /^(jr\.?|sr\.?|i{2,3}|iv|v)$/i.test(parts[parts.length - 1])){
    suffix.unshift(parts.pop());
  }
  if(parts.length < 2) return [parts[0] || "", ...suffix].join(" ").trim();
  let i = parts.length - 1;
  while(i > 0 && /^(de|del|la|le|van|von|da|dos|di)$/i.test(parts[i-1])) i--;
  return [...parts.slice(i), ...suffix].join(" ");
}

const pairOf = s => {
  if(!s) return null;
  const m = String(s).match(/^(\d+)-(\d+)$/);
  return m ? { w:Number(m[1]), l:Number(m[2]) } : null;
};

/* ---------------- Pythagorean expectation ----------------
   A record is a noisy read on strength. Two clubs at 55-50 are not the same
   club if one got there on blowout wins and one-run losses, and the calibration
   said as much: records alone lost to simply knowing who was at home. Run
   differential separates them, and is the oldest well-attested improvement on
   W-L there is.

   The exponent is the conventional 1.83. Nothing here is asserted to work —
   USE_PYTH is a hypothesis, and the calibration on the Odds tab now runs the
   season both ways and reports which won. If run differential loses there, set
   this to false and the app goes back to records. */
const USE_PYTH = true;

/* Whether a club's record is in the single-game model at all.

   The calibration has said something awkward twice over and it has not been
   acted on. Records alone failed to beat knowing who was at home; starters were
   the only component that beat that baseline; and the sweep's preferred
   regression was 4,000, which is a polite arithmetic way of saying ignore
   records. Meanwhile the model still regresses by 400 and stacks recency,
   bullpens and Pythagorean expectation on top of a term the season says is
   worthless.

   So this is a switch, and the calibration now scores all four combinations of
   records and starters against the home-field baseline. If the lean model does as
   well, most of the machinery above is decoration and this should be false. That
   would be a finding, not a failure. */
const USE_TEAM = true;
const PYTH_EXP = 1.83;

function pythPct(rs, ra){
  if(!(rs > 0) || !(ra > 0)) return null;
  const a = Math.pow(rs, PYTH_EXP), b = Math.pow(ra, PYTH_EXP);
  return a + b > 0 ? a / (a + b) : null;
}

/* The wins a club's run differential says it should have, over the games it has
   actually played — so it drops into the same regression as a real win count
   and the two are directly comparable. Null whenever runs are not loaded yet,
   in which case every caller falls back to the record. */
function pythWins(id){
  const r = S.runs[id];
  if(!r || !r.g) return null;
  const p = pythPct(r.rs, r.ra);
  return p == null ? null : { w:p * r.g, g:r.g };
}

/* A club's true rate: its strength over the season, plus its last ten counted
   again K times, then regressed toward .500. Strength is run differential where
   the season figures have loaded and the plain record otherwise. */
function teamRate(t, regress){
  const R = regress == null ? REGRESS_SEASON : regress;
  const k = RECENCY_W;
  const ten = pairOf(t.l10);
  const addW = ten ? k * ten.w : 0;
  const addG = ten ? k * (ten.w + ten.l) : 0;
  const eff = USE_PYTH ? pythWins(t.id) : null;
  const w = eff ? eff.w : t.w;
  const g = eff ? eff.g : t.w + t.l;
  return (w + addW + R / 2) / (g + addG + R);
}

/* A starter's effective ERA, with his last three outings counted again K
   times. Earned runs are recovered from the rate and the innings, so the blend
   is over actual runs rather than an average of two averages. */
function starterEra(p){
  if(!p || p.era == null) return null;
  const k = RECENCY_W;
  if(!p.form || !p.ip) return p.era;
  const seasonER = p.era * p.ip / 9;
  const recentER = p.form.era * p.form.ip / 9;
  const ip = p.ip + k * p.form.ip;
  return ip > 0 ? (seasonER + k * recentER) * 9 / ip : p.era;
}

/* ---------------- game projection ----------------
   A Bradley-Terry comparison of two clubs on the log-odds scale: each side's
   regressed winning percentage, a home edge, and a damped adjustment for the
   gap between the two starters' ERAs.

   SP_WEIGHT is a judgement call, not a fitted parameter. It is set so a full
   run of ERA advantage moves the line about two and a half points, which is
   deliberately conservative — ERA is noisy, it carries the team's defence
   inside it, and a starter throws only part of the game. Nothing here is
   calibrated against outcomes, because this build has no way to backtest. */
function project(g){
  const h = S.teams[g.hid], a = S.teams[g.aid];
  if(!h || !a) return null;
  const lg = p => Math.log(p / (1 - p));

  let d = HFA;
  let usedTeam = false;
  if(USE_TEAM){
    d += lg(teamRate(h, REGRESS_GAME)) - lg(teamRate(a, REGRESS_GAME));
    usedTeam = true;
  }

  const hp = S.pitchers[g.hProbId], ap = S.pitchers[g.aProbId];
  const hEra = starterEra(hp), aEra = starterEra(ap);
  let usedSP = false, usedBP = false;
  if(hEra != null && aEra != null){
    const gap = Math.max(-SP_CAP, Math.min(SP_CAP, aEra - hEra));
    d += SP_WEIGHT * gap;
    usedSP = true;
  }

  const homeBp = S.bullpens[g.hid], awayBp = S.bullpens[g.aid];
  if(homeBp && awayBp){
    const gap = Math.max(-BP_CAP, Math.min(BP_CAP, awayBp.era - homeBp.era));
    d += BP_WEIGHT * gap;
    usedBP = true;
  }

  const pHome = 1 / (1 + Math.exp(-d));
  return { pHome, pAway:1 - pHome, usedTeam, usedSP, usedBP };
}

/* Fair American odds. The two sides sum to 100%, so unlike a real book there
   is no margin baked in — which is exactly why these will not match a
   sportsbook even when the underlying view agrees. */
function american(p){
  if(p <= 0 || p >= 1) return "";
  const raw = p >= 0.5 ? -(100 * p / (1 - p)) : 100 * (1 - p) / p;
  const r = Math.round(Math.abs(raw) / 5) * 5;
  return (raw < 0 ? "\u2212" : "+") + r;
}

function projectionBlock(g){
  if(g.st !== "sched") return "";
  const pr = project(g);
  if(!pr) return "";
  const row = (teamId, p) => '<div class="mlrow">'
    + '<span class="tbar" style="background:' + col(teamId) + '" aria-hidden="true"></span>'
    + '<span class="pname">' + ab(teamId) + '<em>' + esc(nm(teamId)) + '</em></span>'
    + '<span class="mlpct">' + Math.round(p * 100) + '%</span>'
    + '<span class="mlodds">' + american(p) + '</span></div>';
  const inputs = [];
  if(pr.usedTeam) inputs.push("records");
  if(pr.usedSP) inputs.push("starters");
  if(pr.usedBP) inputs.push("bullpens");
  const label = !inputs.length ? "home field only"
    : inputs.length === 1 ? inputs[0] + " only"
    : inputs.slice(0, -1).join(", ") + " and " + inputs[inputs.length - 1];
  return '<div class="pblock">'
    + '<h5 class="plabel">Model line · ' + label
      + (S.calFit ? ' · calibrated' : "") + '</h5>'
    + row(g.aid, 1 - calibrate(pr.pHome)) + row(g.hid, calibrate(pr.pHome)) + '</div>';
}

/* The bats that can end an at-bat in one swing, against the arm they face.
   Deliberately rates rather than a probability: "one per 18 plate
   appearances" is what has happened, and it cannot be mistaken for a
   forecast the way "9% tonight" would be.

   Each club gets a header naming the opposing starter, so the group of
   hitters underneath is unambiguously the group facing that arm. */
function powerBlock(g){
  if(g.st !== "sched") return "";
  const side = (teamId, oppPid) => {
    const bats = (S.hitters[teamId] || []).slice(0, 5);
    if(!bats.length) return "";
    const opp = S.pitchers[oppPid];
    /* The opposing club is whoever's starter this is. */
    const oppTeam = teamId === g.aid ? g.hid : g.aid;
    const pen = (S.bullpens[oppTeam] || {}).hr9;
    const facing = opp && opp.hr9 != null
      ? 'vs ' + esc((opp.name || "").split(" ").slice(-1)[0])
        + ' <b>' + opp.hr9.toFixed(1) + '</b>'
        + (pen != null ? ' \u00b7 pen <b>' + pen.toFixed(1) + '</b>' : "") + ' HR/9'
      : (opp && opp.name ? 'vs ' + esc(opp.name.split(" ").slice(-1)[0]) : "");
    return '<div class="clubhead">'
      + '<span class="tbar" style="background:' + col(teamId) + '" aria-hidden="true"></span>'
      + '<span class="clubab">' + ab(teamId) + '</span>'
      + '<span class="facing">' + facing + '</span></div>'
      + '<div class="batrow bathead"><span></span><span></span>'
        + '<span>season</span><span>pa/hr</span><span>last 5</span></div>'
      + bats.map(b => {
        const f = S.hitterForm[b.id];
        /* One row per hitter, not two. Surname only, and the last five
           compressed to its two useful figures — the height of this block was
           swallowing the whole screen. */
        const l5 = f
          ? '<b' + (f.hr > 0 ? ' class="hot"' : '') + '>' + f.hr + '</b>'
            + (f.avg != null ? ' ' + f.avg.toFixed(3).replace(/^0/, "") : "")
          : '<span class="dash">\u2014</span>';
        return '<div class="batrow">'
          + '<span class="bdash" aria-hidden="true"></span>'
          + '<span class="bname">' + esc(lastName(b.name)) + '</span>'
          + '<span class="bhr">' + b.hr + ' HR</span>'
          + '<span class="brate">1/' + Math.round(b.perPA) + '</span>'
          + '<span class="bl5" title="last 5 games">' + l5 + '</span></div>';
      }).join("");
  };
  // Visitors bat against the home starter, and the reverse.
  const away = side(g.aid, g.hProbId), home = side(g.hid, g.aProbId);
  if(!away && !home) return "";
  return '<div class="pblock"><h5 class="plabel">Power on show</h5>'
    + away + (away && home ? '<div class="clubgap"></div>' : "") + home + '</div>';
}

/* What has happened on the bases tonight. Shown only once something has, so a
   game with no running game does not carry an empty row saying nothing. Caught
   stealing is included because a club 0-for-2 has been running too, and that is
   as much a fact about the game as two clean steals. */
function stealLine(g){
  if(g.st !== "live" && g.st !== "final") return "";
  const s = S.steals[g.pk];
  if(!s) return "";
  const total = s.h + s.a + s.hcs + s.acs;
  if(!total) return "";
  /* Attempts rather than a bare count, so a club running twice and failing twice
     does not read as a club that never left first. */
  const side = (id, sb, cs) => ab(id) + ' <b>' + sb + '</b>'
    + (cs ? '<i> of ' + (sb + cs) + '</i>' : "");
  return '<div class="bpline sb"><em>steals</em>'
    + side(g.aid, s.a, s.acs) + ' \u00b7 ' + side(g.hid, s.h, s.hcs) + '</div>';
}

/* Who runs, before the game gives you anything to look at. The counterpart to
   Power on show, and read the same way: what has already happened, at a rate,
   not a forecast. A club's own total sits alongside so three names can be placed
   against how much running the lineup does as a whole. */
function basepathBlock(g){
  if(g.st !== "sched") return "";
  const side = teamId => {
    const rs = S.runners[teamId] || [];
    const tb = S.teamBat[teamId];
    /* A club that never runs still gets its header. Dropping it left the block
       showing one side of a two-sided matchup with no hint why. */
    if(!rs.length && !tb) return "";
    return '<div class="clubhead">'
      + '<span class="tbar" style="background:' + col(teamId) + '" aria-hidden="true"></span>'
      + '<span class="clubab">' + ab(teamId) + '</span>'
      + '<span class="facing">' + (tb && tb.sb != null
          ? '<b>' + tb.sb + '</b> SB as a club'
            + (tb.sbRate != null ? ' \u00b7 ' + Math.round(tb.sbRate * 100) + '%' : "")
          : "") + '</span></div>'
      + (rs.length
          ? '<div class="batrow bathead"><span></span><span></span>'
              + '<span>sb</span><span>att</span><span>rate</span></div>'
            + rs.map(r => '<div class="batrow">'
                + '<span class="bdash" aria-hidden="true"></span>'
                + '<span class="bname">' + esc(lastName(r.name)) + '</span>'
                + '<span class="bhr">' + r.sb + '</span>'
                + '<span class="brate">' + r.att + '</span>'
                + '<span class="bl5"><b' + (r.rate >= 0.8 ? ' class="hot"' : '') + '>'
                  + Math.round(r.rate * 100) + '%</b></span></div>').join("")
          : '<div class="batrow"><span class="bdash" aria-hidden="true"></span>'
            + '<span class="bname">no regular base stealer</span>'
            + '<span class="bhr"></span><span class="brate"></span>'
            + '<span class="bl5"></span></div>');
  };
  const away = side(g.aid), home = side(g.hid);
  if(!away && !home) return "";
  return '<div class="pblock"><h5 class="plabel">On the basepaths</h5>'
    + away + (away && home ? '<div class="clubgap"></div>' : "") + home + '</div>';
}

/* ============================== rendering =========================== */

const SEAM = '<svg class="seamrule" viewBox="0 0 320 14" preserveAspectRatio="none" aria-hidden="true">'
  + '<path d="M0 9 C 80 -1, 240 -1, 320 9" stroke="#C8102E" stroke-width="1.6" fill="none" stroke-dasharray="1.5 5" stroke-linecap="round"/>'
  + '<path d="M0 5 C 80 15, 240 15, 320 5" stroke="#C8102E" stroke-width="1.6" fill="none" stroke-dasharray="1.5 5" stroke-linecap="round"/></svg>';

const BALL = '<svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true">'
  + '<circle cx="20" cy="20" r="18.5" fill="#F2F0E6"/>'
  + '<path d="M9 4.5 C16.5 13, 16.5 27, 9 35.5" stroke="#C8102E" stroke-width="1.7" fill="none" stroke-dasharray="1 3.4" stroke-linecap="round"/>'
  + '<path d="M31 4.5 C23.5 13, 23.5 27, 31 35.5" stroke="#C8102E" stroke-width="1.7" fill="none" stroke-dasharray="1 3.4" stroke-linecap="round"/></svg>';

/* Wind arrow points the way the wind is going, i.e. bearing + 180. */
const windArrow = deg => '<svg class="arrow" viewBox="0 0 20 20" aria-hidden="true" '
  + 'style="transform:rotate(' + (((deg||0)+180)%360) + 'deg)">'
  + '<path d="M10 2 L14.5 12 L10 9.6 L5.5 12 Z"/></svg>';

/* Bases, with home plate included. Without it three floating squares do not
   read as an infield — home is the anchor that makes the shape legible. The
   label spells out the state, since the shape alone conveys nothing to a
   screen reader. */
function basesText(on){
  const b = Array.isArray(on) ? on : [];
  const names = ["first","second","third"].filter((_,i) => b[i]);
  if(!names.length) return "Bases empty";
  if(names.length === 3) return "Bases loaded";
  return "Runner" + (names.length > 1 ? "s" : "") + " on "
    + (names.length === 2 ? names.join(" and ") : names[0]);
}

function diamond(on){
  const b = Array.isArray(on) ? on : [];
  const bases = [[0,-9,b[1]],[9,0,b[0]],[-9,0,b[2]]];
  const sq = (x,y,filled) =>
    '<rect x="' + (x-4) + '" y="' + (y-4) + '" width="8" height="8" transform="rotate(45 '
    + x + ' ' + y + ')" fill="' + (filled ? "#F5B841" : "none") + '" stroke="'
    + (filled ? "#F5B841" : "#3A5A60") + '" stroke-width="1.4"/>';
  return '<svg width="38" height="38" viewBox="0 0 38 38" role="img" aria-label="'
    + basesText(b) + '">'
    + '<g transform="translate(19,17)">'
    + '<path d="M-9 0 L0 -9 L9 0 L0 9 Z" fill="none" stroke="#1C3A40" stroke-width="1"/>'
    + bases.map(([x,y,f]) => sq(x,y,f)).join("")
    + '<path d="M-3.2 9 L0 6 L3.2 9 L3.2 12 L-3.2 12 Z" fill="#2A4A50"/>'
    + '</g></svg>';
}

/* The batter's season line, when a box score has been read. */
function batLine(pk, id){
  const b = id != null ? S.box[boxKey(pk, id)] : null;
  if(!b) return "";
  const bits = [];
  if(b.avg) bits.push(b.avg);
  if(b.hr != null) bits.push(b.hr + " HR");
  if(b.today) bits.push(b.today);
  return bits.length ? ' <i class="batline">' + esc(bits.join(" \u00b7 ")) + '</i>' : "";
}

/* Tonight's work for whoever is pitching: count first, since that is the one
   that tells you the bullpen is coming. */
function pitchLine(pk, id){
  const b = id != null ? S.box[boxKey(pk, id)] : null;
  if(!b) return "";
  const bits = [];
  if(b.pitches != null) bits.push(b.pitches + " pitches");
  if(b.pIp) bits.push(b.pIp + " IP");
  if(b.pEr != null) bits.push(b.pEr + " ER");
  if(b.pK != null) bits.push(b.pK + " K");
  return bits.length
    ? '<div class="formline"><em>tonight</em>' + esc(bits.join(" \u00b7 ")) + '</div>' : "";
}

function inningText(g){
  if(!g.ord) return "Live";
  const h = (g.half||"").toLowerCase();
  if(h === "middle") return "Mid " + g.ord;
  if(h === "end") return "End " + g.ord;
  return (h === "bottom" ? "Bot " : "Top ") + g.ord;
}

/* Baseball is played in series, not as isolated games.

   Two things this has to get right. First, a four- or five-game set can start
   before the app's four-day window, so the tally comes from the full season
   fetch where available and falls back to the window until that lands.

   Second, whether the game in front of you counts. For one still to come, the
   record is the state going in. For one already final, leaving it out reads as
   nonsense — you have just watched a team win and the line says they trail. So
   a finished game counts itself. */
function seriesLine(g){
  if(!g.sg || !g.gis || g.gis < 2) return "";
  const key = h2hKey(g.hid, g.aid);
  const seasonList = S.series[key];
  const inclusive = g.st === "final";
  const DAYS = 7 * 24 * 3600 * 1000;
  const when = g.date ? new Date(g.date).getTime() : null;

  let h = 0, a = 0, counted = 0;
  if(Array.isArray(seasonList) && seasonList.length && when != null){
    for(const x of seasonList){
      if(x.sg == null) continue;
      if(inclusive ? x.sg > g.sg : x.sg >= g.sg) continue;
      if(Math.abs(new Date(x.date).getTime() - when) > DAYS) continue;   // same set only
      if(x.winner === g.hid) h++; else a++;
      counted++;
    }
  } else {
    // Fallback: the games held in the current window.
    const samePair = x => (x.hid === g.hid && x.aid === g.aid)
      || (x.hid === g.aid && x.aid === g.hid);
    for(const x of S.games){
      if(!samePair(x) || x.st !== "final" || x.sg == null) continue;
      if(inclusive ? x.sg > g.sg : x.sg >= g.sg) continue;
      if(x.hs === x.as) continue;
      if((x.hs > x.as ? x.hid : x.aid) === g.hid) h++; else a++;
      counted++;
    }
  }

  let txt = "Game " + g.sg + " of " + g.gis;
  if(counted){
    txt += h === a
      ? " · series level " + h + "\u2013" + a
      : " · " + ab(h > a ? g.hid : g.aid) + " lead "
        + Math.max(h,a) + "\u2013" + Math.min(h,a);
  } else if(g.sg === 1){
    txt += " · opener";
  } else if(g.sg === g.gis){
    txt += " · finale";
  }
  return '<div class="serieslabel">' + txt + '</div>';
}

function stakes(g){
  const h = S.teams[g.hid], a = S.teams[g.aid];
  if(!h || !a) return null;
  if(h.div === a.div){
    const lead = inDiv(h.div)[0];
    if(lead && gbTo(h,lead) <= 4 && gbTo(a,lead) <= 4)
      return ["seam", DIV[h.div][0] + " " + DIV[h.div][1] + " stakes"];
    return ["slate","Division rival"];
  }
  if(pct(h) >= .54 && pct(a) >= .54) return ["bulb","Two contenders"];
  return null;
}

function side(id, runs, hits, won, blank, batting){
  const t = S.teams[id], c = col(id);
  // The run total carries the club's colour. The leader also gets a glow in
  // that colour, so who is ahead still reads instantly on a dark panel.
  const runStyle = blank ? ""
    : ' style="color:' + c + (won ? ';text-shadow:0 0 15px ' + c + '66' : '') + '"';
  const runLabel = blank ? "" : ' aria-label="' + nm(id) + ' ' + runs
    + (runs === 1 ? " run" : " runs") + (won ? ", leading" : "") + '"';
  return '<div class="srow' + (won ? " win" : "") + '">'
    + '<span class="tbar" style="background:' + c + '" aria-hidden="true"></span>'
    + '<span class="sabbr">' + ab(id)
      + (batting ? '<i class="atbat" role="img" aria-label="at bat"></i>' : "") + '</span>'
    + '<span class="sname">' + esc(nm(id)) + '</span>'
    + '<span class="srec">' + (t ? t.w + "–" + t.l : "") + '</span>'
    + '<span class="shits">' + (hits == null ? "" : hits) + '</span>'
    + '<span class="sruns"' + runStyle + runLabel + '>' + (blank ? "" : runs) + '</span></div>';
}

function weatherStrip(g){
  const v = S.venues[g.venueId];
  const roof = v && v.roof ? v.roof : null;
  const shut = roof && /dome|indoor|closed/i.test(roof);
  const w = wxAt(g.venueId, g.start);
  if(!w && !roof) return "";
  const air = w && w.air != null
    ? '<span class="wxbit' + (w.air <= THIN_AIR ? ' thin' : '') + '"><b>' + Math.round(w.air)
      + '%</b> air' + (w.elev != null && w.elev > 300 ? ' · ' + feet(w.elev).toLocaleString() + ' ft' : "")
      + '</span>'
    : "";
  if(shut){
    return '<div class="wx"><span class="wxbit">Roof closed — no wind in play</span>' + air
      + '<span class="wxroof shut">' + esc(roof) + '</span></div>';
  }
  if(!w) return "";
  const rel = windRelative(w.dir, cfBearing((v && v.name) || g.venue));
  const gust = w.wind >= 12;
  return '<div class="wx">'
    + '<span class="wxtemp">' + Math.round(w.temp) + '°</span>'
    + '<span class="wxbit' + (gust && rel && /^out/.test(rel) ? ' thin' : '') + '">'
      + windArrow(w.dir) + '<b>' + Math.round(w.wind) + '</b> mph '
      + (rel ? rel : "from " + compass(w.dir)) + '</span>'
    + air
    + (w.rain != null && w.rain >= 25 ? '<span class="wxbit"><b>' + w.rain + '%</b> rain</span>' : "")
    + (roof ? '<span class="wxroof">' + esc(roof) + '</span>' : "")
    + '</div>';
}

function pill(label, val, dp, hot){
  if(val == null || isNaN(val)) return "";
  return '<span class="pill' + (hot ? " hot" : "") + '"><b>'
    + val.toFixed(dp) + '</b>' + label + '</span>';
}

/* A starter's season line. Falls back to the bare name when MLB has no
   stats yet — a debut, or a reliever with no starts — rather than showing
   zeros that would read as a pitcher who has been shelled. */
function pitcherLine(teamId, pid, fallbackName){
  const p = S.pitchers[pid] || null;
  const name = (p && p.name) || fallbackName;
  if(!name) return "";
  const bits = [ab(teamId)];
  if(p && p.hand) bits.push(p.hand + "HP");
  if(p && p.ip) bits.push(p.ip.toFixed(0) + " IP");
  const stats = p
    ? pill("ERA", p.era, 2) + pill("WHIP", p.whip, 2) + pill("K/9", p.k9, 1)
      + pill("HR/9", p.hr9, 1, p.hr9 != null && p.hr9 >= 1.3)
    : "";
  const f = p && p.form;
  const formLine = f
    ? '<div class="formline"><em>last ' + f.n + (f.n === 1 ? " start" : " starts") + '</em>'
      + '<b>' + f.era.toFixed(2) + '</b> ERA · ' + ipText(f.ip) + ' IP · '
      + f.k + ' K · ' + f.bb + ' BB · ' + f.hr + ' HR</div>'
    : "";
  return '<div class="pline">'
    + '<span class="tbar" style="background:' + col(teamId) + '" aria-hidden="true"></span>'
    + '<span class="pname">' + esc(name) + '<em>' + bits.join(" · ") + '</em></span>'
    + '<span class="prec">' + (p && p.w != null ? p.w + "–" + p.l : "") + '</span></div>'
    + '<div class="pills">' + (stats || '<span class="pill">no season line yet</span>') + '</div>'
    + formLine;
}

function starters(g){
  if(!g.aProb && !g.hProb && !g.aProbId && !g.hProbId) return "";
  const bp = (teamId) => {
    const b = S.bullpens[teamId];
    return b ? ab(teamId) + ' <b>' + b.era.toFixed(2) + '</b>' : "";
  };
  const a = bp(g.aid), h = bp(g.hid);
  const lgTxt = S.bpLg != null ? ' \u00b7 lg ' + S.bpLg.toFixed(2) : "";

  // Season series so far, if these two have met.
  const rec = S.h2h[h2hKey(g.hid, g.aid)];
  const hw = rec ? (rec[g.hid] || 0) : 0, aw = rec ? (rec[g.aid] || 0) : 0;
  const h2h = (hw + aw) > 0
    ? '<div class="bpline"><em>season series</em>'
      + ab(g.aid) + ' <b class="' + (aw > hw ? "up" : "") + '">' + aw + '</b>'
      + ' \u00b7 ' + ab(g.hid) + ' <b class="' + (hw > aw ? "up" : "") + '">' + hw + '</b>'
      + (hw === aw ? ' \u00b7 level' : "") + '</div>'
    : "";
  return '<div class="pblock"><h5 class="plabel">Starters</h5>'
    + pitcherLine(g.aid, g.aProbId, g.aProb)
    + pitcherLine(g.hid, g.hProbId, g.hProb)
    + (a && h ? '<div class="bpline"><em>bullpen era</em>' + a + ' \u00b7 ' + h + lgTxt + '</div>' : "")
    + h2h
    + '</div>';
}

/* Whoever is throwing right now. The defence is the side not batting. */
function onMound(g){
  if(g.st !== "live" || (!g.pitcherId && !g.pitcher)) return "";
  const teamId = /top/i.test(g.half || "") ? g.hid : g.aid;
  return '<div class="pblock"><h5 class="plabel">On the mound</h5>'
    + pitcherLine(teamId, g.pitcherId, g.pitcher)
    + pitchLine(g.pk, g.pitcherId) + '</div>';
}

/* The detail blocks are the bulk of a card's height, so they fold away by
   default. Score, time and conditions stay visible — enough to scan fifteen
   games — and one tap opens the rest. */
function detail(g){
  const open = !!S.open[g.pk];
  const label = open
    ? '<span>Less</span><i class="chev" aria-hidden="true">\u25B4</i>'
    : '<span>Starters · power · bases · model line</span><i class="chev" aria-hidden="true">\u25BE</i>';
  const toggle = '<button class="disc" data-toggle="' + g.pk + '" aria-expanded="' + open + '">'
    + label + '</button>';
  if(!open) return toggle;

  const inner = starters(g) + powerBlock(g) + basepathBlock(g) + projectionBlock(g);
  if(inner) return inner + toggle;
  // Expanded but the deferred fetch has not landed yet.
  return '<div class="pblock waiting">'
    + (S.detailState === "error"
        ? "Could not load starters and hitters."
        : "Loading starters, power and the model line\u2026")
    + '</div>' + toggle;
}

/* A bar for the live win probability, split at the current split. */
/* The last completed play, in MLB's words. Trimmed of the leading batter name
   where the badge and the description would otherwise repeat it. */
function lastPlayLine(g){
  if(g.st !== "live") return "";
  const p = S.lastPlay[g.pk];
  if(!p || !p.desc) return "";
  return '<div class="lastplay">'
    + '<span class="chip ' + p.kind.tone + '">' + esc(p.kind.tag) + '</span>'
    + '<span class="lpwhen">' + (p.top ? "T" : "B") + p.inning + '</span>'
    + '<p class="lpdesc">' + esc(p.desc) + '</p>'
    + '</div>';
}

function liveOdds(g){
  const w = liveWinProb(g);
  if(!w) return "";
  /* A game in progress is never settled, so the display never says 0 or 100. */
  const raw = Math.round(w.pHome * 100);
  const hp = Math.min(99, Math.max(1, raw)), ap = 100 - hp;
  const lead = hp >= ap ? g.hid : g.aid;
  return '<div class="liveodds">'
    + '<div class="lobar" role="img" aria-label="Win probability: '
      + esc(nm(g.aid)) + ' ' + ap + ' percent, ' + esc(nm(g.hid)) + ' ' + hp + ' percent">'
      + '<i style="width:' + ap + '%;background:' + col(g.aid) + '"></i>'
      + '<i style="width:' + hp + '%;background:' + col(g.hid) + '"></i>'
    + '</div>'
    + '<div class="lolabels"><span>' + ab(g.aid) + ' ' + ap + '%</span>'
    + '<em>win probability</em>'
    + '<span>' + ab(g.hid) + ' ' + hp + '%</span></div>'
    + '</div>';
}

function gameCard(g){
  const blank = g.st === "sched" || g.st === "off";
  const tag = stakes(g);
  const homeBats = g.st === "live" && /bottom/i.test(g.half||"");
  const awayBats = g.st === "live" && /top/i.test(g.half||"");
  let head = "";
  const dl = g.delay;
  if(g.st === "off")
    head = '<span class="glabel warn">' + esc(g.detail || "Postponed") + '</span>';
  else if(dl && dl.pre)
    /* Not started, and not starting on time. The scheduled time stays, struck
       through, so it is clear what was meant to happen. */
    head = '<span class="glabel warn">Delayed' + (dl.why ? ' \u00b7 ' + esc(dl.why) : "")
      + '</span><span class="glabel was">' + dayName(g.start) + " " + clock(g.start) + '</span>';
  else if(g.st === "live")
    head = '<span class="livetag"><span class="dot' + (dl ? "" : " live") + '"></span>'
      + (dl ? 'Delayed' + (dl.why ? ' \u00b7 ' + esc(dl.why) : "") : inningText(g)) + '</span>'
      + (dl ? '<span class="glabel was">' + inningText(g) + '</span>' : "");
  else if(g.st === "final") head = '<span class="glabel">' + esc(g.detail || "Final") + '</span>';
  else head = '<span class="glabel">' + dayName(g.start) + " " + clock(g.start) + '</span>';

  let count = "";
  if(g.st === "live" && g.balls != null){
    // Between halves MLB still reports three outs and a stale count. There is
    // no live at-bat then, so show nothing rather than a row of red lights.
    const inPlay = /^(top|bottom)$/i.test(g.half || "");
    if(inPlay){
      const outs = g.outs || 0;
      count = '<span class="count">'
        + '<span class="bs" aria-label="Count ' + g.balls + ' and ' + g.strikes + '">'
          + g.balls + "–" + g.strikes + '</span>'
        + '<span class="outs" role="img" aria-label="' + outs
          + (outs === 1 ? " out" : " outs") + '">' + [0,1,2].map(i =>
          '<i class="' + (i < outs ? "on" : "") + '" aria-hidden="true"></i>').join("")
        + '</span></span>';
    }
  }

  return '<article class="gcard"><header class="ghead">' + head + count
    + (tag ? '<span class="chip ' + tag[0] + '">' + tag[1] + '</span>' : "") + '</header>'
    + seriesLine(g)
    + '<div class="matrix"><div class="mhead"><span></span><span>H</span><span>R</span></div>'
    + side(g.aid, g.as, g.aH, !blank && g.as > g.hs, blank, awayBats)
    + side(g.hid, g.hs, g.hH, !blank && g.hs > g.as, blank, homeBats)
    + '</div>'
    + liveOdds(g)
    + weatherStrip(g)
    + (g.st === "live" && g.balls != null
        ? '<div class="livebar">' + diamond(g.onBase) + '<div class="matchup">'
          + (g.batter
              // Between halves nobody is at the plate; MLB is naming who is next.
              ? '<span><em>' + (/^(top|bottom)$/i.test(g.half || "") ? "AB" : "DUE UP")
                + '</em>' + esc(g.batter) + batLine(g.pk, g.batterId) + '</span>'
              : "")
          + (g.onDeck || g.inHole
              ? '<span><em>NEXT</em>'
                + [g.onDeck, g.inHole].filter(Boolean).map(n => esc(lastName(n))).join(", ")
                + '</span>'
              : "")
          + '</div></div>'
        : "")
    + lastPlayLine(g)
    + stealLine(g)
    + onMound(g)
    + (g.st === "sched" ? detail(g) : "")
    + '<footer class="gfoot"><span>' + esc(g.venue || city(g.hid)) + '</span>'
    + '<button class="tlink" data-team="' + g.hid + '">' + ab(g.hid) + ' outlook →</button>'
    + '</footer></article>';
}

/* The club you follow, and the one thing you actually want to know about it:
   what is happening right now, or next. Live game beats upcoming beats last
   result. */
function followState(id){
  const mine = g => g.hid === id || g.aid === id;
  const live = S.games.find(g => mine(g) && g.st === "live");
