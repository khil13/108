       weight: settled and merely certain are not quite the same thing. */
    const mark = leg.void ? ["t", "\u2013"]
      : leg.hit != null ? (leg.hit ? ["y", "\u2713"] : ["n", "\u2717"])
      : leg.clear ? ["y prov", "\u2713"]
      : leg.dead ? ["n prov", "\u2717"]
      : ["t", "\u00b7"];
    /* The club the leg is on is bolded inside its own fixture, so one short
       string says both which game it is and which side of it, without repeating
       an abbreviation twice. A run leg belongs to neither side and gets a plain
       fixture. Cards written before build 94 stored no fixture and show none. */
    const side = id => leg.team === id ? '<b>' + ab(id) + '</b>' : ab(id);
    const fixture = leg.aid && leg.hid
      ? side(leg.aid) + ' at ' + side(leg.hid) : "";
    const bits = [fixture, esc(leg.detail),
                  leg.actual ? esc(leg.actual) : "",
                  leg.hit == null && leg.clear ? "already clear" : "",
                  leg.hit == null && leg.dead ? "already gone" : ""].filter(Boolean);
    return '<div class="cdpick">'
      + '<span class="cdmark ' + mark[0] + '">' + mark[1] + '</span>'
      + '<span class="cdwho">' + esc(leg.label)
        + '<em>' + bits.join(" \u00b7 ") + '</em></span>'
      + '<span class="cdout"><b>' + Math.round(leg.p * 100) + '%</b></span>'
      + '</div>';
  };

  let out = SEAM + '<h2 class="eyebrow">Card of the day</h2>';

  if(!rec){
    out += '<div class="empty"><h3>No card today</h3>'
      + '<p>A card is built once MLB has posted enough of today\u2019s probable starters, '
      + 'and needs at least three games to draw from. Games already under way are not '
      + 'eligible \u2014 nothing here is picked after first pitch.</p></div>';
  } else {
    const s = parlaySummary(rec);
    out += '<div class="cdblk">'
      + '<div class="cdline">'
        + '<span class="cdmark ' + (s.settled ? (s.landed ? "y" : "n") : "t") + '">'
          + (s.settled ? (s.landed ? "\u2713" : "\u2717") : "\u00b7") + '</span>'
        /* With every leg voided the product of an empty list is 1, which printed
           as "0 legs, all landing 100.0%" and "1 in 1". The one figure on this
           block the notes tell you to read first cannot be allowed to say that. */
        + '<span class="cdteams">' + (!s.n ? '<b>Nothing left to settle</b>'
            : s.dead ? '<b>Gone</b>'
            : !s.remaining ? '<b>Landed</b>'
            : s.remaining === s.n ? '<b>' + s.n + ' legs</b>, all landing'
            : '<b>' + s.remaining + '</b> still to land') + '</span>'
        + '<span class="cdscore">' + (!s.n || s.dead || !s.remaining
            ? '\u2014' : '<b>' + (s.conditional * 100).toFixed(1) + '%</b>') + '</span>'
      + '</div>'
      + '<div class="cdmeta">' + (!s.n ? '<span>every leg voided</span>'
          : (s.dead || !s.remaining ? "" : '<span>' + odds(s.conditional) + '</span>')
            + '<span>' + s.hit + ' of ' + s.done + ' settled</span>'
            + (s.early ? '<span>' + s.early + ' clear with the game live</span>' : "")
            /* The pre-game figure stays visible, because the record grades what
               was claimed before first pitch, not what survived to the ninth. */
            + (s.remaining < s.n
                ? '<span>said ' + (s.joint * 100).toFixed(1) + '% pre-game</span>' : ""))
        + (s.voided ? '<span>' + s.voided + ' void</span>' : "")
      + '</div>'
      + rec.legs.map(legRow).join("")
      + '</div>'
      + '<p class="note">Every leg is the app\u2019s own number, recorded before first '
      + 'pitch and graded below. The figure at the top is their product: the chance all '
      + (s.n === 1 ? "of it lands" : "of them land") + ' together, which is the only '
      + 'number a parlay actually turns on. One leg per game, so the multiplication is '
      + 'not inflated by two legs that would fail for the same reason.</p>'
      + '<p class="note"><b>Read that top figure before anything else.</b> The record on '
      + 'this tab says the side model is behind backing the home team, the run projection '
      + 'is behind guessing the league average, and bats have homered below their own '
      + 'expectation. Legs built from those do not become reliable by being multiplied '
      + 'together \u2014 the product falls faster than any of them improves. There is also '
      + 'no price here: without a book\u2019s number this cannot tell you a leg is '
      + 'mispriced, only how likely the app thinks it is. Steal legs are the weakest, '
      + 'because how often a runner actually starts is not in the data.</p>';
  }

  if(past.length){
    out += '<h3 class="cdday">Earlier cards</h3>';
    for(const r of past){
      const s = parlaySummary(r);
      out += '<div class="cdblk">'
        + '<div class="cdline">'
          + '<span class="cdmark ' + (s.landed ? "y" : "n") + '">'
            + (s.landed ? "\u2713" : "\u2717") + '</span>'
          + '<span class="cdteams">' + esc(r.date) + '</span>'
          + '<span class="cdscore">' + (s.n
              ? '<b>' + s.hit + '</b>\u2013' + (s.done - s.hit) : '\u2014') + '</span>'
        + '</div>'
        + '<div class="cdmeta">' + (s.n
            ? '<span>said ' + (s.joint * 100).toFixed(1) + '%</span>'
              + '<span>' + (s.landed ? "landed" : "did not land") + '</span>'
            : '<span>every leg voided</span>') + '</div>'
        + '</div>';
    }
    const all = past.map(parlaySummary).filter(a => a.n > 0);
    const landed = all.filter(a => a.landed).length;
    const expected = all.reduce((n, a) => n + a.joint, 0);
    if(all.length) out += '<p class="note">' + landed + ' of ' + all.length
      + (all.length === 1 ? ' card' : ' cards') + ' landed, against '
      + expected.toFixed(2) + ' expected from the app\u2019s own numbers. '
      + (landed > expected + 1
          ? 'Ahead of expectation, over a sample far too small to mean anything.'
          : 'A card of eight legs is supposed to fail almost always; that it does is not '
            + 'evidence the legs are wrong, and it landing once would not be evidence '
            + 'they are right.') + '</p>';
  }
  return out;
}

/* Yesterday and before: what was written down, against what happened. */
function scorecardBlock(){
  const settled = Object.values(S.card)
    .filter(e => e.hs != null)
    .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  const pending = Object.values(S.card).filter(e => e.hs == null).length;

  if(!settled.length){
    const today = iso(new Date());
    const waiting = Object.values(S.card).filter(e => e.hs == null);
    const laterToday = waiting.filter(e => e.date === today).length;
    const older = waiting.length - laterToday;
    return '<div class="empty"><h3>Nothing settled yet</h3>'
      + '<p>' + (!waiting.length
          ? 'Predictions are written down when you open this tab and checked against the '
            + 'result afterwards. Nothing is reconstructed after the fact, so the record '
            + 'starts from your first visit.'
          : (laterToday
              ? laterToday + (laterToday === 1 ? ' prediction is' : ' predictions are')
                + ' recorded for games later today. They are graded once those finish.'
              : "")
            + (older
                ? (laterToday ? ' ' : "")
                  + older + (older === 1 ? ' older prediction is' : ' older predictions are')
                  + ' still waiting on results \u2014 the season data loads a moment after '
                  + 'this tab opens, so give it a second and check again.'
                : ""))
      + '</p></div>'
      /* An empty record is exactly when someone would want to restore one. */
      + scorecardIO();
  }

  const s = scorecardSummary();
  const byDay = [];
  for(const e of settled){
    const last = byDay[byDay.length - 1];
    if(last && last.date === e.date) last.items.push(e);
    else byDay.push({ date:e.date, items:[e] });
  }
  const label = d => d === iso(new Date()) ? "Today"
    : d === iso(shift(-1)) ? "Yesterday"
    : (() => { const dt = new Date(d + "T12:00:00");
        return isNaN(dt) ? d : dt.toLocaleDateString(undefined,
          { weekday:"long", month:"short", day:"numeric" }); })();

  return SEAM
    + '<h2 class="eyebrow">The record</h2>'
    + '<div class="ledger">'
      + '<div><b>' + (s.n ? s.right + '/' + s.n : "\u2014")
        + '</b><span>sides right</span></div>'
      + '<div><b>' + (s.high ? s.highRight + '/' + s.high : "\u2014")
        + '</b><span>at ' + Math.round(CONF_BAR * 100) + '%+</span></div>'
      + '<div><b>' + (s.watchN ? s.watchHr + '/' + s.watchN : "\u2014")
        + '</b><span>bats homered</span></div>'
    + '</div>'
    /* Every bat named is now graded on three counts, not one. Each cell reads
       "landed of graded", and the sentence below gives each its expectation,
       because a count without a bar under it says nothing. */
    + (s.hitN || s.runN
        ? '<div class="ledger">'
          + '<div><b>' + (s.hitN ? s.hitGot + '/' + s.hitN : "\u2014")
            + '</b><span>got a hit</span></div>'
          + '<div><b>' + (s.runN ? s.runGot + '/' + s.runN : "\u2014")
            + '</b><span>scored</span></div>'
          + '<div><b>' + (s.watchExpN ? s.watchHrP + '/' + s.watchExpN : "\u2014")
            + '</b><span>homered</span></div>'
          + '</div>'
        : "")
    + '<p class="note cdsum">'
      + (s.n
          ? 'Sides called right ' + Math.round(s.acc * 100) + '% of the time '
            + 'over ' + s.n + (s.n === 1 ? ' settled game' : ' settled games') + '. '
          : 'No side has been callable yet \u2014 every settled game finished level. ')
      + (s.drawn
          ? s.drawn + (s.drawn === 1 ? ' game finished' : ' games finished')
            + ' level and so had no side to call, though the bats and arms in '
            + (s.drawn === 1 ? 'it' : 'them') + ' are graded below. '
          : "")
      + (s.runMAE != null || s.kMAE != null
          ? 'Run projections missed by ' + (s.runMAE != null ? s.runMAE.toFixed(1) : "\u2014")
            + (s.kMAE != null ? ', strikeout projections by ' + s.kMAE.toFixed(1) : "")
            + '. '
          : "")
      + (s.brier != null && s.baseBrier != null
          ? (() => {
              const d = s.baseBrier - s.brier;
              /* The tally above counts every miss the same. This does not: it
                 charges for how much was staked, so a confident wrong call costs
                 more than a hesitant one. It still says nothing about margin —
                 a one-run loss and a rout are identical here too, because the
                 model named a winner and not a score. */
              return 'Brier ' + s.brier.toFixed(3) + ' against ' + s.baseBrier.toFixed(3)
                + ' for backing the home side every time'
                + (Math.abs(d) < 0.002 ? ', level'
                    : d > 0 ? ', which is better'
                            : ', which is worse')
                + '. That one charges for confidence, so a 64% miss costs more '
                + 'than a 52% one. '
                + 'Neither number cares about the margin. ';
            })()
          : "")
      + (s.watchExpN
          ? (() => {
              const exp = s.watchExp, sd = s.watchSd, hit = s.watchHrP;
              /* Counted over the picks that carry a rate, not all of them —
                 comparing every homer against an expectation drawn from a
                 subset would flatter or damn the picker at random. */
              const all = s.watchExpN === s.watchN;
              let line = (all
                  ? 'Bats homered ' + hit + ' of ' + s.watchN
                  : 'Of the ' + s.watchExpN + (s.watchExpN === 1 ? ' pick' : ' picks')
                    + ' carrying a rate, ' + hit + ' homered')
                + ' against ' + exp.toFixed(1) + ' expected';
              if(sd && sd > 0){
                const z = (hit - exp) / sd;
                line += Math.abs(z) < 1.5
                  ? ', which is an ordinary run'
                  : Math.abs(z) < 2
                    ? ', a ' + Math.abs(z).toFixed(1) + '-sigma stretch '
                      + (z < 0 ? 'below' : 'above') + ' \u2014 unusual, not alarming'
                    : ', ' + Math.abs(z).toFixed(1) + ' sigma '
                      + (z < 0 ? 'below' : 'above')
                      + ', further out than luck comfortably explains';
              }
              return line + '. ';
            })()
          : "")
      + ((s.hitN || s.runN)
          ? 'Of the same picks, '
            + (s.hitN ? s.hitGot + ' of ' + s.hitN + ' got a hit against '
                + s.hitExp.toFixed(1) + ' expected' : "")
            + (s.hitN && s.runN ? ', and ' : "")
            + (s.runN ? s.runGot + ' of ' + s.runN + ' scored against '
                + s.runExp.toFixed(1) + ' expected' : "")
            + '. '
          : "")
      + (s.watchDnp
          ? s.watchDnp + (s.watchDnp === 1 ? ' bat sat' : ' bats sat')
            + ' and drew a dash; lineups are not posted when the pick is made. '
          : "")
      + (!s.n ? ""
          : (() => {
              /* A reference edge rather than the observed one: at thirteen games
                 the observed rate is mostly noise, and squaring it to get a
                 sample size amplifies that into nonsense. 54% is roughly what a
                 working baseball model achieves, so it is the honest yardstick
                 for how long this will take to answer. */
              const need = gamesNeeded(0.54);
              const bar = detectableAt(s.n);
              if(bar != null && bar < 1)
                return 'At ' + s.n + (s.n === 1 ? ' game' : ' games') + ', only a hit rate '
                  + 'above ' + Math.round(bar * 100) + '% would stand out from chance at all. '
                  + 'Telling a real 54% model from a coin flip takes about '
                  + need.toLocaleString() + ' settled games \u2014 six weeks or so of full '
                  + 'slates. Until then this is a log, not a verdict.';
              return 'Telling a real 54% model from a coin flip takes about '
                + need.toLocaleString() + ' settled games. Until then this is a log, not '
                + 'a verdict.';
            })())
      + '</p>'
    + (() => {
        /* Five days of games, each now seven rows deep — a matchup line, four bats
           and two arms — ran to several hundred rows. The most recent day is the
           one that gets read; the rest fold away behind a count, the same way the
           Feed handles its older moves. Nothing is dropped. */
        const dayBlock = d => '<h3 class="cdday">' + esc(label(d.date)) + '</h3>'
        + d.items.map(e => {
            const homeWon = e.hs > e.as;
            const tie = e.hs === e.as;
            const p = gradedP(e);
            const picked = p > 0.5 ? e.hid : e.aid;
            const hit = !tie && ((p > 0.5) === homeWon);
            const conf = Math.round(Math.max(p, 1 - p) * 100);
            const runGap = e.total != null ? (e.hs + e.as) - e.total : null;
            /* Away first, matching the "at" in the matchup, with the winner's
               club and runs in chalk. */
            const clubs = (homeWon ? ab(e.aid) + ' at <b>' + ab(e.hid) + '</b>'
                            : tie ? ab(e.aid) + ' at ' + ab(e.hid)
                            : '<b>' + ab(e.aid) + '</b> at ' + ab(e.hid));
            const score = (homeWon || tie ? e.as : '<b>' + e.as + '</b>') + '\u2013'
              + (homeWon ? '<b>' + e.hs + '</b>' : e.hs);

            /* A pick and its outcome. The label column the old layout spent on
               "bat to watch", repeated on every row, is now a club tag beside the
               name — the same width says something different each time. */
            const pick = (mark, name, tag, detail, out) =>
              '<div class="cdpick">'
              + '<span class="cdmark ' + mark[0] + '">' + mark[1] + '</span>'
              + '<span class="cdwho">' + esc(name)
                + '<em>' + [tag, detail].filter(Boolean).map(esc).join(" \u00b7 ") + '</em></span>'
              + '<span class="cdout">' + out + '</span>'
              + '</div>';

            return '<article class="cdblk">'
              + '<div class="cdline">'
                + '<span class="cdmark ' + (tie ? "t" : hit ? "y" : "n") + '">'
                  + (tie ? "\u2013" : hit ? "\u2713" : "\u2717") + '</span>'
                + '<span class="cdteams">' + clubs + '</span>'
                + '<span class="cdscore">' + score + '</span>'
              + '</div>'
              + '<div class="cdmeta">'
                + '<span>said <b>' + ab(picked) + '</b> ' + conf + '%</span>'
                + (e.total != null
                    ? '<span>runs <b>' + e.total.toFixed(1) + '</b> \u2192 ' + (e.hs + e.as)
                      + ' (' + (runGap > 0 ? "+" : "") + runGap.toFixed(1) + ')</span>'
                    : "")
              + '</div>'
              /* The watched bat was named as one to watch, so its outcome is a
                 pick with a result — it gets its own marked row rather than a note
                 tacked onto the game above it. */
              + watchList(e).map(w => {
                  const tag = w.team ? ab(w.team) + ' bat' : "bat";
                  /* Named before the lineup card existed, then rested. No
                     chance to go deep, so no verdict either way. */
                  if(w.dnp)
                    return pick(["t", "\u2013"], lastName(w.name), tag, "did not play",
                      w.p != null ? Math.round(w.p * 100) + '% chance' : "");
                  if(!w.result)
                    return pick(["t", "\u2013"], lastName(w.name), tag,
                                "result not recorded", "");
                  const homered = w.result.hr > 0;
                  return pick(homered ? ["y", "\u2713"] : ["n", "\u2717"],
                    lastName(w.name), tag,
                    w.result.line || "did not play",
                    homered ? '<b>' + w.result.hr + ' HR</b>' : "no homer");
                }).join("")
              + (Array.isArray(e.ks)
                  ? e.ks.filter(k => k.actual != null || k.scratched).map(k => {
                  const tag = k.own ? ab(k.own) + ' arm' : "arm";
                  /* Named as the probable, never took the mound. Neither right
                     nor wrong — the start it projected did not happen — so it
                     draws the neutral mark and sits out the tally above. */
                  if(k.scratched)
                    return pick(["t", "\u2013"], lastName(k.name), tag, "did not pitch",
                      'said <b>' + k.exp.toFixed(1) + '</b>');
                  const gap = k.actual - k.exp;
                  const close = Math.abs(gap) <= 2;
                  /* "0 strikeouts" was the longest string in the narrowest
                     column, and the one that got clipped. K says it. */
                  return pick(close ? ["y", "\u2713"] : ["n", "\u2717"],
                    lastName(k.name), tag,
                    k.actual + " K",
                    'said <b>' + k.exp.toFixed(1) + '</b> ('
                      + (gap > 0 ? "+" : "") + gap.toFixed(1) + ')');
                }).join("") : "")
              + '</article>';
          }).join("");

        const recent = byDay.slice(0, 1), older = byDay.slice(1, 5);
        const olderGames = older.reduce((n, d) => n + d.items.length, 0);
        return recent.map(dayBlock).join("")
          + (olderGames
              ? '<button class="disc notes" data-recordolder="1" aria-expanded="'
                + (S.recordOlder ? "true" : "false") + '">'
                + '<span>' + olderGames + ' earlier '
                + (olderGames === 1 ? "game" : "games") + ', back to '
                + esc(label(older[older.length - 1].date)) + '</span>'
                + '<i class="chev" aria-hidden="true">'
                + (S.recordOlder ? "\u25B4" : "\u25BE") + '</i></button>'
                + (S.recordOlder ? older.map(dayBlock).join("") : "")
              : "");
      })()
    + '<p class="note">Each pick was recorded before the game and has not been revised. '
    + 'A tick on the side means it won. On a bat to watch it means he homered \u2014 '
    + 'the row named him as one to watch, so that is the outcome of the pick, not a '
    + 'footnote. On a strikeout projection it means within two of the real count. '
    + 'A probable starter who was scratched draws a dash instead: MLB lists every '
    + 'rostered player in a box score, so he would otherwise be read as having '
    + 'thrown and struck nobody out, and marked wrong for a start he never made. '
    + 'A bat that was rested draws a dash for the same reason as a scratched starter: the '
    + 'lineup card is not published when the pick is made, so a day off is the manager\u2019s '
    + 'decision rather than the model\u2019s error. '
    + (() => {
        const f = batFit();
        if(!f) return '';
        return '<p class="note">Bat chances are mapped through what has actually '
          + 'happened, the same way the side model is: sigmoid('
          + f.a.toFixed(2) + ' \u00d7 logit(p) '
          + (f.b >= 0 ? '+ ' : '\u2212 ') + Math.abs(f.b).toFixed(2) + '), fitted on '
          + f.n + ' graded picks. The picks came in well under their own expectation, '
          + 'and the reason is structural rather than unlucky: the pick is the largest of '
          + 'eight noisy rates, and the largest of several noisy estimates runs high by '
          + 'construction. This corrects by the amount the record measures, and refits as '
          + 'the record grows \u2014 so if the underlying pick improves, the correction '
          + 'fades on its own.</p>';
      })()
    + '<p class="note">The number of bats named per game has changed twice: one across both clubs before '
    + 'build 78, one per club after it, and two per club from build 102. So the '
    + 'bats-homered count is not comparable across those boundaries, and the second pick '
    + 'of a pair is a lower-probability bat by construction, which pulls the raw hit rate '
    + 'down without anything having got worse. Read the line against expectation instead: '
    + 'each pick carries its own chance, so the expected figure moves with the change and '
    + 'the comparison stays honest. '
    + 'The run projection shows what was said, what happened and the gap; it misses by '
    + 'three and a half runs on average, so read that gap as normal rather than as an '
    + 'error.</p>'
    + scorecardIO();
}

function renderPlays(){
  const today = iso(new Date());
  const upcoming = S.games.filter(g => g.date === today && g.st === "sched")
    .sort((a,b) => new Date(a.start) - new Date(b.start));
  /* Written down before first pitch, then settled once results arrive. */
  upcoming.forEach(recordPrediction);
  buildParlay(today);
  settleScorecard();
  settleParlay();
  settleParlayLive();
  if(S.parlayDirty){ saveParlay(); S.parlayDirty = false; }
  if(S.cardDirty){ saveScorecard(); S.cardDirty = false; }
  settlePicksFromBox();
  const waiting = S.detailState === "loading" || !Object.keys(S.pitchers).length;

  const card = upcoming.length
    ? '<h2 class="eyebrow">Today\'s card \u00b7 ' + upcoming.length + ' games</h2>'
      + (waiting ? '<p class="load">Loading starters\u2026</p>' : "")
      + outlookBlock(upcoming)
      + upcoming.map(cardBlock).join("")
      + '<p class="note"><b>Test these before trusting them.</b> The calibration on the '
      + 'Odds tab replays the side model over every completed game this season; when I ran '
      + 'it, it did not beat simply backing the home team. Treat what follows as a view, '
      + 'not a signal.</p>'
      + '<p class="note">All three lines are this app\'s own output. Side is the model '
      + 'line. Runs is a projection: each club\'s scoring and its opponent\'s concession '
      + 'averaged, then shifted by how each starter compares to the league, scaled to the '
      + 'six innings of nine a starter typically covers. It is shown against the league '
      + 'average because that gap is the only part it knows with any confidence: measured '
      + 'over the season it misses a single game by about three and a half runs, which is '
      + 'no better than guessing the average every time. <b>There is no over/under here</b> '
      + '\u2014 that word needs a book\'s number to mean anything and this app has no '
      + 'source for one, so compare the projection to a line yourself. Watch names one bat '
      + 'per club \u2014 four a game \u2014 by home run rate in each lineup, weighed against '
      + 'the HR/9 of the arm it faces and the bullpen behind him, the batter\u2019s hand '
      + 'against the pitcher\u2019s, and the air and the wind at that ballpark. The best bat '
      + 'on a side hardly changes from night to night, because he is the best bat; the '
      + 'second one moves a good deal, which is where the variation lives. Both are '
      + 'graded. The '
      + 'percentage is each one\u2019s chance of going deep over a full game, not per plate '
      + 'appearance \u2014 a bat at one homer per twenty is a one-in-five shot on the '
      + 'night, not one in twenty. Conditions are common to both clubs, so they do not '
      + 'change which bat is named, only how likely it is to pay off and therefore the '
      + 'bar the record grades it against. Lineups are '
      + 'not published until a few hours before first pitch, so none of this knows who is '
      + 'actually playing.</p>'
    : "";

  if(!card)
    return '<div class="pane"><div class="empty"><h3>Nothing on today\'s card</h3>'
      + '<p>Projections appear once MLB posts the probable starters, usually the evening '
      + 'before. Games already under way move to the Today tab.</p></div>'
      + parlayBlock() + scorecardBlock() + '</div>';

  return '<div class="pane">' + card + parlayBlock() + scorecardBlock() + '</div>';
}

function render(resetScroll){
  const keep = resetScroll ? 0 : window.scrollY;
  const fk = resetScroll ? null : focusKey(document.activeElement);
  const app = document.getElementById("app");
  const live = S.games.some(g => g.st === "live");
  const stamp = S.at ? clock(S.at) : "";
  /* Three states worth distinguishing: fresh, fresh-but-a-refresh-just-failed,
     and running entirely on what was saved last time. */
  const dotClass = S.phase !== "ready" ? (S.phase === "error" ? "bad" : "")
    : S.stale ? "bad" : live ? "live" : "ok";
  const statusText = S.phase !== "ready" ? (S.phase === "error" ? "Offline" : "Loading")
    : S.stale ? "Saved " + stamp : live ? "Live" : "Updated " + stamp;

  let body;
  if(S.phase === "loading") body = '<p class="load">Loading the league…</p>';
  else if(S.phase === "error")
    body = '<div class="pane"><div class="empty"><h3>Could not reach the data</h3>'
      + '<p>' + esc(S.err || "Unknown error") + '. Both feeds are public and need no key, so this is '
      + 'usually a connection problem. Pull to refresh or tap Refresh above.</p></div></div>';
  else if(S.tab === "today") body = renderToday();
  else if(S.tab === "feed") body = renderFeed();
  else if(S.tab === "odds") body = renderOdds();
  else body = renderPlays();

  app.innerHTML =
    '<header class="mast"><div class="mtop">' + BALL
    + '<div><h1 class="wordmark">108</h1><p class="tagline">Baseball by the numbers</p></div>'
    + '<div class="feed"><span class="feedrow"><span class="dot ' + dotClass + '"></span>'
    + statusText + '</span><button class="refresh" id="refresh">Refresh</button></div></div>'
    + '<nav class="tabs" role="tablist" aria-label="Views">'
    + [["today","Today"],["feed","Feed"],["odds","Odds"],["plays","Plays"]].map(([k,label]) =>
        '<button role="tab" id="tab-' + k + '" aria-controls="pane"'
        + ' aria-selected="' + (S.tab===k) + '" tabindex="' + (S.tab===k ? "0" : "-1") + '"'
        + ' data-tab="' + k + '">' + label + '</button>').join("")
    + '</nav></header>'
    + (S.phase === "ready" && S.err
        ? '<p class="banner"><b>' + (S.stale ? "Offline." : "Last refresh failed.") + '</b> '
          + (S.stale
              ? 'This is what was saved at ' + stamp + ' — records and the forecast still '
                + 'work, but scores will not move and there is no weather.'
              : 'Showing data from ' + stamp + '.')
          + '</p>' : "")
    + '<div id="pane" role="tabpanel" aria-labelledby="tab-' + S.tab + '" tabindex="-1">'
    + body + '</div>'
    + '<footer class="foot">108 — the number of double stitches on a regulation baseball.<br>'
    + 'Scores, records and venues from the MLB Stats API. Weather from Open-Meteo. '
    + 'Odds simulated in this browser from the records above.<br>'
    + 'Build ' + BUILD
    + (Object.keys(S.diag).length
        ? '<br>Loaded: ' + ["pitchers","form","bullpens","h2h","remaining","spHistory","rosters","hitters","hitterForm"]
            .filter(k => S.diag[k] != null)
            .map(k => k + ' ' + S.diag[k]).join(' \u00b7 ')
        : "")
    + '</footer>'
    + (S.sheet ? renderSheet() : "");

  if(keep) window.scrollTo(0, keep);
  if(fk){
    const back = app.querySelector(fk);
    if(back && back.focus) back.focus({ preventScroll:true });
  }
  announce();
}

/* One short, non-repeating announcement. Anything more and a screen reader
   would talk over itself every thirty seconds. */
let lastSaid = "";
function announce(){
  const el = document.getElementById("live");
  if(!el || S.phase !== "ready") return;
  let msg = "";
  const id = S.follow;
  const g = id && S.games.find(x => (x.hid === id || x.aid === id) && x.st === "live");
  if(g){
    msg = ab(g.aid) + " " + g.as + ", " + ab(g.hid) + " " + g.hs + ", " + inningText(g);
  } else {
    const live = S.games.filter(x => x.st === "live").length;
    msg = live ? live + (live === 1 ? " game in progress" : " games in progress") : "";
  }
  if(msg && msg !== lastSaid){ lastSaid = msg; el.textContent = msg; }
}

/* ============================== events ============================== */

/* Opening and closing the sheet, with focus handled properly both ways. */
function focusSheet(){
  const sheet = document.querySelector(".sheet");
  if(!sheet) return;
  const btn = sheet.querySelector("#closeSheet");
  (btn || sheet).focus({ preventScroll:true });
}
function closeSheet(){
  const back = S.sheetReturn;
  S.sheet = null; S.swing = null; S.sheetReturn = null;
  render();
  if(back){
    const el = document.getElementById("app").querySelector(back);
    if(el && el.focus) el.focus({ preventScroll:true });
  }
}

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if(tab){
    S.tab = tab.dataset.tab;
    if(S.tab === "odds") ensureSeason();   // the forecast wants the real fixture list
    if(S.tab === "plays"){ ensureSeason(); loadDetail(); }
    if(S.tab === "feed") ensureFeed();
    render(true);
    return;
  }

  const lg = e.target.closest("[data-lg]");
  if(lg){ const [view,k] = lg.dataset.lg.split(":"); S.lg[view] = k; render(true); return; }

  if(e.target.closest("[data-notes]")){ S.notesOpen = !S.notesOpen; render(); return; }

  const tog = e.target.closest("[data-toggle]");
  if(tog){
    const pk = tog.dataset.toggle;
    S.open[pk] = !S.open[pk];
    if(S.open[pk]){ loadDetail(); ensureHitterForm(); }
    render();
    return;
  }

  if(e.target.closest("#runCal")){
    S.calBusy = true; render();
    (async () => {
      if(!S.spHistory) S.spHistory = await loadStarterHistory() || {};
      S.cal = {
        with:backtest(RECENCY_W, false),
        without:backtest(0, false),
        withSP:backtest(RECENCY_W, true),
        /* The same season scored both ways, changing nothing but where team
           strength comes from. This is what decides whether USE_PYTH earns its
           place, and it is the app's own answer rather than mine. */
        rec:backtest(RECENCY_W, false, null, null, false),
        pyth:backtest(RECENCY_W, false, null, null, true),
        /* The four corners of records and starters. This is the experiment the
           calibration has been implying for several builds: if leaving records
           out costs nothing, they are not earning their place. */
        lean:backtest(0, true, null, null, null, false),
        homeOnly:backtest(0, false, null, null, null, false)
      };
      if(S.cal.with) S.sweep = sweep();
      /* Fit on the best model available — with starters if they were testable,
         since that is what the cards actually use. */
      const basis = (S.cal.withSP && S.cal.withSP.spN > 200) ? S.cal.withSP : S.cal.with;
      S.calFit = basis ? fitCalibration(basis.preds) : null;
      /* And the same fit judged on games it never saw. */
      S.calOut = basis ? holdoutCheck(basis.preds) : null;
      try{ localStorage.setItem(FIT_KEY, JSON.stringify(S.calFit)); }catch(err){}
      if(!S.cal.with) S.cal = null;
      else { S.calAt = new Date().toISOString(); saveCal(); }
      S.calBusy = false; render();
    })();
    return;
  }

  if(e.target.closest("[data-feedolder]")){ S.feedOlder = !S.feedOlder; render(); return; }

  if(e.target.closest("[data-recordolder]")){ S.recordOlder = !S.recordOlder; render(); return; }

  const fd = e.target.closest("[data-feed]");
  if(fd){ S.feedMine = fd.dataset.feed === "mine"; render(); return; }

  if(e.target.closest("#exportCard")){ exportScorecard(); return; }

  if(e.target.closest("#markSeen")){ saveBaseline(); render(); return; }

  if(e.target.closest("#changeTeam")){ S.picker = !S.picker; render(); return; }

  const fol = e.target.closest("[data-follow]");
  if(fol){
    const v = fol.dataset.follow;
    S.follow = v === "none" ? null : Number(v);
    S.picker = false;
    saveFollow(S.follow);
    render();
    return;
  }

  if(e.target.closest("#expandAll")){
    const today = iso(new Date());
    const pks = S.games.filter(g => g.date === today && g.st === "sched").map(g => g.pk);
    const anyClosed = pks.some(p => !S.open[p]);
    pks.forEach(p => { S.open[p] = anyClosed; });
    if(anyClosed){ loadDetail(); ensureHitterForm(); }
    render();
    return;
  }

  const team = e.target.closest("[data-team]");
  if(team){
    S.sheetReturn = focusKey(document.activeElement);   // so it can go back
    S.sheet = Number(team.dataset.team); S.swing = null;
    render();
    focusSheet();
    return;
  }

  if(e.target.closest("#refresh")){ load(); return; }

  if(e.target.closest("#rerun")){
    S.simBusy = true; render();
    setTimeout(() => { S.odds = simulate(SIMS); S.simBusy = false; render(); }, 20);
    return;
  }

  if(e.target.closest("#measure")){
    const id = S.sheet;
    S.swingBusy = true; render();
    setTimeout(() => {
      const won = simulate(SHEET_SIMS, {id, add:1});
      const lost = simulate(SHEET_SIMS, {id, add:0});
      S.swing = won[id].berth - lost[id].berth;
      S.swingBusy = false; render();
    }, 20);
    return;
  }

  if(e.target.closest("#closeSheet") || e.target.id === "scrim"){
    closeSheet();
  }
});

/* Delegated, because render() rebuilds the document and any listener bound
   directly to the input would not survive it. */
document.addEventListener("change", e => {
  const inp = e.target.closest("#importFile");
  if(!inp || !inp.files || !inp.files[0]) return;
  const rd = new FileReader();
  rd.onload = () => importScorecard(String(rd.result || ""));
  rd.onerror = () => { S.ioMsg = "Could not read that file."; render(); };
  rd.readAsText(inp.files[0]);
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && S.sheet){ closeSheet(); return; }

  /* A dialog has to hold focus. Without this, Tab walks off into the page
     behind the overlay, which a sighted mouse user never notices and a
     keyboard user cannot recover from. */
  if(e.key === "Tab" && S.sheet){
    const sheet = document.querySelector(".sheet");
    if(!sheet) return;
    const f = [...sheet.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter(el => !el.disabled);
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(!sheet.contains(document.activeElement)){ first.focus(); e.preventDefault(); }
    else if(e.shiftKey && document.activeElement === first){ last.focus(); e.preventDefault(); }
    else if(!e.shiftKey && document.activeElement === last){ first.focus(); e.preventDefault(); }
    return;
  }
  // Arrow keys move between tabs — expected behaviour for role="tablist".
  if((e.key === "ArrowRight" || e.key === "ArrowLeft")
     && document.activeElement && document.activeElement.getAttribute("role") === "tab"){
    const order = ["today","feed","odds","plays"];
    const i = order.indexOf(S.tab);
    const next = order[(i + (e.key === "ArrowRight" ? 1 : order.length - 1)) % order.length];
    S.tab = next;
    render(true);
    const el = document.getElementById("tab-" + next);
    if(el) el.focus();
    e.preventDefault();
  }
});

/* Poll faster while games are in progress. */
setInterval(() => {
  if(S.phase === "error") return;
  const live = S.games.some(g => g.st === "live");
  const age = S.at ? Date.now() - S.at.getTime() : Infinity;
  if(age > (live ? 30000 : 180000)) load();
}, 15000);

document.addEventListener("visibilitychange", () => {
  if(!document.hidden && S.at && Date.now() - S.at.getTime() > 60000) load();
});

S.follow = loadFollow();
S.baseline = loadBaseline();
S.card = loadScorecard();
repairScorecard();
S.parlay = loadParlay();
loadCal();
try{
  const f = JSON.parse(localStorage.getItem(FIT_KEY) || "null");
  if(f && typeof f.a === "number" && typeof f.b === "number") S.calFit = f;
}catch(e){}

/* Paint from cache first so there is no empty screen, then go and refresh.
   If the network is down, this is all you get — and the banner says so. */
(function bootFromCache(){
  const c = loadCache();
  if(!c) return;
  S.teams = c.teams;
  S.games = c.games;
  S.venues = c.venues || {};
  S.at = new Date(c.at);
  S.stale = true;
  S.phase = "ready";
  try{ S.odds = simulate(SIMS); }catch(e){ S.odds = null; }
  if(S.odds) render();
})();

load();
</script>
