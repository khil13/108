  const byPk = {}, byPair = {}, ambiguous = {};
  if(Array.isArray(S.finals))
    for(const f of S.finals){
      if(!f || !f.date || f.hs == null || f.as == null) continue;
      if(f.pk != null) byPk[String(f.pk)] = f;
      const k = f.date + ":" + f.hid + ":" + f.aid;
      if(k in byPair) ambiguous[k] = true; else byPair[k] = f;
    }

  for(const key in S.card){
    const e = S.card[key];
    if(!e || e.hs != null || !e.date) continue;
    const k = e.date + ":" + e.hid + ":" + e.aid;
    const f = byPk[key] || (ambiguous[k] ? null : byPair[k]);
    if(!f) continue;
    e.hs = f.hs; e.as = f.as;
    changed = true;
  }

  for(const g of S.games){
    const e = S.card[String(g.pk)];
    if(!e || e.hs != null) continue;
    if(g.st !== "final" || g.hs == null || g.as == null) continue;
    e.hs = g.hs; e.as = g.as;
    /* What the watched batter actually did. Reported, not graded: the row was
       offered as "this is the bat most likely to matter", never as a claim that
       he would go deep. A fact either way. */
    /* What each starter actually struck out. The box score carries it, and it is
       a plain count against a plain projection. */
    if(Array.isArray(e.ks)){
      for(const k of e.ks){
        if(k.actual != null) continue;
        /* Scoped to this game, so absence now means he was not in it — but the
           live poll only ever captured games it happened to watch, so a missing
           line here is as likely to mean "never polled" as "never pitched".
           Grading yes, scratch verdicts no; those come from the box score
           fetched deliberately in settlePicksFromBox. */
        const b = S.box[boxKey(g.pk, k.pid)];
        if(pitchedIn(b) && b.pK != null) k.actual = b.pK;
      }
    }
    for(const w of watchList(e)){
      if(w.result || w.dnp || w.id == null) continue;
      const b = S.box[boxKey(g.pk, w.id)];
      if(!b) continue;                          // never polled; not evidence of anything
      if(!battedIn(b)){ w.dnp = true; continue; }
      w.result = { hr:b.todayHr != null ? b.todayHr : null,
        h:b.batH != null ? b.batH : null, r:b.batR != null ? b.batR : null,
        line:b.today || null };
    }
    changed = true;
  }
  if(changed){ S.cardDirty = true; saveScorecard(); }
}

/* A pick can only be graded from the box score of the game it was made on, and
   the live poll stops the moment a game ends. So the watched batter's result and
   the starters' strikeout counts were never arriving: the window in which they
   could be captured was only while the game was live and the app was open.

   This closes it. For any finished game whose picks are still unresolved, fetch
   that game's box score once and grade them. A few at a time, and each key is
   claimed so a failed fetch is not retried forever. */
/* Predictions written before the batter id was stored carry only a name and a
   club. That was enough to leave them permanently ungradeable — the settlement
   looks a player up by id. The club's hitter list has both, so the id can be
   recovered rather than the record written off. */
function repairWatchId(e){
  for(const w of watchList(e)){
    if(w.id != null || !w.name || !w.team) continue;
    const roster = S.hitters[w.team];
    if(!Array.isArray(roster)) continue;
    const hit = roster.find(b => b.name === w.name);
    if(hit && hit.id != null){ w.id = hit.id; S.cardDirty = true; }
  }
}

/* Three attempts, not one. The old code claimed a game before the fetch and
   never released it, so a single dropped request — a tunnel, a flaky minute of
   wifi — abandoned that game's picks permanently. Counting instead means a
   transient failure is retried on a later render while a game whose box score
   genuinely has nothing to offer still stops being asked about. */
const BOX_TRIES = 3;

async function settlePicksFromBox(){
  const pending = [];
  for(const key in S.card){
    const e = S.card[key];
    if(!e || e.hs == null) continue;
    repairWatchId(e);
    if((e.boxTries || 0) >= BOX_TRIES) continue;
    const needWatch = watchList(e).some(w => w.id != null && !w.result && !w.dnp);
    const needK = Array.isArray(e.ks)
      && e.ks.some(k => k.actual == null && !k.scratched);
    if(needWatch || needK) pending.push(key);
  }
  if(!pending.length) return;

  let changed = false;
  for(const key of pending.slice(0, 6)){
    const e = S.card[key];
    e.boxTries = (e.boxTries || 0) + 1;
    let j;
    try{ j = await getJSON(MLB + "/game/" + key + "/boxscore"); }
    catch(err){ changed = true; continue; }   // the attempt count is worth saving
    /* It answered, so whatever it says is final: anything still ungraded below
       is absent from the game rather than unreachable. */
    e.boxTries = BOX_TRIES;
    const box = readBoxscore(j);
    if(noteStar(key, e.date, box, { home:e.hid, away:e.aid })) changed = true;
    if(settleParlayFromBox(key, box)) changed = true;
    for(const w of watchList(e)){
      if(w.id == null || w.result || w.dnp) continue;
      /* This box score is the game's own, so a bat that is not in it, or is in
         it without a plate appearance, did not play. Recorded as such rather
         than failed. */
      const b = box[w.id];
      if(battedIn(b)) w.result = { hr:b.todayHr != null ? b.todayHr : 0,
        h:b.batH != null ? b.batH : 0, r:b.batR != null ? b.batR : 0,
        line:b.today || null };
      else w.dnp = true;
    }
    if(Array.isArray(e.ks)) for(const k of e.ks){
      if(k.actual != null) continue;
      /* This box score is the game's own, so absence is meaningful: a probable
         who is not in it, or is in it without having thrown, did not pitch.
         Recorded as such rather than graded — the projection was for a start
         that never happened, and marking it wrong would say something false
         about the pitcher and about the model. */
      const b = box[k.pid];
      if(pitchedIn(b)){ if(b.pK != null) k.actual = b.pK; }
      else k.scratched = true;
    }
    changed = true;
  }
  if(changed || S.cardDirty){ saveScorecard(); S.cardDirty = false; render(); }
}

/* How long before the record means anything.

   Two figures from the same normal approximation to a coin flip. detectableAt
   is the hit rate that would stand out from chance at the sample you have:
   anything below it is indistinguishable from a run of luck. gamesNeeded runs it
   the other way — the sample at which a given real edge would separate from 50%.

   Both use the 95% two-sided z of 1.96 and the variance of a fair coin, which is
   the widest case and so the conservative one. The point is not the exact
   number; it is that "too few to mean much yet" has a size, and the size is
   larger than it feels. */
const detectableAt = n => n > 0 ? 0.5 + 1.96 * Math.sqrt(0.25 / n) : null;
const gamesNeeded = p => {
  const edge = Math.abs(p - 0.5);
  if(edge < 1e-6) return Infinity;
  return Math.ceil(Math.pow(1.96, 2) * 0.25 / (edge * edge));
};

/* What the card put on screen, which is what the record grades. Entries written
   before build 81 stored only the model's raw number, so that is the fallback. */
const gradedP = e => e.shown != null ? e.shown : e.pHome;

/* The record so far, over settled games only.

   A drawn game has no side to be right about, so it sits out the side record —
   but its bats and its starters are gradeable like anyone else's, and used to be
   dropped from every tally while still drawing rows on screen. Sides are counted
   over the games that could be called; everything else over all of them. */
function scorecardSummary(){
  const settled = Object.values(S.card).filter(e => e.hs != null);
  if(!settled.length) return null;
  const called = settled.filter(e => e.hs !== e.as);

  let right = 0, brier = 0, baseBrier = 0, high = 0, highRight = 0;
  for(const e of called){
    const p = gradedP(e);
    const homeWon = e.hs > e.as;
    const conf = Math.max(p, 1 - p);
    const hit = (p > 0.5) === homeWon;
    if(hit) right++;
    /* The picks it leaned on, which is where a model earns its keep. The
       threshold is 55 rather than 60 because the calibration told the model to
       regress team records hard, and it now rarely exceeds 60 at all — a bar it
       almost never clears measures nothing. */
    if(conf >= CONF_BAR){ high++; if(hit) highRight++; }
    brier += Math.pow(p - (homeWon ? 1 : 0), 2);
    /* Scored against the same games, so the comparison is like for like. */
    baseBrier += Math.pow(HOME_BASE - (homeWon ? 1 : 0), 2);
  }

  let absErr = 0, totN = 0, watchN = 0, watchHr = 0, kN = 0, kErr = 0, kBias = 0;
  /* The worst individual misses, not only the average of them.

     A mean is exactly the wrong statistic for finding a broken input. Thirty-six
     strikeout picks off by 1.5 and four off by five average to the same figure as
     a model that is uniformly mediocre — so a systematic error affecting a tenth
     of picks sits inside a healthy-looking 2.1 and cannot be seen. The projection
     that read 6.5 strikeouts for a pitcher the books had at 2.5 was in the record
     the whole time, averaged away.

     Kept as a short list of the largest errors, which is where a broken input
     announces itself: one name with a five-strikeout miss is noise, three of them
     sharing a shape is a bug. */
  const kWorst = [], runWorst = [];
  let watchExp = 0, watchVar = 0, watchExpN = 0, watchHrP = 0, watchDnp = 0;
  let hitN = 0, hitGot = 0, hitExp = 0, runN = 0, runGot = 0, runExp = 0;
  for(const e of settled){
    if(e.total != null){
      const err = Math.abs(e.total - (e.hs + e.as));
      absErr += err; totN++;
      runWorst.push({ name:ab(e.aid) + " at " + ab(e.hid), exp:e.total,
                      actual:e.hs + e.as, err, date:e.date });
    }
    for(const w of watchList(e)){
      if(w.dnp){ watchDnp++; continue; }
      if(!w.result) continue;
      watchN++; if(w.result.hr > 0) watchHr++;
      /* Each pick carried its own chance of a homer, so the expectation is the
         sum of them rather than a single league rate — and the variance comes
         from the same place, which is what makes "unlucky" measurable. */
      if(w.p != null){
        watchExp += w.p; watchVar += w.p * (1 - w.p); watchExpN++;
        if(w.result.hr > 0) watchHrP++;
      }
      /* Hits and runs, counted the same way and against the same kind of bar. */
      if(w.pHit != null && w.result.h != null){
        hitN++; hitExp += w.pHit; if(w.result.h > 0) hitGot++;
      }
      if(w.pRun != null && w.result.r != null){
        runN++; runExp += w.pRun; if(w.result.r > 0) runGot++;
      }
    }
    if(Array.isArray(e.ks)) for(const k of e.ks){
      if(k.actual == null) continue;
      kN++; kErr += Math.abs(k.exp - k.actual); kBias += k.exp - k.actual;
      kWorst.push({ name:k.name, exp:k.exp, actual:k.actual,
                    err:Math.abs(k.exp - k.actual), date:e.date });
    }
  }
  const n = called.length;
  return { n, drawn:settled.length - n, right,
           acc:n ? right / n : null, brier:n ? brier / n : null,
           baseBrier:n ? baseBrier / n : null,
           runMAE:totN ? absErr / totN : null, totN,
           watchN, watchHr, watchExp, watchExpN, watchHrP, watchDnp,
           hitN, hitGot, hitExp, runN, runGot, runExp,
           watchSd:watchVar > 0 ? Math.sqrt(watchVar) : null,
           high, highRight,
           kN, kMAE:kN ? kErr / kN : null, kBias:kN ? kBias / kN : null,
           kWorst:kWorst.sort((a, b) => b.err - a.err).slice(0, 4),
           runWorst:runWorst.sort((a, b) => b.err - a.err).slice(0, 4) };
}

/* ---------------- projected total ----------------
   A run estimate, not a betting line. Each side's expectation is the midpoint
   of what it scores and what its opponent allows, then shifted by how the
   starter compares to the league — scaled to the share of a game a starter
   covers, about six innings of nine.

   There is deliberately no over/under here. That word only means something
   against a book's number, and this app has no source for one. What follows is
   a projection you can compare to a line yourself. */
const SP_SHARE = 0.6;

function teamRuns(id){
  const r = S.runs[id];
  return r && r.g > 0 ? { rs:r.rs / r.g, ra:r.ra / r.g, g:r.g } : null;
}
function leagueRunsPerGame(){
  let rs = 0, g = 0;
  for(const k in S.runs){ rs += S.runs[k].rs; g += S.runs[k].g; }
  return g > 0 ? rs / g : null;
}

function projectTotal(g){
  const h = teamRuns(g.hid), a = teamRuns(g.aid), lg = leagueRunsPerGame();
  if(!h || !a || !lg) return null;
  let expH = (h.rs + a.ra) / 2, expA = (a.rs + h.ra) / 2;
  const hEra = starterEra(S.pitchers[g.hProbId]);
  const aEra = starterEra(S.pitchers[g.aProbId]);
  let usedSP = false;
  if(hEra != null && aEra != null){
    expH += SP_SHARE * (aEra - lg);      // the arm you face, not your own
    expA += SP_SHARE * (hEra - lg);
    usedSP = true;
  }
  /* Where it is being played. Both sides are scaled by the same factor, since a
     park that suppresses runs suppresses them for whoever is batting. */
  /* No park term. Measured twice over 1,346 games and it moved the projection by
     nothing at all — 3.60 runs off either way, to two decimals. The backtest
     below still computes the comparison, so if it ever starts to matter the app
     will say so; it is simply no longer applied to what the cards show.

     Pulled toward the point the season says it is unbiased at. The split
     between the two sides is left alone — only the total's spread was measured,
     so only the total's spread is corrected. */
  const sh = runShrink();
  let shrunk = false;
  if(sh){
    const raw = expH + expA;
    const adj = sh.inter + sh.slope * raw;
    if(raw > 0 && adj > 0){ const f = adj / raw; expH *= f; expA *= f; shrunk = true; }
  }
  expH = Math.max(1, expH); expA = Math.max(1, expA);
  /* Round the two sides first and derive the total from them, so the card
     never shows parts that fail to add up to the whole. */
  const h1 = Math.round(expH * 10) / 10, a1 = Math.round(expA * 10) / 10;
  return { home:h1, away:a1, total:Math.round((h1 + a1) * 10) / 10, usedSP, lg,
           shrunk };
}

/* A starter's strikeout total tonight: his rate per nine, over the innings he
   typically goes, adjusted for how often the lineup he faces strikes out
   relative to the league. Every input is measured — his K/9 and innings from his
   own season, the lineup's rate from the same hitting data — so the only
   judgement is the shape of the formula. */
/* How long this man's starts actually run.

   Season innings divided by season starts is innings per start only for someone
   who never relieves. For a swingman it charges every relief inning against his
   starts and inflates the figure badly: seventy-eight innings over eleven starts
   reads as 7.1, which put a projection of seven strikeouts and a line at 6.5 on a
   pitcher the books priced at 2.5 — he was throwing about two innings an outing.

   So the last few actual starts come first, since those are starts by definition
   and the app already fetches them for the form line. Failing that, season
   innings over season starts, but only for someone whose appearances and starts
   roughly agree. When they do not and there is no start history, the honest
   answer is that the app cannot tell, and no projection is made. */
function startInnings(p){
  const f = p.form;
  if(f && f.n >= 2 && f.ip > 0) return f.ip / f.n;
  if(!p.ip || !p.gs) return null;
  if(p.g != null && p.g > p.gs + 2) return null;   // relieves too; cannot separate
  return p.ip / p.gs;
}

function projectStrikeouts(pid, oppTeamId){
  const p = S.pitchers[pid];
  if(!p || p.k9 == null || !p.ip || !p.gs || p.gs < 3) return null;
  const ipPerStart = startInnings(p);
  if(ipPerStart == null || ipPerStart < 2) return null;   // not really a starter
  let mult = 1;
  const opp = S.teamBat[oppTeamId];
  const lgK = leagueKRate();
  if(opp && lgK) mult = opp.kRate / lgK;
  return { exp:(p.k9 / 9) * ipPerStart * mult, k9:p.k9, ip:ipPerStart,
           oppKRate:opp ? opp.kRate : null };
}

/* League strikeout rate, from the same team figures. */
function leagueKRate(){
  let k = 0, n = 0;
  for(const key in S.teamBat){ k += S.teamBat[key].kRate; n++; }
  return n ? k / n : null;
}

/* The bat most likely to matter: best home run rate against the most
   homer-prone arm on the card. An observation about who is involved, not a
   prediction that it happens. */
/* The last five games counted four times over against the season total. Enough
   that a hot bat overtakes a similar one who has gone quiet, not enough that a
   genuinely elite rate loses to three good nights. Twenty at-bats is a small
   sample and this treats it like one. */
const WATCH_RECENCY = 4;

function watchRate(b){
  const base = b.perPA > 0 ? 1 / b.perPA : 0;
  const f = S.hitterForm[b.id];
  const ab = f && Number(f.ab) > 0 ? Number(f.ab) : 0;
  const hr = f && Number(f.hr) >= 0 ? Number(f.hr) : null;
  if(!ab || hr == null || !isFinite(hr)) return { rate:base, form:null };
  const rate = (b.hr + WATCH_RECENCY * hr) / (b.pa + WATCH_RECENCY * ab);
  return isFinite(rate) && rate >= 0 ? { rate, form:f } : { rate:base, form:null };
}

/* Which game of a repeated matchup this is. When two clubs meet twice on one
   day — a doubleheader, usually a postponement being made up — the inputs
   barely move, so the same bat wins both times and the second card tells you
   nothing you did not already know. Naming the next-best bat instead gives two
   real names rather than one repeated. */
function matchupIndex(g){
  const same = S.games.filter(x =>
    x.date === g.date
    && ((x.hid === g.hid && x.aid === g.aid) || (x.hid === g.aid && x.aid === g.hid)));
  if(same.length < 2) return 0;
  same.sort((a, b) => new Date(a.start) - new Date(b.start));
  const i = same.findIndex(x => x.pk === g.pk);
  return i < 0 ? 0 : i;
}

/* One bat per club. A single name across both lineups meant half of every card
   went unmentioned — the bat you were watching for was as likely as not on the
   other side. Each club now gets its best home run rate weighed against the
   HR/9 of the arm it actually faces.

   The doubleheader rule survives, applied per club: the second game of a
   repeated matchup takes each side's second name rather than repeating the
   first. */
/* How far the opposing starter alone may move a bat's chance, either way. A
   full season of HR/9 is a real measurement, but it is measured in his park and
   behind his fielders, so it is not all his — 40% is generous without being
   credulous. */
const ARM_SWING = 0.4;

/* A hitter does not face one pitcher, he faces two thirds of a starter and a
   third of a bullpen. The bat pick has always used the starter's HR/9 alone,
   which flatters a lineup facing a homer-prone starter in front of a good pen and
   punishes the reverse.

   Two thirds and a third, because a starter covers about 5.4 of nine innings.
   Nothing here is fitted; the split is the same arithmetic already used to set
   BP_WEIGHT, and it applies to a rate the app measures on both sides. */
const BP_PA_SHARE = 1 / 3;

function facedHr9(starterHr9, oppTeamId){
  const bp = S.bullpens[oppTeamId];
  const pen = bp && bp.hr9 != null ? bp.hr9 : null;
  if(starterHr9 == null) return pen;
  if(pen == null) return starterHr9;
  return (1 - BP_PA_SHARE) * starterHr9 + BP_PA_SHARE * pen;
}

/* The league reference the arm multiplier is measured against, blended the same
   way, so a starter-only league figure is not compared with a blended one. */
function leagueFacedHr9(){
  const sp = leagueHr9();
  if(sp == null) return null;
  return S.bpLgHr9 == null ? sp
    : (1 - BP_PA_SHARE) * sp + BP_PA_SHARE * S.bpLgHr9;
}

/* Clubs with no bat pick because a posted lineup contains none of the hitters the
   app has a home run rate for.

   I had intended to fall back to the unfiltered list here, and on writing it that
   was plainly wrong: naming a man the lineup card says is not playing produces a
   pick guaranteed to void, and the parlay would have taken it as a leg. Losing
   the pick is the correct behaviour. Losing it silently was not. */
function batPickGaps(g){
  const out = [];
  for(const teamId of [g.aid, g.hid]){
    const lu = lineupIds(g, teamId);
    if(!lu) continue;
    const rated = (S.hitters[teamId] || []).filter(b => b.perPA);
    if(!rated.length) continue;          // nothing rated at all: a different gap
    if(!rated.some(b => lu.indexOf(b.id) >= 0)) out.push(teamId);
  }
  return out;
}

/* ---------------- measured platoon splits ----------------

   Every batter has been getting the same damped guess: plus or minus twelve per
   cent on power depending on the handedness matchup, scaled by whether he bats
   left or right. That is the league's average effect applied to everyone, which
   is right on average and wrong about every individual.

   MLB publishes the real thing — each hitter's line against left-handed and
   right-handed pitching — and it costs one request per side.

   It cannot be used raw, and this is the important part. A right-handed regular
   sees about 150 plate appearances against lefties in a season; at a true .240
   that carries a 95% range from .172 to .308. Published work puts the point where
   a batter's platoon split stabilises near two thousand plate appearances, which
   is several seasons. A single year of splits is mostly noise, and a model that
   believed them would name whoever got lucky against lefties in April.

   So the measured split is regressed hard toward the league effect. A hitter with
   a genuinely large sample and a genuinely large split moves; everyone else stays
   near the constant, which is the league effect and is what the app already used.
   The regression constant is the sample size at which a split is trusted half —
   set to a full season's worth against the short side, deliberately heavy. */
const SPLIT_REGRESS = 400;
const SPLIT_MIN_PA = 40;

async function loadSplits(){
  const yr = new Date().getFullYear();
  const out = {};
  /* One request per side. sitCodes accepts both in one call on some builds of
     this API and not others, so they are fetched separately — two requests is a
     smaller price than a shape that silently returns only one of them. */
  for(const [code, key] of [["vl", "vl"], ["vr", "vr"]]){
    let j;
    try{
      j = await getJSON(MLB + "/stats?stats=statSplits&sitCodes=" + code
        + "&group=hitting&season=" + yr + "&sportId=1&limit=1500");
    }catch(e){ continue; }
    /* The response has been shaped two ways across versions: one block with every
       split in it, or one block per split. Both are walked. */
    const blocks = (j && j.stats) || [];
    for(const b of blocks){
      for(const sp of (b.splits || [])){
        const pid = ((sp.player || {}).id);
        const st = sp.stat || {};
        const pa = Number(st.plateAppearances) || 0;
        if(!pid || !pa) continue;
        const rec = out[pid] || (out[pid] = {});
        rec[key] = { pa, hr:Number(st.homeRuns) || 0, h:Number(st.hits) || 0 };
      }
    }
  }
  return out;
}

/* The league's own platoon effect, computed from the same data rather than
   assumed — so the thing individual splits are regressed toward is measured too.
   Keyed by the batter's hand, because a left-hander's platoon split is larger
   than a right-hander's and always has been. */
function leagueSplit(){
  if(S.lgSplit) return S.lgSplit;
  const acc = { L:{ same:{hr:0,pa:0}, opp:{hr:0,pa:0} },
                R:{ same:{hr:0,pa:0}, opp:{hr:0,pa:0} } };
  for(const pid in S.splits){
    const side = S.bats[pid];
    if(side !== "L" && side !== "R") continue;
    const r = S.splits[pid];
    /* "Same" is a left-hander against a lefty, or a right-hander against a
       righty: the disadvantaged matchup in both cases. */
    const same = side === "L" ? r.vl : r.vr;
    const opp  = side === "L" ? r.vr : r.vl;
    if(same){ acc[side].same.hr += same.hr; acc[side].same.pa += same.pa; }
    if(opp){  acc[side].opp.hr  += opp.hr;  acc[side].opp.pa  += opp.pa; }
  }
  const out = {};
  for(const side of ["L", "R"]){
    const a = acc[side];
    if(a.same.pa < 5000 || a.opp.pa < 5000) continue;
    const sameRate = a.same.hr / a.same.pa, oppRate = a.opp.hr / a.opp.pa;
    if(sameRate > 0 && oppRate > 0) out[side] = { same:sameRate, opp:oppRate };
  }
  S.lgSplit = Object.keys(out).length ? out : null;
  return S.lgSplit;
}

/* The one thing that can tell two team-mates apart on a given night.

   Everything else the bat pick weighs — the opposing starter, the bullpen behind
   him, the park, the wind, the air — is common to a whole lineup. So the ranking
   within a club came down to season home run rate, which barely moves, and the
   same name was named every day. Handedness is different: it varies by batter and
   by which arm happens to be starting, so the club's best right-handed bat can
   genuinely overtake its best left-handed one when a lefty is on the mound.

   The direction is not in dispute; the size is a judgement, and this is roughly
   half of the published splits, damped for the same reason SP_WEIGHT is. Left
   handers gain more from the advantage than right handers lose from its absence,
   so the two sides are not mirrored — and at the league's rough mix of hands the
   four cases average to 1.00, so this shifts the ranking without inflating
   anyone's stated chance. */
const PLATOON_SWING = 0.12;

/* How many bats each club gets on the card. */
const WATCH_PER_CLUB = 2;

/* The swing is for power. Contact platoon splits are roughly half the size —
   a batting average moves about twenty points across the handedness matchup
   where a home run rate moves a fifth — so hits and runs pass a smaller scale
   rather than reusing the homer figure, which would have overstated them. */
const CONTACT_PLATOON = 0.5;

function platoonMult(batSide, pitchHand, scaleBy, pid){
  if(!batSide || !pitchHand) return 1;
  const swing = PLATOON_SWING * (scaleBy == null ? 1 : scaleBy);
  if(batSide === "S") return 1 + swing * 0.25;   // always takes the better side
  const scale = batSide === "L" ? 1 : 0.75;
  /* The league effect, which is what this function has always returned. */
  const assumed = 1 + (batSide !== pitchHand ? swing : -swing) * scale;

  const rec = pid != null ? S.splits[pid] : null;
  const lg = leagueSplit();
  if(!rec || !lg || !lg[batSide]) return assumed;
  const facing = pitchHand === "L" ? rec.vl : rec.vr;
  const other  = pitchHand === "L" ? rec.vr : rec.vl;
  if(!facing || !other) return assumed;
  if(facing.pa < SPLIT_MIN_PA || other.pa < SPLIT_MIN_PA) return assumed;

  /* His own rate in this matchup against his own rate overall, both measured.
     Regressed toward the league effect by SPLIT_REGRESS plate appearances, so a
     hitter with 120 trips against lefties barely moves off the constant and one
     with a full career's worth moves most of the way to his own number. */
  const ownPa = facing.pa + other.pa, ownHr = facing.hr + other.hr;
  if(!ownPa || !ownHr) return assumed;
  const overall = ownHr / ownPa;
  const inThis = facing.hr / facing.pa;
  if(!(overall > 0)) return assumed;
  const measured = inThis / overall;

  const w = facing.pa / (facing.pa + SPLIT_REGRESS);
  const blended = w * measured + (1 - w) * assumed;
  /* Damped like every other multiplier here, and by the same amount, so a wild
     split cannot swing a pick further than the arm faced can. */
  const capped = Math.max(1 - ARM_SWING, Math.min(1 + ARM_SWING, blended));
  /* Contact splits are roughly half the size of power splits, and scaleBy is how
     the caller asks for that. Applied to the distance from neutral. */
  const k = scaleBy == null ? 1 : scaleBy;
  return 1 + (capped - 1) * k;
}

/* Who is actually in the lineup, when MLB has published it. */
function lineupIds(g, teamId){
  const lu = g && g.lineup;
  if(!lu) return null;
  const arr = teamId === g.hid ? lu.home : teamId === g.aid ? lu.away : null;
  return Array.isArray(arr) && arr.length ? arr : null;
}

/* Where a man bats, and what that is worth.

   MLB returns the posted lineup in batting order and the app was reading it only
   for membership — is he playing, yes or no — and then giving every hitter the
   same flat 4.3 plate appearances. A leadoff man gets about 4.65 and a nine-hole
   hitter about 3.85, which is 21% more trips to the plate, and it moves a homer
   chance by four points before anything about the matchup is considered.

   It is also the input that changes most from day to day. A season rate barely
   moves; a batting order moves whenever the manager feels like it, and it is
   published a few hours before first pitch. So this is where a card sharpens once
   the lineups land, rather than staying the guess it was in the morning.

   The slope is the league's own shape — roughly a tenth of a plate appearance per
   slot — and it is applied only where a lineup is actually posted. Before that
   everyone gets the flat figure, which is what the app has always done. */
function slotOf(g, teamId, playerId){
  const lu = lineupIds(g, teamId);
  if(!lu) return null;
  const i = lu.indexOf(playerId);
  return i < 0 ? null : i;
}

/* 1st, 2nd, 3rd, then th. Written out because `+` binds tighter than `||` and
   the one-line version of this silently produced "bats 1" for the leadoff man. */
function ordinal(n){
  const suffix = n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th";
  return n + suffix;
}

function paForSlot(slot){
  if(slot == null) return PA_PER_GAME;
  return Math.max(3.4, 4.65 - Math.min(8, slot) * 0.10);
}

/* The league's opponent batting average among the starters on file, so a hit
   projection is measured against the same population its arm comes from. */
function leagueOppAvg(){
  let sum = 0, n = 0;
  for(const key in S.pitchers){
    const v = parseFloat((S.pitchers[key] || {}).oppAvg);
    if(isFinite(v) && v > 0){ sum += v; n++; }
  }
  return n >= 5 ? sum / n : null;
}

/* League HR/9 among the starters on file, innings-weighted so a long reliever
   with nine innings does not count for as much as a starter with a hundred and
   forty. Stands in for a probable who has not been announced. */
function leagueHr9(){
  let hr = 0, ip = 0;
  for(const key in S.pitchers){
    const p = S.pitchers[key];
    if(p.hr9 == null || !p.ip) continue;
    hr += p.hr9 * p.ip / 9;
    ip += p.ip;
  }
  return ip > 0 ? 9 * hr / ip : null;
}

/* Every rated bat on a club, ranked and fully scored — home run, hit and run
   chances alike — against the arm the club actually faces tonight. bestBats and
   benchBats both slice this same list rather than each computing their own, so
   the two can never quietly disagree about who is better than whom. */
function rankedBats(g, batTeam, oppPid, oppTeam, cond){
  const p = S.pitchers[oppPid];
  /* The opposing starter's HR/9 multiplies every bat in that lineup by the
     same amount, so it has no say in which one is named — only in how likely
     he is to go deep. A probable who has not been posted therefore cost the
     whole club its pick for no reason: a lineup facing an unnamed arm still
     has a most dangerous bat. The league's starters stand in until the real
     one is announced, and the row says as much. */
  const known = !!(p && p.hr9 != null);
  const spHr9 = known ? p.hr9 : leagueHr9();
  /* What he will actually see tonight: this starter, plus the relief behind
     him. Relief is a season figure and the same every night, which is exactly
     why it belongs here — it is information about the opponent the batter's own
     rate knows nothing about. */
  const hr9 = facedHr9(spHr9, oppTeam);
  const penHr9 = (S.bullpens[oppTeam] || {}).hr9;
  /* An array, not null. A caller once filtered this for truthiness and threw on
     the first cold open, before any pitcher or bullpen had loaded — see the
     build note that fixed it. Kept empty rather than null so every caller can
     concatenate without checking. */
  if(hr9 == null) return [];
  /* Once MLB posts the lineup, only men actually in it are eligible. Before
     that the pick is made blind, as it always was, and says so. */
  const lu = lineupIds(g, batTeam);
  /* The whole pool, not the first eight of it. The stored array is ordered by
     home run total for the display above; slicing it here threw away exactly
     the high-rate bats the union was widened to include. */
  /* A man on the injured list has no chance at all, which is a fact rather than a
     probability, and the app already had it. */
  const out = unavailable();
  const pool = (S.hitters[batTeam] || [])
    .filter(b => !out[b.id])
    .filter(b => !lu || lu.indexOf(b.id) >= 0);
  const ranked = [];
  for(const b of pool){
    if(!b.perPA) continue;
    const r = watchRate(b);
    const side = S.bats[b.id] || null;
    const hand = known ? p.hand : null;
    const plat = platoonMult(side, hand, 1, b.id);
    const platC = platoonMult(side, hand, CONTACT_PLATOON, b.id);
    const slot = slotOf(g, batTeam, b.id);
    ranked.push({ score:r.rate * plat * hr9, batter:b.name, batterId:b.id, team:batTeam,
                  perPA:b.perPA, hr:b.hr, pa:b.pa, slot, paTonight:paForSlot(slot),
                  hRate:b.pa > 0 ? (b.h || 0) / b.pa : 0,
                  rRate:b.pa > 0 ? (b.r || 0) / b.pa : 0, platC,
                  pitcher:known ? p.name : null,
                  hr9, spHr9, penHr9, plat, side, hand,
                  tba:!known, posted:!!lu, blended:r.rate, form:r.form });
  }
  if(!ranked.length) return [];
  /* Ranked on the chance over tonight's trips, not on the rate alone. Two bats at
     the same rate are not the same pick when one leads off and the other bats
     ninth, and before this the order could not tell them apart. */
  for(const b of ranked) b.score = b.score * (b.paTonight / PA_PER_GAME);
  ranked.sort((a, b) => b.score - a.score);
  /* The arm belongs in the number, not only in the ranking. HR/9 decided which
     bat was named and then played no part in how likely he was to go deep, so
     a hitter facing a homer-prone starter and one facing a groundballer were
     graded against the same expectation. Measured against the league rather
     than used raw, and damped, because a starter's HR/9 carries his park and
     his defence inside it. */
  const lg = leagueFacedHr9();
  const armMult = lg && lg > 0
    ? Math.max(1 - ARM_SWING, Math.min(1 + ARM_SWING, hr9 / lg)) : 1;
  /* A hit is a different question from a home run, so it answers to a
     different arm figure: the opposing starter's opponent average rather than
     his HR/9, measured against the league the same damped way. Runs are
     different again — a batter scores when his club scores, so his rate is
     scaled by what the run projection expects of that club tonight against
     what it usually manages. Both are measured; neither invents a weight. */
  const lgAvg = leagueOppAvg();
  const oppAvg = known && p.oppAvg != null ? parseFloat(p.oppAvg) : null;
  const hitMult = (lgAvg && oppAvg) ?
    Math.max(1 - ARM_SWING, Math.min(1 + ARM_SWING, oppAvg / lgAvg)) : 1;
  const tot = projectTotal(g);
  const own = S.runs[batTeam];
  const runMult = (tot && own && own.g > 0) ? (() => {
    const tonight = batTeam === g.hid ? tot.home : tot.away;
    const usual = own.rs / own.g;
    return usual > 0
      ? Math.max(1 - ARM_SWING, Math.min(1 + ARM_SWING, tonight / usual)) : 1;
  })() : 1;

  return ranked.map(chosen => {
    const mult = (cond ? cond.mult : 1) * armMult * (chosen.plat || 1);
    return Object.assign(chosen, { cond, armMult,
      adjusted:chosen.blended * mult,
      /* Over the trips he will actually get, which the batting order settles. */
      raw:gameProb(chosen.blended * mult, chosen.paTonight),
      tonight:calibrateBat(gameProb(chosen.blended * mult, chosen.paTonight)),
      /* Both scaled by the platoon edge as well, since handedness bears on
         contact as much as on power. */
      pHit:calibrateMarket("hit",
        gameProb(chosen.hRate * hitMult * (chosen.platC || 1), chosen.paTonight)),
      /* A run needs someone behind him to drive him in, so the nine-hole penalty
         is real twice over — fewer trips, and the worst hitters following. That
         second part is not modelled; only the trips are. */
      pRun:calibrateMarket("run",
        gameProb(chosen.rRate * runMult * (chosen.platC || 1), chosen.paTonight)) });
  });
}

function bestBats(g){
  const n = matchupIndex(g);
  const cond = hrConditions(g);
  const pick = (batTeam, oppPid, oppTeam) => {
    const all = rankedBats(g, batTeam, oppPid, oppTeam, cond);
    /* Two per club, four per game. The best bat on a side barely moves from one
       night to the next — he is the best bat, and saying otherwise would be
       naming someone less likely — but the runner-up moves a great deal, so a
       second name is where the day-to-day variation actually lives.

       Both are graded. The alternative was to name two and check one, which would
       have kept the tally continuous at the cost of putting something on screen
       that nothing verifies, and that is not how the rest of this works. */
    const start = n * WATCH_PER_CLUB;
    let picks = all.slice(start, start + WATCH_PER_CLUB);
    /* Second game of a doubleheader with a short list: rather than no pick, fall
       back to the tail of it. */
    if(!picks.length) picks = all.slice(-WATCH_PER_CLUB);
    /* Only a doubleheader's later game is "next best"; the second pick of a
       pair is not, and its own percentage says where it stands. */
    return picks.map((chosen, i) =>
      Object.assign(chosen, { rank:start > 0 ? start + i : 0 }));
  };
  // Visitors bat against the home starter and the home relief, and the reverse.
  return pick(g.aid, g.hProbId, g.hid).concat(pick(g.hid, g.aProbId, g.aid));
}

/* Three more per club, for the leaderboard rather than the card. Same ranking,
   same multipliers, the next slice down — never the two already named as Watch
   picks, so nothing here can duplicate a pick already being graded. Nothing
   returned by this is recorded or settled: it is a look at the rest of the
   lineup, not a claim being tracked. */
const BENCH_PER_CLUB = 3;

function benchBats(g){
  const n = matchupIndex(g);
  const cond = hrConditions(g);
  const pick = (batTeam, oppPid, oppTeam) => {
    const all = rankedBats(g, batTeam, oppPid, oppTeam, cond);
    const start = n * WATCH_PER_CLUB + WATCH_PER_CLUB;
    return all.slice(start, start + BENCH_PER_CLUB);
  };
  return pick(g.aid, g.hProbId, g.hid).concat(pick(g.hid, g.aProbId, g.aid));
}

/* A rate per plate appearance is not a chance of a home run tonight, and the
   difference is the whole reason "1 of 16" was unreadable. A regular gets about
   4.3 plate appearances in a game he starts, so a bat at one homer per twenty
   goes deep in roughly a fifth of his games — not a twentieth.

   Storing this with each pick is what lets the record say how many homers were
   expected, and so whether a lean stretch is a bad picker or a bad fortnight. */
const PA_PER_GAME = 4.3;
const gameProb = (rate, pa) =>
  rate > 0 && rate < 1 ? 1 - Math.pow(1 - rate, pa == null ? PA_PER_GAME : pa) : null;
const hrGameProb = gameProb;   // the same arithmetic, named for its first use

const watchOf = mu => Object.assign(
  { name:mu.batter, team:mu.team, id:mu.batterId,
    p:mu.tonight != null ? mu.tonight : gameProb(mu.blended),
    pHit:mu.pHit, pRun:mu.pRun },
  /* Picked against a stand-in rather than the real arm, so it can be improved
     on while the game has still not started. */
  mu.tba ? { tba:true } : null);

/* Records written before this change named one bat and stored it singular.
   Both shapes are read through here, so an old card still grades. */
const watchList = e => Array.isArray(e.watches) ? e.watches : (e.watch ? [e.watch] : []);

/* Which club each player is actually on now.

   MLB reports hitting stats against whichever club a player earned them with,
   so a mid-season trade leaves someone listed under a former team — the power
   block would show a hitter who cannot possibly bat in tonight's game. This is
   the check that catches it: one request for all thirty rosters, then anyone
   whose stats are filed under a club they no longer play for is dropped.

   If the request fails the app behaves as it did before, listing them, which is
   wrong but not broken. */
async function loadRosters(){
  const yr = new Date().getFullYear();
  /* Two maps: which club a player is on, and which side he bats from. Between
     them they carry the trade filter and the entire platoon term, so when this
     comes back empty the app quietly loses both — no handedness on any row, no
     split applied, and traded players left under their old club. It read zero in
     the wild while every other fetch worked, which is the argument for not
     depending on a single endpoint shape.

     The players list is tried first: one request, every player in the league,
     each with a current club and a batting side, and a flatter shape than a
     hydrate. The team hydrate stays as the fallback. */
  const out = {}, bats = {};
  const take = (pid, tid, side) => {
    if(!pid) return;
    if(tid && T[tid]) out[pid] = tid;
    if(side) bats[pid] = side;
  };
  try{
    const pj = await getJSON(MLB + "/sports/1/players?season=" + yr);
    for(const p of (pj && pj.people) || [])
      take(p.id, (p.currentTeam || {}).id, (p.batSide || {}).code);
    if(Object.keys(bats).length > 200) return { club:out, bats };
  }catch(e){}

  let j;
  try{
    j = await getJSON(MLB + "/teams?sportId=1&season=" + yr + "&hydrate=roster(person)");
  }catch(e){ return { club:out, bats }; }
  for(const t of j.teams || []){
    if(!T[t.id]) continue;
    // The shape has varied; accept either a bare array or a nested one.
    const list = Array.isArray(t.roster) ? t.roster
      : (t.roster && Array.isArray(t.roster.roster)) ? t.roster.roster : null;
    if(!list) continue;
    for(const entry of list){
      const person = entry.person || {};
      const pid = person.id;
      if(!pid) continue;
      out[pid] = t.id;
      const side = (person.batSide || {}).code;
      if(side) bats[pid] = side;
    }
  }
  return { club:out, bats };
}

/* Every regular's season hitting line in one request, sorted by home runs,
   then grouped by club. A 100 plate-appearance floor keeps a callup with two
   homers in nine games out of the leaders. */
async function loadHitters(rosters){
  const byTeam = {}, runners = {};
  const yr = new Date().getFullYear();
  let j;
  try{
    j = await getJSON(MLB + "/stats?stats=season&group=hitting&season=" + yr
      + "&sportId=1&sortStat=homeRuns&order=desc&limit=750");
  }catch(e){
    /* The shape matters as much as the contents. Returning the bare byTeam here
       left S.hitters undefined, and every read of S.hitters[id] then threw — the
       Plays tab entirely, any expanded card, and out through render() as an
       unhandled rejection on every subsequent poll. One dropped request on a
       750-row fetch bricked the app until reload. */
    return { byTeam, teamBat:{}, runners:{} };
  }
  const splits = (j.stats && j.stats[0] && j.stats[0].splits) || [];
  const bat = {};
  for(const s of splits){
    const tid = (s.team || {}).id, st = s.stat || {};
    if(!T[tid]) continue;
    /* Team strikeout rate is accumulated across every player in the response,
       before the leaders are filtered out — a top-five-by-homers list would say
       nothing about how often the lineup as a whole strikes out. */
    const tb = bat[tid] || (bat[tid] = { k:0, pa:0, sb:0, cs:0 });
    tb.k += Number(st.strikeOuts) || 0;
    tb.pa += Number(st.plateAppearances) || 0;
    tb.sb += Number(st.stolenBases) || 0;
    tb.cs += Number(st.caughtStealing) || 0;

    const pid = (s.player || {}).id;
    /* Anyone whose stats sit under a club they have since left is dropped, for
       runners as much as for sluggers. Only applied when the roster list loaded. */
    const traded = rosters && Object.keys(rosters).length && pid
      && rosters[pid] && rosters[pid] !== tid;

    /* Base stealers are a different list from home run hitters and need their
       own pass: the fastest man in a lineup is often near the bottom of it for
       power, and the plate-appearance floor that keeps a callup out of the
       slugging leaders would keep a September pinch-runner out of this one too.
       Five attempts is the floor — below that a success rate is noise. */
    const sb = Number(st.stolenBases) || 0, cs = Number(st.caughtStealing) || 0;
    if(!traded && sb + cs >= 5){
      (runners[tid] = runners[tid] || []).push({
        id:pid, name:(s.player || {}).fullName || "\u2014",
        sb, cs, att:sb + cs, rate:sb / (sb + cs) });
    }

    const hr = st.homeRuns, pa = st.plateAppearances;
    if(!hr || hr <= 0 || !pa || pa < 100) continue;
    if(traded) continue;
    (byTeam[tid] = byTeam[tid] || []).push({
      id:pid,
      name:(s.player || {}).fullName || "—", hr, pa, perPA:pa / hr,
      /* Already in the response, and thrown away until now. */
      h:Number(st.hits) || 0, r:Number(st.runs) || 0
    });
  }
    /* Two lists, unioned, because the pool was being chosen by one measure and
     ranked by another. Keeping the top eight by season home run total, then
     ranking those by rate, quietly excluded the better bet: thirty homers in six
     hundred plate appearances makes that cut ahead of eighteen in two hundred and
     sixty, though the second man is likelier to go deep tonight. He could never
     be named because he was never a candidate.

     So the club's biggest totals and its best rates both get in. The rate arm
     asks for 200 plate appearances rather than the 100 that qualifies anyone at
     all — a rate off a quarter-season is noisy enough to top a list by luck, and
     this pick has no regression of its own to lean on.

     The stored order stays by total, because Power on show reads from the same
     array and describes itself as the club's leading home run hitters. */
  for(const k in byTeam){
    const all = byTeam[k];
    const byTotal = all.slice().sort((a, b) => b.hr - a.hr).slice(0, 8);
    const byRate = all.filter(b => b.pa >= 200)
      .sort((a, b) => a.perPA - b.perPA).slice(0, 8);
    const seen = {}, keep = [];
    for(const b of byTotal.concat(byRate)){
      if(seen[b.id]) continue;
      seen[b.id] = true; keep.push(b);
    }
    byTeam[k] = keep.sort((a, b) => b.hr - a.hr);
  }
  for(const k in runners) runners[k] = runners[k].sort((a, b) => b.sb - a.sb).slice(0, 3);
  const teamBat = {};
  for(const k in bat) if(bat[k].pa > 500)
    teamBat[k] = { kRate:bat[k].k / bat[k].pa, sb:bat[k].sb, cs:bat[k].cs,
                   sbRate:bat[k].sb + bat[k].cs > 0
                     ? bat[k].sb / (bat[k].sb + bat[k].cs) : null };
  return { byTeam, teamBat, runners };
}

/* Bullpen strength, built from player lines rather than a team total, because
   MLB's team pitching figures fold the starters in. A "reliever" here is a
   pitcher with zero starts — unambiguous, at the cost of excluding swingmen,
   whose innings get left out of both clubs equally. The league average is
   computed from the same pass rather than assumed. */
async function loadBullpens(){
  const yr = new Date().getFullYear();
  let j;
  try{
    j = await getJSON(MLB + "/stats?stats=season&group=pitching&season=" + yr
      + "&sportId=1&sortStat=inningsPitched&order=desc&limit=1200");
  }catch(e){ return { teams:{}, lg:null }; }
  const splits = (j.stats && j.stats[0] && j.stats[0].splits) || [];
  const acc = {};
  let lgER = 0, lgIP = 0, lgHR = 0;
  /* The same response already carries stolen bases allowed and runners caught, for
     every pitcher on every staff. Accumulated per club here because a steal leg
     had no nightly term at all: its whole number was the runner's season total
     over his club's games, so the league's best thief was the best steal leg every
     single night — measured over twelve simulated nights, one name took five of
     them. Who is behind the plate and on the mound is the thing that varies, and
     this is the only handle on it in a keyless feed.

     Over every pitcher, not just relievers: a runner going in the third faces the
     starter, and the club's rate is the club's rate. */
  const run = {};
  for(const s of splits){
    const tid = (s.team || {}).id, st = s.stat || {};
    if(!T[tid]) continue;
    const r = run[tid] || (run[tid] = { sb:0, cs:0 });
    r.sb += Number(st.stolenBases) || 0;
    r.cs += Number(st.caughtStealing) || 0;
    if(st.gamesStarted == null || Number(st.gamesStarted) !== 0) continue;
    const ip = inningsOf(st.inningsPitched), er = Number(st.earnedRuns);
    if(!ip || ip <= 0 || isNaN(er)) continue;
    const a = acc[tid] || (acc[tid] = { ip:0, er:0, hr:0 });
    a.ip += ip; a.er += er;
    a.hr += Number(st.homeRuns) || 0;
    lgER += er; lgIP += ip; lgHR += Number(st.homeRuns) || 0;
  }
  const teams = {};
  for(const k in acc){
    if(acc[k].ip < BP_MIN_IP) continue;
    teams[k] = { era:9 * acc[k].er / acc[k].ip, ip:acc[k].ip,
                 hr9:9 * acc[k].hr / acc[k].ip };
  }
  /* Caught-stealing rate per club, and the league's, with a floor on attempts so
     a club nobody has run against does not read as impregnable. */
  const def = {};
  let lgSb = 0, lgCs = 0;
  for(const k in run){
    const att = run[k].sb + run[k].cs;
    lgSb += run[k].sb; lgCs += run[k].cs;
    if(att >= 20) def[k] = run[k].cs / att;
  }
  return { teams, lg:lgIP > 0 ? 9 * lgER / lgIP : null,
           lgHr9:lgIP > 0 ? 9 * lgHR / lgIP : null,
           def, lgCs:(lgSb + lgCs) >= 200 ? lgCs / (lgSb + lgCs) : null };
}

/* ---------------- the feed ----------------
   MLB publishes every roster move as a transaction: trades, injured-list
   placements, activations, call-ups, releases. The descriptions are MLB's own
   prose, so this is a news feed without a word of it being written here. */
const FEED_DAYS = 12;

/* MLB's descriptions begin with the club's full name — "Los Angeles Dodgers
   placed RHP..." — which the header directly above already shows. Stripping it
   costs nothing and shortens every line in the feed. */
function trimClub(desc, teamId){
  if(!desc || !teamId) return desc || "";
  const full = (city(teamId) ? city(teamId) + " " : "") + nm(teamId);
  const bare = nm(teamId);
  for(const name of [full, bare]){
    if(name && desc.startsWith(name + " ")){
      const rest = desc.slice(name.length + 1);
      return rest.charAt(0).toUpperCase() + rest.slice(1);
    }
  }
  return desc;
}

/* MLB's transaction feed does not reliably carry a team id, but every
   description opens with the club's full name. Matching that recovers the club
   — and with it the colour, the abbreviation, and the ability to trim the name
   out of the sentence. Longest name first, so "Chicago White Sox" is not
   mistaken for "Chicago Cubs" on the word Chicago. */
let CLUB_BY_NAME = null;
function clubFromText(desc){
  if(!desc) return null;
  if(!CLUB_BY_NAME){
    CLUB_BY_NAME = [];
    for(const id of Object.keys(T).map(Number)){
      const full = (city(id) ? city(id) + " " : "") + nm(id);
      CLUB_BY_NAME.push([full.toLowerCase(), id]);
      if(nm(id)) CLUB_BY_NAME.push([nm(id).toLowerCase(), id]);
    }
    CLUB_BY_NAME.sort((a, b) => b[0].length - a[0].length);
  }
  const low = String(desc).toLowerCase();
  for(const [name, id] of CLUB_BY_NAME) if(low.startsWith(name + " ")) return id;
  return null;
}

/* The position MLB names before the player: "optioned CF Junior Perez". A real
   detail, and it costs nothing since the sentence is already in hand. */
function positionFromText(desc){
  const m = String(desc || "").match(/\b(RHP|LHP|C|1B|2B|3B|SS|LF|CF|RF|OF|IF|DH|P)\s+[A-Z]/);
  return m ? m[1] : null;
}

/* An initials disc in the club's colour. Not a likeness — MLB's headshots are
   licensed images and hotlinking them from a hosted page is a different matter
   from reading their stats API, so this is drawn rather than fetched. It earns
   its place by making the feed scannable by shape and colour instead of by
   reading every line.

   Falls back to the club abbreviation when a transaction names no player, which
   happens for coaching and front-office moves. */
function initialsOf(name){
  if(!name) return "";
  /* Suffixes are dropped, but particles are not: "Elly De La Cruz" is ED, not
     EC — lastName() already knows where a surname begins, so reuse it. */
  const parts = String(name).trim().split(/\s+/)
    .filter(p => !/^(jr\.?|sr\.?|i{2,3}|iv|v)$/i.test(p));
  if(!parts.length) return "";
  if(parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  const surname = lastName(parts.join(" "));
  return (parts[0][0] + (surname[0] || parts[parts.length - 1][0])).toUpperCase();
}

/* A hex colour at low opacity, so the disc carries the club's colour as a fill
   rather than only a ring. An outline alone reads as a placeholder. */
function tint(hex, alpha){
  const h = String(hex || "#738E93").replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(x => x + x).join("") : h, 16);
  if(isNaN(n)) return "rgba(115,142,147," + alpha + ")";
  return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255)
    + "," + alpha + ")";
}

function avatar(name, teamId, big, pos){
  const c = teamId ? col(teamId) : "#738E93";
  const txt = initialsOf(name) || (teamId ? ab(teamId).slice(0, 2) : "\u2014");
  return '<span class="avwrap" aria-hidden="true">'
    + '<span class="av' + (big ? " avbig" : "") + '"'
      + ' style="border-color:' + c + ';color:' + c
      + ';background:' + tint(c, big ? 0.18 : 0.12) + '">' + esc(txt) + '</span>'
    + (pos ? '<span class="avpos">' + esc(pos) + '</span>' : "")
    + '</span>';
}

/* A trade moves a player between two clubs, and the sentence makes you work out
   which way. Two discs and an arrow say it at a glance. */
function tradeAvatar(e){
  const to = e.team, from = e.from;
  if(!from || !to || from === to) return avatar(e.person, to, true);
  /* The player's initials, with the direction of the move beneath: the club he
     left, an arrow, the club he joined. */
  const txt = initialsOf(e.person);
  return '<span class="avtrade" aria-hidden="true">'
    + '<span class="av avbig" style="border-color:' + col(to) + ';color:' + col(to)
      + ';background:' + tint(col(to), 0.18) + '">' + esc(txt || "\u21c4") + '</span>'
    + '<span class="avpair">'
      + '<i class="avmini" style="background:' + col(from) + '"></i>'
      + '<i class="avarrow">\u2192</i>'
      + '<i class="avmini" style="background:' + col(to) + '"></i>'
    + '</span></span>';
}

/* The injured list comes in lengths, and they are different news. MLB states
   which in its own wording. */
function ilLength(desc){
  const m = String(desc || "").match(/(\d+)-day/i);
  return m ? m[1] + "-day" : null;
}

/* A short badge from MLB's type and wording. Status Change covers both going
   on the injured list and coming off it, so the description settles which. */
function feedKind(t){
  const d = String((t || {}).typeDesc || "").toLowerCase();
  const note = String((t || {}).description || "").toLowerCase();
  if(d.includes("trade")) return { tag:"trade", tone:"seam" };
  /* "il" as a substring matches Milwaukee, Phillies and available, so the test
     has to be for the phrase MLB actually uses. */
  if(/injured list|\b\d+-day\b|\bIL\b/i.test(note))
    return note.includes("activated") || note.includes("reinstated")
      ? { tag:"back", tone:"grass" } : { tag:"injured", tone:"blush" };
  if(note.includes("activated") || note.includes("reinstated")) return { tag:"back", tone:"grass" };
  if(d.includes("selected") || d.includes("recalled")) return { tag:"called up", tone:"bulb" };
  if(d.includes("optioned") || d.includes("assigned")) return { tag:"sent down", tone:"slate" };
  if(d.includes("designated")) return { tag:"dfa", tone:"slate" };
  if(d.includes("released")) return { tag:"released", tone:"slate" };
  if(d.includes("signed")) return { tag:"signed", tone:"bulb" };
  if(d.includes("claimed")) return { tag:"claimed", tone:"bulb" };
  return { tag:d || "move", tone:"slate" };
}

async function loadFeed(){
  const from = iso(shift(-FEED_DAYS)), to = iso(shift(1));
  let j;
  try{
    j = await getJSON(MLB + "/transactions?sportId=1&startDate=" + from + "&endDate=" + to);
  }catch(e){ return []; }
  const out = [];
  for(const t of j.transactions || []){
    if(!t.description) continue;
    const tid = (t.team || {}).id || clubFromText(t.description);
    out.push({
      id:t.id, date:t.date || t.effectiveDate || "",
      team:T[tid] ? tid : null,
      from:((t.fromTeam || {}).id) || null,
      person:(t.person || {}).fullName || null,
      /* The id, not just the name. Matching a transaction to a pick by name is
         a guess; matching by id is not. */
      pid:((t.person || {}).id) || null,
      desc:trimClub(t.description, T[tid] ? tid : null),
      kind:feedKind(t)
    });
  }
  /* MLB files a multi-player trade once per player, each carrying the same
     sentence, so a five-for-one arrived as five identical paragraphs. Collapsed
     to one, with a count of how many players the move covered. */
  const seen = {}, merged = [];
  for(const e of out){
    const key = e.date + "|" + e.desc;
    if(seen[key]){
      seen[key].also = (seen[key].also || 0) + 1;
      /* A five-for-one collapses to one row, but all five ids are kept so the
         row can still be matched against tonight's picks. */
      if(e.pid) (seen[key].pids = seen[key].pids || []).push(e.pid);
      continue;
    }
    seen[key] = e;
    merged.push(e);
  }
  // Newest first; MLB returns them oldest first.
  merged.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  return merged;
}

/* Who the transactions feed says is unavailable.

   The app has been printing an injured man's home run chance while the Feed tab,
   two taps away, carried MLB's own notice that he had been placed on the injured
   list. Nothing connected them: the Feed flagged moves that touched a pick, but a
   pick never asked the Feed anything.

   Walked oldest to newest so a placement followed by an activation leaves a man
   available again — the same player can go on the list and come off it inside the
   window, and only the last word counts. Multi-player entries carry every id, so
   a trade that folded several notices into one row still resolves each of them.

   What this cannot see: a man placed on the list before the feed's window opens,
   about twelve days. That is a real gap, and the lineup filter closes it a few
   hours before first pitch. This closes the morning, which is when the card is
   built. */
function unavailable(){
  const out = {};
  const feed = (S.feed || []).slice().sort((a, b) =>
    a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id || 0) - (b.id || 0));
  for(const e of feed){
    const tag = (e.kind || {}).tag;
    if(tag !== "injured" && tag !== "back" && tag !== "sent down") continue;
    const ids = [e.pid].concat(e.pids || []).filter(Boolean);
    for(const id of ids){
      if(tag === "back") delete out[id];
      else out[id] = tag === "injured" ? "on the injured list" : "sent down";
    }
  }
  return out;
}

/* Every player the app is currently naming, and in what capacity.

   The Feed has been a well-made news reader sitting beside an app that never
   read it. A ten-day injured-list placement is ordinary news until the man is
   one of tonight's four Watch picks, at which point it is the most important
   thing on the screen — and nothing said so.

   Built from what is already in memory, so it costs nothing. Degrades to an
   empty set before the hitters have loaded, which is the state the Feed tab is
   usually in if it is opened first. */
function namedPlayers(){
  const out = {};
  const today = iso(new Date());
  for(const g of S.games){
    if(g.date !== today) continue;
    if(g.hProbId) out[g.hProbId] = "starting tonight";
    if(g.aProbId) out[g.aProbId] = "starting tonight";
    if(g.st !== "sched") continue;
    for(const b of benchBats(g)) if(b.batterId) out[b.batterId] = "on the leaderboard";
    /* After the leaderboard, so a named pick overwrites the weaker label. */
    for(const b of bestBats(g)) if(b.batterId) out[b.batterId] = "named tonight";
  }
  return out;
}

/* A trade in the feed is better evidence than a clock.

   Roster data expires after three hours or a change of date, which bounds how
   stale it can get but still let a trade sit unreflected on the Plays tab for
   most of an afternoon. The Feed refreshes every ten minutes and knows about the
   move long before the clock does, so a trade it has not seen before expires the
   roster cache immediately.

   Not on the first read of a session: there is nothing to compare against then,
   and expiring on every cold start would refetch the heaviest data in the app
   for no reason. */
function tradeForcesRefresh(){
  const recent = iso(shift(-1));
  const trades = S.feed.filter(e => e.kind.tag === "trade" && e.date >= recent);
  if(!trades.length) return false;
  const newest = String(trades[0].id || (trades[0].date + trades[0].desc));
  if(S.feedTradeSeen === newest) return false;
  const first = S.feedTradeSeen == null;
  S.feedTradeSeen = newest;
  if(first || S.detailState !== "ready") return false;
  S.detailForce = true;    // detailStale() now reads true; loadDetail refetches
  return true;
}

/* Runs the animation only while it is in view. IntersectionObserver where it
   exists, and where it does not the scene simply keeps looping, which is what it
   did before. Re-attached after every render because render() rebuilds the whole
   tab and the old node is gone. */
let moonWatch = null;
function watchMoon(){
  const el = document.querySelector(".moon");
  if(!el || typeof IntersectionObserver !== "function") return;
  if(moonWatch) moonWatch.disconnect();
  moonWatch = new IntersectionObserver(entries => {
    for(const e of entries) e.target.classList.toggle("rest", !e.isIntersecting);
  }, { rootMargin:"80px" });
  moonWatch.observe(el);
}

/* Refetched when the tab is opened and the last read is more than ten minutes
   old. Loading once per session would leave a news feed frozen. */
const FEED_TTL = 10 * 60 * 1000;
async function ensureFeed(){
  if(S.feedState === "loading") return;
  const age = S.feedAt ? Date.now() - S.feedAt : Infinity;
  if(S.feedState === "ready" && age < FEED_TTL) return;
  if(!S.feed.length){ S.feedState = "loading"; render(); }
  const fresh = await loadFeed();
  if(fresh.length || !S.feed.length) S.feed = fresh;   // keep the old list if a refresh fails
  S.feedAt = Date.now();
  S.feedState = "ready";
  if(tradeForcesRefresh()) loadDetail();
  S.diag.feed = S.feed.length;
  render();
}

/* Venue coordinates and roof type come from MLB, so no ballpark list is
   hardcoded here and venue changes are picked up automatically. */
async function loadVenues(ids){
  const out = {};
  try{
    const j = await getJSON(MLB + "/venues?hydrate=location,fieldInfo&venueIds=" + ids.join(","));
    for(const v of j.venues || []){
      const c = ((v.location||{}).defaultCoordinates) || {};
      out[v.id] = { id:v.id, name:v.name,
        lat:c.latitude == null ? null : c.latitude,
        lon:c.longitude == null ? null : c.longitude,
        roof:((v.fieldInfo||{}).roofType) || null };
    }
  }catch(e){ /* weather simply stays absent */ }
  return out;
}

/* One request covers every ballpark: Open-Meteo accepts comma-separated
   coordinate lists and returns an array in the same order. */
async function loadWeather(venues){
  const parks = Object.values(venues).filter(v => v.lat != null && v.lon != null);
  if(!parks.length) return {};
  const url = WX
    + "?latitude=" + parks.map(p => p.lat).join(",")
    + "&longitude=" + parks.map(p => p.lon).join(",")
    + "&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,precipitation_probability,surface_pressure"
    + "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=UTC&forecast_days=3";
  let j;
  try{ j = await getJSON(url); }catch(e){ return {}; }
  const arr = Array.isArray(j) ? j : [j];
  const out = {};
  parks.forEach((p,i) => {
    if(arr[i] && arr[i].hourly)
      out[p.id] = { h:arr[i].hourly, elev:arr[i].elevation == null ? null : arr[i].elevation };
  });
  return out;
}

/* Air density from the ideal gas law: rho = P / (R * T), with pressure and
   temperature both measured. Thinner air means less drag and more carry,
   which is the whole story at altitude. 1.225 kg/m3 is the sea-level
   standard, so the percentage is honest physics on real inputs, not an
   invented "carry index". */
const R_AIR = 287.058, RHO0 = 1.225;
/* The sea-level standard is defined at 59F, so nearly every summer game sits
   below it — a 97% threshold flagged fourteen of fifteen and told you only
   that it was July. 90% is the level that actually separates altitude and
   desert heat from ordinary warm weather. */
const THIN_AIR = 90;
function airPct(tempF, hPa){
  if(tempF == null || hPa == null) return null;
  const K = (tempF - 32) * 5/9 + 273.15;
  return (hPa * 100) / (R_AIR * K) / RHO0 * 100;
}
const feet = m => Math.round(m * 3.28084);

/** Conditions at first pitch: the forecast hour nearest the start time. */
function wxAt(venueId, startISO){
  const rec = S.wx[venueId];
  if(!rec || !rec.h || !rec.h.time || !startISO) return null;
  const h = rec.h;
  const target = new Date(startISO).getTime();
  let best = -1, gap = Infinity;
  for(let i = 0; i < h.time.length; i++){
    const d = Math.abs(new Date(h.time[i] + "Z").getTime() - target);
    if(d < gap){ gap = d; best = i; }
  }
  if(best < 0 || gap > 3*3600*1000) return null;
  const temp = h.temperature_2m[best];
  const hPa = (h.surface_pressure || [])[best];
  return { temp, wind:h.wind_speed_10m[best], dir:h.wind_direction_10m[best],
           rain:(h.precipitation_probability||[])[best],
           air:airPct(temp, hPa), elev:rec.elev };
}

const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = deg => COMPASS[Math.round(((deg % 360) / 22.5)) % 16];
const degOf = pt => { const i = COMPASS.indexOf(pt); return i < 0 ? null : i * 22.5; };

/* Compass direction from home plate to centre field, per ballpark.
   Source: Clem's Baseball Architecture, "CF orientation" column, read from
   the current-parks section of the stadium statistics table.

   Keyed by venue name as MLB reports it, lowercased. Renamed parks carry
   both spellings so a rename does not silently break the lookup. Anything
   missing — the Athletics at Sutter Health Park, for one — falls back to the
   raw bearing, which is honest rather than guessed. */
const ORIENT = {
  "fenway park":"NE",                "wrigley field":"NE",
  "dodger stadium":"NNE",            "angel stadium":"NE",
  "kauffman stadium":"NE",           "oriole park at camden yards":"NNE",
  "rate field":"ESE",                "guaranteed rate field":"ESE",
  "rogers centre":"NNW",             "progressive field":"N",
  "coors field":"N",                 "tropicana field":"NE",
  "chase field":"N",                 "t-mobile park":"NE",
  "oracle park":"ESE",               "daikin park":"ENE",
  "minute maid park":"ENE",          "comerica park":"SSE",
  "american family field":"SE",      "pnc park":"ESE",
  "great american ball park":"ESE",  "great american ballpark":"ESE",
  "citizens bank park":"NNE",        "petco park":"N",
  "busch stadium":"NE",              "nationals park":"NNE",
  "yankee stadium":"ENE",            "citi field":"NNE",
  "target field":"E",                "loandepot park":"ESE",
  "truist park":"SSE",               "globe life field":"ENE"
};
const cfBearing = venueName => {
  if(!venueName) return null;
  const pt = ORIENT[venueName.toLowerCase().trim()];
  return pt ? degOf(pt) : null;
};

/* Where the wind is actually pushing the ball, given the park's alignment.
   Open-Meteo reports the bearing wind comes FROM, so it travels toward
   bearing+180. Measured against the home-plate-to-centre axis: negative is
   the left-field side, positive the right. */
const WIND_ZONES = ["out to center","out to right","crossing to right","in from right",
                    "in from center","in from left","crossing to left","out to left"];
function windRelative(fromDeg, cf){
  if(fromDeg == null || cf == null) return null;
  let a = (fromDeg + 180) - cf;
  a = ((a % 360) + 360) % 360;                 // 0–359 clockwise from the CF axis
  return WIND_ZONES[Math.round(a / 45) % 8];
}

/* The same geometry as a number rather than a label: how much of the wind is
   actually pushing toward the outfield, in mph. Positive blows out, negative in,
   and a crosswind lands near zero because it does neither. The eight zones above
   are for reading; this is for arithmetic. */
function windOut(fromDeg, mph, cf){
  if(fromDeg == null || cf == null || mph == null) return null;
  const toward = (fromDeg + 180) * Math.PI / 180;
  return mph * Math.cos(toward - cf * Math.PI / 180);
}

/* ---------------- conditions, as they bear on a home run ----------------
   The app has measured the wind and the air at every ballpark since the weather
   went in, printed both on the card, and never once let them touch the bat pick
   — which is the pick they bear on most. A fly ball at the wall is decided by
   drag and by what the air is doing, and both are known here.

   Air is physics and already computed: density from the measured pressure and
   temperature, as a share of the sea-level standard. Thinner air is less drag
   and more carry, which is the whole of why Coors plays as it does. The
   elasticity below converts a density shortfall into a home run rate, and it is
   set so that Coors on a summer evening — around 85% of standard — lifts the
   rate by roughly a fifth, which is the neighbourhood of that park's measured
   home run factor.

   Wind is a judgement, and a deliberately small one: a percent and a half per
   mph blowing out, capped at a quarter either way, so a 15 mph gale out to
   centre moves the number by about a fifth and a hurricane cannot move it by
   more than a quarter. Published work on Wrigley puts the real effect higher
   than this. Damped on purpose, since the forecast is for first pitch and the
   wind at 9pm is not the wind at 7.

   Neither coefficient is fitted against results, exactly as SP_WEIGHT was not
   before the calibration existed. They are stated here so they can be argued
   with, and the record now grades every pick against the number they produce,
   which is how they will eventually be found wrong. */
const AIR_ELASTICITY = 1.3;
const WIND_PER_MPH = 0.015;
const WIND_CAP = 0.25;

/* What the air is doing across tonight's slate.

   The air term measured every park against the sea-level standard, which is
   defined at 59F — a temperature baseball is rarely played in. So a 95% park
   scored x1.065, a 93% park x1.091, and on a summer slate every single game was
   multiplied upward with nothing pulling the other way. That is a systematic
   inflation of every bat pick, not a park effect.

   Measured against the slate's own mean instead, so Coors is still high and a
   cool coastal evening is genuinely low. The cost is that a night which is hot
   everywhere now reads as neutral rather than raised; the benefit is that the
   term no longer adds several per cent to every number in the app. */
function slateAir(){
  let sum = 0, n = 0;
  for(const g of S.games){
    const w = wxAt(g.venueId, g.start);
    if(w && w.air != null){ sum += w.air; n++; }
  }
  return n >= 3 ? sum / n : null;
}

function hrConditions(g){
  const v = S.venues[g.venueId];
  const w = wxAt(g.venueId, g.start);
  if(!w) return null;
  const roofShut = !!(v && v.roof && /dome|indoor|closed/i.test(v.roof));
  let mult = 1, air = null, out = null;
  const ref = slateAir();
  if(w.air != null && ref != null){
    air = w.air;
    mult *= 1 + AIR_ELASTICITY * ((ref - w.air) / 100);
  } else if(w.air != null){
    air = w.air;          // shown, but nothing to measure it against yet
  }
  /* A closed roof means there is no wind in play, whatever the forecast says
     about the weather outside it. */
  if(!roofShut){
    const cf = cfBearing((v && v.name) || g.venue);
    const o = windOut(w.dir, w.wind, cf);
    if(o != null){
      out = o;
      mult *= 1 + Math.max(-WIND_CAP, Math.min(WIND_CAP, WIND_PER_MPH * o));
    }
  }
  return { mult, air, out, roofShut, temp:w.temp, wind:w.wind, dir:w.dir };
}

async function load(){
  const yr = new Date().getFullYear();
  try{
    const [st, sc] = await Promise.all([
      getJSON(MLB + "/standings?leagueId=103,104&season=" + yr + "&standingsTypes=regularSeason"),
      getJSON(MLB + "/schedule?sportId=1&startDate=" + iso(shift(-1)) + "&endDate=" + iso(shift(2))
              + "&hydrate=team,linescore,probablePitcher,lineups")
    ]);
    const teams = readStandings(st);
    if(Object.keys(teams).length < 20) throw new Error("standings incomplete");
    S.teams = teams;
    S.games = readGames(sc);
    S.phase = "ready"; S.err = null; S.at = new Date(); S.stale = false;
    S.odds = simulate(SIMS);
    saveCache();
    if(!S.baseline) saveBaseline();   // first visit: record the starting point silently
    render();

    /* What a collapsed card shows: score, time, stakes, weather. That is all
       this stage fetches. Starters, power and the model line live behind a
       tap, so their data is fetched on the tap — see loadDetail. */
    if(!Object.keys(S.venues).length){
      const ids = [...new Set(S.games.map(g => g.venueId).filter(Boolean))];
      if(ids.length){ S.venues = await loadVenues(ids); render(); }
    }
    // Ballparks do not move, so venues are fetched once. Weather does.
    const wxAge = S.wxAt ? Date.now() - S.wxAt : Infinity;
    if(Object.keys(S.venues).length && wxAge > 15 * 60 * 1000){
      S.wx = await loadWeather(S.venues); S.wxAt = Date.now(); render();
    }
    // Box scores carry the batter's line and the pitcher's count.
    loadBoxscores();

    /* The live win probability needs each club's scoring rate, which lives in
       the season fetch. Without this it was only ever available after visiting
       another tab, so the bar silently omitted itself on the one screen where
       it matters. Guarded internally, so it runs once. */
    if(S.games.some(g => g.st === "live")) ensureSeason();

    // A live card shows its pitcher without being expanded, so fetch those now.
    if(S.games.some(g => g.st === "live") && !Object.keys(S.pitchers).length){
      const pids = [...new Set(S.games
        .flatMap(g => [g.hProbId, g.aProbId, g.pitcherId]).filter(Boolean))];
      if(pids.length){ S.pitchers = await loadPitchers(pids); render(); }
    }
  }catch(e){
    S.err = e.message;
    if(S.phase !== "ready") S.phase = "error";
    render();
  }
}

/* Everything behind the disclosure: starters with their game logs, the power
   blocks, and the bullpen figures the model line needs. Four requests, two of
   them 750 rows deep — far and away the bulk of this app's traffic, and all of
   it for content that stays folded away until asked for. So it is fetched on
   the first expand, once per session, and rendered as each piece lands. */
/* The season fetch serves two masters: head-to-head records on the cards, and
   the real fixture list the forecast needs. Either tab may ask for it first,
   so it lives behind one guard and recomputes the odds once it lands. */
async function ensureSeason(){
  if(S.remaining) return;
  const season = await loadSeason();
  S.h2h = season.h2h;
  S.series = season.series;
  S.runs = season.runs;
  S.finals = season.finals;
  S.remaining = season.remaining;
  S.diag.h2h = Object.keys(S.h2h).length;
  S.diag.remaining = season.remaining.length;
  if(season.remaining.length > 100) S.odds = simulate(SIMS);   // now schedule-aware
  render();
}

/* Rosters, hitters and bullpens were fetched once and never again. Scores poll
   every thirty seconds and the transactions feed every ten minutes, so the app
   could print a trade in the Feed while still listing the player under his old
   club on the Plays tab — two sets of facts from the same source disagreeing
   because one had an expiry and the other did not. On a phone, where the app sits
   in the background for days rather than being reloaded, that gap only widens.

   Three hours, or any change of date, whichever comes first. The date check is
   the one that matters: most roster moves land overnight. */
const DETAIL_TTL = 3 * 60 * 60 * 1000;

function detailStale(){
  if(S.detailState !== "ready") return false;
  /* An explicit flag, not a zeroed timestamp. Setting detailAt to 0 to force a
     refresh looked like it worked and did nothing, because the guard below
     treats 0 as "never loaded" and returns false. */
  if(S.detailForce) return true;
  if(!S.detailAt) return false;
  if(S.detailDay && S.detailDay !== iso(new Date())) return true;
  return Date.now() - S.detailAt > DETAIL_TTL;
}

async function loadDetail(){
  if(S.detailState === "loading") return;
  if(S.detailState === "ready"){
    if(!detailStale()) return;
    /* Cleared so the guards below fetch again rather than skipping. Each piece
       re-renders as it lands, the same as on a cold start. */
    S.pitchers = {}; S.bullpens = {}; S.bpLg = null; S.bpLgHr9 = null;
    S.runDef = {}; S.lgCs = null;
    S.rosters = {}; S.bats = {}; S.hitters = {}; S.teamBat = {}; S.runners = {};
    S.splits = {}; S.lgSplit = null;
  }
  S.detailState = "loading";
  render();
  try{

  const pids = [...new Set(S.games
    .flatMap(g => [g.hProbId, g.aProbId, g.pitcherId]).filter(Boolean))];

  if(!Object.keys(S.pitchers).length && pids.length){
    S.pitchers = await loadPitchers(pids); render();
  }
  S.diag.pitchers = Object.keys(S.pitchers).length;

  if(pids.length){ S.diag.form = await loadPitcherForm(pids); render(); }

  if(!Object.keys(S.bullpens).length){
    const bp = await loadBullpens();
    S.bullpens = bp.teams; S.bpLg = bp.lg; S.bpLgHr9 = bp.lgHr9;
    S.runDef = bp.def || {}; S.lgCs = bp.lgCs; render();
  }
  S.diag.bullpens = Object.keys(S.bullpens).length;

  await ensureSeason();

  if(!Object.keys(S.hitters).length){
    if(!Object.keys(S.rosters).length){
      const r = await loadRosters() || {};
      S.rosters = r.club || {};
      S.bats = r.bats || {};
      S.diag.rosters = Object.keys(S.rosters).length;
      S.diag.bats = Object.keys(S.bats).length;
    }
    /* Splits ride with the hitters: same cadence, same expiry, and useless
       without them. */
    S.splits = await loadSplits() || {};
    S.lgSplit = null;
    S.diag.splits = Object.keys(S.splits).length;
    const hit = await loadHitters(S.rosters) || {};
    /* Defensive on the way in as well, so a future change to loadHitters cannot
       reintroduce the same failure. */
    S.hitters = hit.byTeam || {};
    S.teamBat = hit.teamBat || {};
    S.runners = hit.runners || {};
    render();
  }
  S.diag.hitters = Object.values(S.hitters).reduce((n,a) => n + a.length, 0);

    S.detailState = "ready";
    S.detailAt = Date.now();
    S.detailDay = iso(new Date());
    S.detailForce = false;
  }catch(e){
    // Never leave a card stuck on "loading" because one call blew up.
    S.detailState = "error";
  }
  render();
  ensureHitterForm();
}

/* What just happened. MLB names the event and writes the sentence, so the only
