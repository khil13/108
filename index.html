          leg.hit = sb > 0; leg.actual = sb + " SB";
        }
        changed = true;
      } else if(leg.kind === "k"){
        if(!pitchedIn(b)){ leg.void = true; leg.actual = "did not pitch"; changed = true; continue; }
        const k = b.pK != null ? b.pK : 0;
        /* Legs written before the line existed carried only a floor, and an
           absent `over` reads as the over it always was. */
        const cleared = k >= leg.need;
        leg.hit = leg.over === false ? !cleared : cleared;
        leg.actual = k + " K";
        changed = true;
      }
    }
  }
  if(changed){ S.parlayDirty = true; saveParlay(); }
  return changed;
}

/* Where a card stands, which is not the same question as how it finished.

   Once legs start settling the pre-game product stops being the number that
   matters. What matters is the chance of the legs still outstanding — and a card
   sitting at 2% with seven of eight already in is telling you the wrong thing at
   the moment you most want the right one. */
function parlaySummary(rec){
  const legs = rec.legs || [];
  const live = legs.filter(l => !l.void);
  const done = live.filter(l => l.hit != null);
  const hit = done.filter(l => l.hit).length;

  /* A leg decided while the game is still on counts toward where the card
     stands, without being treated as finally graded. */
  let failed = 0, remaining = 0, remainingP = 1, early = 0;
  for(const l of live){
    const verdict = l.hit != null ? l.hit : l.clear ? true : l.dead ? false : null;
    if(l.hit == null && (l.clear || l.dead)) early++;
    if(verdict === null){ remaining++; remainingP *= l.p; }
    else if(!verdict) failed++;
  }
  const dead = failed > 0;
  return { n:live.length, done:done.length, hit, early, failed, dead, remaining,
           voided:legs.length - live.length,
           /* Zero once anything has failed; one when nothing is left to come. */
           conditional:dead ? 0 : remainingP,
           settled:done.length === live.length && live.length > 0,
           landed:done.length === live.length && hit === live.length && live.length > 0,
           joint:live.reduce((n, l) => n * l.p, 1) };
}

/* ---------------- how much evidence is behind a number ----------------

   Not a grade of the bet. Grading a bet needs a price to compare against, and
   this app has none — the odds it displays are converted from its own
   probability, so an "edge" computed here would be the model measured against
   itself and would read zero forever. An app that showed a confident letter with
   nothing behind it would be doing the one thing this record exists to prevent.

   What can be graded is the evidence, and every input is already measured:

     the component      strikeouts miss by about two and are the best-calibrated
                        thing here; run totals measure no better than guessing the
                        league average, and a leg drawn from one is worth less
                        trust than a leg drawn from the other, whatever its stated
                        probability says
     the sample         a bat with two hundred plate appearances is weaker
                        evidence than one with six hundred
     the lineup         posted, or the pick made blind hours early
     the starter        confirmed, or a league-average stand-in filling in

   Each is a deduction from a full mark, so the letter has an arithmetic behind it
   and a one-line reason that names whichever deduction was largest. */
const GRADE_BASE = {
  k:    0,     // strikeouts: the best-calibrated component in the record
  ml:   0.6,   // sides: ahead of the home-field baseline, but barely
  hr:   0.8,   // homers: measured, corrected, still the shakiest of the bats
  hit:  0.5,
  run:  0.5,
  sb:   1.4,   // steals: the app cannot see whether a runner starts
  runs: 1.6    // run totals: no better than a flat guess, by its own calibration
};

function evidence(o){
  if(!o || !o.kind) return null;
  let cost = GRADE_BASE[o.kind] != null ? GRADE_BASE[o.kind] : 0.8;
  const why = [];
  const hit = (c, reason) => { if(c > 0){ cost += c; why.push([c, reason]); } };
  if(GRADE_BASE[o.kind] >= 1.4) why.push([GRADE_BASE[o.kind], "the weakest component in the record", "kind"]);
  else if(GRADE_BASE[o.kind] >= 0.8) why.push([GRADE_BASE[o.kind], "from a component that runs middling", "kind"]);

  /* The wording scales with the number, because one sentence for every sample
     below five hundred said "465 plate appearances is a thin sample" — and 465 is
     most of a full season, printed under a B grade as though something were
     wrong. A partial season and a hundred-odd trips to the plate are different
     complaints and now read as different complaints. */
  if(o.pa != null) hit(o.pa >= 500 ? 0 : o.pa >= 300 ? 0.4 : o.pa >= 150 ? 0.9 : 1.5,
    o.pa >= 300 ? o.pa + " plate appearances, short of a full season"
      : o.pa >= 150 ? "only " + o.pa + " plate appearances behind the rate"
      : "just " + o.pa + " plate appearances \u2014 very little to go on");
  if(o.gs != null) hit(o.gs >= 15 ? 0 : o.gs >= 8 ? 0.5 : 1.1,
    o.gs >= 8 ? o.gs + " starts on file, short of a full season"
      : "just " + o.gs + " starts on file");
  /* An unposted lineup costs a little rather than a lot, because it is the normal
     state of the world: lineups appear three or four hours before first pitch, so
     a card built in the morning has every bat unposted. Charging 0.7 for it meant
     the grade was mostly reporting what time of day it was. Posting a lineup is
     now a small bonus in effect rather than its absence being a large penalty. */
  if(o.posted === false) hit(0.3, "the lineup is not posted yet");
  if(o.tba === true) hit(1.0, "the opposing starter has not been named");
  /* There was a penalty here for how far the calibration moved the raw number.
     It looked like per-pick information and was not: the mapping is a single
     curve fitted to the whole component, so it moves every homer pick by 30 to 40
     per cent, and the only variation is with the probability itself — which is
     printed beside the letter already. Two picks at 28% and 32% were drawing
     different letters purely from where that near-constant landed against a
     threshold. The component's own weakness is already charged above, once. */
  /* Sides and run totals are club-level, so nothing above touched them and every
     such leg drew the same letter every night — a label rather than a
     measurement. What varies is how confident the projection is: a pick at 51%
     is one the model cannot separate, whatever component it came from. */
  if(o.p != null){
    const edge = Math.abs(o.p - 0.5);
    hit(edge >= 0.12 ? 0 : edge >= 0.06 ? 0.4 : 0.8,
      edge >= 0.06 ? "a modest separation" : "the model barely separates this one");
  }

  const letter = cost <= 0.5 ? "A" : cost <= 1.2 ? "B" : cost <= 2.2 ? "C" : "D";
  /* An A means nothing meaningful is missing, so it does not get a complaint
     printed under it. A single small deduction can still land inside the A band,
     and leading with it read as though the top mark were a warning. */
  if(letter === "A") return { letter, cost, why:"everything on file and in sample" };
  /* The component's own weakness is a property of the kind, not of this pick, and
     it is already implied by what the row says it is. So the reason prefers
     whatever is specific to tonight — an unposted lineup, a thin sample, an
     unnamed arm — and falls back to the component only when nothing else is
     wrong. Otherwise every steal leg reads "the weakest component" whether or not
     the app knows the runner is starting, which is the one thing that
     distinguishes them. */
  /* Only deductions that actually cost something get to explain the letter. A
     0.4 mark against a leg that still grades B should not be the sentence under
     it, or the row reads worse than the letter says. */
  const specific = why.filter(w => w[2] !== "kind" && w[0] >= 0.5);
  const pick = specific.length ? specific : why;
  pick.sort((a, b) => b[0] - a[0]);
  return { letter, cost, why:pick.length ? pick[0][1] : "everything on file and in sample" };
}

/* The arc is written once and used twice: the trail is that path stroked, and
   the ball rides the same path via offset-path, so the two can never disagree
   about where the ball went. */
/* ---------------- the night's best line ----------------

   Every box score the app fetches already carries every player in the game, both
   sides, whether or not the app named any of them. Settlement parses all of it
   and then throws away everything it did not ask about. So the best offensive
   line on the slate is already in memory once a night, and noticing it costs no
   request at all — which is the only reason this is worth doing. Fetching thirty
   box scores to decorate a header would not be.

   Scored on what the box gives structurally: hits, home runs, runs and steals. No
   parsing of the summary string for doubles and RBI, because that string is prose
   and its shape has changed before. A weight of four on a home run and one on
   everything else is a judgement, stated here rather than tuned — nothing depends
   on it beyond which name appears above the numbers. */
const STAR_KEY = "108.star";

function lineScore(b){
  if(!b || !b.batPA) return 0;
  const h = b.batH || 0, hr = b.todayHr || 0;
  return h + 3 * hr + (b.batR || 0) + (b.batSb || 0);
}

function noteStar(pk, date, box, teams){
  let best = null, bestScore = 0;
  for(const id in box){
    const b = box[id];
    if(!b.name || !b.batPA) continue;
    const sc = lineScore(b);
    if(sc > bestScore){ bestScore = sc; best = { id, b, sc }; }
  }
  /* A quiet three-for-four is not worth a headline; this is looking for the one
     line on the slate that stood out. */
  if(!best || bestScore < 6) return false;
  const prev = S.star;
  if(prev && prev.date === date && prev.score >= bestScore) return false;
  const b = best.b;
  S.star = { date, pk, id:Number(best.id), name:b.name, score:bestScore,
    hr:b.todayHr || 0, h:b.batH || 0, r:b.batR || 0, sb:b.batSb || 0,
    line:b.today || null,
    /* Which side he bats from, so the scene can put him there. Read now rather
       than at render time: the roster map can be cleared and refetched between
       the night he did it and the morning you look. */
    side:S.bats ? (S.bats[Number(best.id)] || null) : null,
    team:b.side === "home" ? teams.home : teams.away };
  try{ localStorage.setItem(STAR_KEY, JSON.stringify(S.star)); }catch(e){}
  return true;
}

function loadStar(){
  try{
    const raw = localStorage.getItem(STAR_KEY);
    const v = raw ? JSON.parse(raw) : null;
    /* Yesterday's line, not last week's. Anything older is dropped rather than
       shown, since a stale headline is worse than none. */
    if(v && v.date && v.date >= iso(shift(-2))) S.star = v;
  }catch(e){}
}

const MOON_ARC = "M36 56 C 112 4, 216 4, 296 31";

/* One ball per home run, up to three, each leaving a beat after the last. With no
   star to show it falls back to a single ball and no caption, which is the state
   on any morning before a box score has been read. */
function moonshot(){
  const st = S.star;
  /* A left-hander stands on the other side of the plate and pulls the other way,
     so the whole scene is mirrored rather than the figure alone — batter, arc,
     wall and crowd all swap ends. A switch hitter is drawn right-handed, which is
     a coin toss rather than a claim.

     Mirrored with a transform on the group instead of a second set of
     coordinates: one geometry to get right, and the arc length the dash values
     depend on is unchanged by a reflection. */
  const lefty = st && st.side === "L";
  /* Math.min(3, undefined) is NaN, and a NaN loop bound draws no balls at all —
     an empty sky where the animation should be. Coerced and floored so a missing
     or nonsensical homer count still shows one. */
  const hr = st && isFinite(Number(st.hr)) ? Math.floor(Number(st.hr)) : 0;
  const balls = Math.max(1, Math.min(3, hr));
  /* A star object without a name is not a star: it produced a caption reading
     "undefined" rather than falling back to none. */
  const label = st && st.name
    ? esc(lastName(st.name)) + ' \u00b7 ' + esc(st.line || ((st.h || 0) + " hits"))
      + (st.team ? ' \u00b7 ' + ab(st.team) : "")
    : null;
  /* His club's colour, where there is one. The rest of the app already colours
     every row by team; the one picture in it was the exception. */
  const tint = st && st.team ? col(st.team) : null;
  let out = MOON_OPEN(lefty, tint);
  for(let i = 0; i < balls; i++)
    out += '<circle class="ball" style="offset-path:path(\'' + MOON_ARC + '\');'
      + 'animation-delay:' + (i * 0.24).toFixed(2) + 's"/>';
  out += '</g></svg>';
  /* Outside the svg, so a left-hander's caption is not reflected with the park. */
  return out + (label
    ? '<p class="moonwho"><span>Yesterday\u2019s best line</span>' + label + '</p>'
    : "");
}

const MOON_OPEN = (lefty, tint) => '<svg class="moon" viewBox="0 0 320 74"'
  + ' preserveAspectRatio="xMidYMid meet" role="img"'
  + ' aria-label="A batter driving a ball over the outfield wall">'
  /* One reflection about the centre line flips the whole park. */
  + '<g' + (lefty ? ' transform="translate(320,0) scale(-1,1)"' : "")
    + (tint ? ' style="--tint:' + tint + '"' : "") + '>'
  /* Back to front, and the order matters: the stands are a filled block first,
     then the crowd sits on top of it. Drawn the other way round the block covered
     every one of them and the seats read as an empty box. */
  + '<rect class="wall" x="248" y="18" width="72" height="28" rx="1"/>'
  + '<circle class="fan" cx="256" cy="24" r="1.6"/><circle class="fan" cx="265" cy="24" r="1.6"/><circle class="fan" cx="274" cy="24" r="1.6"/><circle class="fan" cx="283" cy="24" r="1.6"/><circle class="fan" cx="292" cy="24" r="1.6"/><circle class="fan" cx="301" cy="24" r="1.6"/><circle class="fan" cx="310" cy="24" r="1.6"/><circle class="fan" cx="260" cy="30" r="1.6"/><circle class="fan" cx="269" cy="30" r="1.6"/><circle class="fan" cx="278" cy="30" r="1.6"/><circle class="fan" cx="287" cy="30" r="1.6"/><circle class="fan" cx="296" cy="30" r="1.6"/><circle class="fan" cx="305" cy="30" r="1.6"/><circle class="fan" cx="314" cy="30" r="1.6"/><circle class="fan" cx="256" cy="36" r="1.6"/><circle class="fan" cx="265" cy="36" r="1.6"/><circle class="fan" cx="274" cy="36" r="1.6"/><circle class="fan" cx="283" cy="36" r="1.6"/><circle class="fan" cx="292" cy="36" r="1.6"/><circle class="fan" cx="301" cy="36" r="1.6"/><circle class="fan" cx="310" cy="36" r="1.6"/>'
  + '<path class="cap" d="M248 18 H320"/>'
  /* The foul pole rises from the wall it belongs to rather than floating. */
  + '<path class="pole" d="M249 18 V3"/>'
  + '<path class="ground" d="M0 58 H320"/>'
  /* A shallow infield edge. An arc of radius 46 across this width climbed to the
     top of the frame and read as a dome over the batter's head. */
  + '<path class="dirt" d="M10 58 Q 52 48, 94 58"/>'
  /* Head, torso and two legs in a stance \u2014 small, but enough that it reads as a
     person rather than a lollipop at this size. */
  + '<circle class="body" cx="26" cy="36" r="3.4"/>'
  + '<path class="limb" d="M26 40 L26 48"/>'
  + '<path class="limb" d="M26 48 L21 58"/>'
  + '<path class="limb" d="M26 48 L31 58"/>'
  + '<path class="bat" d="M26 43 L41 32"/>'
  + '<circle class="splash" cx="296" cy="31" r="5"/>'
  + '<path class="arc" d="' + MOON_ARC + '"/>'
  + '<path class="comet" d="' + MOON_ARC + '"/>';

/* Three bats worth looking at first, each chosen by a different question.

   The leaderboard lists every club in schedule order and leaves you to scan
   sixty rows for what stands out. This says which three are interesting and why
   each one is here — the likeliest to go deep, the likeliest to reach base at
   all, and the one whose matchup has moved him furthest from his own baseline.

   Three different criteria on purpose. Ranking everything by one number would
   just be the top of the leaderboard again, and the third question in particular
   is one no ranking answers: not "who is best" but "who is most improved by
   tonight", which is a genuinely different bat most nights.

   Nothing here is recorded. These are the same picks already on the cards below,
   surfaced rather than duplicated — a named pick is graded once, in the record,
   whether or not it also appears here. */
function highlightBats(games){
  const all = [];
  for(const g of games) for(const b of bestBats(g).concat(benchBats(g))){
    if(b.batterId == null) continue;
    /* How much tonight has moved him from his own season rate. The conditions,
       the arm and the platoon are all already inside `adjusted`; `blended` is
       what he does ordinarily. A ratio, so a modest hitter in a good spot can
       outrank a great one in a neutral spot, which is the point of asking. */
    b.lift = b.blended > 0 && b.adjusted > 0 ? b.adjusted / b.blended : 1;
    all.push(b);
  }
  if(all.length < 3) return null;
  const best = (key, dir) => all.slice().sort((a, b) =>
    (dir === "up" ? b[key] - a[key] : a[key] - b[key]))[0];

  const power = best("tonight", "up");
  /* Distinct names, so the block never says the same man three times. By name as
     well as by id: a doubleheader puts the same player in two games with two
     different ids for the pick, and both would otherwise be eligible. */
  const seen = {};
  const claim = b => { seen[b.batterId] = true; seen["n:" + b.batter] = true; return b; };
  const free = () => all.filter(b => !seen[b.batterId] && !seen["n:" + b.batter]);
  claim(power);
  const contact = free().sort((a, b) => (b.pHit || 0) - (a.pHit || 0))[0];
  if(!contact) return null;
  claim(contact);
  const matchup = free().sort((a, b) => b.lift - a.lift)[0];
  if(!matchup) return null;
  return { power, contact, matchup };
}

function highlightBlock(games){
  const h = highlightBats(games);
  if(!h) return "";
  const pct = v => v == null ? "\u2014" : Math.round(v * 100) + "%";
  const why = b => {
    const bits = [];
    if(b.hr != null) bits.push(b.hr + " HR");
    if(b.side && b.hand) bits.push(b.side + " v " + b.hand + "HP");
    if(b.pitcher) bits.push("v " + lastName(b.pitcher));
    return bits.join(" \u00b7 ");
  };
  const cell = (tag, b, figure, label, kind) => {
    const ev = evidence({ kind, pa:b.pa, posted:b.posted, tba:b.tba,
      p:kind === "hit" ? b.pHit : b.tonight });
    return '<div class="hcard">'
    + '<span class="htag">' + tag + '</span>'
    + '<div class="hname">'
      + '<span class="tbar" style="background:' + col(b.team) + '" aria-hidden="true"></span>'
      + esc(lastName(b.batter)) + '</div>'
    + '<div class="hfig"><b>' + figure + '</b><span>' + label + '</span>'
      + (ev ? '<span class="hgrade g' + ev.letter + '" title="'
          + esc(ev.why) + '">' + ev.letter + '</span>' : "")
    + '</div>'
    + '<div class="hwhy">' + esc(why(b)) + '</div>'
    + (ev ? '<div class="hwhy ev">' + esc(ev.why) + '</div>' : "")
    + '</div>';
  };

  return moonshot()
    + '<h2 class="eyebrow">Three to look at first</h2>'
    + '<div class="hgrid">'
      + cell("Most likely to go deep", h.power, pct(h.power.tonight), "home run", "hr")
      + cell("Most likely to reach", h.contact, pct(h.contact.pHit), "a hit", "hit")
      + cell("Best matchup tonight", h.matchup,
          (h.matchup.lift >= 1 ? "+" : "") + Math.round((h.matchup.lift - 1) * 100) + "%",
          "against his own rate", "hr")
    + '</div>'
    + '<p class="note">Three questions rather than one ranking: the biggest home run '
    + 'chance, the biggest chance of a hit, and the bat the night has moved furthest from '
    + 'its own season rate \u2014 conditions, the arm faced and the handedness matchup all '
    + 'together. That last one is not a claim he is the best bat on the slate, only that '
    + 'tonight suits him most. All three are already named on the cards below; this is '
    + 'where to start, not an extra set of picks.</p>';
}

/* Three more bats per club, beyond the two already named below in the game
   cards. Grouped by team rather than by game, since the question here is "who
   else on this roster is worth a look" rather than "what does this matchup say."

   Nothing here is recorded. bestBats feeds the scorecard and the parlay and its
   picks are graded the next day; this is the opposite of that on purpose — a
   look at the rest of the lineup, not a claim being tracked, which is why it
   reads in bars rather than in the tick-or-cross language the record uses. */
function leaderboardBlock(games){
  const groups = [];
  for(const g of games){
    const byTeam = {};
    for(const b of benchBats(g)) (byTeam[b.team] = byTeam[b.team] || []).push(b);
    for(const teamId in byTeam) groups.push({ teamId:Number(teamId), bats:byTeam[teamId] });
  }
  if(!groups.length) return "";

  const bar = (label, pct, tone) => '<div class="leadbar">'
    + '<span class="leadlbl">' + label + '</span>'
    + '<span class="leadtrack"><i style="width:' + Math.max(2, pct * 100)
      + '%;background:' + tone + '"></i></span>'
    + '<span class="leadpct">' + Math.round(pct * 100) + '%</span></div>';
  const row = b => '<div class="leadrow">'
    + '<span class="leadname">' + esc(lastName(b.batter)) + '</span>'
    + '<div class="leadbars">'
      + bar("H", b.pHit || 0, "var(--grass)")
      + bar("R", b.pRun || 0, "var(--slate)")
      + bar("HR", b.tonight || 0, "var(--bulb)")
    + '</div></div>';
  const group = gr => '<div class="leadgrp">'
    + '<div class="leadhead">'
      + '<span class="tbar" style="background:' + col(gr.teamId) + '" aria-hidden="true"></span>'
      + '<b>' + ab(gr.teamId) + '</b><em>' + esc(nm(gr.teamId)) + '</em></div>'
    + gr.bats.map(row).join("")
    + '</div>';

  return SEAM + '<h2 class="eyebrow">Also worth watching</h2>'
    + '<button class="disc notes" data-leadmore="1" aria-expanded="'
      + (S.leadOpen ? "true" : "false") + '">'
      + '<span>' + groups.length + ' clubs, three bats each, beyond the two named below</span>'
      + '<i class="chev" aria-hidden="true">' + (S.leadOpen ? "\u25B4" : "\u25BE") + '</i></button>'
    + (S.leadOpen ? groups.map(group).join("") : "")
    + (S.leadOpen
        ? '<p class="note">Same three chances as the named bats \u2014 hit, run, home run, '
          + 'over a full game \u2014 ranked just below them by the same measure. Not '
          + 'recorded and not graded: this is the rest of tonight\u2019s lineups, not a '
          + 'second set of picks.</p>'
        : "");
}

/* The card, with the number that decides it at the top rather than the bottom. */
function parlayBlock(){
  const today = iso(new Date());
  const rec = S.parlay[today];
  const past = Object.values(S.parlay)
    .filter(r => r.date !== today && (r.legs || []).some(l => l.hit != null))
    .sort((a, b) => a.date < b.date ? 1 : -1)
    .slice(0, 5);

  const odds = p => p <= 0 ? "\u2014"
    : p >= 1 ? "1 in 1"
    : "1 in " + (1 / p >= 1000 ? Math.round(1 / p / 100) * 100 : Math.round(1 / p)).toLocaleString();

  const legRow = leg => {
    /* A leg decided with the game still on gets the same glyph at reduced
       weight: settled and merely certain are not quite the same thing. */
    const ev = evidence({ kind:leg.kind, pa:leg.pa, gs:leg.gs, p:leg.p,
      posted:leg.posted, tba:leg.tba });
    const mark = leg.void ? ["t", "\u2013"]
      : leg.hit != null ? (leg.hit ? ["y", "\u2713"] : ["n", "\u2717"])
      : leg.clear ? ["y prov", "\u2713"]
      : leg.dead ? ["n prov", "\u2717"]
      : ["t", "\u00b7"];
    /* The club the leg is on is bolded inside its own fixture, so one short
       string says both which game it is and which side of it, without repeating
       an abbreviation twice. A run leg belongs to neither side and gets a plain
       fixture. Cards written before build 94 stored no fixture and show none. */
    const side = id => leg.team === id ? '<b>' + ab(id) + '</b>' : ab(id);
    const fixture = leg.aid && leg.hid
      ? side(leg.aid) + ' at ' + side(leg.hid) : "";
    const bits = [fixture, leg.shared ? "shares this game" : "", esc(leg.detail),
                  ev ? esc(ev.why) : "",
                  leg.actual ? esc(leg.actual) : "",
                  leg.hit == null && leg.clear ? "already clear" : "",
                  leg.hit == null && leg.dead ? "already gone" : ""].filter(Boolean);
    return '<div class="cdpick">'
      + '<span class="cdmark ' + mark[0] + '">' + mark[1] + '</span>'
      + '<span class="cdwho">' + esc(leg.label)
        + '<em>' + bits.join(" \u00b7 ") + '</em></span>'
      + '<span class="cdout"><b>' + Math.round(leg.p * 100) + '%</b>'
        + (ev ? '<i class="cdgrade g' + ev.letter + '">' + ev.letter + '</i>' : "")
        + '</span>'
      + '</div>';
  };

  let out = SEAM + '<h2 class="eyebrow">Card of the day</h2>';

  if(!rec){
    out += '<div class="empty"><h3>No card today</h3>'
      + '<p>A card is built once MLB has posted enough of today\u2019s probable starters, '
      + 'and needs at least three games to draw from. Games already under way are not '
      + 'eligible \u2014 nothing here is picked after first pitch.</p></div>';
  } else {
    const s = parlaySummary(rec);
    out += '<div class="cdblk">'
      + '<div class="cdline">'
        + '<span class="cdmark ' + (s.settled ? (s.landed ? "y" : "n") : "t") + '">'
          + (s.settled ? (s.landed ? "\u2713" : "\u2717") : "\u00b7") + '</span>'
        /* With every leg voided the product of an empty list is 1, which printed
           as "0 legs, all landing 100.0%" and "1 in 1". The one figure on this
           block the notes tell you to read first cannot be allowed to say that. */
        + '<span class="cdteams">' + (!s.n ? '<b>Nothing left to settle</b>'
            : s.dead ? '<b>Gone</b>'
            : !s.remaining ? '<b>Landed</b>'
            : s.remaining === s.n ? '<b>' + s.n + ' legs</b>, all landing'
            : '<b>' + s.remaining + '</b> still to land') + '</span>'
        + '<span class="cdscore">' + (!s.n || s.dead || !s.remaining ? '\u2014'
            : '<b>' + (s.conditional >= 0.001
                ? (s.conditional * 100).toFixed(1) + '%' : odds(s.conditional))
              + '</b>') + '</span>'
      + '</div>'
      + '<div class="cdmeta">' + (!s.n ? '<span>every leg voided</span>'
          : (s.dead || !s.remaining ? "" : '<span>' + odds(s.conditional) + '</span>')
            + '<span>' + s.hit + ' of ' + s.done + ' settled</span>'
            + (s.early ? '<span>' + s.early + ' clear with the game live</span>' : "")
            /* The pre-game figure stays visible, because the record grades what
               was claimed before first pitch, not what survived to the ninth. */
            /* A long card's joint runs below a tenth of a per cent and printed as
               "said 0.0% pre-game", which tells you nothing about a card that was
               a genuine long shot. Odds carry it at any length. */
            + (s.remaining < s.n
                ? '<span>said ' + (s.joint >= 0.001
                    ? (s.joint * 100).toFixed(1) + '%' : odds(s.joint))
                  + ' pre-game</span>' : ""))
        + (s.voided ? '<span>' + s.voided + ' void</span>' : "")
      + '</div>'
      + rec.legs.map(legRow).join("")
      + '</div>'
      + ((rec.legs || []).some(l => l.shared)
          ? '<p class="note"><b>Some legs share a game.</b> The slate was too short to '
            + 'fill the card from separate fixtures, so a few games were asked for a '
            + 'second or third pick rather than the card being cut short. Those legs are '
            + 'marked. It matters because the figure at the top multiplies them as though '
            + 'they were independent, and legs on the same game are not: an over and a '
            + 'home run in the same park rise together, an under and a home run pull '
            + 'against each other. The error can go either way and this app has no honest '
            + 'way to size it, so it is disclosed rather than adjusted. Never the same '
            + 'market twice on one game \u2014 that would be one pick written twice.</p>'
          : "")
      + '<p class="note"><b>The letter is not a rating of the bet.</b> Rating a bet needs '
      + 'a price to compare against, and this app has none \u2014 the odds it shows are '
      + 'converted from its own probability, so any \u201cedge\u201d would be the model '
      + 'measured against itself and would read zero forever. The letter grades the '
      + 'evidence instead: which component the leg comes from and how that component '
      + 'grades out in the record below, how much of a season stands behind the player, '
      + 'whether the lineup is posted and the opposing starter named, and how far the '
      + 'calibration had to move the raw number. A strikeout leg on a confirmed starter '
      + 'earns an A; a homer leg on a two-hundred-plate-appearance bat facing an unnamed '
      + 'arm earns a C, and the row says which of those cost it the most. A high '
      + 'percentage with a low letter is a number the app believes but cannot yet '
      + 'support.</p>'
      + '<p class="note">Every leg is the app\u2019s own number, recorded before first '
      + 'pitch and graded below. The figure at the top is their product: the chance all '
      + (s.n === 1 ? "of it lands" : "of them land") + ' together, which is the only '
      + 'number a parlay actually turns on. One leg per game, so the multiplication is '
      + 'not inflated by two legs that would fail for the same reason.</p>'
      + '<p class="note"><b>Read that top figure before anything else.</b> The record on '
      + 'this tab says the side model is behind backing the home team, the run projection '
      + 'is behind guessing the league average. Legs built from those do not become '
      + 'reliable by being multiplied together \u2014 the product falls faster than any '
      + 'of them improves. There is also no price here: without a book\u2019s number this '
      + 'cannot tell you a leg is mispriced, only how likely the app thinks it is.</p>'
      + '<p class="note">Eight legs, whatever the slate offers. Five kinds \u2014 the '
      + 'side, the run total, a starter\u2019s strikeouts, a home run and a steal \u2014 '
      + 'one of each first, then a second of each, so no kind takes more than a quarter '
      + 'of the card. The card followed the number of games for a while, which gave '
      + 'thirteen and fifteen leg cards at one in twenty thousand and worse: those cannot '
      + 'land, so they cannot tell you anything. Filling the last places by probability '
      + 'instead of by kind handed them all to strikeouts and run totals, leaving one slot '
      + 'each for homers and steals \u2014 and one slot is one name, the best of that kind '
      + 'on the slate, who is the same player most nights. Home runs and steals were dropped for a '
      + 'stretch when the homer picks were running three sigma under their own '
      + 'expectation; what fixed that was not removing them but measuring the bias and '
      + 'correcting for it, so the homer legs now use the number the record has mapped '
      + 'rather than the raw one. Steal legs remain the weakest: how often a runner '
      + 'actually starts is only known once a lineup is posted, and the leg says which '
      + 'of the two it is.</p>'
      + '<p class="note">More legs is not more chances \u2014 it is fewer. Every leg '
      + 'multiplies the card down and the ones added last are the least likely, which is '
      + 'why the length is fixed rather than following the slate. The figure at the top '
      + 'tracks it; the share of legs landing, below, is what measures the picks.</p>';
  }

  if(past.length){
    out += '<h3 class="cdday">Earlier cards</h3>';
    for(const r of past){
      const s = parlaySummary(r);
      out += '<div class="cdblk">'
        + '<div class="cdline">'
          + '<span class="cdmark ' + (s.landed ? "y" : "n") + '">'
            + (s.landed ? "\u2713" : "\u2717") + '</span>'
          + '<span class="cdteams">' + esc(r.date) + '</span>'
          + '<span class="cdscore">' + (s.n
              ? '<b>' + s.hit + '</b>\u2013' + (s.done - s.hit) : '\u2014') + '</span>'
        + '</div>'
        /* The third place this figure appears, and the last one still rounding a
           thirteen-leg card's chance down to "said 0.0%" — which reads as the app
           having claimed nothing at all. Odds carry it at any length. */
        + '<div class="cdmeta">' + (s.n
            ? '<span>said ' + (s.joint >= 0.001
                ? (s.joint * 100).toFixed(1) + '%' : odds(s.joint)) + '</span>'
              + '<span>' + (s.landed ? "landed" : "did not land") + '</span>'
              /* How many legs came in, which is the part of a long card that
                 carries information. The card is built to fail; the legs are what
                 the record is actually measuring. */
              + (s.done ? '<span>' + Math.round(100 * s.hit / s.done)
                  + '% of legs</span>' : "")
            : '<span>every leg voided</span>') + '</div>'
        + '</div>';
    }
    const all = past.map(parlaySummary).filter(a => a.n > 0);
    const landed = all.filter(a => a.landed).length;
    const expected = all.reduce((n, a) => n + a.joint, 0);
    /* Legs across every card on file. A run of failed cards says almost nothing —
       they are built to fail — but the share of legs that came in is directly
       comparable to what was claimed for them, and that is a real check. */
    let legHit = 0, legDone = 0;
    for(const a of all){ legHit += a.hit; legDone += a.done; }
    if(all.length) out += '<p class="note">' + landed + ' of ' + all.length
      + (all.length === 1 ? ' card' : ' cards') + ' landed, against '
      + expected.toFixed(2) + ' expected from the app\u2019s own numbers. '
      + (legDone
          ? '<b>' + legHit + ' of ' + legDone + ' legs came in, '
            + Math.round(100 * legHit / legDone) + '%.</b> That is the figure worth '
            + 'watching. A card of ten legs or more is arithmetically almost certain to '
            + 'fail, so a column of crosses is not a verdict on the picks; the share of '
            + 'legs landing is, and it can be compared against what the card claimed. '
          : "")
      + (landed > expected + 1
          ? 'The cards themselves are ahead of expectation, over a sample far too small '
            + 'to mean anything.'
          : 'A long card is supposed to fail almost always; that it does is not evidence '
            + 'the legs are wrong, and it landing once would not be evidence they are '
            + 'right.') + '</p>';
  }
  return out;
}

/* Yesterday and before: what was written down, against what happened. */
function scorecardBlock(){
  const settled = Object.values(S.card)
    .filter(e => e.hs != null)
    .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  const pending = Object.values(S.card).filter(e => e.hs == null).length;

  if(!settled.length){
    const today = iso(new Date());
    const waiting = Object.values(S.card).filter(e => e.hs == null);
    const laterToday = waiting.filter(e => e.date === today).length;
    const older = waiting.length - laterToday;
    return '<div class="empty"><h3>Nothing settled yet</h3>'
      + '<p>' + (!waiting.length
          ? 'Predictions are written down when you open this tab and checked against the '
            + 'result afterwards. Nothing is reconstructed after the fact, so the record '
            + 'starts from your first visit.'
          : (laterToday
              ? laterToday + (laterToday === 1 ? ' prediction is' : ' predictions are')
                + ' recorded for games later today. They are graded once those finish.'
              : "")
            + (older
                ? (laterToday ? ' ' : "")
                  + older + (older === 1 ? ' older prediction is' : ' older predictions are')
                  + ' still waiting on results \u2014 the season data loads a moment after '
                  + 'this tab opens, so give it a second and check again.'
                : ""))
      + '</p></div>'
      /* An empty record is exactly when someone would want to restore one. */
      + scorecardIO();
  }

  const s = scorecardSummary();
  const byDay = [];
  for(const e of settled){
    const last = byDay[byDay.length - 1];
    if(last && last.date === e.date) last.items.push(e);
    else byDay.push({ date:e.date, items:[e] });
  }
  const label = d => d === iso(new Date()) ? "Today"
    : d === iso(shift(-1)) ? "Yesterday"
    : (() => { const dt = new Date(d + "T12:00:00");
        return isNaN(dt) ? d : dt.toLocaleDateString(undefined,
          { weekday:"long", month:"short", day:"numeric" }); })();

  return SEAM
    + '<h2 class="eyebrow">The record</h2>'
    + '<div class="ledger">'
      + '<div><b>' + (s.n ? s.right + '/' + s.n : "\u2014")
        + '</b><span>sides right</span></div>'
      + '<div><b>' + (s.high ? s.highRight + '/' + s.high : "\u2014")
        + '</b><span>at ' + Math.round(CONF_BAR * 100) + '%+</span></div>'
      + '<div><b>' + (s.watchN ? s.watchHr + '/' + s.watchN : "\u2014")
        + '</b><span>bats homered</span></div>'
    + '</div>'

    /* The tail, next to the average.

       An average error is the wrong tool for spotting a broken input: it is a
       summary designed to smooth exactly the outliers a bug produces. This lists
       the largest individual misses instead, which is where a wrong input shows
       itself — one big miss is a pitcher having an odd night, three sharing a
       shape is something in the arithmetic. */
    + (() => {
        const rows = [];
        const worst = (list, label, unit) => {
          if(!list || !list.length || list[0].err < 3) return;
          rows.push('<div class="worsthead">' + label + '</div>'
            + list.filter(w => w.err >= 3).slice(0, 3).map(w =>
                '<div class="worstrow"><span>' + esc(w.name || "\u2014") + '</span>'
                + '<em>said ' + w.exp.toFixed(1) + ', got ' + w.actual + unit + '</em>'
                + '<b>' + (w.exp > w.actual ? "+" : "\u2212")
                + w.err.toFixed(1) + '</b></div>').join(""));
        };
        worst(s.kWorst, "Strikeouts", "");
        worst(s.runWorst, "Run totals", "");
        if(!rows.length) return "";
        return '<div class="worst">'
          + '<div class="worsttitle">Furthest off</div>' + rows.join("")
          + '</div>'
          + '<p class="note">The biggest single misses on file, alongside the averages '
          + 'above. An average is built to smooth outliers, which makes it the wrong '
          + 'place to look for a broken input: a projection that read six strikeouts for '
          + 'a pitcher who threw two sat inside a healthy-looking average for days, and '
          + 'was only caught by comparing it against a bookmaker. One large miss is a '
          + 'strange night. Three with the same shape is something in the arithmetic, and '
          + 'this is where that would show.</p>';
      })()

    + '<p class="note cdsum">'
      + (s.n
          ? 'Sides called right ' + Math.round(s.acc * 100) + '% of the time '
            + 'over ' + s.n + (s.n === 1 ? ' settled game' : ' settled games') + '. '
          : 'No side has been callable yet \u2014 every settled game finished level. ')
      + (s.drawn
          ? s.drawn + (s.drawn === 1 ? ' game finished' : ' games finished')
            + ' level and so had no side to call, though the bats and arms in '
            + (s.drawn === 1 ? 'it' : 'them') + ' are graded below. '
          : "")
      + (s.runMAE != null || s.kMAE != null
          ? 'Run projections missed by ' + (s.runMAE != null ? s.runMAE.toFixed(1) : "\u2014")
            + (s.kMAE != null ? ', strikeout projections by ' + s.kMAE.toFixed(1) : "")
            + '. '
          : "")
      + (s.brier != null && s.baseBrier != null
          ? (() => {
              const d = s.baseBrier - s.brier;
              /* The tally above counts every miss the same. This does not: it
                 charges for how much was staked, so a confident wrong call costs
                 more than a hesitant one. It still says nothing about margin —
                 a one-run loss and a rout are identical here too, because the
                 model named a winner and not a score. */
              return 'Brier ' + s.brier.toFixed(3) + ' against ' + s.baseBrier.toFixed(3)
                + ' for backing the home side every time'
                + (Math.abs(d) < 0.002 ? ', level'
                    : d > 0 ? ', which is better'
                            : ', which is worse')
                + '. That one charges for confidence, so a 64% miss costs more '
                + 'than a 52% one. '
                + 'Neither number cares about the margin. ';
            })()
          : "")
      + (s.watchExpN
          ? (() => {
              const exp = s.watchExp, sd = s.watchSd, hit = s.watchHrP;
              /* Counted over the picks that carry a rate, not all of them —
                 comparing every homer against an expectation drawn from a
                 subset would flatter or damn the picker at random. */
              const all = s.watchExpN === s.watchN;
              let line = (all
                  ? 'Bats homered ' + hit + ' of ' + s.watchN
                  : 'Of the ' + s.watchExpN + (s.watchExpN === 1 ? ' pick' : ' picks')
                    + ' carrying a rate, ' + hit + ' homered')
                + ' against ' + exp.toFixed(1) + ' expected';
              if(sd && sd > 0){
                const z = (hit - exp) / sd;
                line += Math.abs(z) < 1.5
                  ? ', which is an ordinary run'
                  : Math.abs(z) < 2
                    ? ', a ' + Math.abs(z).toFixed(1) + '-sigma stretch '
                      + (z < 0 ? 'below' : 'above') + ' \u2014 unusual, not alarming'
                    : ', ' + Math.abs(z).toFixed(1) + ' sigma '
                      + (z < 0 ? 'below' : 'above')
                      + ', further out than luck comfortably explains';
              }
              return line + '. ';
            })()
          : "")
      + ((s.hitN || s.runN)
          ? 'Of the same picks, '
            + (s.hitN ? s.hitGot + ' of ' + s.hitN + ' got a hit against '
                + s.hitExp.toFixed(1) + ' expected' : "")
            + (s.hitN && s.runN ? ', and ' : "")
            + (s.runN ? s.runGot + ' of ' + s.runN + ' scored against '
                + s.runExp.toFixed(1) + ' expected' : "")
            + '. '
          : "")
      + (s.watchDnp
          ? s.watchDnp + (s.watchDnp === 1 ? ' bat sat' : ' bats sat')
            + ' and drew a dash; lineups are not posted when the pick is made. '
          : "")
      + (!s.n ? ""
          : (() => {
              /* A reference edge rather than the observed one: at thirteen games
                 the observed rate is mostly noise, and squaring it to get a
                 sample size amplifies that into nonsense. 54% is roughly what a
                 working baseball model achieves, so it is the honest yardstick
                 for how long this will take to answer. */
              const need = gamesNeeded(0.54);
              const bar = detectableAt(s.n);
              if(bar != null && bar < 1)
                return 'At ' + s.n + (s.n === 1 ? ' game' : ' games') + ', only a hit rate '
                  + 'above ' + Math.round(bar * 100) + '% would stand out from chance at all. '
                  + 'Telling a real 54% model from a coin flip takes about '
                  + need.toLocaleString() + ' settled games \u2014 six weeks or so of full '
                  + 'slates. Until then this is a log, not a verdict.';
              return 'Telling a real 54% model from a coin flip takes about '
                + need.toLocaleString() + ' settled games. Until then this is a log, not '
                + 'a verdict.';
            })())
      + '</p>'
    + (() => {
        /* Five days of games, each now seven rows deep — a matchup line, four bats
           and two arms — ran to several hundred rows. The most recent day is the
           one that gets read; the rest fold away behind a count, the same way the
           Feed handles its older moves. Nothing is dropped. */
        const dayBlock = d => '<h3 class="cdday">' + esc(label(d.date)) + '</h3>'
        + d.items.map(e => {
            const homeWon = e.hs > e.as;
            const tie = e.hs === e.as;
            const p = gradedP(e);
            const picked = p > 0.5 ? e.hid : e.aid;
            const hit = !tie && ((p > 0.5) === homeWon);
            const conf = Math.round(Math.max(p, 1 - p) * 100);
            const runGap = e.total != null ? (e.hs + e.as) - e.total : null;
            /* Away first, matching the "at" in the matchup, with the winner's
               club and runs in chalk. */
            const clubs = (homeWon ? ab(e.aid) + ' at <b>' + ab(e.hid) + '</b>'
                            : tie ? ab(e.aid) + ' at ' + ab(e.hid)
                            : '<b>' + ab(e.aid) + '</b> at ' + ab(e.hid));
            const score = (homeWon || tie ? e.as : '<b>' + e.as + '</b>') + '\u2013'
              + (homeWon ? '<b>' + e.hs + '</b>' : e.hs);

            /* A pick and its outcome. The label column the old layout spent on
               "bat to watch", repeated on every row, is now a club tag beside the
               name — the same width says something different each time. */
            const pick = (mark, name, tag, detail, out) =>
              '<div class="cdpick">'
              + '<span class="cdmark ' + mark[0] + '">' + mark[1] + '</span>'
              + '<span class="cdwho">' + esc(name)
                + '<em>' + [tag, detail].filter(Boolean).map(esc).join(" \u00b7 ") + '</em></span>'
              + '<span class="cdout">' + out + '</span>'
              + '</div>';

            return '<article class="cdblk">'
              + '<div class="cdline">'
                + '<span class="cdmark ' + (tie ? "t" : hit ? "y" : "n") + '">'
                  + (tie ? "\u2013" : hit ? "\u2713" : "\u2717") + '</span>'
                + '<span class="cdteams">' + clubs + '</span>'
                + '<span class="cdscore">' + score + '</span>'
              + '</div>'
              + '<div class="cdmeta">'
                + '<span>said <b>' + ab(picked) + '</b> ' + conf + '%</span>'
                + (e.total != null
                    ? '<span>runs <b>' + e.total.toFixed(1) + '</b> \u2192 ' + (e.hs + e.as)
                      + ' (' + (runGap > 0 ? "+" : "") + runGap.toFixed(1) + ')</span>'
                    : "")
              + '</div>'
              /* The watched bat was named as one to watch, so its outcome is a
                 pick with a result — it gets its own marked row rather than a note
                 tacked onto the game above it. */
              + watchList(e).map(w => {
                  const tag = w.team ? ab(w.team) + ' bat' : "bat";
                  /* Named before the lineup card existed, then rested. No
                     chance to go deep, so no verdict either way. */
                  if(w.dnp)
                    return pick(["t", "\u2013"], lastName(w.name), tag, "did not play",
                      w.p != null ? Math.round(w.p * 100) + '% chance' : "");
                  if(!w.result)
                    return pick(["t", "\u2013"], lastName(w.name), tag,
                                "result not recorded", "");
                  const homered = w.result.hr > 0;
                  return pick(homered ? ["y", "\u2713"] : ["n", "\u2717"],
                    lastName(w.name), tag,
                    w.result.line || "did not play",
                    homered ? '<b>' + w.result.hr + ' HR</b>' : "no homer");
                }).join("")
              + (Array.isArray(e.ks)
                  ? e.ks.filter(k => k.actual != null || k.scratched).map(k => {
                  const tag = k.own ? ab(k.own) + ' arm' : "arm";
                  /* Named as the probable, never took the mound. Neither right
                     nor wrong — the start it projected did not happen — so it
                     draws the neutral mark and sits out the tally above. */
                  if(k.scratched)
                    return pick(["t", "\u2013"], lastName(k.name), tag, "did not pitch",
                      'said <b>' + k.exp.toFixed(1) + '</b>');
                  const gap = k.actual - k.exp;
                  const close = Math.abs(gap) <= 2;
                  /* "0 strikeouts" was the longest string in the narrowest
                     column, and the one that got clipped. K says it. */
                  return pick(close ? ["y", "\u2713"] : ["n", "\u2717"],
                    lastName(k.name), tag,
                    k.actual + " K",
                    'said <b>' + k.exp.toFixed(1) + '</b> ('
                      + (gap > 0 ? "+" : "") + gap.toFixed(1) + ')');
                }).join("") : "")
              + '</article>';
          }).join("");

        const recent = byDay.slice(0, 1), older = byDay.slice(1, 5);
        const olderGames = older.reduce((n, d) => n + d.items.length, 0);
        return recent.map(dayBlock).join("")
          + (olderGames
              ? '<button class="disc notes" data-recordolder="1" aria-expanded="'
                + (S.recordOlder ? "true" : "false") + '">'
                + '<span>' + olderGames + ' earlier '
                + (olderGames === 1 ? "game" : "games") + ', back to '
                + esc(label(older[older.length - 1].date)) + '</span>'
                + '<i class="chev" aria-hidden="true">'
                + (S.recordOlder ? "\u25B4" : "\u25BE") + '</i></button>'
                + (S.recordOlder ? older.map(dayBlock).join("") : "")
              : "");
      })()
    + '<p class="note">Each pick was recorded before the game and has not been revised. '
    + 'A tick on the side means it won. On a bat to watch it means he homered \u2014 '
    + 'the row named him as one to watch, so that is the outcome of the pick, not a '
    + 'footnote. On a strikeout projection it means within two of the real count. '
    + 'A probable starter who was scratched draws a dash instead: MLB lists every '
    + 'rostered player in a box score, so he would otherwise be read as having '
    + 'thrown and struck nobody out, and marked wrong for a start he never made. '
    + 'A bat that was rested draws a dash for the same reason as a scratched starter: the '
    + 'lineup card is not published when the pick is made, so a day off is the manager\u2019s '
    + 'decision rather than the model\u2019s error. '
    + (() => {
        const f = batFit();
        if(!f) return '';
        return '<p class="note">Bat chances are mapped through what has actually '
          + 'happened, the same way the side model is: sigmoid('
          + f.a.toFixed(2) + ' \u00d7 logit(p) '
          + (f.b >= 0 ? '+ ' : '\u2212 ') + Math.abs(f.b).toFixed(2) + '), fitted on '
          + f.n + ' graded picks. The picks came in well under their own expectation, '
          + 'and the reason is structural rather than unlucky: the pick is the largest of '
          + 'eight noisy rates, and the largest of several noisy estimates runs high by '
          + 'construction. This corrects by the amount the record measures, and refits as '
          + 'the record grows \u2014 so if the underlying pick improves, the correction '
          + 'fades on its own.</p>';
      })()
    + '<p class="note">The number of bats named per game has changed twice: one across both clubs before '
    + 'build 78, one per club after it, and two per club from build 102. So the '
    + 'bats-homered count is not comparable across those boundaries, and the second pick '
    + 'of a pair is a lower-probability bat by construction, which pulls the raw hit rate '
    + 'down without anything having got worse. Read the line against expectation instead: '
    + 'each pick carries its own chance, so the expected figure moves with the change and '
    + 'the comparison stays honest. '
    + 'The run projection shows what was said, what happened and the gap; it misses by '
    + 'three and a half runs on average, so read that gap as normal rather than as an '
    + 'error.</p>'
    + scorecardIO();
}

/* Writing down and settling, on every render rather than only the Plays one.

   This used to live inside renderPlays, which meant a prediction was recorded
   only if that tab happened to be on screen while the game was still scheduled.
   Anything that started before you opened Plays was never written down — and a
   game that was never recorded can never settle, so it was simply absent from
   the record. What got measured depended on which tab you were looking at.

   The rule itself is unchanged: only scheduled games, frozen at first pitch,
   never revised afterwards. It just no longer depends on tab state. load() runs
   every thirty seconds while the app is open, so this now runs with it.

   It cannot record anything while the app is closed. If nothing is open before
   first pitch there is still no prediction, which is correct. */
function keepTheRecord(){
  if(S.phase !== "ready" || !S.teams) return;
  const today = iso(new Date());
  S.games.filter(g => g.date === today && g.st === "sched")
    .forEach(recordPrediction);
  buildParlay(today);
  settleScorecard();
  settleParlay();
  settleParlayLive();
  if(S.parlayDirty){ saveParlay(); S.parlayDirty = false; }
  if(S.cardDirty){ saveScorecard(); S.cardDirty = false; }
  settlePicksFromBox();
}

function renderPlays(){
  const today = iso(new Date());
  const upcoming = S.games.filter(g => g.date === today && g.st === "sched")
    .sort((a,b) => new Date(a.start) - new Date(b.start));
  const waiting = S.detailState === "loading" || !Object.keys(S.pitchers).length;

  const card = upcoming.length
    ? '<h2 class="eyebrow">Today\'s card \u00b7 ' + upcoming.length + ' games</h2>'
      + (waiting ? '<p class="load">Loading starters\u2026</p>' : "")
      + highlightBlock(upcoming)
      + leaderboardBlock(upcoming)
      + upcoming.map(cardBlock).join("")
      + '<p class="note"><b>Test these before trusting them.</b> The calibration on the '
      + 'Odds tab replays the side model over every completed game this season; when I ran '
      + 'it, it did not beat simply backing the home team. Treat what follows as a view, '
      + 'not a signal.</p>'
      + '<p class="note">All three lines are this app\'s own output. Side is the model '
      + 'line. Runs is a projection: each club\'s scoring and its opponent\'s concession '
      + 'averaged, then shifted by how each starter compares to the league, scaled to the '
      + 'six innings of nine a starter typically covers. It is shown against the league '
      + 'average because that gap is the only part it knows with any confidence: measured '
      + 'over the season it misses a single game by about three and a half runs, which is '
      + 'no better than guessing the average every time. <b>There is no over/under here</b> '
      + '\u2014 that word needs a book\'s number to mean anything and this app has no '
      + 'source for one, so compare the projection to a line yourself. Watch names one bat '
      + 'per club \u2014 four a game \u2014 by home run rate in each lineup, weighed against '
      + 'the HR/9 of the arm it faces and the bullpen behind him, the batter\u2019s hand '
      + 'against the pitcher\u2019s, and the air and the wind at that ballpark. The best bat '
      + 'on a side hardly changes from night to night, because he is the best bat; the '
      + 'second one moves a good deal, which is where the variation lives. Both are '
      + 'graded. The '
      + 'percentage is each one\u2019s chance of going deep over a full game, not per plate '
      + 'appearance \u2014 a bat at one homer per twenty is a one-in-five shot on the '
      + 'night, not one in twenty. Conditions are common to both clubs, so they do not '
      + 'change which bat is named, only how likely it is to pay off and therefore the '
      + 'bar the record grades it against. Lineups are '
      + 'not published until a few hours before first pitch, so none of this knows who is '
      + 'actually playing.</p>'
    : "";

  if(!card)
    return '<div class="pane"><div class="empty"><h3>Nothing on today\'s card</h3>'
      + '<p>Projections appear once MLB posts the probable starters, usually the evening '
      + 'before. Games already under way move to the Today tab.</p></div>'
      + parlayBlock() + scorecardBlock() + '</div>';

  return '<div class="pane">' + card + parlayBlock() + scorecardBlock() + '</div>';
}

function render(resetScroll){
  /* Before anything is drawn, and on every tab. A prediction that is not written
     down before first pitch cannot be recovered afterwards. */
  keepTheRecord();
  const keep = resetScroll ? 0 : window.scrollY;
  const fk = resetScroll ? null : focusKey(document.activeElement);
  const app = document.getElementById("app");
  const live = S.games.some(g => g.st === "live");
  const stamp = S.at ? clock(S.at) : "";
  /* Three states worth distinguishing: fresh, fresh-but-a-refresh-just-failed,
     and running entirely on what was saved last time. */
  const dotClass = S.phase !== "ready" ? (S.phase === "error" ? "bad" : "")
    : S.stale ? "bad" : live ? "live" : "ok";
  const statusText = S.phase !== "ready" ? (S.phase === "error" ? "Offline" : "Loading")
    : S.stale ? "Saved " + stamp : live ? "Live" : "Updated " + stamp;

  let body;
  if(S.phase === "loading") body = '<p class="load">Loading the league…</p>';
  else if(S.phase === "error")
    body = '<div class="pane"><div class="empty"><h3>Could not reach the data</h3>'
      + '<p>' + esc(S.err || "Unknown error") + '. Both feeds are public and need no key, so this is '
      + 'usually a connection problem. Pull to refresh or tap Refresh above.</p></div></div>';
  else if(S.tab === "today") body = renderToday();
  else if(S.tab === "feed") body = renderFeed();
  else if(S.tab === "odds") body = renderOdds();
  else body = renderPlays();

  app.innerHTML =
    '<header class="mast"><div class="mtop">' + BALL
    + '<div><h1 class="wordmark">108</h1><p class="tagline">Baseball by the numbers</p></div>'
    + '<div class="feed"><span class="feedrow"><span class="dot ' + dotClass + '"></span>'
    + statusText + '</span><button class="refresh" id="refresh">Refresh</button></div></div>'
    + '<nav class="tabs" role="tablist" aria-label="Views">'
    + [["today","Today"],["feed","Feed"],["odds","Odds"],["plays","Plays"]].map(([k,label]) =>
        '<button role="tab" id="tab-' + k + '" aria-controls="pane"'
        + ' aria-selected="' + (S.tab===k) + '" tabindex="' + (S.tab===k ? "0" : "-1") + '"'
        + ' data-tab="' + k + '">' + label + '</button>').join("")
    + '</nav></header>'
    + (S.phase === "ready" && S.err
        ? '<p class="banner"><b>' + (S.stale ? "Offline." : "Last refresh failed.") + '</b> '
          + (S.stale
              ? 'This is what was saved at ' + stamp + ' — records and the forecast still '
                + 'work, but scores will not move and there is no weather.'
              : 'Showing data from ' + stamp + '.')
          + '</p>' : "")
    + '<div id="pane" role="tabpanel" aria-labelledby="tab-' + S.tab + '" tabindex="-1">'
    + body + '</div>'
    + '<footer class="foot">108 — the number of double stitches on a regulation baseball.<br>'
    + 'Scores, records and venues from the MLB Stats API. Weather from Open-Meteo. '
    + 'Odds simulated in this browser from the records above.<br>'
    + 'Build ' + BUILD
    + (Object.keys(S.diag).length
        ? '<br>Loaded: ' + ["pitchers","form","bullpens","h2h","remaining","spHistory","rosters","bats","splits","hitters","hitterForm"]
            .filter(k => S.diag[k] != null)
            .map(k => k + ' ' + S.diag[k]).join(' \u00b7 ')
        : "")
    + '</footer>'
    + (S.player ? playerSheet() : S.sheet ? renderSheet() : "");

  if(keep) window.scrollTo(0, keep);
  if(fk){
    const back = app.querySelector(fk);
    if(back && back.focus) back.focus({ preventScroll:true });
  }
  /* The scene is a fresh node after every render, so the observer follows it. */
  watchMoon();
  announce();
}

/* One short, non-repeating announcement. Anything more and a screen reader
   would talk over itself every thirty seconds. */
let lastSaid = "";
function announce(){
  const el = document.getElementById("live");
  if(!el || S.phase !== "ready") return;
  let msg = "";
  const id = S.follow;
  const g = id && S.games.find(x => (x.hid === id || x.aid === id) && x.st === "live");
  if(g){
    msg = ab(g.aid) + " " + g.as + ", " + ab(g.hid) + " " + g.hs + ", " + inningText(g);
  } else {
    const live = S.games.filter(x => x.st === "live").length;
    msg = live ? live + (live === 1 ? " game in progress" : " games in progress") : "";
  }
  if(msg && msg !== lastSaid){ lastSaid = msg; el.textContent = msg; }
}

/* ============================== events ============================== */

/* Opening and closing the sheet, with focus handled properly both ways. */
function focusSheet(){
  const sheet = document.querySelector(".sheet");
  if(!sheet) return;
  const btn = sheet.querySelector("#closeSheet");
  (btn || sheet).focus({ preventScroll:true });
}
function closeSheet(){
  const back = S.sheetReturn;
  S.sheet = null; S.swing = null; S.player = null; S.sheetReturn = null;
  render();
  if(back){
    const el = document.getElementById("app").querySelector(back);
    if(el && el.focus) el.focus({ preventScroll:true });
  }
}

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if(tab){
    S.tab = tab.dataset.tab;
    if(S.tab === "odds") ensureSeason();   // the forecast wants the real fixture list
    if(S.tab === "plays"){ ensureSeason(); loadDetail(); }
    if(S.tab === "feed") ensureFeed();
    render(true);
    return;
  }

  const lg = e.target.closest("[data-lg]");
  if(lg){ const [view,k] = lg.dataset.lg.split(":"); S.lg[view] = k; render(true); return; }

  if(e.target.closest("[data-notes]")){ S.notesOpen = !S.notesOpen; render(); return; }

  const tog = e.target.closest("[data-toggle]");
  if(tog){
    const pk = tog.dataset.toggle;
    S.open[pk] = !S.open[pk];
    if(S.open[pk]){ loadDetail(); ensureHitterForm(); }
    render();
    return;
  }

  if(e.target.closest("#runCal")){
    S.calBusy = true; render();
    (async () => {
      if(!S.spHistory) S.spHistory = await loadStarterHistory() || {};
      S.cal = {
        with:backtest(RECENCY_W, false),
        without:backtest(0, false),
        withSP:backtest(RECENCY_W, true),
        /* The same season scored both ways, changing nothing but where team
           strength comes from. This is what decides whether USE_PYTH earns its
           place, and it is the app's own answer rather than mine. */
        rec:backtest(RECENCY_W, false, null, null, false),
        pyth:backtest(RECENCY_W, false, null, null, true),
        /* The four corners of records and starters. This is the experiment the
           calibration has been implying for several builds: if leaving records
           out costs nothing, they are not earning their place. */
        lean:backtest(0, true, null, null, null, false),
        homeOnly:backtest(0, false, null, null, null, false)
      };
      if(S.cal.with) S.sweep = sweep();
      /* Fit on the best model available — with starters if they were testable,
         since that is what the cards actually use. */
      const basis = (S.cal.withSP && S.cal.withSP.spN > 200) ? S.cal.withSP : S.cal.with;
      S.calFit = basis ? fitCalibration(basis.preds) : null;
      /* And the same fit judged on games it never saw. */
      S.calOut = basis ? holdoutCheck(basis.preds) : null;
      try{ localStorage.setItem(FIT_KEY, JSON.stringify(S.calFit)); }catch(err){}
      if(!S.cal.with) S.cal = null;
      else { S.calAt = new Date().toISOString(); saveCal(); }
      S.calBusy = false; render();
    })();
    return;
  }

  if(e.target.closest("[data-feedolder]")){ S.feedOlder = !S.feedOlder; render(); return; }

  if(e.target.closest("[data-recordolder]")){ S.recordOlder = !S.recordOlder; render(); return; }

  if(e.target.closest("[data-leadmore]")){ S.leadOpen = !S.leadOpen; render(); return; }

  const fd = e.target.closest("[data-feed]");
  if(fd){ S.feedMine = fd.dataset.feed === "mine"; render(); return; }

  if(e.target.closest("#exportCard")){ exportScorecard(); return; }

  if(e.target.closest("#markSeen")){ saveBaseline(); render(); return; }

  if(e.target.closest("#changeTeam")){ S.picker = !S.picker; render(); return; }

  const fol = e.target.closest("[data-follow]");
  if(fol){
    const v = fol.dataset.follow;
    S.follow = v === "none" ? null : Number(v);
    S.picker = false;
    saveFollow(S.follow);
    render();
    return;
  }

  if(e.target.closest("#expandAll")){
    const today = iso(new Date());
    const pks = S.games.filter(g => g.date === today && g.st === "sched").map(g => g.pk);
    const anyClosed = pks.some(p => !S.open[p]);
    pks.forEach(p => { S.open[p] = anyClosed; });
    if(anyClosed){ loadDetail(); ensureHitterForm(); }
    render();
    return;
  }

  const who = e.target.closest("[data-player]");
  if(who){
    S.sheetReturn = focusKey(document.activeElement);
    S.player = { id:Number(who.dataset.player), team:Number(who.dataset.pteam),
                 name:who.dataset.pname };
    S.sheet = null; S.swing = null;
    render();
    focusSheet();
    /* The requests start now, not when the card was drawn. */
    loadSwings(S.player.id, S.player.team).then(render);
    return;
  }

  const team = e.target.closest("[data-team]");
  if(team){
    S.sheetReturn = focusKey(document.activeElement);   // so it can go back
    S.sheet = Number(team.dataset.team); S.swing = null; S.player = null;
    render();
    focusSheet();
    return;
  }

  if(e.target.closest("#refresh")){ load(); return; }

  if(e.target.closest("#rerun")){
    S.simBusy = true; render();
    setTimeout(() => { S.odds = simulate(SIMS); S.simBusy = false; render(); }, 20);
    return;
  }

  if(e.target.closest("#measure")){
    const id = S.sheet;
    S.swingBusy = true; render();
    setTimeout(() => {
      const won = simulate(SHEET_SIMS, {id, add:1});
      const lost = simulate(SHEET_SIMS, {id, add:0});
      S.swing = won[id].berth - lost[id].berth;
      S.swingBusy = false; render();
    }, 20);
    return;
  }

  if(e.target.closest("#closeSheet") || e.target.id === "scrim"){
    closeSheet();
  }
});

/* Delegated, because render() rebuilds the document and any listener bound
   directly to the input would not survive it. */
document.addEventListener("change", e => {
  const inp = e.target.closest("#importFile");
  if(!inp || !inp.files || !inp.files[0]) return;
  const rd = new FileReader();
  rd.onload = () => importScorecard(String(rd.result || ""));
  rd.onerror = () => { S.ioMsg = "Could not read that file."; render(); };
  rd.readAsText(inp.files[0]);
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && S.sheet){ closeSheet(); return; }

  /* A dialog has to hold focus. Without this, Tab walks off into the page
     behind the overlay, which a sighted mouse user never notices and a
     keyboard user cannot recover from. */
  if(e.key === "Tab" && S.sheet){
    const sheet = document.querySelector(".sheet");
    if(!sheet) return;
    const f = [...sheet.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter(el => !el.disabled);
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(!sheet.contains(document.activeElement)){ first.focus(); e.preventDefault(); }
    else if(e.shiftKey && document.activeElement === first){ last.focus(); e.preventDefault(); }
    else if(!e.shiftKey && document.activeElement === last){ first.focus(); e.preventDefault(); }
    return;
  }
  // Arrow keys move between tabs — expected behaviour for role="tablist".
  if((e.key === "ArrowRight" || e.key === "ArrowLeft")
     && document.activeElement && document.activeElement.getAttribute("role") === "tab"){
    const order = ["today","feed","odds","plays"];
    const i = order.indexOf(S.tab);
    const next = order[(i + (e.key === "ArrowRight" ? 1 : order.length - 1)) % order.length];
    S.tab = next;
    render(true);
    const el = document.getElementById("tab-" + next);
    if(el) el.focus();
    e.preventDefault();
  }
});

/* Poll faster while games are in progress. */
setInterval(() => {
  if(S.phase === "error") return;
  const live = S.games.some(g => g.st === "live");
  const age = S.at ? Date.now() - S.at.getTime() : Infinity;
  if(age > (live ? 30000 : 180000)) load();
}, 15000);

document.addEventListener("visibilitychange", () => {
  if(!document.hidden && S.at && Date.now() - S.at.getTime() > 60000) load();
});

S.follow = loadFollow();
S.baseline = loadBaseline();
S.card = loadScorecard();
repairScorecard();
S.parlay = loadParlay();
loadCal();
loadStar();
try{
  const f = JSON.parse(localStorage.getItem(FIT_KEY) || "null");
  if(f && typeof f.a === "number" && typeof f.b === "number") S.calFit = f;
}catch(e){}

/* Paint from cache first so there is no empty screen, then go and refresh.
   If the network is down, this is all you get — and the banner says so. */
(function bootFromCache(){
  const c = loadCache();
  if(!c) return;
  S.teams = c.teams;
  S.games = c.games;
  S.venues = c.venues || {};
  S.at = new Date(c.at);
  S.stale = true;
  S.phase = "ready";
  try{ S.odds = simulate(SIMS); }catch(e){ S.odds = null; }
  if(S.odds) render();
})();

load();
</script>
